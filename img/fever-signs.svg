<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Child with fever. Call 911 for a first seizure, if hard to wake, or trouble breathing. Do give plenty of fluids. Do not undress, sponge or bundle up."><title>Child with fever. Call 911 for a first seizure, if hard to wake, or trouble breathing. Do give plenty of fluids. Do not undress, sponge or bundle up.</title><rect width="320" height="240" fill="#fff"/><g font-family="sans-serif" fill="#222"><rect x="14" y="12" width="292" height="216" rx="12" fill="#fff6e0" stroke="#c90" stroke-width="3"/><text x="160" y="40" text-anchor="middle" font-size="16" font-weight="bold">CALL 911 IF A CHILD WITH FEVER:</text><text x="34" y="68" font-size="15">• Has a first seizure</text><text x="34" y="92" font-size="15">• Is hard to wake</text><text x="34" y="116" font-size="15">• Has trouble breathing</text><line x1="30" y1="134" x2="290" y2="134" stroke="#c90"/><text x="34" y="162" font-size="15"><tspan font-weight="bold" fill="#060">DO:</tspan> give plenty of fluids</text><text x="34" y="192" font-size="15"><tspan font-weight="bold" fill="#a00">DON'T:</tspan> undress, sponge</text><text x="96" y="212" font-size="15">or bundle up the child</text></g></svg>
