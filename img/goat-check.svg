<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Healthy goat checklist: bright clear eyes, chews cud, shiny coat, strong legs and feet"><title>Healthy goat checklist: bright clear eyes, chews cud, shiny coat, strong legs and feet</title><rect width="320" height="240" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#222"><ellipse cx="130" cy="120" rx="70" ry="35" fill="#e8dcc8" stroke="#333"/><rect x="190" y="70" width="40" height="34" rx="10" fill="#e8dcc8" stroke="#333"/><circle cx="215" cy="82" r="4" fill="#222"/><path d="M196 70 l-6 -18 M208 70 l2 -18" stroke="#333" stroke-width="3"/><rect x="80" y="150" width="10" height="40" fill="#e8dcc8" stroke="#333"/><rect x="105" y="150" width="10" height="40" fill="#e8dcc8" stroke="#333"/><rect x="155" y="150" width="10" height="40" fill="#e8dcc8" stroke="#333"/><rect x="175" y="150" width="10" height="40" fill="#e8dcc8" stroke="#333"/><path d="M219 82 L250 50" stroke="#58a"/><text x="312" y="44" text-anchor="end" font-size="13">Bright eyes</text><path d="M228 100 L250 120" stroke="#58a"/><text x="312" y="134" text-anchor="end" font-size="13">Chews cud</text><path d="M120 90 L110 40" stroke="#58a"/><text x="110" y="34" text-anchor="middle" font-size="13">Shiny coat</text><path d="M90 190 L60 210" stroke="#58a"/><text x="60" y="224" text-anchor="middle" font-size="13">Strong legs, feet</text><text x="225" y="200" text-anchor="middle" font-size="13">Not eating, or alone?</text><text x="225" y="216" text-anchor="middle" font-size="13">Call the vet</text></g></svg>
