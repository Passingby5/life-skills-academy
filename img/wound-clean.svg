<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Clean a small wound: wash hands, rinse with clean water, cover with a clean bandage"><title>Clean a small wound: wash hands, rinse with clean water, cover with a clean bandage</title><rect width="320" height="240" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#222"><circle cx="55" cy="100" r="35" fill="#9bd" stroke="#333"/><text x="55" y="105" text-anchor="middle" font-size="14">SOAP</text><text x="55" y="165" text-anchor="middle" font-size="13">1 Wash hands</text><path d="M140 60 v50" stroke="#58a" stroke-width="6"/><rect x="120" y="115" width="80" height="30" rx="12" fill="#f2c9a0" stroke="#333"/><path d="M150 128 h20" stroke="#c66" stroke-width="3"/><text x="160" y="165" text-anchor="middle" font-size="13">2 Rinse with</text><text x="160" y="181" text-anchor="middle" font-size="13">clean water</text><rect x="225" y="110" width="80" height="34" rx="14" fill="#f2c9a0" stroke="#333"/><rect x="245" y="114" width="40" height="26" fill="#fff" stroke="#333"/><text x="265" y="165" text-anchor="middle" font-size="13">3 Cover it</text><text x="160" y="215" text-anchor="middle" font-size="13">Red streaks, pus or fever: get help</text></g></svg>
