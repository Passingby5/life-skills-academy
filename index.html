<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10202e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Skills">
<meta name="description" content="Life Skills Academy: Know It. Quick real life myth checks for families. Works offline.">
<link rel="manifest" href="manifest.webmanifest">

<title>Life Skills Academy</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#10202e;color:#f2f5f7;font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
#app{max-width:720px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 24px}
h1{font-size:1.5rem;margin:.2em 0 .4em}
h2{font-size:1.2rem;margin:.6em 0 .3em}
p{margin:.4em 0}
button,.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;min-width:48px;margin:8px 0;padding:10px 14px;border:0;border-radius:14px;background:#24435c;color:#fff;font:inherit;font-weight:600;text-align:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none;word-break:break-word}
button:active{filter:brightness(1.2)}
button.main{background:#2f8f5b}
button.alt{background:#3a3f6b}
button.danger{background:#8a2d2d}
button.ghost.danger{background:transparent;border:2px solid #8a2d2d;color:#ffb3a8}
button.ghost{background:transparent;border:2px solid #3b5b74}
button.on{outline:3px solid #ffd257}
button:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.ver{font-size:.8rem;opacity:.75;text-align:center;margin-top:16px}
.card{background:#183247;border-radius:16px;padding:14px;margin:10px 0}
.scene{font-size:1.2rem;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top button{width:auto;margin:0}
.muted{opacity:.75;font-size:.9rem}
.pick{background:#7a5a12}
.fix .lab{font-weight:700;color:#ffd257}
.fix .wrong{font-weight:800;color:#ff8a7a}
.fix .ok{font-weight:800;color:#7be0a3}
a.src{display:flex;align-items:center;min-height:48px;color:#9fd3ff;word-break:break-word}
.wow{display:inline-block;background:#ffd257;color:#2a1d00;font-weight:900;font-size:1.3rem;padding:8px 16px;border-radius:999px;margin:4px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{min-height:72px;margin:0;font-size:.85rem;font-weight:500;background:#24435c}
.tile.f{background:#2e4d3c}
.tile.sel{outline:3px solid #ffd257}
.tile.gone{visibility:hidden}
.tile.miss{background:#7a2d2d}
.note{background:#5a3d10;border-radius:12px;padding:10px}
ul.list{padding-left:1.1em}ul.list li{margin:.5em 0}
input{width:100%;min-height:52px;font:inherit;padding:8px 12px;border-radius:12px;border:2px solid #3b5b74;background:#0c1924;color:#fff}
.cimg{display:block;width:auto;max-width:100%;height:auto;max-height:34vh;min-width:min(100%,300px);margin:0 auto 10px;border-radius:10px;background:#fff;object-fit:contain}
.picker details{border:2px solid #3b5b74;border-radius:14px;margin:8px 0;padding:4px 10px}
.picker summary{min-height:48px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;list-style:none}
.picker summary::-webkit-details-marker{display:none}
.picker summary::before{content:'\25B8';display:inline-block;width:1em;font-size:1.1em;transition:transform .15s}
.picker details[open]>summary::before{transform:rotate(90deg)}
.picker .decks{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.picker .decks button{min-height:52px;margin:5px 0;font-size:.95rem}
@media (orientation:landscape) and (max-height:500px){
  html,body{font-size:16px}
  #app{max-width:none;padding:8px max(14px,env(safe-area-inset-left)) 12px max(14px,env(safe-area-inset-right))}
  .play{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .play .card{margin:0}
  .play button{min-height:48px;margin:6px 0}
  .tiles{grid-template-columns:1fr 1fr 1fr 1fr}
  .cimg{max-height:none}
  .fix .cimg{float:right;width:clamp(300px,45%,400px);max-width:none;min-width:0;margin:0 0 8px 12px}
  .picker .decks{grid-template-columns:1fr 1fr 1fr}
  h1{font-size:1.25rem}
}
.sectnote { margin: .2rem .2rem .5rem; font-size: .9rem; }
.cite { font-size: .95rem; }
.notice { font-size: .85rem; margin-top: .6rem; }
.cuegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cuegrid button.cuet{min-height:72px;margin:0;font-size:.9rem;font-weight:500;background:#24435c}
.cuegrid button.cuet.on{background:#7a2d2d;outline:3px solid #ffd257}
.cues{list-style:none;padding:0;margin:8px 0}
.cue{padding:8px 10px;margin:6px 0;border-radius:10px;background:#1d3346;border-left:6px solid #3b5b74}
.cue.flag{border-left-color:#d9534f}
.cue.fine{border-left-color:#2f8f5b}
.cue.miss{outline:2px dashed #ffd257}
@media (orientation:landscape) and (max-height:500px){.cuegrid{grid-template-columns:1fr 1fr 1fr}.cuegrid button.cuet{min-height:52px}}

/* v18 Power Plays: way-out diagram, 3 to 4 boxes with arrows, fits 390 px wide with no side scroll. */
.steps { display: flex; align-items: stretch; gap: 4px; margin: .6rem 0; }
.steps .step { flex: 1 1 0; min-width: 0; border: 2px solid #9fd3ff; border-radius: 10px; padding: .45rem .2rem; font-size: .8rem; line-height: 1.2; text-align: center; overflow-wrap: anywhere; word-break: break-word; hyphens: auto; -webkit-hyphens: auto; display: flex; align-items: center; justify-content: center; }
.steps .arr { flex: 0 0 auto; align-self: center; font-size: 1rem; color: #9fd3ff; }
.tactic { font-weight: 600; }
.faith { font-size: .85rem; font-style: italic; }
.passage{background:#132a3b;border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.55}
.passage h2{margin:4px 0 8px}
.passage .para{margin:0 0 12px;font-size:1.05rem}
.passage .para.mark{background:#2b4a2f;border-radius:8px;padding:4px 6px}
.passage .pnum{display:inline-block;min-width:1.4em;font-weight:700;color:#ffd257}
.proof{margin:10px 0;padding:8px 12px;border-left:4px solid #ffd257;background:#132a3b;border-radius:6px}
.qtext{font-weight:600}
</style></head>

      c: ['Almost none of them do', 'About a third', 'About 8 in 10 of them'],
      m: 'Almost no scientists believe in God.', f: 'Pew 2009: 33% of scientists believe in God and 18% in a higher power; 41% believe in neither.', w: 'Scientists are far less religious than the public (83% believe in God), but believers are a large minority.', src: 'pew-scientists' },
    { id: 'ct26', ages: 'both', topic: 'climate', s: { ya: 'A meme says scientists in the 1970s said an ice age was coming. Was that the consensus?', adult: 'A talk host says 1970s scientists all predicted an ice age. Was that the scientific view?' },
      c: ['Most of them predicted it', 'Warming led even then', 'The papers made no forecasts'],
      m: 'Scientists in the 1970s agreed an ice age was coming.', f: 'A 2008 review in the Bulletin of the AMS found greenhouse warming dominated scientists\' thinking even then.', w: 'The review calls the 1970s cooling consensus an enduring popular myth.', src: 'peterson' },
    { id: 'ct27', ages: 'both', topic: 'climate', s: { ya: 'A post says the Sun is what is heating the planet. What does NASA say?', adult: 'A neighbor says recent warming is just the Sun. What does NASA say about solar energy since the 1950s?' },
      c: ['It is mostly the Sun', 'No net rise in Sun energy', 'The Sun has cooled'],
      m: 'The Sun is causing today\'s warming.', f: 'NASA: solar energy reaching Earth has followed its 11-year cycle with no net increase since the 1950s.', w: 'The Sun does shape climate and Earth\'s orbit drives ice ages, but NASA says recent warming is too fast and large for those causes.', src: 'nasa-sun' },
    { id: 'ct28', ages: 'both', topic: 'climate', s: { ya: 'A friend says climate has always changed, so this warming is natural. What does NASA say?', adult: 'Your brother says climate always changes, so today\'s warming is natural. What does NASA say?' },
      c: ['It is just the normal cycle', 'Humans drive today\'s warming', 'Mostly from volcanoes'],
      m: 'Today\'s warming is just the natural cycle.', f: 'NASA: the current warming is clearly the result of human activity since the mid-1800s, at a rate not seen in many millennia.', w: 'Climate did change before (eight ice age cycles in 800,000 years). The question is the cause now, and the IPCC calls human influence established fact.', src: 'nasa-evidence' },
    { id: 'ct29', ages: 'both', topic: 'climate', s: { ya: 'A post says Earth has already warmed by 5 degrees F. How much has it warmed since the late 1800s?', adult: 'A speaker says the planet has already heated up 5 degrees F. How much does NASA say it has warmed?' },
      c: ['About 5 degrees F', 'About 2 degrees F', 'About 10 degrees F'],
      m: 'Earth has already warmed about 5 degrees F.', f: 'NASA: about 2 degrees F (1 degree C) since the late 19th century.', w: 'Overstating harms trust. The real number is still large for a whole planet, and most of it came in the last 40 years.', src: 'nasa-evidence' },
    { id: 'ct30', ages: 'both', topic: 'climate', s: { ya: 'A friend says U.S. carbon emissions fall every single year now. Did they fall in 2025?', adult: 'A coworker says U.S. CO2 emissions keep dropping every year. What did the EIA report for 2025?' },
      c: ['They fell again in 2025', 'They rose about 2%', 'They fell by half since 2024'],
      m: 'U.S. carbon emissions now fall every year.', f: 'EIA: U.S. energy-related CO2 rose 2% in 2025, from colder winter, more coal power and higher demand.', w: 'Long-run trends and single years can differ. Solar generation also grew 34% that year.', src: 'eia-co2' },
    { id: 'ct33', ages: 'both', topic: 'vaccines', s: { ya: 'A post shows a VAERS report and says it proves a vaccine caused an injury. Does it?', adult: 'A relative says a report in VAERS proves the shot caused a death. Does a VAERS report prove that?' },
      c: ['Yes, a filed report is proof', 'A report is not proof alone', 'If a doctor filed it, yes'],
      m: 'A VAERS report proves the vaccine caused the problem.', f: 'VAERS is not designed to determine if a vaccine caused a health problem; anyone can file a report.', w: 'VAERS is an early warning system. Its value is spotting unusual patterns that then get studied, so reports matter, but one report is not proof.', src: 'vaers' },
    { id: 'ct34', ages: 'both', topic: 'vaccines', s: { ya: 'A friend says studies found the MMR shot causes autism. What do the IOM and AHRQ reviews say?', adult: 'A mom in your group says the MMR vaccine was shown to cause autism. What do the major reviews say?' },
      c: ['They found it does', 'They found no link', 'The reviews never looked at MMR'],
      m: 'Studies found the MMR vaccine causes autism.', f: 'CDC: the IOM and AHRQ reviews found, with a high strength of evidence, no association between MMR and autism.', w: 'Other big studies agree. A 2019 Danish study of 657,461 children found MMR does not raise autism risk, and a 2014 meta-analysis of over 1.2 million children found no link to vaccines.', src: 'cdc-autism', also: ['hviid2019', 'taylor2014'] },
    { id: 'ct35', ages: 'both', topic: 'vaccines', s: { ya: 'A post says the CDC states flatly that no vaccine causes autism. What does the CDC page say now?', adult: 'A nurse friend says the CDC site says vaccines do not cause autism, case closed. What does the page say now?' },
      c: ['It says the case is closed', 'It says it is not ruled out', 'It says vaccines cause it'],
      m: 'The CDC website says it is settled that vaccines do not cause autism.', f: 'Since its July 2026 change, the CDC page says "vaccines do not cause autism" is not evidence-based because studies have not ruled out a link. That is not evidence of a link.', w: 'The large studies found no link: the IOM and AHRQ reviews cited on the same page, a Danish study of 657,461 children (2019), and a 2014 meta-analysis of over 1.2 million children.', src: 'cdc-autism', also: ['hviid2019', 'taylor2014'] },
    { id: 'ct36', ages: 'ya', topic: 'vaccines', s: 'A friend says scientists already know the main cause of autism. Do they?',
      c: ['The main cause is known now', 'They have not found root causes', 'It is screen time'],
      m: 'Scientists already know what causes autism.', f: 'CDC: scientists have not identified the root causes of autism.', w: 'That is why claims from any side that one thing causes autism go beyond the evidence.', src: 'cdc-autism' },
    { id: 'ct37', ages: 'both', topic: 'immigration', s: { ya: 'A post says the number of immigrants here illegally has been shrinking for years. What did Pew find for 2023?', adult: 'A commentator says illegal immigration numbers have been falling for years. What did Pew find for 2023?' },
      c: ['It kept shrinking', 'A record 14 million', 'Fewer than 2 million people'],
      m: 'The unauthorized immigrant population has been shrinking for years.', f: 'Pew: it reached a record 14 million in 2023, up 3.5 million in two years.', w: 'Pew also says it likely started to decline in 2025 with more deportations. The count changes fast with policy.', src: 'pew-unauth2023' },
    { id: 'ct38', ages: 'both', topic: 'immigration', s: { ya: 'Someone says most immigrants in the U.S. are here illegally. What share are unauthorized?', adult: 'A woman at the diner says most immigrants are illegal. What share of U.S. immigrants were unauthorized in 2023?' },
      c: ['Most of them are', 'About 1 in 4', 'Almost none of them'],
      m: 'Most immigrants in the U.S. are here illegally.', f: 'Pew: unauthorized immigrants were 27% of the foreign-born in 2023; 46% of all immigrants were naturalized citizens.', w: 'The unauthorized share did rise, from 22% in 2021. Both the rise and the minority share are true.', src: 'pew-unauth2023' },
    { id: 'ct39', ages: 'both', topic: 'immigration', s: { ya: 'A video says immigrants here illegally commit more crime than citizens. What did a big Texas study find?', adult: 'A neighbor says undocumented immigrants are more likely to commit crimes. What did the PNAS Texas study find?' },
      c: ['Much higher crime rates', 'Lower felony arrest rates', 'Exactly the same rates'],
      m: 'Undocumented immigrants commit more crime than native-born citizens.', f: 'A 2020 PNAS study of Texas arrests found lower felony arrest rates for undocumented immigrants than for native-born citizens.', w: 'It used Texas data that records immigration status. Each crime by anyone is real harm, and people who want tighter borders argue from law and fairness too, not only crime.', src: 'pnas' },
    { id: 'ct40', ages: 'both', topic: 'immigration', s: { ya: 'Which country did most unauthorized immigrants come from in 2023?', adult: 'Your coworker says most unauthorized immigrants are Mexican. What did Pew find for 2023?' },
      c: ['Mexico, by a big majority', 'Mexico, but only 30%', 'A mix led by Canada'],
      m: 'Most unauthorized immigrants are from Mexico.', f: 'Pew: Mexico is still the top country but was 30% in 2023; Mexicans used to be a majority.', w: 'Growth from 2021 to 2023 came mostly from other countries, rising from 6.4 to 9.7 million.', src: 'pew-unauth2023' },
    { id: 'ct42', ages: 'both', topic: 'guns', s: { ya: 'A post says most gun deaths in the U.S. are murders. What did CDC data show for 2024?', adult: 'A news segment implies most gun deaths are homicides. What did CDC data show for 2024?' },
      c: ['Most of them are murders', 'Most are suicides', 'About 9 in 10 are accidents'],
      m: 'Most U.S. gun deaths are murders.', f: 'CDC 2024: 62% of the 44,447 gun deaths were suicides and 35% were homicides.', w: 'Suicides get less attention than homicides but have long been the majority of gun deaths.', src: 'pew-guns' },
    { id: 'ct43', ages: 'both', topic: 'guns', s: { ya: 'A friend says most gun murders are done with AR-style rifles. What did the FBI find for 2024?', adult: 'A coworker says assault-style rifles are used in most gun murders. What did the FBI find for 2024?' },
      c: ['Mostly AR-style rifles', 'Handguns, by a wide margin', 'Mostly hunting shotguns'],
      m: 'Assault-style rifles are used in most gun murders.', f: 'FBI 2024: handguns were in 53% of gun murders with data, all rifles in 3%, and 42% type not stated.', w: 'Rifles get attention because of mass shootings, which are a small fraction of gun homicides. Supporters of a ban point to their use in those attacks.', src: 'pew-guns' },
    { id: 'ct44', ages: 'both', topic: 'guns', s: { ya: 'Someone says the Second Amendment means any weapon, anywhere, no limits. What did the Court say in Heller?', adult: 'A coworker says the Second Amendment allows no limits at all. What did Heller say?' },
      c: ['It has no limits', 'The right is not unlimited', 'It only covers hunting rifles'],
      m: 'The Second Amendment right has no limits.', f: 'Heller (2008): "Like most rights, the Second Amendment right is not unlimited."', w: 'Heller named concealed carry bans that courts had upheld as an example. Where the lines fall is still argued in court.', src: 'sc-heller' },
    { id: 'ct45', ages: 'both', topic: 'guns', s: { ya: 'A classmate says the Second Amendment only protects state militias. What did the Supreme Court hold in Heller?', adult: 'A friend says the Second Amendment only covers militias. What did the Supreme Court hold in 2008?' },
      c: ['Militia service only', 'An individual right', 'Police and soldiers only'],
      m: 'The Second Amendment protects only militia service.', f: 'Heller: it protects an individual right to keep a gun unconnected with militia service, such as for self-defense at home.', w: 'Four justices dissented. Heller is the law now, and how far it reaches is still argued.', src: 'sc-heller' },
    { id: 'ct46', ages: 'both', topic: 'guns', s: { ya: 'A post says the gun death rate is the highest it has ever been. Is it?', adult: 'A speaker says gun deaths per person are at an all-time high. What does the CDC rate show?' },
      c: ['An all-time high, yes', 'Below the 1974 peak', 'The lowest rate ever recorded'],
      m: 'The U.S. gun death rate is at an all-time high.', f: 'CDC: 12.8 gun deaths per 100,000 in 2024, below the peak of 16.3 in 1974.', w: 'The total count was among the highest on record because the population grew. Gun homicides fell 27% from 2021 to 2024.', src: 'pew-guns' },
    { id: 'ct48', ages: 'both', topic: 'guns', s: { ya: 'Someone says Republicans and Democrats agree on nothing about guns. Do they agree on any gun policy?', adult: 'A cousin says the two parties agree on zero gun policies. Did Pew find any they agree on?' },
      c: ['They agree on nothing at all', 'Yes, on some', 'They agree on every gun policy'],
      m: 'Republicans and Democrats agree on no gun policies.', f: 'Pew: 88% of Republicans and 89% of Democrats favor keeping people with mental illness from buying guns.', w: 'They split sharply on assault-style weapon bans and carrying in more places, so both "agreement" and "division" are real.', src: 'pew-gunowners' },
    { id: 'ct49', ages: 'both', topic: 'guns', s: { ya: 'A friend says most gun owners own guns mainly for hunting. What did Pew find?', adult: 'A city friend thinks gun owners mostly keep guns to hunt. What reason did Pew find tops the list?' },
      c: ['Mostly for hunting', 'Mostly for protection', 'Mostly for collecting'],
      m: 'Most gun owners own guns mainly for hunting.', f: 'Pew: 72% of gun owners say protection is a major reason; 32% say hunting.', w: 'And 81% of owners say a gun makes them feel safer. Critics point to risks at home; owners point to self-defense.', src: 'pew-gunowners' },
    { id: 'ct50', ages: 'ya', topic: 'guns', s: 'A post says most American adults personally own a gun. What did Pew find?',
      c: ['Most adults do', 'About 1 in 3 adults', 'About 9 in 10 rural adults'],
      m: 'Most American adults own a gun.', f: 'Pew 2023: 32% of adults say they personally own a gun; another 10% live with someone who does.', w: 'Ownership differs a lot by group: 47% of rural adults vs 20% of urban adults.', src: 'pew-gunowners' },
    { id: 'ct51', ages: 'both', topic: 'crime', s: { ya: 'A video says violent crime is way worse now than in the 1990s. What does FBI data show?', adult: 'A neighbor says violent crime is far higher than in the early 1990s. What does FBI data show?' },
      c: ['It is far higher now', 'Down 49% since 1993', 'About the same as back then'],
      m: 'Violent crime is far higher now than in the 1990s.', f: 'FBI: the violent crime rate fell 49% from 1993 to 2022; the BJS survey shows a 71% drop.', w: 'Gallup found most Americans say crime is up nationally in most years, even as rates fell. Local crime spikes are still real for those who live through them.', src: 'pew-crime' },
    { id: 'ct52', ages: 'both', topic: 'crime', s: { ya: 'A friend says murder did not really go up during the pandemic. Did it go up?', adult: 'A podcaster says murder did not really rise in 2020. Did it rise?' },
      c: ['It barely changed at all', 'Yes, a record jump', 'It fell 20% that year'],
      m: 'Murder did not really rise during the pandemic.', f: 'Pew: in 2020 the U.S. murder rate saw its largest single-year increase on record.', w: 'It stayed higher through 2022, then preliminary data showed a big drop in 2023. Both the spike and the fall are real.', src: 'pew-crime' },
    { id: 'ct53', ages: 'both', topic: 'crime', s: { ya: 'Do most violent crimes get reported to the police?', adult: 'A friend assumes nearly all violent crimes get reported to police. What did the BJS survey find for 2022?' },
      c: ['Yes, nearly all', 'Only about 4 in 10 get reported', 'Almost none of them ever do'],
      m: 'Nearly all violent crimes are reported to police.', f: 'BJS 2022: only 41.5% of violent crimes and 31.8% of household property crimes were reported.', w: 'This is why police counts and victim surveys differ, and why both are used.', src: 'pew-crime' },
    { id: 'ct54', ages: 'adult', topic: 'crime', s: 'A neighbor says police solve most violent crimes that are reported. What did the FBI find for 2022?',
      c: ['Most of them get solved', 'About a third', 'About 9 in 10 get solved'],
      m: 'Police solve most reported violent crimes.', f: 'FBI 2022: police cleared 36.7% of reported violent crimes, down from 48.1% in 2013.', w: 'Clearance for murder was 52.3%. Both police and their critics cite this drop, for different reasons.', src: 'pew-crime' },
    { id: 'ct56', ages: 'both', topic: 'wages', s: { ya: 'A friend says a $15 federal minimum wage would cost zero jobs. What did the CBO estimate?', adult: 'A candidate says a $15 minimum wage would not cost any jobs. What did the CBO estimate in 2021?' },
      c: ['No jobs lost at all', '1.4 million fewer jobs', '10 million fewer jobs'],
      m: 'A $15 federal minimum wage would cost no jobs.', f: 'CBO (2021): employment would fall by 1.4 million workers in 2025 on average, about 0.9%.', w: 'CBO gave a wide range, from about zero to 2.7 million. The same report found big gains for others (see the poverty card).', src: 'cbo-minwage' },
    { id: 'ct57', ages: 'both', topic: 'wages', s: { ya: 'Someone says a $15 minimum wage would not help anyone out of poverty. What did the CBO estimate?', adult: 'A business owner says a $15 minimum would not lift anyone out of poverty. What did the CBO find?' },
      c: ['It helps nobody', '0.9 million fewer poor', 'It ends poverty for 17 million'],
      m: 'A $15 minimum wage would not lift anyone out of poverty.', f: 'CBO (2021): 0.9 million fewer people in poverty, and 17 million workers would get raises.', w: 'This is the tradeoff: higher pay and less poverty for many, fewer jobs for some. Which matters more is a values question.', src: 'cbo-minwage' },
    { id: 'ct58', ages: 'both', topic: 'wages', s: { ya: 'People say minimum wage jobs are mostly for teens. What did BLS find for 2023?', adult: 'A coworker says almost all minimum wage earners are teenagers. What did BLS find?' },
      c: ['Almost all are teenagers', 'Most are 25 or older', 'Most are over 65'],
      m: 'Almost all minimum wage workers are teenagers.', f: 'BLS 2023: workers under 25 were 44% of those at or below the federal minimum; 25 and older were about 56%.', w: 'Young workers are overrepresented, so both camps have a point. Most work in food service, where tips may add to pay.', src: 'bls-minwage' },
    { id: 'ct59', ages: 'both', topic: 'wages', s: { ya: 'A post says tons of American workers earn $7.25 an hour or less. What share of hourly workers did in 2023?', adult: 'A speaker says millions earn the $7.25 federal minimum or less. What share of hourly workers did in 2023?' },
      c: ['About 1 in 4 workers', 'About 1 in 100', 'About 1 in 10'],
      m: 'A large share of U.S. workers earn $7.25 an hour or less.', f: 'BLS 2023: 1.1% of hourly workers earned the federal minimum or less, down from 13.4% in 1979.', w: 'Thirty states and D.C. set higher minimums, so the $7.25 floor affects few.', src: 'bls-minwage' },
    { id: 'ct60', ages: 'both', topic: 'taxes', s: { ya: 'You get a raise that moves you into the next tax bracket. Does your whole paycheck get taxed at the higher rate?', adult: 'A coworker turns down a raise so she will not jump a tax bracket. Will all her pay be taxed at the higher rate?' },
      c: ['Yes, all of it', 'Only the part above the line', 'If you are married filing jointly'],
      m: 'Moving into a higher bracket raises the tax on all your income.', f: 'IRS: you pay the higher rate only on the part of income that is in the new bracket.', w: 'So a raise does not lower your take-home pay from income tax alone. This is a mix-up on all sides.', src: 'irs-brackets' },
    { id: 'ct61', ages: 'both', topic: 'taxes', s: { ya: 'A post says the top 1% pay a smaller share of income tax than their share of income. What does IRS data show?', adult: 'A friend says the top 1% pay less than their fair share of income tax compared to what they earn. What does IRS data show?' },
      c: ['A smaller share than their income', 'About 38% of it', 'About 5% of all of it'],
      m: 'The top 1% pay a smaller share of income tax than their share of income.', f: 'IRS 2023: the top 1% had 20.6% of income (AGI) and paid 38.4% of federal income tax.', w: 'This is income tax only, not payroll or other taxes. Whether that share is fair is a values question.', src: 'irs-soi' },
    { id: 'ct62', ages: 'both', topic: 'taxes', s: { ya: 'Someone says the richest of the rich pay the highest income tax rate of anyone. What does IRS data show?', adult: 'A coworker says the very richest pay the highest average income tax rates. What did the IRS find for 2023?' },
      c: ['Yes, the richest pay the most', 'No, the top 0.001% pay less', 'They pay no income tax'],
      m: 'The very richest Americans pay the highest average income tax rate.', f: 'IRS 2023: the top 0.001% paid an average 23.6%, below the top 0.1% at 26.7% and top 1% at 26.3%.', w: 'This is federal income tax only. Whether rates at the very top are fair is argued by both sides.', src: 'irs-soi' },
    { id: 'ct64', ages: 'both', topic: 'economy', s: { ya: 'A friend says any tax-funded program, like aid for the poor, makes a country socialist. Does it, by definition?', adult: 'Your uncle says any government benefit program is socialism. Is that the definition?' },
      c: ['Yes, that is socialism', 'Capitalist nations have them too', 'If taxes top 20% of income, yes'],
      m: 'Any tax-funded social program makes an economy socialist.', f: 'Britannica: social programs exist in most capitalist economies and do not make an economy socialist.', w: 'Socialism is about who owns or controls the means of production. Critics of big programs still argue about cost and freedom on other grounds.', src: 'brit-socialism' },
    { id: 'ct65', ages: 'both', topic: 'economy', s: { ya: 'A post calls Denmark a socialist country. What did Denmark\'s own prime minister say at Harvard?', adult: 'A candidate holds up Denmark as socialism that works. What did Denmark\'s prime minister say in 2015?' },
      c: ['It is a socialist nation', 'A market economy', 'A monarchy with no markets'],
      m: 'Denmark is a socialist country.', f: 'PM Lars Lokke Rasmussen: "Denmark is far from a socialist planned economy. Denmark is a market economy."', w: 'He called the Nordic model an expanded welfare state with a successful market economy. Fans of its programs and fans of its markets can both claim parts of it.', src: 'denmark' },
    { id: 'ct66', ages: 'both', topic: 'economy', s: { ya: 'Someone says Denmark pays for free college and health care just by taxing the rich. How does its PM describe it?', adult: 'A friend says Nordic benefits come from taxing only the wealthy. How did Denmark\'s PM describe the cost?' },
      c: ['Only the rich pay for all of it', 'It costs high taxes on nearly all', 'Oil money pays for it'],
      m: 'Nordic benefits are paid for by taxing only the rich.', f: 'The PM said the catch is high taxes: a 25% sales tax and total taxes near half of national income, vs about 25% in the U.S.', w: 'A sales tax falls on everyone who shops. Whether the trade is worth it is the real debate.', src: 'denmark' },
    { id: 'ct67', ages: 'both', topic: 'economy', s: { ya: 'What is the defining feature of socialism?', adult: 'At dinner someone says socialism just means high taxes. What is its defining feature?' },
      c: ['High taxes on the rich', 'Shared control of production', 'Free health care for everyone'],
      m: 'Socialism just means high taxes.', f: 'Britannica: in socialism the major means of production are owned or controlled collectively, not mainly by private owners.', w: 'Under capitalism they are privately owned and markets set prices. Socialists say capitalism concentrates wealth; defenders point to individual choice in free markets.', src: 'brit-socialism' },
    { id: 'ct69', ages: 'both', topic: 'abortion', s: { ya: 'A post says the Dobbs decision banned abortion across the whole U.S. Did it?', adult: 'A friend thinks the Supreme Court outlawed abortion nationwide in 2022. What did Dobbs do?' },
      c: ['It banned abortion nationwide', 'It returned it to voters', 'A federal right to abortion'],
      m: 'The Dobbs decision banned abortion nationwide.', f: 'Dobbs (2022) overruled Roe and Casey and returned the authority to regulate abortion to the people and their elected representatives.', w: 'States now set their own laws. Pro-life Americans see this as letting people protect unborn life; pro-choice Americans see a lost right. Three justices dissented.', src: 'sc-dobbs' },
    { id: 'ct70', ages: 'both', topic: 'abortion', s: { ya: 'When in pregnancy do most U.S. abortions happen, according to CDC data?', adult: 'A relative believes most abortions happen late in pregnancy. What does CDC data for 2022 show?' },
      c: ['Mostly late, after 21 weeks', 'About 93% by 13 weeks', 'Mostly at 14 to 20 weeks'],
      m: 'Most abortions happen late in pregnancy.', f: 'CDC 2022: 92.8% were at 13 weeks or earlier; 6.1% at 14 to 20 weeks and 1.1% at 21 weeks or later.', w: 'For pro-life Americans, gestational age does not change the value of the life; for pro-choice Americans, early timing matters. Both are moral views; the timing is a fact.', src: 'cdc-abortion' },
    { id: 'ct71', ages: 'both', topic: 'abortion', s: { ya: 'A friend says abortions after 21 weeks basically never happen. Do they happen?', adult: 'Someone says abortions at 21 weeks or later never happen. Do they, per CDC data for 2022?' },
      c: ['They never happen', 'Yes, they do, about 1 in 100', 'About 1 in 5 of all abortions'],
      m: 'Abortions after 21 weeks never happen.', f: 'CDC 2022: 1.1% of reported abortions were at 21 weeks or later.', w: 'Rare is not never. Pro-life and pro-choice Americans both cite this figure, one to show it happens and one to show it is rare.', src: 'cdc-abortion' },
    { id: 'ct72', ages: 'adult', topic: 'abortion', s: 'How were most U.S. abortions done in 2022, according to the CDC?',
      c: ['Mostly by surgery', 'Mostly early medication', 'Mostly late procedures'],
      m: 'Most abortions are surgical.', f: 'CDC 2022: 53.3% were early medication abortions at 9 weeks or less.', w: 'Use of early medication abortion grew 129% from 2013 to 2022.', src: 'cdc-abortion' },
    { id: 'ct73', ages: 'ya', topic: 'abortion', s: 'A post says most abortions are among teenagers. What age group had the most in 2022?',
      c: ['Teenagers, by far', 'Women in their 20s', 'Women over 40'],
      m: 'Most abortions are among teenagers.', f: 'CDC 2022: women in their twenties accounted for 56.5% of abortions.', w: 'The CDC notes this is similar to previous years.', src: 'cdc-abortion' },
    { id: 'ct74', ages: 'both', topic: 'abortion', s: { ya: 'What does the Southern Baptist Convention\'s statement of faith say about the unborn?', adult: 'A coworker says the SBC has no official stance on unborn life. What does the Baptist Faith and Message say?' },
      c: ['It takes no stance', 'Life from conception', 'Life begins at birth for all'],
      m: 'The Southern Baptist Convention has no official stance on unborn life.', f: 'Baptist Faith and Message 2000: speak on behalf of the unborn and for the sanctity of all human life from conception to natural death.', w: 'The Catholic Catechism likewise teaches life is sacred from its beginning. Other churches differ; knowing each one\'s text avoids guesswork.', src: 'sbc-bfm' },
    { id: 'ct75', ages: 'both', topic: 'speech', s: { ya: 'A creator says a private platform banning her account violates her First Amendment rights. Does it?', adult: 'A friend says a private company firing or banning him for a post violates the First Amendment. Does it?' },
      c: ['Yes, that is censorship by law', 'It limits government only', 'If you paid for the account'],
      m: 'A private company blocking your speech violates the First Amendment.', f: 'Halleck (2019): the Free Speech Clause prohibits only governmental, not private, abridgment of speech.', w: 'People can still argue that big platforms should allow more speech as a matter of policy or fairness. That is a separate question from the Constitution.', src: 'sc-halleck' },
    { id: 'ct76', ages: 'both', topic: 'speech', s: { ya: 'A classmate says hate speech is not protected by the First Amendment. What did the Supreme Court say in Matal v. Tam?', adult: 'A friend says hateful speech is not covered by free speech law. What did the Court say in 2017?' },
      c: ['It is not protected', 'Yes, it is protected', 'Only when said online'],
      m: 'Hate speech is not protected by the First Amendment.', f: 'Matal v. Tam (2017): the government may not ban speech for being offensive; we protect "the thought that we hate."', w: 'Incitement to imminent lawless action can still be punished. Many find hate speech deeply wrong; the Court says the remedy is not government bans of ideas.', src: 'sc-matal' },
    { id: 'ct77', ages: 'both', topic: 'speech', s: { ya: 'Is it automatically illegal to argue in general that force or lawbreaking is justified?', adult: 'Someone says any speech advocating force is a crime. What test did Brandenburg v. Ohio set?' },
      c: ['Yes, always illegal', 'Only if it incites now', 'If it is posted online, yes'],

    'atp-3-50-21': ['Army ATP 3-50.21 Survival (2018)', 'https://armypubs.army.mil/epubs/DR_pubs/DR_a/pdf/web/ARN12086_ATP%203-50x21%20FINAL%20WEB%202.pdf']
  },
  cards: [
    { id: 'nv01', ages: 'both', topic: 'gear', s: 'Your phone has a trail map app. Should you still pack a paper map?',
      c: ['The app is all you need', 'Pack paper as a backup', 'Paper maps are always out of date'],
      m: 'A phone app is all the map you need.', f: 'Bring a physical map as a backup, and an extra phone battery.', w: 'Phones die, break and lose signal.', src: 'nps-10' },
    { id: 'nv02', ages: 'both', topic: 'gear', s: 'Which light do park rangers suggest for night on the trail?',
      c: ['The phone\'s bright flashlight', 'A headlamp, hands-free', 'A candle in a glass jar'],
      m: 'A phone light is the best trail light.', f: 'Headlamps are the top pick because they are hands-free. Pack extra batteries.', w: 'You need your hands to climb and carry.', src: 'nps-10' },
    { id: 'nv03', ages: 'both', topic: 'gear', s: 'What color clothes help if Search and Rescue has to look for you?',
      c: ['Dark green, to blend in', 'Bright, easy-to-see colors', 'Gray, to stay cool'],
      m: 'Dull colors are best outdoors.', f: 'Bright clothing makes you easier to see.', w: 'Rescuers spot bright colors from far off.', src: 'nps-10' },
    { id: 'nv04', ages: 'both', topic: 'gear', s: 'How much extra food should you pack on a day hike?',
      c: ['Enough for lunch only', 'A spare day of food', 'None; you will be back soon'],
      m: 'A day hike needs no extra food.', f: 'Pack an extra day\'s food, best if no-cook, like trail mix, nuts and bars.', w: 'Plans change. Extra food helps you or others.', src: 'nps-10' },
    { id: 'nv05', ages: 'both', topic: 'gear', s: 'When should you drink water on a hot hike?',
      c: ['Wait until thirsty', 'Often, before thirst', 'Only at stops, each hour'],
      m: 'Drink when you get thirsty.', f: 'Drink water often and before you feel thirsty.', w: 'Thirst comes late, after you start to dry out.', src: 'nps-10' },
    { id: 'nv06', ages: 'both', topic: 'gear', s: 'Before you head out, who should know your plan?',
      c: ['Only the ranger at the gate', 'Someone at home, with a time', 'The hiking partner, only'],
      m: 'You don\'t need to tell anyone.', f: 'Tell someone where you are going and when to expect you back.', w: 'Then someone knows to call for help.', src: 'nps-10' },
    { id: 'nv07', ages: 'both', topic: 'gear', s: 'What is a good thing to check in your first aid kit before a trip?',
      c: ['The color of the box', 'The dates on items', 'The brand of each bandage'],
      m: 'First aid kits last forever.', f: 'Check expiration dates and replace items. Add your own medicines.', w: 'Old supplies may not work.', src: 'nps-10' },
    { id: 'nv08', ages: 'both', topic: 'gear', s: 'Why carry fire starting gear on a day hike?',
      c: ['To roast some snacks', 'For signals and for warmth', 'Fire is never needed'],
      m: 'Fire gear is only for camping.', f: 'Fire can be a signal and a heat source for cooking and staying warm.', w: 'Pack waterproof matches or a lighter and fire starters.', src: 'nps-10' },
    { id: 'nv09', ages: 'both', topic: 'gear', s: 'What emergency shelter is light enough for a day pack?',
      c: ['A full cabin tent', 'A space blanket or tarp', 'A heavy wool rug, rolled'],
      m: 'Shelter is too heavy for a day hike.', f: 'A tent, tarp, bivy sack or space blanket are light options.', w: 'Shelter guards you from weather and cold.', src: 'nps-10' },
    { id: 'nv10', ages: 'both', topic: 'gear', s: 'What goes in the "repair kit" of the Ten Essentials?',
      c: ['A spare phone, mostly', 'Duct tape and a multi-tool', 'A sewing kit, small'],
      m: 'There is no need for tools on a hike.', f: 'Carry duct tape, a knife, scissors and a multi-tool.', w: 'Gear breaks at bad times.', src: 'nps-10' },
    { id: 'nv11', ages: 'both', topic: 'map', s: 'On a topo map, the brown lines are close together. What does that mean?', img: 'img/contour-lines.svg', imgAlt: 'Drawing of brown contour lines around a hill. On one side the lines are close together, labeled steep. On the other side they are far apart, labeled gentle.',
      c: ['Flat and easy walking', 'Steep slopes are there', 'A lake or a pond'],
      m: 'Close lines mean flat ground.', f: 'Contour lines close together mean steep slopes.', w: 'Each line is one height. Close lines mean height changes fast.', src: 'usgs-mapcompass' },
    { id: 'nv12', ages: 'both', topic: 'map', s: 'What do contour lines on a topo map show?', img: 'img/contour-lines.svg', imgAlt: 'Drawing of brown contour lines around a hill. On one side the lines are close together, labeled steep. On the other side they are far apart, labeled gentle.',
      c: ['Trails you can walk on', 'Ground at one height', 'Borders between the states'],
      m: 'Brown lines are hiking trails.', f: 'They are imaginary lines that follow the ground at one constant elevation.', w: 'They show the shape of the land.', src: 'usgs-mapcompass' },
    { id: 'nv13', ages: 'both', topic: 'map', s: 'On a USGS topo map, what color are woods?',
      c: ['Brown, like the dirt', 'In a green tint', 'Purple, like grapes are'],
      m: 'Woods are shown in brown.', f: 'Woodlands are shown in a green tint, and water in blue.', w: 'Brown is used for contour lines.', src: 'usgs-mapcompass' },
    { id: 'nv14', ages: 'ya', topic: 'map', s: 'A topo map says 1:24,000. What does that mean?',
      c: ['The map is 24,000 years old', 'Each map inch is 24,000', 'It shows 24,000 places'],
      m: 'It is the map\'s age.', f: 'It is the scale: 1 inch on the map is 24,000 inches on the ground.', w: 'That is about 2,000 feet per inch.', src: 'usgs-mapcompass' },
    { id: 'nv15', ages: 'ya', topic: 'map', s: 'On a 1:24,000 map, 1 inch stands for about how far?',
      c: ['About 1 mile', 'About 2,000 feet', 'About 100 feet'],
      m: 'An inch is about a mile.', f: 'At 1:24,000, 1 inch is about 2,000 feet.', w: 'It\'s a good scale for hiking.', src: 'usgs-mapcompass' },
    { id: 'nv16', ages: 'both', topic: 'map', s: 'On a compass with degrees, what number is east?',
      c: ['East is 180', 'East is 90', 'East is 270'],
      m: 'East is 180.', f: 'North is 0 or 360, east is 90, south is 180 and west is 270.', w: 'Degrees go around clockwise.', src: 'usgs-mapcompass' },
    { id: 'nv17', ages: 'both', topic: 'compass', s: 'Does a compass needle point to true north?', img: 'img/compass-declination.svg', imgAlt: 'Drawing of a compass circle with two arrows from the center. A black arrow points straight up to true north. A red arrow leans off to the side toward magnetic north. The angle between them is labeled declination.',
      c: ['Always, everywhere on earth', 'Rarely; it finds magnetic north', 'Only during the summer'],
      m: 'A compass always points to true north.', f: 'A compass points to magnetic north, which is usually not true north.', w: 'The gap between them is called declination.', src: 'usgs-mapcompass' },
    { id: 'nv18', ages: 'both', topic: 'compass', s: 'Does declination stay the same over the years?', img: 'img/compass-declination.svg', imgAlt: 'Drawing of a compass circle with two arrows from the center. A black arrow points straight up to true north. A red arrow leans off to the side toward magnetic north. The angle between them is labeled declination.',
      c: ['It is fixed forever', 'It shifts with place, time', 'It changes only in big storms'],
      m: 'Declination never changes.', f: 'Declination varies with location and with time.', w: 'Use a recent map or the NOAA calculator.', src: 'usgs-decl' },
    { id: 'nv19', ages: 'both', topic: 'compass', s: 'Where on a USGS topo map do you find the declination?', img: 'img/compass-declination.svg', imgAlt: 'Drawing of a compass circle with two arrows from the center. A black arrow points straight up to true north. A red arrow leans off to the side toward magnetic north. The angle between them is labeled declination.',
      c: ['On the back cover', 'In the map collar', 'In a separate book you buy'],
      m: 'You have to buy a separate book.', f: 'The map collar shows the declination at the map center for the year it was made.', w: 'Old maps may be out of date.', src: 'usgs-decl' },
    { id: 'nv20', ages: 'both', topic: 'compass', s: 'Your old family topo map is from 1975. Is its declination still right?',
      c: ['Declination never shifts', 'It may have changed', 'It only matters in Canada'],
      m: 'Old maps stay right forever.', f: 'Magnetic north keeps moving, so the map\'s declination may be out of date. NOAA has a calculator.', w: 'Small errors add up over miles.', src: 'usgs-mapcompass' },
    { id: 'nv21', ages: 'adult', topic: 'compass', s: 'Where can you check today\'s declination for your spot?',
      c: ['Ask at a gas station', 'NOAA\'s online calculator', 'The car\'s GPS screen'],
      m: 'There\'s no way to know it.', f: 'NOAA has an online calculator for declination at any place and date.', w: 'Then set or adjust your compass.', src: 'usgs-decl' },
    { id: 'nv22', ages: 'ya', topic: 'compass', s: 'Can a compass ever point south?',
      c: ['Never, it\'s impossible', 'At very high latitudes', 'When it breaks, only'],
      m: 'A compass can never point south.', f: 'At very high latitudes, a compass can even point south.', w: 'Near the magnetic pole, things get strange.', src: 'usgs-decl' },
    { id: 'nv23', ages: 'both', topic: 'compass', s: 'Should you walk holding an open compass out in front of you?',
      c: ['Watch it the whole way', 'Sight a mark, then walk', 'Hold it very still, walking'],
      m: 'Watch the compass the whole time.', f: 'Sight on a landmark along your bearing, close the compass and walk to it. Repeat.', w: 'A moving compass does not stay level or steady.', src: 'atp-3-50-21' },
    { id: 'nv24', ages: 'both', topic: 'compass', s: 'What makes a good landmark (steering mark) to walk toward?',
      c: ['A small bush close by', 'A tall, far, clear one', 'Any rock that looks gray'],
      m: 'Pick the nearest thing on your line.', f: 'Pick the most distant, highest object on your line that you can easily recognize.', w: 'You check the compass less often.', src: 'atp-3-50-21' },
    { id: 'nv25', ages: 'adult', topic: 'compass', s: 'You aim for a bridge on a long river. Why aim a bit to one side on purpose?',
      c: ['It makes the walk shorter', 'You\'ll know which way to turn', 'The compass works better'],
      m: 'Always aim straight at the target.', f: 'Aim about 10 degrees to one side. When you reach the river, you know which way to turn.', w: 'No one walks a perfect line.', src: 'atp-3-50-21' },
    { id: 'nv26', ages: 'adult', topic: 'compass', s: 'You walk around a fallen tree in your path. Which steps count toward distance?',
      c: ['Every step you take', 'Only steps toward the goal', 'The steps taken sideways'],
      m: 'Count every step.', f: 'Count only paces taken toward the goal, not the sideways ones.', w: 'Side steps don\'t move you forward.', src: 'atp-3-50-21' },
    { id: 'nv27', ages: 'both', topic: 'compass', s: 'Do small compass and pace errors matter over a long hike?',
      c: ['They cancel each other out', 'They add up over distance', 'They vanish on flat land'],
      m: 'Small errors don\'t matter.', f: 'Errors add up over distance. Check your spot against land features often.', w: 'You can end up far off course.', src: 'atp-3-50-21' },
    { id: 'nv28', ages: 'both', topic: 'move', s: 'You are lost after a crash or fall. When should you make big choices?',
      c: ['At once, while fresh', 'After the shock passes', 'When it gets dark out'],
      m: 'Decide fast while your adrenaline is up.', f: 'Don\'t decide right after the event. Wait for the shock to pass, then think it through.', w: 'Shock clouds judgment.', src: 'atp-3-50-21' },
    { id: 'nv29', ages: 'both', topic: 'move', s: 'It\'s storming, and you have a safe shelter. Should you leave to travel?',
      c: ['Leave now to beat it', 'Stay put in the shelter', 'Run between the trees fast'],
      m: 'Bad weather is a reason to hurry out.', f: 'Leaving a safe shelter to travel in bad weather is foolish.', w: 'Storms cause falls, cold and getting lost.', src: 'atp-3-50-21' },
    { id: 'nv30', ages: 'both', topic: 'move', s: 'You are hiking a new trail. Why look back often?',
      c: ['To take in the view', 'To know the way back', 'To count the people'],
      m: 'Looking back is a waste of time.', f: 'Study your back trail. Know the way back as well as the way forward.', w: 'Trails look very different going the other way.', src: 'atp-3-50-21' },
    { id: 'nv31', ages: 'both', topic: 'move', s: 'In the wild, when should you make camp?',
      c: ['When it is fully dark', 'Early, with time to spare', 'Whenever you feel tired'],
      m: 'Hike until dark, then camp.', f: 'Make camp early so you have time to build a shelter.', w: 'Shelter is hard to build in the dark.', src: 'atp-3-50-21' },
    { id: 'nv32', ages: 'both', topic: 'move', s: 'What is a smart rule for hands and feet on rough ground?',
      c: ['Grab anything to steady you', 'Look first, then place them', 'Go fast and trust luck'],
      m: 'Grab whatever is there.', f: 'Don\'t put your hands or feet anywhere without looking first.', w: 'Snakes, thorns and loose rock hide there.', src: 'atp-3-50-21' },
    { id: 'nv33', ages: 'ya', topic: 'move', s: 'How should you climb a steep slope to save energy?',
      c: ['Straight up, fast as you can', 'Zigzag back and forth', 'Run up on your toes'],
      m: 'Straight up is fastest and best.', f: 'Zigzag or traverse up steep slopes to save energy and keep balance.', w: 'Each step is smaller and safer.', src: 'atp-3-50-21' },
    { id: 'nv34', ages: 'ya', topic: 'move', s: 'How should your knees be when going down a steep hill?',
      c: ['Locked out straight', 'Bent, back straight', 'Wobbly and loose'],
      m: 'Lock your knees going down.', f: 'Keep your back straight and your knees bent going down.', w: 'Bent knees don\'t overextend the joint.', src: 'atp-3-50-21' },
    { id: 'nv35', ages: 'ya', topic: 'move', s: 'Which animals are better signs that water is near?',
      c: ['Hawks and owls nearby', 'Deer and other grazers', 'Wolves and foxes nearby'],
      m: 'Predators lead you to water.', f: 'Grazing animals, like deer, are better signs of water than predators.', w: 'Grazers need water often.', src: 'atp-3-50-21' },
    { id: 'nv36', ages: 'ya', topic: 'move', s: 'About how far from their hive do bees usually travel?',
      c: ['Up to 40 miles', 'About 4 miles', 'About 400 feet'],
      m: 'Bees fly huge distances.', f: 'Bees seldom go more than four miles from the hive, and usually have water in that range.', w: 'Bees can be a clue to water.', src: 'atp-3-50-21' },
    { id: 'nv37', ages: 'both', topic: 'water', s: 'You must cross a river. What is a good first step?',
      c: ['Jump in and test it', 'Look from high ground', 'Wait for the water to drop'],
      m: 'Just jump in and see.', f: 'First look from a high place to get a good view and find a crossing spot.', w: 'You can see rapids, channels and bars.', src: 'atp-3-50-21' },
    { id: 'nv38', ages: 'both', topic: 'water', s: 'Which spot is usually easier to cross?',
      c: ['One wide, deep channel', 'Two or three narrow ones', 'A ledge of rocks across'],
      m: 'One wide channel is easiest.', f: 'Two or three narrow channels are usually easier than one wide river.', w: 'Each one is smaller and slower.', src: 'atp-3-50-21' },
    { id: 'nv39', ages: 'both', topic: 'water', s: 'A ledge of rocks runs across the river. Is that a good place to cross?',
      c: ['Great; step on the rocks', 'Avoid it; it means rapids', 'Okay, if the rocks are dry'],
      m: 'Rocks make a handy bridge.', f: 'A rock ledge across a river often means dangerous rapids or canyons.', w: 'Water speeds up over ledges.', src: 'atp-3-50-21' },
    { id: 'nv40', ages: 'both', topic: 'water', s: 'You\'re swept into fast, shallow rapids. How do you ride them?',
      c: ['Head first, on your belly', 'On your back, feet first', 'Stand up and try to walk'],
      m: 'Stand up and walk out.', f: 'Lie on your back, feet pointing downstream, and keep your feet up.', w: 'Feet catch rocks before your head does, and staying up keeps them from getting stuck.', src: 'atp-3-50-21' },
    { id: 'nv41', ages: 'adult', topic: 'water', s: 'Crossing a deep, swift river by swimming, which way do you swim?',
      c: ['Straight against it', 'With the current', 'Upstream, and hard'],
      m: 'Fight the current to stay on line.', f: 'Swim with the current, not against it, and keep your body flat.', w: 'Fighting the current wears you out.', src: 'atp-3-50-21' },
    { id: 'nv42', ages: 'adult', topic: 'water', s: 'A group fords a stream holding one pole. Where does the heaviest person go?',
      c: ['In the middle spot', 'At the downstream end', 'At the upstream end'],
      m: 'The strongest goes upstream.', f: 'The heaviest person goes downstream, the lightest upstream.', w: 'The upstream person breaks the current for the rest.', src: 'atp-3-50-21' },
    { id: 'nv43', ages: 'adult', topic: 'water', s: 'You use a pole to ford a swift stream. Where do you plant it?',
      c: ['On the downstream side', 'On the upstream side', 'Behind you, on the shore'],
      m: 'Plant it downstream to lean on.', f: 'Plant the pole firmly on the upstream side to break the current.', w: 'The current pushes the pole against you.', src: 'atp-3-50-21' },
    { id: 'nv44', ages: 'adult', topic: 'water', s: 'Can a float made from logs always hold you?',
      c: ['Every log floats fine', 'Test it before crossing', 'Dead wood always floats'],
      m: 'All dead wood floats.', f: 'Test any log first. Some, like palm, sink even when dead.', w: 'A sinking float is worse than none.', src: 'atp-3-50-21' },
    { id: 'nv45', ages: 'both', topic: 'water', s: 'Which spot in a river is dangerous because of a strong backward pull?',
      c: ['A flat, sandy bar', 'Eddies behind rocks', 'A slow, wide pool'],
      m: 'Calm swirls are safe to rest in.', f: 'Eddies can pull you backward and under the surface.', w: 'They form behind rocks and logs.', src: 'atp-3-50-21' },
    { id: 'nv46', ages: 'both', topic: 'direction', s: 'Does the sun always rise exactly due east?',
      c: ['Exactly due east, always', 'Roughly east, not exact', 'In the winter only'],
      m: 'The sun rises exactly due east every day.', f: 'The sun rises in the east and sets in the west, but not exactly due east or west.', w: 'It shifts with the seasons.', src: 'atp-3-50-21' },
    { id: 'nv47', ages: 'both', topic: 'direction', s: 'In the US, which way does a shadow point at noon?',
      c: ['To the south', 'To the north', 'To the east, mostly'],
      m: 'Noon shadows point south.', f: 'In the Northern Hemisphere, shadows point north at noon.', w: 'The sun is in the south at noon.', src: 'atp-3-50-21' },
    { id: 'nv48', ages: 'both', topic: 'direction', s: 'Shadow-tip method: you mark the first tip of a stick\'s shadow. What direction is that mark?',
      c: ['East, every time', 'West, every time', 'North, every time'],
      m: 'The first mark is east.', f: 'The first shadow mark is always west. The second mark, 10 to 15 minutes later, is east.', w: 'Shadows move opposite the sun.', src: 'atp-3-50-21' },
    { id: 'nv49', ages: 'both', topic: 'direction', s: 'How long do you wait between shadow-tip marks?',
      c: ['Wait about 2 hours', 'Wait 10 to 15 minutes', 'Wait about 1 minute'],
      m: 'Wait a few hours.', f: 'Wait 10 to 15 minutes until the tip moves a few inches.', w: 'Then draw a line for east-west.', src: 'atp-3-50-21' },
    { id: 'nv50', ages: 'both', topic: 'direction', s: 'With the first shadow mark (west) on your left, which way are you facing?',
      c: ['You face south', 'You face north', 'You face east now'],
      m: 'You face south.', f: 'West on your left means north is ahead, east right and south behind.', w: 'Picture a map.', src: 'atp-3-50-21' },
    { id: 'nv51', ages: 'adult', topic: 'direction', s: 'The ground is sloped. Must the shadow stick stand straight up for the shadow-tip method?',
      c: ['Straight up, exactly', 'A slant works too', 'Only on flat ground'],
      m: 'The stick must be dead straight.', f: 'Tilting the stick doesn\'t hurt the accuracy of the shadow-tip method.', w: 'Only the tip is marked.', src: 'atp-3-50-21' },
    { id: 'nv52', ages: 'both', topic: 'direction', s: 'Watch method, Northern Hemisphere: you point the hour hand at the sun. Where is south?',
      c: ['At the 12 mark', 'Halfway to the 12', 'At the hour hand itself'],
      m: 'The 12 points south.', f: 'South is midway between the hour hand and 12 (or 1 on daylight time).', w: 'It\'s rough, so check it often.', src: 'atp-3-50-21' },
    { id: 'nv53', ages: 'ya', topic: 'direction', s: 'You only have a digital watch. Can you use the watch method?',
      c: ['Only analog ones work', 'Draw a clock face', 'Digital ones won\'t work'],
      m: 'You need a watch with hands.', f: 'Draw a clock face with the right time on paper or the ground and use that.', w: 'The method only needs the hour position.', src: 'atp-3-50-21' },
    { id: 'nv54', ages: 'adult', topic: 'direction', s: 'The moon rises before the sun has set. Which side of the moon is lit?',
      c: ['The east side', 'The west side', 'The south side'],
      m: 'The lit side is east.', f: 'If the moon rises before sunset, the lit side faces west. After midnight, east.', w: 'The lit side faces the sun.', src: 'atp-3-50-21' },
    { id: 'nv55', ages: 'both', topic: 'direction', s: 'Which stars help you find the North Star?',
      c: ['Orion\'s belt stars', 'The Dipper\'s pointers', 'The brightest star seen'],
      m: 'The North Star is the brightest star.', f: 'The two pointer stars on the Big Dipper\'s bowl point to the North Star.', w: 'Go about five times their distance apart.', src: 'atp-3-50-21' },
    { id: 'nv56', ages: 'ya', topic: 'direction', s: 'From the Big Dipper\'s pointer stars, how far out is the North Star?',
      c: ['About 1 gap away', 'About 5 gaps away', 'About 20 gaps away'],
      m: 'It\'s right next to them.', f: 'Extend the line about five times the distance between the pointer stars.', w: 'It\'s the end of the Little Dipper\'s handle.', src: 'atp-3-50-21' },
    { id: 'nv57', ages: 'adult', topic: 'direction', s: 'You are at 35 degrees north latitude. How high up is the North Star?',
      c: ['About 70 degrees up', 'About 35 degrees up', 'About 10 degrees, low'],
      m: 'It\'s always straight overhead.', f: 'The North Star sits about as high as your latitude.', w: 'It narrows your search.', src: 'atp-3-50-21' },
    { id: 'nv58', ages: 'ya', topic: 'direction', s: 'Which star group points south in the Southern Hemisphere?',
      c: ['The Big Dipper', 'The Southern Cross', 'The Lazy W shape'],
      m: 'The Big Dipper works everywhere.', f: 'There\'s no bright south star, so use the Southern Cross as a signpost.', w: 'The Big Dipper isn\'t seen well down south.', src: 'atp-3-50-21' },
    { id: 'nv59', ages: 'both', topic: 'direction', s: 'Moss grows on one side of a tree. Does that point north?',
      c: ['Moss always marks north', 'Moss can\'t be trusted', 'Moss always marks east'],
      m: 'Moss always grows on the north side.', f: 'Moss can grow all around some trees, so it can\'t be trusted to show north.', w: 'Use the sun or stars instead.', src: 'atp-3-50-21' },
    { id: 'nv60', ages: 'adult', topic: 'direction', s: 'In a tree stump in the US, which side has the wider-spaced rings?',
      c: ['The north side', 'The south side', 'The east side, mostly'],
      m: 'Rings are wider on the north.', f: 'Growth is stronger toward the equator, so rings are wider on the south side in the US.', w: 'That side gets more sun.', src: 'atp-3-50-21' },
    { id: 'nv61', ages: 'adult', topic: 'direction', s: 'In the US in summer, which hillsides hold snow patches longer?',
      c: ['The south-facing slopes', 'North-facing slopes, shady', 'The west-facing slopes'],
      m: 'South slopes keep snow longer.', f: 'North-facing slopes get less sun, stay cooler and keep snow longer.', w: 'South slopes melt first.', src: 'atp-3-50-21' },
    { id: 'nv62', ages: 'ya', topic: 'direction', s: 'How do you magnetize a needle to make a compass?',
      c: ['Heat it in a flame', 'Stroke one way on silk', 'Rub it back and forth'],
      m: 'Rub it back and forth.', f: 'Stroke it slowly in one direction on silk or through your hair. Always one way.', w: 'Then float or hang it; it lines up north-south.', src: 'atp-3-50-21' },
    { id: 'nv63', ages: 'ya', topic: 'direction', s: 'You float a magnetized needle on a leaf in water. What does it do?',
      c: ['Spins and spins around', 'Lines up north-south', 'Sinks to the bottom'],
      m: 'It just spins around.', f: 'The needle slowly lines itself up north-south.', w: 'Use the sun to tell which end is north.', src: 'atp-3-50-21' },
    { id: 'nv64', ages: 'both', topic: 'gps', s: 'Should you count only on a GPS to find your way?',
      c: ['GPS alone is plenty', 'Use it with a map', 'GPS works best on its own'],
      m: 'A GPS never fails.', f: 'Use GPS along with a map and compass so you are less likely to get lost.', w: 'Batteries die and signals drop.', src: 'atp-3-50-21' },
