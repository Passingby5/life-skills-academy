  cards: [
    { id: 'sf01', ages: 'both', topic: 'courier', cite: 'U.S. Attorney, S.D. Cal., Oct. 20, 2023', s: 'Victoria Carmona was caught with hidden cocaine and told agents a Facebook job had her drive cash to Mexico. The story was a planned cover; she pleaded guilty. Real "blind mule" pitches look like it. Which signs are red flags?',
      cues: [
        { t: 'A stranger on Facebook says you can earn pay driving cash', flag: true, why: 'Real firms do not hire strangers to haul cash.' },
        { t: 'Your car must be left with them for a while first', flag: true, why: 'Time alone with your car lets them hide drugs in it.' },
        { t: 'The dealer says you must show a license to test drive', flag: false, why: 'Normal check before a test drive.' },
        { t: 'They say a GPS unit will be put in to keep the car secure', flag: true, why: 'A tracker lets them follow the load, not keep you safe.' },
        { t: 'Your new boss says pay comes by direct deposit', flag: false, why: 'Normal payroll.' },
        { t: 'A trucking firm you applied to runs a background check', flag: false, why: 'Real employers often check.' }
      ],
      doThis: 'Never drive a car or carry a bag someone else packed or had alone. Say no and report the offer at tips.fbi.gov.', src: 'doj-carmona', also: ['ftc-reshipping'] },
    { id: 'sf02', ages: 'both', topic: 'courier', cite: 'U.S. Attorney, W.D. Wash., June 23, 2025', s: 'Martin Peinado Torres said a Facebook post promised construction work. After he filled out the forms, he was told the job was moving drugs. Which signs are red flags?',
      cues: [
        { t: 'They give you a company address you can visit', flag: false, why: 'Details you can check are a good sign.' },
        { t: 'The foreman says you will see the site before day one', flag: false, why: 'Seeing the worksite is a good sign.' },
        { t: 'The forms ask for your family\'s home addresses', flag: true, why: 'Family details became leverage; he said they threatened his family.' },
        { t: 'The real job is revealed only after you sign up', flag: true, why: 'A bait and switch is a classic trafficking move.' },
        { t: 'They ask to see your work permit before you start', flag: false, why: 'Checking work papers is normal and legal.' },
        { t: 'They say your family can get hurt if you quit', flag: true, why: 'A threat to family is coercion. Get help right away.' }
      ],
      doThis: 'Check any job offer through the company itself. If you are threatened, call 911 or the trafficking hotline at 1-888-373-7888.', src: 'doj-fbcourier', also: ['polaris-recruit'] },
    { id: 'sf03', ages: 'both', topic: 'courier', cite: 'U.S. Attorney, N.D. Okla., May 12, 2026', s: 'Jose Sanchez Sanchez, smuggled into the U.S., was told he now owed the cartel a $25,000 "fee" and had to work it off as a courier in Tulsa. Which signs are red flags?',
      cues: [
        { t: 'A boss says you owe a big fee you never agreed to', flag: true, why: 'A surprise debt is a common way to trap workers.' },
        { t: 'The boss says you must work until the debt is paid', flag: true, why: 'Working off a debt under pressure is debt bondage.' },
        { t: 'A landlord says first month\'s rent is due upfront, with a lease', flag: false, why: 'A normal, written rental cost.' },
        { t: 'They ask you to sign in with your name at the shelter', flag: false, why: 'Shelters log guests to keep people safe.' },
        { t: 'They keep moving you between houses they control', flag: true, why: 'Moving people around keeps them isolated and dependent.' },
        { t: 'A legal aid office says they will never charge for advice', flag: false, why: 'Free legal help is real; use it.' }
      ],
      doThis: 'A debt is never a reason you must commit a crime. Call 1-888-373-7888 (text 233733) to get help, even without papers.', src: 'doj-sanchez-courier', also: ['dhs-blue-signs'] },
    { id: 'sf04', ages: 'both', topic: 'courier', cite: 'U.S. Attorney, S.D. Cal., Aug. 31, 2021', s: 'A Tijuana drug ring led by Osvaldo Mendivil-Tamayo recruited high school students who crossed into San Diego every day to carry drugs. Which signs are red flags?',
      cues: [
        { t: 'Someone says you can earn easy cash to carry a package across', flag: true, why: 'You would be the one caught and charged at the border.' },
        { t: 'A teacher says you must bring a signed trip form', flag: false, why: 'Ordinary school paperwork.' },
        { t: 'They pick you because you cross every day for school', flag: true, why: 'Daily crossers look routine, so ring leaders target them.' },
        { t: 'Your parents ask who will drive you home', flag: false, why: 'Normal care from family.' },
        { t: 'The coach says the team will ride in the school van', flag: false, why: 'A known adult with school approval.' },
        { t: 'A friend\'s parent offers to get you a ticket for a game', flag: false, why: 'A known adult doing a normal favor.' }
      ],
      doThis: 'Never carry anything across a border for someone else. Tell a parent, teacher or school officer about any offer.', src: 'doj-teens', also: ['polaris-recruit'] },
    { id: 'sf05', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, W.D. Wash., May 15, 2026', s: 'A Washington retiree was told she won $22 million from Publishers Clearing House. Roshard Andrew Carty took more than $600,000 in "fees" and pushed her to sell her home. Which signs are red flags?',
      cues: [
        { t: 'Before you get the prize, you must pay fees', flag: true, why: 'Real prizes never charge you first.' },
        { t: 'The caller asks you to tell no one about the win', flag: true, why: 'Secrecy keeps family from stopping the scam.' },
        { t: 'The store asks for your ID to cash a big check', flag: false, why: 'Normal fraud check at a store.' },
        { t: 'The caller says the FBI is on the call with you', flag: true, why: 'A fake authority claim to scare you into obeying.' },
        { t: 'You hang up and call your bank on the number on your card', flag: false, why: 'Calling the known number is the safe way.' },
        { t: 'They say your money was lost and ask you for more', flag: true, why: 'Each "loss" is a new ask; the prize never comes.' }
      ],
      doThis: 'Hang up. Never pay to get a prize. Tell a family member and report it at ReportFraud.ftc.gov.', src: 'doj-carty' },
    { id: 'sf06', ages: 'both', topic: 'moneyMule', cite: 'U.S. Attorney, E.D. Mo., Mar. 25, 2026', s: 'Sharon Dolisi of Missouri took checks from 28 lottery scam victims into her own bank account, then told her bank she buys gold. Which signs are red flags if someone asks you to help like that?',
      cues: [
        { t: 'Checks from strangers go into your own bank account', flag: true, why: 'That is moving scam money, even if you keep none.' },
        { t: 'You tell your bank you trade gold to explain the cash', flag: true, why: 'She gave her bank a false gold story. Lying to cover it is a crime.' },
        { t: 'Your bank says it must ask why you need so much cash', flag: false, why: 'Banks ask to protect you. Answer honestly.' },
        { t: 'A friend you know pays you back with a check', flag: false, why: 'A known person paying a known debt is fine.' },
        { t: 'Your bank says you must sign loan papers at a branch', flag: false, why: 'A normal step for a loan you asked for.' },
        { t: 'Your gym calls to say your class moved to noon', flag: false, why: 'Ordinary call from a place you use.' }
      ],
      doThis: 'Never let strangers send money through your account. If you already did, stop, keep records and report at ic3.gov.', src: 'doj-dolisi', also: ['ftc-fake-check'] },
    { id: 'sf07', ages: 'both', topic: 'moneyMule', cite: 'U.S. Attorney, E.D. Pa., Aug. 10, 2026', s: 'Emily Zawacki of Chester County took about $2 million in wires and mailed cash for a man called "David Thomas" she had never met. Which signs are red flags?',
      cues: [
        { t: 'Your boss is someone you have never met in person', flag: true, why: 'A boss or friend you never meet is a top mule sign.' },
        { t: 'Money from people you do not know shows up in your account', flag: true, why: 'You become the face of the fraud.' },
        { t: 'He says when cash will be mailed to your home', flag: true, why: 'He is running a pipeline through your home.' },
        { t: 'Your aunt says she will mail $20 cash for your birthday', flag: false, why: 'A known relative sending a small gift is fine.' },
        { t: 'Your boss says your pay will come by direct deposit', flag: false, why: 'A normal payroll deposit.' },
        { t: 'Your bank says staff will never ask for your PIN', flag: false, why: 'True. Real banks never ask for it.' }
      ],
      doThis: 'Stop moving the money. Keep the messages and report at ic3.gov. Tell your bank right away.', src: 'doj-chester', also: ['doj-cupid'] },
    { id: 'sf08', ages: 'both', topic: 'moneyMule', cite: 'U.S. Attorney, W.D.N.Y., Apr. 11, 2025', s: 'Mohamed Sakr of Montreal picked up cash from elderly New Yorkers told a loved one was jailed for DWI. He played the "bail bondsman." Which signs are red flags?',
      cues: [
        { t: 'A caller says your grandson was arrested for DWI', flag: true, why: 'A scary story to rush you before you check.' },
        { t: 'The caller says bail will be picked up at your door', flag: true, why: 'Courts never send someone to collect bail at home.' },
        { t: 'A court clerk gives you a case number you can check', flag: false, why: 'You can call the court yourself to confirm.' },
        { t: 'Your grandson says he will call you back on his own phone', flag: false, why: 'His known number is a safe way to check.' },
        { t: 'The money goes to a bail bondsman you have never met', flag: true, why: 'That stranger is the scam\'s courier.' },
        { t: 'A lawyer you know says you must come in to sign papers', flag: false, why: 'A known office with an address you can visit.' }
      ],
      doThis: 'Hang up and call your grandchild or a parent directly. Never hand cash to a courier. Call 911 if one shows up.', src: 'doj-canada-mule' },
    { id: 'sf09', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, N.D. Ohio, July 27, 2021', s: 'John Pla and Johnny Palmer of Tampa drove to Ohio homes to collect "bail" from grandparents told a relative was arrested. Which signs are red flags?',
      cues: [
        { t: 'A caller says he is your grandchild\'s lawyer', flag: true, why: 'Fake lawyers make the story sound official.' },

        { t: 'You call your grandchild\'s mom on her own number to check', flag: false, why: 'Checking with family is the right move.' },
        { t: 'A neighbor says they will keep an eye on your home for you', flag: false, why: 'Ordinary kindness.' },
        { t: 'A caller says to hang up and call the police main number', flag: false, why: 'Being told to check for yourself is a good sign.' },
        { t: 'Your grandchild says the game money came from a job', flag: false, why: 'Normal family talk.' }

      doThis: 'Call your grandchild or their parent on a number you know. Never hand cash to a courier. Report at ic3.gov.', src: 'doj-pla' },
    { id: 'sf10', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, W.D. Ky., June 13, 2025', s: 'In the case of Phillipe Gravel-Nadon, Canadian call centers told Kentucky seniors a grandchild had a car crash and urgently needed money. "Couriers" collected cash at their homes. Which signs are red flags?',
      cues: [
        { t: 'A caller says your grandchild needs money before tonight', flag: true, why: 'Urgency stops you from checking.' },

        { t: 'They say a courier will come to your home for the cash', flag: true, why: 'Real courts and lawyers do not do this.' },
        { t: 'Your grandchild\'s mom says she will call from her own phone', flag: false, why: 'A known number you can trust.' },
        { t: 'A caller says to call the hospital main desk to confirm', flag: false, why: 'Calling the real main number is a good check.' },
        { t: 'Your family has a code word you must hear first', flag: false, why: 'A code word helps you spot fakes.' }
      ],
      doThis: 'Hang up. Call your grandchild or a parent on a number you know. Set a family code word.', src: 'doj-ky-grand' },
    { id: 'sf11', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, D.R.I., Nov. 4, 2024', s: 'Two men in Rhode Island were charged as couriers in grandparent scams. Callers posed as a grandchild, a lawyer or the police and sent couriers for cash. Which signs are red flags?',
      cues: [
        { t: 'A caller who says he is a police officer wants bail in cash', flag: true, why: 'Real police do not collect bail by phone or at your door.' },
        { t: 'You hang up and call the police department\'s main number', flag: false, why: 'The right way to check a story.' },
        { t: 'You are told to meet a courier at a drop-off spot', flag: true, why: 'A parking lot handoff is a courier scam.' },
        { t: 'A bank teller says they must ask what the cash is for', flag: false, why: 'Tellers are trained to spot this. Tell them.' },
        { t: 'Your son says he will call you back from his real number', flag: false, why: 'A normal way to reach family.' },
        { t: 'The courthouse says bail is paid at the court window', flag: false, why: 'Real bail goes through the court.' }
      ],
      doThis: 'Call your family member on a number you know. Tell the bank teller what is going on. Report at ic3.gov.', src: 'doj-ri-grand' },
    { id: 'sf12', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, C.D. Cal., Sept. 6, 2022', s: 'Co-schemers of stockbroker Robert Cirillo talked an 82-year-old into sending $400,000 for his grandson\'s "bail" to an account Cirillo controlled. Which signs are red flags?',
      cues: [
        { t: 'You are told to wire bail to a private bank account', flag: true, why: 'Courts take bail through the court, not a private account.' },
        { t: 'They say the huge amount must go out today', flag: true, why: 'Pressure and size are both warning signs.' },
        { t: 'The court says bail rules are on its website', flag: false, why: 'Public rules you can check.' },
        { t: 'Your grandson\'s school says he missed a class', flag: false, why: 'Ordinary call.' },
        { t: 'A lawyer says you will meet at a real office with a sign', flag: false, why: 'A real place you can verify.' },
        { t: 'The bank says it will hold a large wire and call you', flag: false, why: 'A safety step, not a red flag.' }
      ],
      doThis: 'Stop and verify with family and the court directly. Ask your bank to hold any big wire. Report at ic3.gov.', src: 'doj-cirillo' },
    { id: 'sf13', ages: 'both', topic: 'impostor', cite: 'U.S. Attorney, E.D. Wash., Sept. 4, 2024', s: 'A woman in Yakima was told she had a warrant and must pay a $14,000 bond in a jail parking lot. Charmmorro Vijay Strothers, posing as a U.S. Marshal, took the cash. Which signs are red flags?',
      cues: [
        { t: 'A caller says you have a warrant and can pay to clear it', flag: true, why: 'Warrants are not cleared by paying on the phone.' },
        { t: 'The caller stays on the phone with you at the bank', flag: true, why: 'Keeping you on the phone stops you from checking.' },
        { t: 'A man in a parking lot takes the cash', flag: true, why: 'No real officer takes cash in a lot.' },
        { t: 'You get a handwritten receipt with a case number', flag: true, why: 'Fake paperwork to make it look real.' },

        { t: 'A deputy says you must come inside to the front desk', flag: false, why: 'Real offices meet you inside.' }

      doThis: 'Hang up. Call the court or police on a number you look up yourself. Report impostors at ReportFraud.ftc.gov.', src: 'doj-strothers' },
    { id: 'sf14', ages: 'both', topic: 'impostor', cite: 'U.S. Attorney, C.D. Cal., May 25, 2023', s: 'Davyd George Brand Jimenez is charged with posing as an ICE agent. Prosecutors say he showed a fake badge and promised Latino immigrants green cards and work permits for money. Which signs are red flags?',
      cues: [
        { t: 'A man who says he is a federal agent can get you a green card for a fee', flag: true, why: 'No federal agent sells immigration status.' },

        { t: 'A nonprofit says they never charge for help with forms', flag: false, why: 'You can check DOJ-accredited helpers.' },

      doThis: 'Use only a licensed lawyer or a DOJ-accredited helper. Report fake agents at ReportFraud.ftc.gov.', src: 'doj-brand-ice' },
    { id: 'sf15', ages: 'both', topic: 'impostor', cite: 'U.S. Attorney, W.D. Mich., May 14, 2024', s: 'Kari Morales was charged by a grand jury. Prosecutors say she drove to Grand Rapids to swap a fake "FBI WARRANT OF ARREST" for $60,000 in cash for a man she met online, and was told she could keep $2,500. Which signs are red flags?',

        { t: 'A notary says they must check your ID before stamping', flag: false, why: 'Normal notary rule.' }

      doThis: 'Say no to any errand that moves cash for a stranger. Federal agencies never demand money to end a warrant. Report at ic3.gov.', src: 'doj-morales' },
    { id: 'sf16', ages: 'both', topic: 'impostor', cite: 'U.S. Attorney, D.S.D., Jan. 28, 2026', s: 'Scammers working with Abdul Waheed Mohammed told a Rapid City senior she was part of a crime and would be arrested unless she handed over cash and gold. Which signs are red flags?',

      doThis: 'Hang up and tell someone you trust. Police never ask for cash or gold. Report at ReportFraud.ftc.gov.', src: 'doj-mohammed' },
    { id: 'sf17', ages: 'both', topic: 'impostor', cite: 'U.S. Attorney, W.D. Tex., Nov. 13, 2025', s: 'Dhruv Mangukiya, a student in Texas, picked up cash and gold from seniors told by "Treasury officials" to make a deposit to end an investigation. Which signs are red flags?',

      doThis: 'Hang up. Look up the agency\'s number yourself. Never hand cash or gold to anyone. Report at ReportFraud.ftc.gov.', src: 'doj-austin-amazon' },
    { id: 'sf18', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, S.D.N.Y., July 31, 2025', s: 'In a case against Su Jian Liu and Jingbin Jiang, seniors saw pop-ups saying to call a number. Callers said their bank was hacked and told them to buy gold, which couriers picked up. Which signs are red flags?',

    { id: 'sf19', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, D.R.I., Aug. 6, 2026', s: 'Cynthia Sun was sentenced for a scheme that sent pop-ups to seniors claiming their accounts were hacked, then told them to move money. Which signs are red flags?',
      cues: [

    { id: 'sf20', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, W.D. Pa., May 12, 2022', s: 'Two Californians were indicted in a tech support scam. Pop-ups posed as tech companies, said accounts were hacked, and got victims to move funds. Which signs are red flags?',

    { id: 'sf21', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, S.D. Tex., Sept. 30, 2021', s: 'Sumit Kumar Singh admitted his part in a tech support refund ring. It took fees, then said victims were "overpaid" and must mail cash back by FedEx or UPS. Which signs are red flags?',

        { t: 'You check your balance yourself in your own bank app', flag: false, why: 'Good check.' }

    { id: 'sf22', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, D. Ariz., Dec. 30, 2024', s: 'In an Arizona case against Ahmed Syed and Rupesh Chintakindi, pop-ups said computers were hacked. Victims were told to buy gold and gift cards that "government reps" would collect. Which signs are red flags?',

      doThis: 'Never pay anyone with gift cards or gold. Hang up and call your bank. Report at ReportFraud.ftc.gov.', src: 'doj-tech-az', also: ['ftc-fake-check'] },
    { id: 'sf23', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, E.D. Mo., Oct. 7, 2024', s: 'Five people, including Dariona Lambert, were arrested in a St. Louis case said to have taken at least $8 million from seniors. The indictment says callers said savings were compromised. Couriers picked up gold bars. Which signs are red flags?',

    { id: 'sf24', ages: 'both', topic: 'moneyMule', cite: 'U.S. Attorney, M.D. Fla., Nov. 1, 2024', s: 'Viraj Patel was a mule who picked up money and gold. Callers told a senior her identity was stolen, took remote access, and bought $71,000 in gold bars. Which signs are red flags?',

    { id: 'sf25', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, D. Md., July 27, 2023', s: 'In Yong Chen\'s gift card case, a Maryland man got an email saying a tech support plan would renew unless he called. "Brian" had his daughter type $300, but it showed as $3,000. Which signs are red flags?',

    { id: 'sf27', ages: 'both', topic: 'scams', cite: 'U.S. Attorney, E.D. Va., Nov. 3, 2017', s: 'Timeiki Hedspeth helped run a $6 million "mystery shopper" scheme. Recruits got fake cashier\'s checks to "test" wire services by sending most of the money on. Which signs are red flags?',

    { id: 'sf29', ages: 'both', topic: 'romance', cite: 'U.S. Attorney, D.R.I., Oct. 8, 2024', s: 'Wisdom Onyobeno\'s ring used fake profiles on Words with Friends and dating apps. They claimed to be soldiers overseas or workers on oil rigs in the Gulf of Mexico who needed money. Which signs are red flags?',

    { id: 'tr02', ages: 'both', topic: 'triage', s: 'In a crowd of hurt people, who do you check first?', img: 'img/triage-tags.svg', imgAlt: 'Four triage tags in a row: red marked Immediate, yellow marked Delayed, green marked Minor, black marked Dead. A note says SALT also uses grey for expectant.',
      c: ['The loudest one, who screams most', 'Those lying still or bleeding badly', 'Whoever can walk to you first'],
      m: 'The one screaming the loudest is the worst hurt.', f: 'Check first those who are not moving or have a clear life threat, like heavy bleeding.', w: 'Screaming takes breath and a strong heart. The still ones may be dying.', src: 'chemm-salt' },
    { id: 'tr03', ages: 'both', topic: 'triage', s: 'How long should each person\'s quick check take at a mass crash?',
      c: ['About 10 minutes each, fully', 'Less than 1 minute each', 'Five minutes per person'],
      m: 'Do a full exam on each person before you move on.', f: 'Each quick check should take less than one minute.', w: 'Long exams on one person leave others to die waiting.', src: 'chemm-salt' },
    { id: 'tr04', ages: 'both', topic: 'triage', s: 'What does a red triage tag mean?', img: 'img/triage-tags.svg', imgAlt: 'Four triage tags in a row: red marked Immediate, yellow marked Delayed, green marked Minor, black marked Dead. A note says SALT also uses grey for expectant.',
      c: ['Dead, or sadly past all help', 'Life threat, but likely to live', 'Minor hurts; can wait a while'],
      m: 'Red means the person is beyond help.', f: 'Red means immediate: badly hurt, but with a good chance to live with fast care.', w: 'Red goes first because fast care can save them.', src: 'chemm-start' },
    { id: 'tr05', ages: 'both', topic: 'triage', s: 'What does a yellow triage tag mean?', img: 'img/triage-tags.svg', imgAlt: 'Four triage tags in a row: red marked Immediate, yellow marked Delayed, green marked Minor, black marked Dead. A note says SALT also uses grey for expectant.',
      c: ['Needs care this very minute', 'Serious, but care can wait', 'Fine; may go home now'],
      m: 'Yellow means the person needs care first.', f: 'Yellow means delayed: serious, but not about to die in the next hours.', w: 'Yellow can wait while red gets care first.', src: 'chemm-start' },
    { id: 'tr06', ages: 'both', topic: 'triage', s: 'Someone with a green tag can do what?', img: 'img/triage-tags.svg', imgAlt: 'Four triage tags in a row: red marked Immediate, yellow marked Delayed, green marked Minor, black marked Dead. A note says SALT also uses grey for expectant.',
      c: ['Nothing; they must lie still', 'Help with their own care', 'Go first in the ambulance'],
      m: 'Every tagged person must lie still and wait.', f: 'Green means minor. They may help in their own care and can wait.', w: 'Green tags may even help others while they wait.', src: 'chemm-start' },
    { id: 'tr07', ages: 'both', topic: 'triage', s: 'In SALT triage, which tag means "not expected to survive"?', img: 'img/triage-tags.svg', imgAlt: 'Four triage tags in a row: red marked Immediate, yellow marked Delayed, green marked Minor, black marked Dead. A note says SALT also uses grey for expectant.',
      c: ['A black tag, every time', 'A grey tag, in SALT', 'A blue tag, used rarely'],
      m: 'Black is the only tag for people who will not make it.', f: 'SALT uses grey for expectant and black for dead.', w: 'Grey still gets comfort care when there is time.', src: 'chemm-salt' },
    { id: 'tr08', ages: 'both', topic: 'triage', s: 'In SALT, a black tag means what?',
      c: ['Hurt, but can wait hours', 'Dead, or not breathing', 'Needs care first, fast'],
      m: 'Black just means badly hurt.', f: 'Black is for those who are not breathing or have injuries no one can live through.', w: 'Time goes to those who can still be saved.', src: 'chemm-salt' },
    { id: 'tr09', ages: 'both', topic: 'triage', s: 'START triage checks the mind in a quick way. How?',
      c: ['Ask them the date and year', 'See if they obey commands', 'Ask them to count to 100'],
      m: 'You need a long quiz to check someone\'s mind.', f: 'START checks if the person can follow simple commands.', w: 'Following a command shows the brain is working well enough for now.', src: 'chemm-start' },
    { id: 'tr10', ages: 'both', topic: 'triage', s: 'You press a fingernail and let go. The pink color is slow to come back. How slow is too slow?',
      c: ['Over 10 seconds is slow', 'Over 2 seconds is slow', 'Over 5 seconds is slow'],
      m: 'Ten seconds is normal for color to return.', f: 'If the color takes more than 2 seconds, refill is delayed.', w: 'Slow refill can mean shock or poor blood flow.', src: 'navedtra-14295' },
    { id: 'tr12', ages: 'both', topic: 'triage', s: 'START triage is meant for people who look older than what age?',
      c: ['Only those over 18', 'Those older than 8', 'Every age, even babies'],
      m: 'Adult triage works the same on babies.', f: 'START is for people who look older than 8. Kids have their own tool.', w: 'Children breathe and react in different ways than adults.', src: 'chemm-start' },
    { id: 'tr13', ages: 'both', topic: 'triage', s: 'During a SALT check, one person is bleeding hard from a leg. What do you do before you move on?',
      c: ['Tag them and keep going fast', 'Stop the bleeding with a tourniquet', 'Splint the leg, then go on'],
      m: 'In triage you only tag people and never treat them.', f: 'SALT says to do quick lifesaving steps, like a tourniquet for heavy bleeding.', w: 'A few seconds of help can save a life.', src: 'chemm-salt' },
    { id: 'tr14', ages: 'both', topic: 'triage', s: 'An hour ago you tagged a man yellow. Now he is pale and fast breathing. What now?',
      c: ['A tag, once given, stays put', 'Check again; tags can change', 'Wait, since yellow means later'],
      m: 'Once a person is tagged, the tag stays.', f: 'Triage keeps changing. Check people again and change the tag when needed.', w: 'A small wound can turn into shock.', src: 'navedtra-14295' },
    { id: 'tr15', ages: 'both', topic: 'triage', s: 'What is the main goal of triage?',
      c: ['Help the worst hurt first, always', 'Save the most people you can', 'Treat people in arrival order'],
      m: 'Triage always means the worst hurt goes first.', f: 'Triage tries to save the most people with the time and supplies you have.', w: 'Sometimes the worst hurt need so much that others would die waiting.', src: 'navedtra-14295' },
    { id: 'tr16', ages: 'both', topic: 'scene', s: 'The 911 caller said "she just fainted." You get there. Do you trust that report?',
      c: ['Trust it; the caller saw it', 'Keep an open mind', 'Treat it as a simple faint'],
      m: 'The first report tells you what is wrong.', f: 'Do not let what you heard before you got there make up your mind.', w: 'Callers can miss a fall, a bleed or a drug.', src: 'navedtra-14295' },
    { id: 'tr17', ages: 'both', topic: 'scene', s: 'In the first fast check of a hurt person, when do you fix a problem you find?',
      c: ['After the full exam is done', 'The moment you find it', 'Once the ambulance gets there'],
      m: 'You finish the whole check, then treat.', f: 'In the first check, fix each big problem right when you find it.', w: 'A blocked airway can\'t wait for the rest of the exam.', src: 'navedtra-14295' },
    { id: 'tr18', ages: 'both', topic: 'scene', s: 'In the ABCDE first check, what does the A stand for?',
      c: ['Arms and legs, for breaks', 'Airway, so air can get in', 'Alert, or asleep, or out cold'],
      m: 'A is for arms, checking breaks first.', f: 'The ABCDEs are airway, breathing, circulation, disability and expose.', w: 'No air in, nothing else matters.', src: 'navedtra-14295' },
    { id: 'tr19', ages: 'both', topic: 'scene', s: 'About how fast should the ABCDE check and the transport choice be done?',
      c: ['Within 1 hour, if possible', 'Within 10 minutes, if possible', 'Within 2 hours, if possible'],
      m: 'Take as long as you need on scene.', f: 'Ideally the first check, status and transport choice take 10 minutes or less.', w: 'Bad injuries need a hospital fast.', src: 'navedtra-14295' },
    { id: 'tr20', ages: 'both', topic: 'scene', s: 'If the heart stops, how soon can the brain start to be harmed for good?',
      c: ['After about 1 hour', 'In 4 to 6 minutes', 'After about 30 minutes'],
      m: 'The brain can go without blood for half an hour.', f: 'Lasting brain harm can start in 4 to 6 minutes.', w: 'That is why you start CPR and call 911 fast.', src: 'navedtra-14295' },
    { id: 'tr21', ages: 'both', topic: 'scene', s: 'A hurt man is not talking much and wears a thick coat. Do you look under it?',
      c: ['Leave it on; it keeps him warm', 'Look under it, then cover him', 'Only if he says it hurts there'],
      m: 'Don\'t open clothes unless the person says it hurts.', f: 'You can\'t treat what you have not found. Look, then keep them warm and covered.', w: 'A quiet person may not tell you about a big wound.', src: 'navedtra-14295' },
    { id: 'tr22', ages: 'both', topic: 'vitals', s: 'An adult at rest has a pulse over 100. What is that called?',
      c: ['Normal for most adults', 'It is called rapid', 'Slow, and a bit low'],
      m: 'Over 100 is a normal resting pulse.', f: 'A pulse over 100 beats a minute is rapid.', w: 'A fast pulse can be a sign of shock.', src: 'navedtra-14295' },
    { id: 'tr23', ages: 'ya', topic: 'vitals', s: 'Your friend runs track and has a resting pulse of 45. Is that a sign of illness?',
      c: ['Yes; call 911 right away', 'That can be normal for athletes', 'It means she needs a doctor'],
      m: 'A pulse under 60 always means trouble.', f: 'A fit athlete may have a normal resting pulse of 40 to 50.', w: 'A strong heart pumps more with each beat.', src: 'navedtra-14295' },
    { id: 'tr24', ages: 'both', topic: 'vitals', s: 'How many breaths a minute is normal for an adult at rest?',
      c: ['About 30 to 40', 'About 12 to 20', 'About 4 to 8 or so'],
      m: 'Fast breathing like 30 is normal at rest.', f: 'A resting adult takes 12 to 20 breaths a minute.', w: 'Much faster or slower needs fast care.', src: 'navedtra-14295' },
    { id: 'tr25', ages: 'both', topic: 'vitals', s: 'What is a quick way to count breaths?',
      c: ['Ask how they feel breathing', 'Count 30 seconds, times 2', 'Count 10 seconds, times 3'],
      m: 'Just ask them if their breathing is okay.', f: 'Count breaths for 30 seconds and multiply by 2.', w: 'Counting gives a real number you can report.', src: 'navedtra-14295' },
    { id: 'tr26', ages: 'both', topic: 'vitals', s: 'A hurt person breathes very fast, or very slow. What does that mean?',
      c: ['They are only scared; wait', 'They need fast medical care', 'They will settle down soon'],
      m: 'Odd breathing is just nerves.', f: 'Breathing much too fast or too slow means they need medical care fast.', w: 'It can be a sign of shock, a head injury or poison.', src: 'navedtra-14295' },
    { id: 'tr27', ages: 'both', topic: 'vitals', s: 'You have no thermometer. How do you get a quick sense of skin temperature?',
      c: ['Feel the palm of their hand', 'Back of your hand on forehead', 'Feel the bottom of a foot'],
      m: 'You can\'t judge temperature without a thermometer.', f: 'Feel the forehead with the back of your hand. Note warm, hot, cool or cold.', w: 'Cool, damp skin can be a sign of shock.', src: 'navedtra-14295' },
    { id: 'tr28', ages: 'both', topic: 'shock', s: 'After a car wreck, a man gets restless and anxious. What could it be?',
      c: ['Only fear; he will be fine', 'An early sign of shock', 'Low sugar; give him soda'],
      m: 'Restless people are just upset.', f: 'Restlessness and worry are early signs of shock. Call 911.', w: 'Shock can sneak up before the person looks bad.', src: 'navedtra-14295' },
    { id: 'tr29', ages: 'both', topic: 'shock', s: 'What does skin often feel like in shock?',
      c: ['Hot, dry and flushed', 'Cool, with clammy sweat', 'Normal, warm and pink'],
      m: 'Shock makes skin hot and red.', f: 'In shock, skin feels cool and is covered with clammy sweat.', w: 'Blood is pulled away from the skin.', src: 'navedtra-14295' },
    { id: 'tr30', ages: 'both', topic: 'shock', s: 'What is the pulse often like in shock?',
      c: ['Slow and very strong', 'Rapid, weak, and thready', 'Steady and quite normal'],
      m: 'In shock the pulse slows down.', f: 'The pulse often gets rapid, weak and thready.', w: 'The heart races to make up for low blood.', src: 'navedtra-14295' },
    { id: 'tr31', ages: 'both', topic: 'shock', s: 'One sign of shock looks fine, but the rest of the scene looks bad. What wins?',
      c: ['The one sign that looks fine', 'The whole picture of the scene', 'The person\'s own word on it'],
      m: 'One normal sign rules out shock.', f: 'The whole picture matters more than any one sign.', w: 'Signs of shock vary from person to person.', src: 'navedtra-14295' },
    { id: 'tr32', ages: 'both', topic: 'shock', s: 'A blood pressure cuff shows the top number under 90. What is that?',
      c: ['Normal for a calm person', 'Low blood pressure', 'High blood pressure'],
      m: 'Under 90 is a good, healthy number.', f: 'A top number below 90 is low blood pressure, which can be a sign of shock.', w: 'Low pressure means less blood reaching the brain.', src: 'navedtra-14295' },
    { id: 'tr35', ages: 'ya', topic: 'rescue', s: 'A friend is drowning at the lake. You are not trained in lifesaving. Best way to help?',
      c: ['Swim out and grab them', 'Hold out a pole or branch', 'Wait on shore, call later'],
      m: 'Swim straight out to grab them.', f: 'Hold out a pole, oar, branch or stick, or throw something that floats. Call 911.', w: 'You stay safe on shore and can still help.', src: 'navedtra-14295' },
    { id: 'tr36', ages: 'ya', topic: 'rescue', s: 'Why is it risky to swim out to a drowning person if you are not trained?',
      c: ['The water may be cold', 'They may panic and fight you', 'You may lose your shoes'],
      m: 'A drowning person will hold still and let you help.', f: 'A drowning person may panic and fight so hard that you both go under.', w: 'Reach or throw from shore. Don\'t go unless trained.', src: 'navedtra-14295' },
    { id: 'tr37', ages: 'both', topic: 'rescue', s: 'There is smoke and you have no mask. Does a wet cloth keep you safe from bad gases?',
      c: ['Yes; it blocks all gas', 'It only cuts smoke', 'Only if kept very wet'],
      m: 'A wet cloth protects you from all smoke and gas.', f: 'A wet cloth helps with smoke and heat, but gives no protection from poison gas or low oxygen.', w: 'Carbon monoxide passes right through it.', src: 'navedtra-14295' },
    { id: 'tr38', ages: 'both', topic: 'rescue', s: 'In a smoky room, is the air near the floor safe from deadly gases?',
      c: ['Clean air sits down low', 'Deadly gas can be low too', 'Gas always rises to the top'],
      m: 'The air by the floor is always safe.', f: 'There is less smoke low, but deadly gases like carbon monoxide can be down low too.', w: 'Get out fast. Staying low is not a safe place to wait.', src: 'navedtra-14295' },
    { id: 'tr39', ages: 'both', topic: 'rescue', s: 'There is a fire in the house. Before you open a closed door, what do you do?',
      c: ['Open it fast to look', 'Feel the door first', 'Kick it open hard'],
      m: 'Fling the door open to see the fire.', f: 'Always feel a door first. If it is hot, use another way out.', w: 'Fire may be right behind a hot door.', src: 'navedtra-14295' },
    { id: 'tr40', ages: 'both', topic: 'rescue', s: 'Your clothes catch fire and you roll up in a blanket. What about your head?',
      c: ['Wrap it up tight too', 'Your head stays uncovered', 'Pour water on it first'],
      m: 'Wrap the whole body, head too.', f: 'Roll up in a blanket, coat or rug, but keep your head uncovered.', w: 'Covering the head can trap flames and smoke at your face.', src: 'navedtra-14295' },
    { id: 'tr41', ages: 'ya', topic: 'rescue', s: 'You are on an upper floor of a burning building. When is jumping okay?',
      c: ['At once, if the floor is hot', 'Only as a last resort', 'Any time it seems faster'],
      m: 'Jumping is a fast way out.', f: 'Do not jump from an upper floor except as a last resort.', w: 'Falls can kill. Look for other ways out first.', src: 'navedtra-14295' },
    { id: 'tr42', ages: 'adult', topic: 'rescue', s: 'A neighbor collapses inside a grain bin or tank. Will a wet rag over your face keep you safe going in?',
      c: ['Yes; a wet rag works fine', 'It won\'t; air may lack oxygen', 'Only if you hold your breath'],
      m: 'A wet rag lets you go in and get them.', f: 'A mask or wet cloth will not protect you from low oxygen or poison gas. Call 911.', w: 'Many rescuers die in tight spaces trying to help.', src: 'navedtra-14295' },
    { id: 'tr43', ages: 'adult', topic: 'rescue', s: 'You smell gas in a shed. You need light to look around. What do you bring?',
      c: ['A lighter, just for a moment', 'Nothing; get out and call', 'A candle in a glass jar'],
      m: 'A quick flame is fine if you are careful.', f: 'Never bring open flames, lighters or ordinary lights near possible explosive gas. Get out and call.', w: 'One spark can set off the gas.', src: 'navedtra-14295' },
    { id: 'tr44', ages: 'both', topic: 'moving', s: 'You carry a hurt person on a stretcher. Which way do they go?',
      c: ['Head first, so they see', 'Feet first, always', 'Either way is fine'],
      m: 'Head first so they can see where they go.', f: 'Move them feet first so the back carrier can watch their breathing.', w: 'The person at the head can see their face.', src: 'navedtra-14295' },
    { id: 'tr45', ages: 'both', topic: 'moving', s: 'You have a stretcher and a hurt person. Who moves to whom?',
      c: ['Carry the person to it', 'Bring it to them', 'Have them walk to it'],
      m: 'Move the hurt person to the stretcher.', f: 'When you can, bring the stretcher to the hurt person.', w: 'Moving the person less means less harm.', src: 'navedtra-14295' },
    { id: 'tr46', ages: 'both', topic: 'moving', s: 'A hurt person is safe where they lie. Should you move them before you check them?',
      c: ['Move them to a soft bed', 'Check them first', 'Drive them in right now'],
      m: 'Move them somewhere comfy first.', f: 'Unless the spot is unsafe, check and treat before you move them.', w: 'Moving can make hidden injuries worse.', src: 'navedtra-14295' },
    { id: 'tr47', ages: 'both', topic: 'moving', s: 'A badly hurt person is in the water. Should you haul them out with a rope?',
      c: ['Yes; it\'s the fastest way', 'Only in a true emergency', 'Sure, if two people pull'],
      m: 'A rope is the best way to pull a hurt person out.', f: 'Only in an extreme emergency. Keep them flat and still if you can.', w: 'Yanking and bending can make injuries worse.', src: 'navedtra-14295' },
    { id: 'tr48', ages: 'adult', topic: 'moving', s: 'A person is trapped in a wrecked car. What is the first stage of getting them out?',
      c: ['Pull them out right away', 'Get to them; reach them', 'Wait for a tow truck'],
      m: 'The first step is to drag them free.', f: 'The first stage is gaining access, reaching the person without hurting them more.', w: 'Then lifesaving care, then freeing them.', src: 'navedtra-14295' },
    { id: 'tr49', ages: 'both', topic: 'medical', s: 'A man acts drunk: confused and unsteady. What else could it be?',
      c: ['Only alcohol; let him sleep', 'Diabetes; look for an ID tag', 'Only tired; let him rest'],
      m: 'Confused and unsteady always means drunk.', f: 'Diabetic people are often mistaken for drunk. Look for a medical ID and call 911.', w: 'Low sugar can kill if missed.', src: 'navedtra-14295' },
    { id: 'tr50', ages: 'both', topic: 'medical', s: 'A diabetic friend is awake but acting odd. You don\'t know if sugar is high or low. Give sugar?',
      c: ['No, it could make it worse', 'Yes; when in doubt, give sugar', 'Wait for it to pass'],
      m: 'Never give sugar unless you know it is low.', f: 'If in doubt, give sugar to a person who is awake, and call 911.', w: 'Low sugar hurts the brain fast. A little extra sugar does little harm.', src: 'navedtra-14295' },
    { id: 'tr51', ages: 'adult', topic: 'medical', s: 'A confused person has breath that smells sweet, like nail polish remover. What may it be?',
      c: ['Too much candy today', 'A diabetic emergency', 'Bad breath, nothing more'],
      m: 'Sweet breath is from eating sweets.', f: 'A sweet acetone smell can be a sign of high blood sugar. Call 911.', w: 'It is a body change, not food.', src: 'navedtra-14295' },
    { id: 'tr52', ages: 'both', topic: 'medical', s: 'A person is passed out and no one knows them. What is worth checking for?',
      c: ['Their phone\'s last calls', 'A medical ID tag or bracelet', 'Their pockets for snacks'],
      m: 'There is nothing to learn from a stranger.', f: 'Look for a medical ID necklace or bracelet. It can tell you about diabetes and more.', w: 'Diabetic people almost always wear one.', src: 'navedtra-14295' },
    { id: 'tr53', ages: 'adult', topic: 'medical', s: 'Your father\'s face droops on one side and that arm is weak. It came on all at once. What now?',
      c: ['Let him nap it off for now', 'Dial 911; may be a stroke', 'Give him a big meal first'],
      m: 'It is just tiredness.', f: 'Sudden weakness on one side can be a stroke. Call 911 right away.', w: 'Stroke care works best fast.', src: 'navedtra-14295' },
    { id: 'tr54', ages: 'adult', topic: 'medical', s: 'While you wait for help with a possible stroke, how do you lay them?',
      c: ['Flat on the back, head down', 'Half sitting, or on weak side', 'Face down on the floor'],
      m: 'Lay them flat on their back.', f: 'Lay them half sitting, or on the paralyzed side, and watch the airway.', w: 'They may not be able to keep their airway clear.', src: 'navedtra-14295' },
    { id: 'tr55', ages: 'both', topic: 'medical', s: 'A man has had a drug many times with no trouble. Can it still cause a severe allergic reaction?',
      c: ['No, he is safe by now', 'Yes, it can happen', 'Only the first time'],
      m: 'A drug that was safe many times stays safe.', f: 'A severe allergic reaction can happen at any time, even after many safe uses.', w: 'Call 911 for trouble breathing or swelling.', src: 'navedtra-14295' },
    { id: 'tr56', ages: 'adult', topic: 'medical', s: 'A child swallowed something from under the sink. What matters most at first?',
      c: ['Name the exact poison first', 'Care for breathing; call help', 'Make the child throw up'],
      m: 'You must know the exact poison before you help.', f: 'Caring for airway, breathing and circulation matters most. Call Poison Control or 911.', w: 'Basic care is safe and works for most poisonings.', src: 'navedtra-14295' },
    { id: 'tr57', ages: 'adult', topic: 'medical', s: 'Your teen swallowed cleaner but feels fine. Can you skip calling for help?',
      c: ['Yes, no signs means fine', 'Get help; signs can worsen fast', 'Give milk and then just wait'],
      m: 'No signs means no poisoning.', f: 'Mild signs can get worse fast. Call Poison Control and watch closely.', w: 'Some poisons act late.', src: 'navedtra-14295' },
    { id: 'tr58', ages: 'both', topic: 'medical', s: 'What is the US Poison Control phone number?',
      c: ['Dial 411 and ask', '1-800-222-1222', 'Dial 311 and ask'],
      m: 'Call information to find it.', f: 'In the US, call Poison Control at 1-800-222-1222. Call 911 if they are not breathing or passed out.', w: 'Save it in your phone.', src: 'chemm-start' },
    { id: 'tr59', ages: 'ya', topic: 'lightning', s: 'You are caught in a field as a storm comes. Does crouching down make you safe?',
      c: ['Yes; crouching keeps you low', 'Run for a building or car', 'Crouch on tiptoes to be safe'],
      m: 'Crouching low keeps you safe.', f: 'Crouching does not make you safer. Get to a solid building or hard-top car.', w: 'Nowhere outside is safe in a storm.', src: 'noaa-lightning' },
    { id: 'tr60', ages: 'ya', topic: 'lightning', s: 'The storm is still miles away and the sky above you is blue. Are you safe from lightning?',
      c: ['Safe; there is no rain here', 'It can strike 10 miles off', 'Safe, if no clouds are above you'],
      m: 'No rain or clouds overhead means you are safe.', f: 'Lightning can strike 10 to 15 miles from the storm.', w: 'If you hear thunder, go inside.', src: 'noaa-lightning' },
    { id: 'tr61', ages: 'ya', topic: 'lightning', s: 'Rain starts with thunder on a hike. Is a big tree a good place to wait?',
      c: ['Good; it keeps you dry', 'Bad; trees draw many strikes', 'Fine, if it is the tallest'],
      m: 'A tree is good cover in a storm.', f: 'Being under a tree is the second leading cause of lightning injury.', w: 'Better wet than struck.', src: 'noaa-lightning' },
    { id: 'tr62', ages: 'ya', topic: 'lightning', s: 'Lightning is close and you are stuck outside. Should you lie flat on the ground?',
      c: ['Yes; it keeps you low', 'Keep moving toward shelter', 'Lie face down; that is best'],
      m: 'Lying flat is the safest thing.', f: 'Lying flat raises your risk from ground current. Keep moving toward shelter.', w: 'Current spreads along the ground.', src: 'noaa-lightning' },
    { id: 'tr63', ages: 'ya', topic: 'lightning', s: 'Your team is one point from winning when thunder rolls. Finish the game?',
      c: ['Finish, then go in', 'Go inside right away', 'Play on, unless you see a bolt'],
      m: 'It\'s fine to finish the game first.', f: 'Seek shelter right away when you hear thunder.', w: 'Many people are struck because they wait too long.', src: 'noaa-lightning' },
    { id: 'tr64', ages: 'ya', topic: 'lightning', s: 'Does a phone or a metal watch draw lightning to you?',
      c: ['Metal pulls it in', 'Metal makes no difference at all', 'Phones draw it most of all'],
      m: 'Metal on your body attracts lightning.', f: 'Height, shape and being alone in the open matter. Metal makes no difference.', w: 'Get inside. Don\'t waste time taking off jewelry.', src: 'noaa-lightning' },
    { id: 'tr65', ages: 'adult', topic: 'lightning', s: 'You are inside during a thunderstorm. What should you stay off?',
      c: ['Your cell phone and the couch', 'Corded phones and plumbing', 'Rugs and wooden chairs'],
      m: 'A house is 100% safe no matter what you touch.', f: 'Stay off corded phones, appliances, plumbing and metal doors and windows.', w: 'Lightning can travel through wires and pipes.', src: 'noaa-lightning' },

  };
  R.prrecap = function () {

  // After any screen change, ignore all taps for 350 ms, so a double tap never lands on the next screen's button.

  var A = {
    home: function () { U.notice = ''; S.active = null; go('home'); },

    pinset: function () {
