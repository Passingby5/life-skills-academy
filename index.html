    { id: 'hr30', ages: 'both', rating: 'adult', topic: 'trafficking', title: "A Good Life, They Promised", cite: "U.S. Department of Justice, labor trafficking sentencing (W.D. Wash.)", sourceIds: ["doj-diego"],
      passage: [
        "In Forks, Washington, a married couple from Guatemala lured the wife's sister to the United States, falsely promising her a home, a job earning a lot of money, and a good life. When she arrived, they told her she owed them a large debt and would work it off picking salal, a plant used by florists. They kept all of her earnings and added charges for food, housing, transportation, and utilities, so the debt grew. They held her identification documents and threatened her with deportation if she tried to leave. They did the same to another relative.",
        "In federal court in Tacoma, the husband was sentenced to three years in prison for forced labor, and his wife to one year of probation for document servitude. The judge called it a \"despicable offense.\" A U.S. attorney said what they did \"amounts to modern day slavery.\"",
        "The case shows that trafficking is not always a stranger with a van. Here the recruiters were family, the work was legal, and no one was locked in a room. The chains were a growing debt, taken papers, and fear of the law. Those are signs anyone can learn: a debt that never shrinks, documents someone else holds, and threats about immigration status. Victims of labor trafficking in the United States can be helped regardless of status, and the people who held them can be prosecuted, as these two were."
      ],
      qs: [
        { id: 'hr30-q1', type: 'mainIdea', q: "What is the main point of the passage?", c: ["Salal picking is poorly paid work", "Debt and taken papers trap family members", "Strangers lured her across the border"], fix: "The passage shows control through debt, documents and threats by relatives.", line: 3, proof: "The chains were a growing debt, taken papers, and fear of the law." },
        { id: 'hr30-q2', type: 'inference', q: "Why did the debt keep growing?", c: ["The price of salal fell each season", "They kept her pay and then added on charges", "She spent her pay on rent and food"], fix: "All earnings went to them, and new charges were added on top.", line: 1, proof: "They kept all of her earnings and added charges for food, housing, transportation, and utilities" },
        { id: 'hr30-q3', type: 'purpose', q: "Why does the author say \"no one was locked in a room\"?", c: ["To suggest she could have left easily", "To show control works without walls", "To show the court took the case lightly"], fix: "The point is that debt, papers and fear did the work that locks might do.", line: 3, proof: "no one was locked in a room" },
        { id: 'hr30-q4', type: 'assumption', q: "The list of signs at the end assumes that...", c: ["Relatives commit most trafficking", "Outsiders are able to notice these signs", "Victims tend to report it themselves"], fix: "Listing signs \"anyone can learn\" assumes others can spot them and act.", line: 3, proof: "Those are signs anyone can learn" },
        { id: 'hr30-q5', type: 'weaken', q: "Which would most weaken the claim that fear of deportation kept her there?", c: ["They held her identification documents the whole time", "She knew she could get help regardless of status", "The work picking salal was legal"], fix: "If she knew status did not block help, the threat would lose its grip.", line: 1, proof: "threatened her with deportation if she tried to leave" },
        { id: 'hr30-q6', type: 'tone', q: "The tone of the final paragraph is best described as...", c: ["Angry", "Instructive and firm", "Neutral and detached"], fix: "The author teaches signs and ends by noting that the abusers were prosecuted.", line: 3, proof: "and the people who held them can be prosecuted, as these two were" }
      ] },
    { id: 'hr31', ages: 'both', rating: 'adult', topic: 'trafficking', title: "Prison-Like Compounds", cite: "U.S. Department of Justice, Prince Group indictment; BBC (2026), Chen Zhi extradited to China", sourceIds: ["doj-prince","bbc-chenzhi"],
      passage: [
        "Federal prosecutors in Brooklyn unsealed an indictment against Chen Zhi, the founder and chairman of Prince Group, a conglomerate based in Cambodia. On paper, the company focused on real estate, financial services, and consumer services. Prosecutors allege that in secret it ran forced-labor scam compounds across Cambodia, where people held against their will worked online \"pig butchering\" schemes: fake friendships or romances that steer victims into fake crypto investments.",
        "A national security official described the setup this way: \"Trafficked workers were confined in prison-like compounds and forced to carry out online scams on an industrial scale.\" The government also filed to seize about 127,271 Bitcoin, worth about $15 billion, which it called the largest forfeiture action in the Justice Department's history. In January 2026, the BBC reports, Cambodia arrested Chen Zhi and extradited him to China. In the U.S. case, the charges are allegations until proven in court.",
        "This kind of case has two sets of victims. One is the person on the other end of the friendly message who loses savings. The other is the worker typing the message, who may have answered a job ad and found themselves trapped. Seeing both helps. It explains why the scripts feel so polished, and it is a reason never to treat an overseas job offer that is vague about the work, or that asks you to hand over your passport, as normal."
      ],
      qs: [
        { id: 'hr31-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["Prince Group's real estate hid its bank fraud", "Scam compounds harm targets and workers", "Crypto scams mostly target the elderly in the United States"], fix: "The last paragraph names the two sets of victims.", line: 3, proof: "This kind of case has two sets of victims." },
        { id: 'hr31-q2', type: 'inference', q: "Why does the author note the charges are \"allegations until proven\"?", c: ["To suggest the evidence is thin", "To be fair about what the case has shown", "To show the trial is under way in Brooklyn"], fix: "An indictment is not a conviction, and the author keeps that line clear.", line: 2, proof: "the charges are allegations until proven in court" },
        { id: 'hr31-q3', type: 'purpose', q: "Why does the passage explain what \"pig butchering\" means?", c: ["To show the workers built the fake investments", "To show how such a scam reels people in, step by step", "To show how the Bitcoin in the case was traced"], fix: "The definition shows the scam's method: trust first, then fake investments.", line: 1, proof: "fake friendships or romances that steer victims into fake crypto investments" },
        { id: 'hr31-q4', type: 'assumption', q: "The warning about vague job offers assumes that...", c: ["Overseas jobs are mostly scams", "Some workers were lured by such offers", "Passports are needed for travel"], fix: "The advice links the trap to how workers may have been lured in.", line: 3, proof: "who may have answered a job ad and found themselves trapped" },
        { id: 'hr31-q5', type: 'strengthen', q: "Which fact would most support the official's word \"industrial\"?", c: ["The government sought about $15 billion in Bitcoin", "The compounds held thousands working in shifts", "The firm had real estate and finance arms in Cambodia"], fix: "Thousands of workers on shifts would fit scams run \"on an industrial scale.\"", line: 2, proof: "forced to carry out online scams on an industrial scale" },
        { id: 'hr31-q6', type: 'tone', q: "How does the author treat the scam workers?", c: ["With suspicion, as likely partners", "With sympathy, as victims of it too", "With neutral distance"], fix: "The author counts the workers as a second set of victims.", line: 3, proof: "The other is the worker typing the message" }
      ] },
    { id: 'hr32', ages: 'both', rating: 'adult', topic: 'cartels', title: "A Cadre of Couriers", cite: "U.S. Attorney, S.D. Cal., teen couriers sentencing", sourceIds: ["doj-teens"],
      passage: [
        "In San Diego a federal judge sentenced Osvaldo Mendivil-Tamayo, 22, to seven years in prison and a $50,000 fine. In his plea agreement he admitted he was \"the leader of a drug distribution cell based in Tijuana\" and that he and others \"specifically recruited high school students who crossed through the San Diego Ports of Entry daily.\" The students carried drugs on their bodies, in backpacks, and in cars.",
        "The evidence came largely from his own Snapchat messages, which agents intercepted. In them he received the identification documents of would-be teen couriers, showing their ages, and in one case a photo of a Chula Vista High School ID card. He kept what prosecutors called a \"cadre of couriers\" and paid other people to recruit them for him. Seizures tied to his group came to about 150 kilograms of drugs, including fentanyl.",
        "Why recruit teenagers? The passage does not quote his reasons, but the record suggests some: students who cross every day draw less notice, they are easy to reach on apps they already use, and a recruiter can offer quick money to someone who has never had much. The teen takes the risk at the border; the leader stays in Tijuana. Anyone offered cash to carry a bag, a package, or a car across a border should see that trade for what it is."
      ],
      qs: [
        { id: 'hr32-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["How agents read his Snapchat messages", "A cell leader made teens take his risks", "Why border students cross each day"], fix: "The passage shows the recruiting and who carried the risk.", line: 3, proof: "The teen takes the risk at the border; the leader stays in Tijuana." },
        { id: 'hr32-q2', type: 'inference', q: "Why did he collect the couriers' ID documents?", c: ["The border crossing, by law, required them", "He knew their ages and still used them", "He planned to pay them by check"], fix: "The IDs showed their ages, so he knowingly used minors.", line: 2, proof: "he received the identification documents of would-be teen couriers, showing their ages" },
        { id: 'hr32-q3', type: 'purpose', q: "Why does the author say \"The passage does not quote his reasons\"?", c: ["To show the reasons are spelled out in his plea", "To admit the theory is the author's inference", "To show the prosecutors erred"], fix: "The author flags that the reasons are inferred from the record, not stated by him.", line: 3, proof: "but the record suggests some" },
        { id: 'hr32-q4', type: 'assumption', q: "The point that daily crossers \"draw less notice\" assumes that...", c: ["Teens hide things better than adults", "Familiar faces at a crossing get less scrutiny", "Students are searched less on weekdays"], fix: "The idea works only if routine crossers get less scrutiny.", line: 3, proof: "students who cross every day draw less notice" },
        { id: 'hr32-q5', type: 'weaken', q: "Which would most weaken the author's claim that the leader avoided risk?", c: ["He paid other people to find couriers", "He often drove the loads across the border himself", "The students used backpacks and their own cars"], fix: "If he drove loads himself, he would share the risk at the border.", line: 3, proof: "the leader stays in Tijuana" },
        { id: 'hr32-q6', type: 'tone', q: "The final sentence is best described as...", c: ["A neutral summary", "A direct warning", "A personal story"], fix: "It tells readers plainly to see the offer for what it is.", line: 3, proof: "should see that trade for what it is" }
      ] },
    { id: 'hr33', ages: 'both', rating: 'adult', topic: 'cartels', title: "The Job Offer on Facebook", cite: "U.S. Attorney, S.D. Cal., blind mule case", sourceIds: ["doj-carmona"],
      passage: [
        "In February 2023, Victoria Carmona was arrested at the San Ysidro Port of Entry with more than 40 pounds of cocaine hidden in her car. She told investigators she was a \"blind mule,\" someone tricked into carrying drugs. She said she had accepted a job offer on Facebook to pick up cash in the United States and drive it to Mexico, that she had handed her car over so others could add a GPS device, and that they must have planted the drugs. She showed Facebook Messenger chats that seemed to back her up.",
        "In her plea agreement she admitted the chats were fake. She and a codefendant had written them in advance, with the codefendant playing the made-up employer, so she would have a story ready if she was caught. She admitted smuggling drugs into the country seven times and faking chats before each trip.",
        "The case cuts two ways. Real blind-mule tricks exist, which is why the story was worth faking: a stranger offers easy money to move cash or a car, and asks for the keys. That offer is the warning sign whether or not anyone is lying about it later. The case also shows that investigators know the story well and test it. A \"job\" that involves driving someone else's cargo across a border is not a job to take, and a screenshot is not a defense."
      ],
      qs: [
        { id: 'hr33-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["Investigators tend to trust blind-mule stories at face value", "The story was faked, but its warning is real", "Cartels recruit mostly through Facebook"], fix: "The author says the case \"cuts two ways\": the story was fake, but the trick it copies is real.", line: 3, proof: "The case cuts two ways." },
        { id: 'hr33-q2', type: 'inference', q: "Why does the author say the story \"was worth faking\"?", c: ["Because faked chats tend to fool investigators", "Real tricks like it make it believable", "Because the codefendant wrote it for her ahead of time"], fix: "A cover story works only if it copies something that really happens.", line: 3, proof: "Real blind-mule tricks exist, which is why the story was worth faking" },
        { id: 'hr33-q3', type: 'purpose', q: "Why does the passage mention she smuggled seven times?", c: ["To show the drugs were planted", "To show the cover story was planned", "To show her trips went unchecked"], fix: "Faking chats before each of seven trips shows planning, not a single trick.", line: 2, proof: "She admitted smuggling drugs into the country seven times and faking chats before each trip." },
        { id: 'hr33-q4', type: 'assumption', q: "The line \"a screenshot is not a defense\" assumes that...", c: ["Courts refuse digital evidence in drug cases", "Chats on a screen are easy to fake", "Agents seldom read the chats"], fix: "The point rests on the fact that screenshots can be fabricated, as here.", line: 3, proof: "a screenshot is not a defense" },
        { id: 'hr33-q5', type: 'strengthen', q: "Which detail best supports calling the offer itself a warning sign?", c: ["The chats were on Facebook Messenger", "The \"employer\" wanted her car keys before the trip", "She carried more than 40 pounds of cocaine"], fix: "Asking a stranger for your car is the core of the blind-mule trick.", line: 3, proof: "a stranger offers easy money to move cash or a car, and asks for the keys" },
        { id: 'hr33-q6', type: 'tone', q: "How would you describe the author's tone?", c: ["Stern and cold toward her", "Even-handed and practical", "Gentle and soft toward her"], fix: "The author sees both sides of the case and gives plain advice.", line: 3, proof: "A \"job\" that involves driving someone else's cargo across a border is not a job to take" }
      ] },
    { id: 'hr34', ages: 'both', rating: 'adult', topic: 'religion', title: "Nobody Asked", cite: "USHMM Holocaust Encyclopedia, Le Chambon-sur-Lignon", sourceIds: ["ushmm-chambon"],
      passage: [
        "During the war the Protestant village of Le Chambon-sur-Lignon, in southern France, sheltered Jews, especially Jewish children, and others hunted by the Germans. The pastor, Andre Trocme, and the town's residents ran an effort that saved thousands of refugees, including about 5,000 Jews. One of those children, Hanne Hirsch Liebmann, was placed in a children's home there in 1941 after being rescued from an internment camp.",
        "A survivor remembered the welcome this way: \"Nobody asked who was Jewish and who was not. Nobody asked where you were from. Nobody asked who your father was or if you could pay.\" Trocme's family Bible, now in the museum, holds his notes for sermons, including a line he wrote in French: \"Happy are those hungry and thirsty of justice; for they will be satisfied.\"",
        "The passage is not an argument that one faith is right. It is a record of what people did with theirs. The villagers read their scripture as a call to protect strangers, and they acted on it at real risk. Elsewhere, the same war saw people of many faiths look away or join in. The difference was not the label on the church door but what each person decided their beliefs required of them when it counted."
      ],
      qs: [
        { id: 'hr34-q1', type: 'mainIdea', q: "What is the main idea of the passage?", c: ["Protestant villages led the rescue across France", "A village acted on faith to shelter strangers", "The pastor saved children on his own"], fix: "The passage records what the villagers did and says the difference was choice.", line: 3, proof: "It is a record of what people did with theirs." },
        { id: 'hr34-q2', type: 'purpose', q: "Why does the author quote the survivor's \"Nobody asked\" lines?", c: ["To show records were kept on each child", "To show help came without conditions or tests", "To show the refugees hid who they were"], fix: "The repeated \"Nobody asked\" stresses help given without tests of origin or money.", line: 2, proof: "Nobody asked who your father was or if you could pay." },
        { id: 'hr34-q3', type: 'inference', q: "What does Trocme's sermon note suggest about the village's motive?", c: ["They hoped for some reward after the war ended", "They saw justice as part of their faith", "They saw sheltering as the law"], fix: "His note ties hunger for justice to the blessing of scripture.", line: 2, proof: "Happy are those hungry and thirsty of justice; for they will be satisfied." },
        { id: 'hr34-q4', type: 'assumption', q: "The last sentence assumes that...", c: ["Faith had little part in the rescue", "Believers may choose very differently", "Church labels predict behavior well"], fix: "Saying the label was not the difference assumes believers made different choices.", line: 3, proof: "The difference was not the label on the church door" },
        { id: 'hr34-q5', type: 'weaken', q: "Which would most weaken the claim that the villagers acted \"at real risk\"?", c: ["The children came from internment camps", "German forces stayed out of the region", "The pastor wrote notes in his Bible"], fix: "If no one ever searched, the risk would be much smaller.", line: 3, proof: "they acted on it at real risk" },
        { id: 'hr34-q6', type: 'tone', q: "How does the author handle religion here?", c: ["As a cause of the war", "Fairly, without ranking faiths", "As proof for Protestant belief"], fix: "The author says the passage is not an argument that one faith is right.", line: 3, proof: "The passage is not an argument that one faith is right." }
      ] },
    { id: 'hr35', ages: 'both', rating: 'adult', topic: 'religion', title: "Eight in Ten", cite: "Pew Research Center, The Global Religious Landscape (2012)", sourceIds: ["pew-landscape"],
      passage: [
        "A 2012 Pew Research Center study of more than 230 countries and territories, based on more than 2,500 censuses, surveys, and registers, estimated that 84% of the world's 2010 population of 6.9 billion identified with a religious group. It counted 2.2 billion Christians (32%), 1.6 billion Muslims (23%), 1 billion Hindus (15%), nearly 500 million Buddhists (7%), and 14 million Jews (0.2%). More than 400 million people practiced folk or traditional religions.",
        "The study found that about 1.1 billion people, or 16%, had no religious affiliation, which made the unaffiliated the third-largest group, behind Christians and Muslims. Even so, surveys indicate that many of the unaffiliated hold some religious or spiritual beliefs, such as belief in God or a universal spirit. Most Muslims, 62%, live in the Asia-Pacific region, not the Middle East, and Christians are the most evenly spread group.",
        "Numbers like these correct easy assumptions. People often picture a faith by the place they hear about most, but most Muslims live in Asia, and having no religion does not always mean having no belief. Reading the data carefully is a form of respect: it lets each group be described as it is, not as a stereotype. Pew itself notes that later research has revised some of the 2010 estimates, which is how good data should work."
      ],
      qs: [
        { id: 'hr35-q1', type: 'mainIdea', q: "Which best states the main point?", c: ["Most of the world, by now, has no religion", "Careful data corrects stereotypes", "Christians are the fastest-growing group"], fix: "The passage gives the numbers and says they correct easy assumptions.", line: 3, proof: "Numbers like these correct easy assumptions." },
        { id: 'hr35-q2', type: 'inference', q: "What can be inferred about the \"unaffiliated\"?", c: ["They are the largest religious group in Asia", "Some of them still hold some spiritual beliefs", "They are mostly atheists"], fix: "Many of the unaffiliated believe in God or a universal spirit.", line: 2, proof: "many of the unaffiliated hold some religious or spiritual beliefs" },
        { id: 'hr35-q3', type: 'purpose', q: "Why does the author point out where most Muslims live?", c: ["To show Muslims outnumber Christians", "To correct a common picture of the faith", "To rank the regions by size"], fix: "The fact that most Muslims are in Asia-Pacific counters the assumption that the faith is mainly Middle Eastern.", line: 3, proof: "but most Muslims live in Asia" },
        { id: 'hr35-q4', type: 'assumption', q: "Calling careful reading \"a form of respect\" assumes that...", c: ["Large samples make statistics exact and final", "Accurate description is owed to people", "Stereotypes hold some truth"], fix: "The claim rests on the idea that describing people accurately honors them.", line: 3, proof: "Reading the data carefully is a form of respect" },
        { id: 'hr35-q5', type: 'weaken', q: "Which would most weaken the study's claim to be broad?", c: ["It drew on more than 2,500 sources", "It used data from a few countries", "It counted folk religions too, as separate groups"], fix: "A study of only a few countries could not support worldwide estimates.", line: 1, proof: "A 2012 Pew Research Center study of more than 230 countries and territories" },
        { id: 'hr35-q6', type: 'tone', q: "The author's view of Pew's revisions is...", c: ["Cautious about them", "Approving", "Doubtful of the method"], fix: "The author says revising estimates \"is how good data should work.\"", line: 3, proof: "which is how good data should work" }
      ] },
    { id: 'hr36', ages: 'both', rating: 'adult', topic: 'genocide', title: "Dig Up the Roots", cite: "Documentation Center of Cambodia, The Security System; USHMM, Cambodia 1975-1979", sourceIds: ["dccam-security","ushmm-cambodia"], guard: ["quotesExtremism","rebutted"],
      passage: [
        "Under the Khmer Rouge, which ruled Cambodia from 1975 to 1979, a person accused of being an enemy rarely suffered alone. The Documentation Center of Cambodia, which has gathered the regime's records and survivors' accounts, reports that occasionally an entire family was executed because of a mistake made by one of its members. Cadres searched out relatives according to a Khmer Rouge adage: \"To dig up the grass, one has to remove even the roots.\"",
        "The adage is an argument dressed as farming advice. It treats a family as a single plant, so that guilt flows through blood. If a father is an enemy, the reasoning goes, his child will grow up to be one, and the only safe course is to act first. That logic has no stopping point. Anyone with a cousin, a teacher, or a neighbor under suspicion could be counted as part of the root.",
        "The rebuttal is simple. People are not plants. A child does not inherit a parent's choices, and punishing a person for what a relative did punishes someone who did nothing. Modern law rests on this idea, that guilt is personal and has to be proven, because the alternative is exactly what Cambodia suffered: a state that turned suspicion into a death sentence for whole families. When a movement starts talking about people as weeds, vermin, or rot, it is preparing to stop treating them as people."
      ],
      qs: [
        { id: 'hr36-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["How the regime ran its labor camps and searched records","A slogan that spread guilt through families","Why survivors kept records of the regime's crimes"], fix: "The passage explains the adage, its logic, and its rebuttal.", line: 2, proof: "It treats a family as a single plant, so that guilt flows through blood." },
        { id: 'hr36-q2', type: 'inference', q: "Why does the author say the logic \"has no stopping point\"?", c: ["The regime ran out of time to finish its plan","Suspicion could spread to others linked","Cadres had orders to search each province"], fix: "Cousins, teachers and neighbors could all be counted as part of the root.", line: 2, proof: "Anyone with a cousin, a teacher, or a neighbor under suspicion could be counted as part of the root." },
        { id: 'hr36-q3', type: 'purpose', q: "Why does the author write \"People are not plants\"?", c: ["To show the cadres misread farming","To challenge the adage's premise","To show that guilt was hard to prove"], fix: "The adage depends on treating people as plants; the author denies that premise directly.", line: 3, proof: "People are not plants." },
        { id: 'hr36-q4', type: 'assumption', q: "The adage assumes that...", c: ["Families share the blame for one member's mistake by law","A child becomes what a parent was","Enemies are easier to find through relatives"], fix: "Killing children \"first\" only makes sense if guilt is inherited.", line: 2, proof: "If a father is an enemy, the reasoning goes, his child will grow up to be one" },
        { id: 'hr36-q5', type: 'strengthen', q: "Which would most support the author's rebuttal?", c: ["Many accused families had lived in the cities","Children of accused parents mostly grew up loyal","The regime kept careful lists of each family"], fix: "If children of the accused were mostly loyal, guilt clearly did not flow through blood.", line: 3, proof: "A child does not inherit a parent's choices" },
        { id: 'hr36-q6', type: 'tone', q: "The tone of the final sentence is best described as...", c: ["Resigned and sad","Warning and stern","Coolly neutral"], fix: "The author tells readers what such language signals.", line: 3, proof: "it is preparing to stop treating them as people" }
      ] },
    { id: 'hr37', ages: 'both', rating: 'adult', topic: 'honor', title: "The Pardon Loophole", cite: "Human Rights Watch (2019), Pakistan honor killing; Dawn (2022), Qandeel's brother acquitted", sourceIds: ["hrw-qandeel","dawn-qandeel","dawn-qandeel2"],
      passage: [
        "In July 2016, Qandeel Baloch, 26, was killed. Her brother confessed, saying she had \"brought dishonor\" to their family and tribe through her online videos and statements. Her celebrity drew wide attention, but Human Rights Watch notes that Pakistani rights activists estimate about 1,000 so-called honor killings in Pakistan every year.",
        "Convictions are rare, and one key reason was a loophole: the legal heirs of a victim could pardon the killer, and the killer is usually also a relative. After Qandeel's death, parliament passed a law imposing harsher punishments and partially closing the loophole. Prosecutors took the unusual step of charging her brothers with a crime against the state. In August 2019 her parents asked the court to \"forgive\" the brothers, and the next day the court rejected the request. Her brother Muhammad Waseem was sentenced to life in September 2019, but in February 2022 the Lahore High Court acquitted him on appeal, after his mother told the court the family had forgiven him.",
        "The loophole shows how a private-sounding custom becomes public policy. When the family that is wronged is also the family that did the wrong, letting the family forgive means letting the killers forgive themselves. Human Rights Watch adds that there are no credible official figures, because such killings are often passed off as suicide or natural death. A law matters only if cases are counted, charged, and carried through."
      ],
      qs: [
        { id: 'hr37-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["The 2016 law closed the pardon loophole for good","Family pardons free the killers","Qandeel's fame made the brothers' trial unusual"], fix: "The passage explains the pardon loophole and why it shields killers.", line: 3, proof: "letting the family forgive means letting the killers forgive themselves" },
