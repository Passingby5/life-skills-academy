    { id: 'lg10', ages: 'both', topic: 'fault', cite: 'Johnson v. McMahan (1998) 68 Cal.App.4th 173; Cal. Civ. Code 3342', s: 'Bradley Johnson was on a ladder fixing a swamp cooler when the owners\' puppy jumped and its jaws closed on his trousers. No wound. Does the dog bite law apply?',
      c: ['No, there must be a wound', 'Yes, a bite is a bite', 'For a known vicious dog'],
      m: 'The dog bite law only counts if the skin is broken.', f: 'Report it and get checked. A bite without a wound can still fall under the strict liability statute.', w: 'The court held section 3342 applies even when the person bitten does not suffer a wound.', src: 'johnson-mcmahan', also: ['civ-3342'] },
    { id: 'lg11', ages: 'both', topic: 'fault', cite: 'Priebe v. Nelson (2006) 39 Cal.4th 1112', s: 'Marta Priebe, a kennel worker, was badly bitten by a boarded dog. She sued its owner under the strict dog bite law. Did it apply?',
      c: ['Yes, the owner is liable', 'Not for a kennel worker', 'When the dog bit before, yes'],
      m: 'A dog owner is always strictly liable, even to the kennel that boards the dog.', f: 'If you work with dogs for pay, know the risk is mostly yours. Ask about the dog\'s history and use safe handling.', w: 'Priebe held a kennel worker assumed the risk of bites from dogs in her care, so strict liability under 3342 was unavailable.', src: 'priebe' },
    // ---- Privacy ----
    { id: 'lg12', ages: 'both', topic: 'privacy', cite: 'Kearney v. Salomon Smith Barney (2006) 39 Cal.4th 95', s: 'Brokers at an Atlanta office taped calls with California clients without telling them. Georgia allows it. Whose law applied?',
      c: ['Georgia law, where the firm sat', 'California law, for its residents', 'Federal law across states'],
      m: 'A company in a one-party state may secretly tape calls with Californians.', f: 'If you are in California, secret taping by an out-of-state caller can still break California law. Ask "Is this recorded?"', w: 'The court held California\'s privacy law applied to the firm\'s calls with California clients.', src: 'kearney' },
    { id: 'lg13', ages: 'both', topic: 'privacy', cite: 'Flanagan v. Flanagan (2002) 27 Cal.4th 766; Cal. Penal Code 632', s: 'In Flanagan, a family fight was over secretly taped phone calls. When is a talk "confidential" under California\'s recording law?',
      c: ['When someone says it is secret', 'When one expects no one overhears', 'Never on a phone line'],
      m: 'A call is only private if someone says it is secret.', f: 'Assume a private call is confidential. Get consent from everyone before you record it.', w: 'Flanagan held a talk is confidential if a party reasonably expects it is not being overheard or recorded.', src: 'flanagan', also: ['pen-632'] },
    { id: 'lg14', ages: 'both', topic: 'privacy', cite: 'Flanagan v. Flanagan (2002); Cal. Penal Code 637.2', s: 'Per Flanagan v. Flanagan, what can a person secretly taped on a confidential call ask for in civil court?',
      c: ['Criminal penalties alone', '$5,000 or 3x damages', 'A formal apology letter'],
      m: 'Secret taping is only a matter for police, not for a lawsuit.', f: 'Save proof of the recording and talk to a lawyer. Civil penalties are available on top of the crime.', w: 'Penal Code 637.2(a) lets an injured person sue for the greater of $5,000 per violation or three times actual damages, as Flanagan notes.', src: 'flanagan', also: ['pen-637-2'] },
    { id: 'lg15', ages: 'both', topic: 'privacy', cite: 'Malinowski v. Martin (2024)', s: 'Kamila Malinowski had dash cam videos of her ex with their kids at custody exchanges. The trial court threw them out as illegal recordings. Was that right?',
      c: ['Yes, they were secret tapes', 'No, they were not confidential', 'Audio alone was banned'],
      m: 'Any video you record of someone without asking is illegal to use.', f: 'Talks in a car at a public exchange may not be "confidential." Ask a family law lawyer before you rely on a video.', w: 'The appeals court held the trial court erred in ruling the dash cam videos captured confidential communications.', src: 'malinowski' },
    { id: 'lg16', ages: 'both', topic: 'privacy', cite: 'United States v. May (9th Cir. 2013); 18 U.S.C. 1708', s: 'In 2010 Jason and Jolynn May drove around grabbing packages off porches and from community mailboxes. What crime did they plead to?',
      c: ['Municipal infraction fine', 'Federal mail theft', 'No crime, porches are public'],
      m: 'Grabbing a package off a porch is a small local matter.', f: 'Never take a package that is not yours. If one lands at your door by mistake, return it or hand it to the carrier.', w: 'The Mays pled guilty to federal mail theft and receipt of stolen mail under 18 U.S.C. 1708.', src: 'us-may', also: ['usc-18-1708'] },
    // ---- Renting ----
    { id: 'lg17', ages: 'both', topic: 'renting', cite: 'Granberry v. Islay Investments (1995) 9 Cal.4th 738; Cal. Civ. Code 1950.5', s: 'Lisa Granberry\'s class of tenants sued a landlord over late deposit returns. How long does a California landlord have to return a deposit or explain what was kept?',
      c: ['Within sixty days', 'Within three weeks', 'No set deadline exists'],
      m: 'A landlord can take as long as needed to return a deposit.', f: 'Send a written request. The refund or an itemized list is due within 21 days of move-out.', w: 'Granberry describes the rule: within three weeks the landlord must return the deposit and account for any amount kept.', src: 'granberry', also: ['civ-1950-5'] },
    { id: 'lg18', ages: 'both', topic: 'renting', cite: 'Granberry v. Islay Investments (1995)', s: 'In Granberry, the landlord missed the deposit deadline in good faith. Could it still sue the tenants for real unpaid rent and repairs?',
      c: ['No, it forfeits its claims', 'Yes, it can still sue', 'For half the amount'],
      m: 'If a landlord misses the deadline, the tenant owes nothing more, ever.', f: 'Do not count on a missed deadline. Pay what you truly owe, and keep move-out photos and receipts.', w: 'The court held a good faith failure to comply does not bar a landlord from recovering damages for unpaid rent, repairs, and cleaning.', src: 'granberry' },
    { id: 'lg19', ages: 'both', topic: 'renting', cite: 'Dromy v. Lukovsky (2013) 219 Cal.App.4th 278; Cal. Civ. Code 1954', s: 'Marina Lukovsky rented a Santa Monica condo since 1994. Her landlord wanted weekend open houses to sell it. Did the court allow them?',
      c: ['Never on weekends', 'Yes, 1 to 4:30 weekends', 'Weekday nights only'],
      m: 'A landlord can never show a rental on weekends.', f: 'You can ask for limits, but showings to buyers are allowed in normal business hours with proper notice.', w: 'The court upheld open houses on weekend days from 1:00 to 4:30 p.m. as within "normal business hours."', src: 'dromy', also: ['civ-1954'] },
    { id: 'lg20', ages: 'both', topic: 'renting', cite: 'Cal. Civ. Code 1954; Dromy v. Lukovsky (2013)', s: 'In Dromy, the landlord won the right to show the condo. What must a landlord still give a tenant before entering for a showing?',
      c: ['No notice, he owns the place', 'Written or 24-hour oral notice', 'A key for the new owner'],
      m: 'Once a landlord wins a showing order, he can walk in any time.', f: 'Expect written notice with date, time and purpose. For a showing to buyers, a call 24 hours ahead is enough if you got a written for-sale notice in the last 120 days.', w: 'Section 1954 requires reasonable written notice in business hours; 1954(d)(2) allows oral notice for showings to buyers after a written sale notice within 120 days.', src: 'civ-1954', also: ['dromy'] },
    // ---- Work ----
    { id: 'lg21', ages: 'both', topic: 'work', cite: 'Cochran v. Schwan\'s Home Service (2014) 228 Cal.App.4th 1137; Cal. Labor Code 2802', s: 'Colin Cochran had to use his own cell phone for work calls. His plan had unlimited minutes. Did the company owe him anything?',
      c: ['No, unlimited plans are free', 'A fair share of the bill', 'Overseas calls only'],
      m: 'If your phone plan is unlimited, your job owes you nothing for work calls.', f: 'Ask in writing for a reasonable share of your phone bill if your job needs your phone.', w: 'Cochran held employers must reimburse a reasonable percentage of the bill, unlimited plan or not.', src: 'cochran', also: ['lab-2802'] },
    { id: 'lg22', ages: 'both', topic: 'work', cite: 'Gattuso v. Harte-Hanks Shoppers (2007) 42 Cal.4th 554', s: 'Frank Gattuso and other sales reps drove their own cars and got no mileage pay, only commissions. Can a higher commission count as repayment?',
      c: ['Never, mileage checks only', 'Yes, if the extra can be traced', 'Yes, commissions count'],
      m: 'Any pay at all covers your work driving costs.', f: 'Ask your employer to show which part of your pay is for car costs. If they cannot, ask to be repaid.', w: 'Gattuso held an employer may use higher pay or commissions if there is a way to apportion the part that repays expenses.', src: 'gattuso' },
    { id: 'lg23', ages: 'both', topic: 'work', cite: 'Grant-Burton v. Covenant Care (2002) 99 Cal.App.4th 1361; Cal. Labor Code 232', s: 'At a 1999 meeting, Sharron Grant-Burton joined other directors comparing how their bonuses worked. She was fired, partly for that. Was that allowed?',
      c: ['Yes, pay talk is private', 'No, that firing broke policy', 'In a union shop only'],
      m: 'Your employer can fire you for comparing pay with coworkers.', f: 'You may discuss your pay. If you are punished for it, write down what happened and report it.', w: 'The court held she had a fundamental right to discuss pay; Labor Code 232 bars firing for it.', src: 'grant-burton', also: ['lab-232'] },
    { id: 'lg24', ages: 'both', topic: 'work', cite: 'Smith v. Superior Court (L\'Oreal) (2006) 39 Cal.4th 77; Cal. Labor Code 201', s: 'Amanza Smith worked one day as a hair model at a L\'Oreal show for $500. When was her pay due?',
      c: ['On the next regular payday', 'Right when the job ended', 'Within 30 days after'],
      m: 'A one-day gig can pay you whenever its normal payday comes.', f: 'For a one-day or fixed job, ask to be paid at the end. Late pay can bring waiting time penalties.', w: 'The court held finishing the job a worker was hired for is a "discharge," so wages are due immediately.', src: 'smith-loreal', also: ['lab-201'] },
    { id: 'lg25', ages: 'both', topic: 'work', cite: 'Smith v. Superior Court (2006); Cal. Labor Code 203', s: 'In the L\'Oreal hair model case, what can a worker seek when an employer willfully pays final wages late?',
      c: ['The wages and no more', 'Up to 30 days\' extra pay', 'A full year of extra pay'],
      m: 'Late final pay costs the employer nothing extra.', f: 'File with the Labor Commissioner. Penalty pay runs a day\'s wage per day, capped at 30 days.', w: 'Section 203 penalties apply to a willful failure to pay a discharged worker. The penalty stops at 30 days.', src: 'lab-203', also: ['smith-loreal'] },
    { id: 'lg26', ages: 'both', topic: 'work', cite: 'Edwards v. Arthur Andersen LLP (2008) 44 Cal.4th 937', s: 'Raymond Edwards signed a deal at Arthur Andersen barring him from serving certain clients after he left. Was it valid in California?',
      c: ['Yes, because it was narrow', 'No, it was never valid', 'Yes, for one year'],
      m: 'A narrow noncompete is fine in California.', f: 'Protect real trade secrets, but a noncompete itself will not hold in California.', w: 'Edwards held section 16600 prohibits employee noncompetition agreements unless a statutory exception applies.', src: 'edwards', also: ['bpc-16600'] },
    { id: 'lg27', ages: 'both', topic: 'work', cite: 'Cal. Bus. and Prof. Code 16600(b); Edwards (2008)', s: 'After Edwards v. Arthur Andersen, an employer says its noncompete is "narrowly tailored" so it works. What does California law now say?',
      c: ['Narrow ones are still valid', 'Void, however narrow', 'Valid if paired with a raise'],
      m: 'A "narrowly tailored" noncompete holds up.', f: 'Take the new job. Return company files and keep secrets, but the noncompete does not bind you.', w: 'Section 16600(b) says to read it broadly, per Edwards, to void noncompetes "no matter how narrowly tailored."', src: 'bpc-16600', also: ['edwards'] },
    // ---- Buying ----
    { id: 'lg28', ages: 'both', topic: 'consumer', cite: 'Figueroa v. FCA US (2022); Cal. Civ. Code 1793.2', s: 'Raul Figueroa\'s new Dodge Ram kept overheating. He took it back six to eight times, and the maker refused to buy it back. What did the jury find?',
      c: ['Keep fixing it, that is it', 'A willful lemon law violation', 'He had to pay for the repairs'],
      m: 'Under warranty, all you get is more repair attempts.', f: 'Keep every repair order and ask the maker in writing for a buyback or replacement.', w: 'The jury found FCA willfully violated the Song-Beverly Act and awarded $30,154.', src: 'figueroa', also: ['civ-1793-2'] },
    { id: 'lg29', ages: 'both', topic: 'consumer', cite: 'Figueroa v. FCA US (2022)', s: 'Figueroa had to sell his lemon truck and got about $3,000 more than he owed. FCA wanted that $3,000 taken off his award. Did the court agree?',
      c: ['Yes, it is a fair credit', 'No credit was given', 'Half was credited'],
      m: 'If you sell a lemon, the maker gets credit for what you got.', f: 'Keep records of what you paid and any sale. The maker does not get credit for what you received selling it.', w: 'The court disagreed with FCA and affirmed the award without the $3,000 credit.', src: 'figueroa' },
    { id: 'lg30', ages: 'both', topic: 'consumer', cite: 'Kiluk v. Mercedes-Benz USA (2019)', s: 'Justin Kiluk bought a certified pre-owned Mercedes for about $122,000. Mercedes said the lemon law only binds sellers of used cars. Who won?',
      c: ['Mercedes, used cars are out', 'Kiluk; its warranty bound it', 'No one, it was settled'],
      m: 'Lemon law protection never covers used cars.', f: 'Keep the warranty papers on a certified pre-owned car. A maker that issues a warranty can be held to it.', w: 'The court held Mercedes stepped into the seller\'s role by issuing an express warranty on a used car.', src: 'kiluk' },
    { id: 'lg31', ages: 'both', topic: 'consumer', cite: 'Mughrabi v. Suzuki (1988) 197 Cal.App.3d 1212; Cal. Civ. Code 1719', s: 'Wajeeh Mughrabi\'s Santa Ana market cashed 35 payroll checks that all bounced. The trial court gave him only the face amount. Was that right?',
      c: ['Yes, the face amount of the checks', 'No, treble damages are owed', 'The bank fees only'],
      m: 'With bounced checks you can only get the face amount.', f: 'Send a written demand. If unpaid in 30 days, you can seek 3 times the check, at least $100 and at most $1,500 per check, unless the writer stopped payment over a good faith dispute.', w: 'The court held the treble damages in section 1719 are mandatory, not up to the judge. Section 1719 sets the $100 to $1,500 limits and the good faith dispute defense.', src: 'mughrabi', also: ['civ-1719'] },
    { id: 'lg32', ages: 'both', topic: 'consumer', cite: 'People v. Toomey (1984) 157 Cal.App.3d 1; Cal. Civ. Code 1689.6', s: 'Bill Toomey\'s company phoned people to sell $25 to $30 casino coupon books "worth hundreds." Buyers were not told they could cancel. What did the court order?',
      c: ['Sales stood, with no refunds owed', 'Refunds and $300,000 penalties', 'A warning letter, no more'],
      m: 'Phone or door sales are final once you say yes.', f: 'Cancel in writing within the cancel window and keep proof. Report sellers who hide it to the Attorney General.', w: 'Toomey was ordered to pay $150,000 in civil penalties plus $150,000 for breaking the injunction, and give refunds under Civil Code 1689.6.', src: 'toomey', also: ['civ-1689-6'] },
    { id: 'lg33', ages: 'both', topic: 'consumer', cite: 'FTC v. Amazon (2025 settlement); ROSCA', s: 'The FTC said Amazon signed people up for Prime without clear consent and made it very hard to cancel. How did it end in 2025?',
      c: ['It was dismissed in court', 'A $2.5 billion settlement', 'Amazon paid a $10,000 fine'],
      m: 'Big companies can make canceling as hard as they like.', f: 'Cancel subscriptions online and screenshot it. Report traps to the FTC at ReportFraud.ftc.gov.', w: 'The FTC secured $2.5 billion, including $1.5 billion in refunds, and Amazon must stop the unlawful enrollment and cancel practices.', src: 'ftc-amazon-prime' },
    { id: 'lg34', ages: 'both', topic: 'consumer', cite: 'FTC v. Grant Connect (9th Cir. 2014)', s: 'Kyle Kimoto\'s companies sold "credit cards" that were really debit offers, then enrolled buyers in "free trials" that started billing. What did the FTC win?',
      c: ['The fine print covered him', 'A court win against him', 'A warning letter only'],
      m: 'If it is in the fine print, a "free trial" that bills you is legal.', f: 'Read before you click. Check your statement every month and dispute charges you never agreed to.', w: 'The Ninth Circuit largely affirmed the FTC\'s summary judgment win against Kimoto.', src: 'ftc-grant-connect' },
    // ---- Money and fraud ----
    { id: 'lg35', ages: 'both', topic: 'money', cite: 'People v. Molina (2004) 120 Cal.App.4th 507; Cal. Penal Code 484e', s: 'Omar Molina was found with a credit card in someone else\'s name. The owner had canceled it. Can holding a canceled card still be a crime?',
      c: ['No, it is dead plastic', 'Yes, it can still count', 'If he used it, but not before'],
      m: 'A canceled card is just trash, so holding it is not a crime.', f: 'Cut up old cards. Never hold or keep a card in someone else\'s name.', w: 'The court held possessing another\'s canceled credit card counts as possessing access card account information.', src: 'molina-484e', also: ['pen-484e'] },
    { id: 'lg36', ages: 'both', topic: 'money', cite: 'United States v. Adedayo John (S.D.N.Y. 2024)', s: 'Adedayo John directed others to open bank accounts and receive money sent by romance scam victims, many older. What happened to him?',
      c: ['Probation, no prison time', 'Seven years in prison', 'A modest fine'],
      m: 'If you only pass money along, you are not part of the scam.', f: 'Never open accounts or receive money for someone you met online. Report the ask at ic3.gov.', w: 'John was sentenced to seven years for money laundering and bank fraud conspiracy; $4.5 million passed through his accounts.', src: 'usss-john' },
    { id: 'lg37', ages: 'both', topic: 'money', cite: 'United States v. Adedayo John (2024)', s: 'In the Adedayo John case, how did victims get tricked into sending money to the ring\'s bank accounts?',
      c: ['Fake lottery prize calls', 'Fake romances online', 'Robberies on the street'],
      m: 'Romance scams only take small amounts from careless people.', f: 'If an online love interest asks for money or a transfer, stop and talk to family first.', w: 'Romance scams used fake identities on dating sites and texts; $19 million moved through the group\'s accounts.', src: 'usss-john' },
    { id: 'lg38', ages: 'both', topic: 'money', cite: 'Widjaja v. JPMorgan Chase (9th Cir. 2021); 15 U.S.C. 1693g', s: 'Thieves made unauthorized withdrawals from Margaretha Widjaja\'s Chase account, starting with a transfer under $2, while she was overseas. How fast must a customer report to keep EFTA protection?',
      c: ['Within one full year', '60 days after the statement', 'Within 24 hours of the theft'],
      m: 'You can report bank theft any time and get it all back.', f: 'Read every statement. Report any odd charge, even $2, right away and in writing.', w: 'The Ninth Circuit held a consumer must report within 60 days after the bank sends the statement showing the first unauthorized transfer.', src: 'widjaja', also: ['usc-15-1693g'] },
    { id: 'lg39', ages: 'both', topic: 'money', cite: 'Gorman v. Wolpoff & Abramson (9th Cir. 2009)', s: 'John Gorman disputed a credit card charge for a satellite TV system he was unhappy with. What must the card bank do after a dispute through the credit bureaus?',
      c: ['It can ignore the dispute', 'A reasonable investigation', 'Erase the whole debt'],
      m: 'Banks can ignore a dispute sent through the credit bureaus.', f: 'Dispute in writing with both the card issuer and the credit bureaus, and keep copies.', w: 'Gorman held any investigation after notice of a dispute must be reasonable.', src: 'gorman' },
    { id: 'lg40', ages: 'both', topic: 'money', cite: 'Hernandez v. Williams, Zinman & Parham (9th Cir. 2016); 15 U.S.C. 1692g', s: 'Maria Hernandez\'s debt passed to a second collector, which never sent its own validation notice. Did it have to?',
      c: ['No, the first one did', 'Yes, all collectors must', 'When she asked, yes'],
      m: 'Once one collector sends a notice, the next ones do not have to.', f: 'Wait for each collector\'s notice and dispute in writing within 30 days if anything looks wrong.', w: 'The Ninth Circuit held the notice duty applies to each debt collector\'s initial communication.', src: 'hernandez-wzp', also: ['usc-15-1692g'] },
    // ---- Taxes ----
    { id: 'lg41', ages: 'both', topic: 'tax', cite: 'United States v. Ahlgren (W.D. Tex. 2024)', s: 'Frank Ahlgren sold about $3.7 million in bitcoin in 2017 to buy a house and claimed fake high purchase prices. What happened?',
      c: ['The charges were dropped', 'Two years in prison', 'A warning letter from the IRS'],
      m: 'Crypto sales are hard to trace, so the IRS will not notice.', f: 'Report every crypto sale and keep records of what you paid.', w: 'Ahlgren was sentenced to two years and ordered to pay $1,095,031 in restitution.', src: 'doj-ahlgren', also: ['irs-crypto'] },
    { id: 'lg42', ages: 'both', topic: 'tax', cite: 'United States v. Ahlgren (2024)', s: 'For 2018 and 2019, Ahlgren moved bitcoin through mixers and traded for cash in person. Did hiding it work?',
      c: ['Yes, mixers hide everything', 'No, he was caught', 'Temporarily, for one year'],
      m: 'Mixers and cash trades make crypto sales invisible.', f: 'Do not try to hide crypto gains. Report gains and losses on your return.', w: 'DOJ said he did not report over $650,000 in sales for 2018 and 2019 and used mixers to hide them; the tax loss topped $1 million.', src: 'doj-ahlgren' },
    { id: 'lg43', ages: 'both', topic: 'tax', cite: 'Gates v. Commissioner (2010) 135 T.C. 1; 26 U.S.C. 121', s: 'David and Christine Gates tore down their old Santa Barbara house, built a new one, never lived in it, then sold. Could they exclude $500,000 of gain?',
      c: ['Yes, the land was theirs', 'No, the exclusion failed', 'Half of it, yes'],
      m: 'Any sale on land you lived on qualifies for the home sale exclusion.', f: 'Before you sell, check that you owned and lived in that home 2 of the last 5 years.', w: 'The Tax Court ruled for the IRS: they never resided in the new house, so the $500,000 exclusion did not apply.', src: 'gates', also: ['usc-26-121'] },
    { id: 'lg44', ages: 'both', topic: 'tax', cite: 'Engdahl v. Commissioner (1979) 72 T.C. 659', s: 'The Engdahls ran a saddlebred horse ranch for years at a loss and did most of the work. The IRS called it a hobby. Who won?',
      c: ['The IRS, losses mean hobby', 'The Engdahls; a real business', 'No one, it settled'],
      m: 'If you lose money for years, the IRS will always call it a hobby.', f: 'Run a side venture like a business: books, a plan, and real effort. That is what courts look at.', w: 'The Tax Court held the horse breeding was an activity engaged in for profit, despite the losses.', src: 'engdahl', also: ['irs-hobby'] },
    // ---- Insurance ----
    { id: 'lg45', ages: 'both', topic: 'insurance', cite: 'Egan v. Mutual of Omaha (1979) 24 Cal.3d 809', s: 'Michael Egan hurt his back at work. Mutual of Omaha cut off his disability pay without having a doctor examine him or asking his own doctors. What did the court say?',
      c: ['Insurers deny whenever', 'That broke good faith', 'Entirely the agent\'s decision'],
      m: 'An insurer can deny a claim without checking the medical facts.', f: 'Ask for the denial reason in writing and for the claim file. A denial with no real look can be bad faith.', w: 'The trial court held failing to have him examined or consult his doctors violated good faith; the Supreme Court affirmed compensatory damages.', src: 'egan' },
    { id: 'lg46', ages: 'both', topic: 'insurance', cite: 'Egan v. Mutual of Omaha (1979)', s: 'Egan won at trial against Mutual of Omaha and two of its claims staff. What did the California Supreme Court keep?',
      c: ['The whole verdict, as is', 'Compensatory damages vs. Mutual', 'The jury verdict was voided'],
      m: 'A big verdict against an insurer always stands as is.', f: 'Keep every letter and note. Appeals can change parts of a verdict, so a strong record matters.', w: 'The court affirmed compensatory damages against Mutual and reversed in all other respects.', src: 'egan' },
    { id: 'lg47', ages: 'both', topic: 'insurance', cite: 'Gruenberg v. Aetna (1973) 9 Cal.3d 566', s: 'Jerome Gruenberg\'s Brass Rail lounge burned. The adjuster told arson police he was over-insured; the arson charges were dismissed. Insurers still denied. Could he sue for bad faith?',
      c: ['No, just the policy amount', 'Yes, bad faith is a tort', 'He can sue the arson unit'],
      m: 'If an insurer treats you badly, you can only sue for the policy amount.', f: 'Keep notes of every call and letter. Unfair handling can be a bad faith tort with extra damages.', w: 'Gruenberg held an insurer owes a duty of good faith and fair dealing, and breaking it is a tort.', src: 'gruenberg' },
    { id: 'lg48', ages: 'both', topic: 'insurance', cite: 'Gruenberg v. Aetna (1973)', s: 'In Gruenberg, the insurers demanded an exam under oath while arson charges were pending. His lawyer asked to wait. What did the insurers do?',
      c: ['Waited for the charges to end', 'Denied for not appearing', 'Paid in full at once'],
      m: 'Insurers always wait until criminal charges are over.', f: 'Talk to a lawyer before an exam under oath, and ask in writing for a delay if charges are pending.', w: 'The insurers refused to wait, warned coverage would be void, and kept denying after the charges were dropped.', src: 'gruenberg' },
    { id: 'lg49', ages: 'both', topic: 'insurance', cite: 'Prudential-LMI v. Superior Court (1990) 51 Cal.3d 674', s: 'Owners found a big foundation crack in 1985 and filed a claim. Prudential took over a year to investigate. They sued 20 months after the claim. Too late?',
      c: ['Yes, a year is a year', 'No, the clock was paused', 'Late, unless the crack was new'],
      m: 'The one-year time to sue keeps running while the insurer investigates.', f: 'Write down when you gave notice and when the denial came. The clock pauses in between.', w: 'The court held the limit is equitably tolled from timely notice until the insurer\'s written denial.', src: 'prudential-lmi', also: ['ins-2071'] },
    { id: 'lg50', ages: 'both', topic: 'insurance', cite: 'Prudential-LMI v. Superior Court (1990)', s: 'In Prudential-LMI, the damage built up slowly over years. When does the one-year clock first start for a slowly growing loss?',
      c: ['The day the policy began', 'When damage is appreciable', 'The day of the denial letter'],
      m: 'The clock starts the day the damage began, even if no one could see it.', f: 'Report damage as soon as you notice it, and keep the date in writing.', w: 'The court held the period begins when damage is or should be known to the insured, so a reasonable insured would know to notify.', src: 'prudential-lmi' },
    { id: 'lg51', ages: 'both', topic: 'insurance', cite: 'Hailey v. California Physicians\' Service (2007), superseded; 42 U.S.C. 300gg-12; Cal. HSC 1389.21', s: 'In the 2007 Hailey case, Blue Shield could rescind a plan if it had checked the health form. Newer laws replaced that rule. Today, when may a plan rescind?',
      c: ['If the form has any mistake', 'Only for fraud or lies', 'After a late premium payment'],
      m: 'A plan can cancel you later for an honest mistake on your application.', f: 'Today a plan may rescind only for fraud or an intentional lie about a material fact, with 30 days written notice and a right to appeal. Plans can no longer turn you down or charge more for past health.', w: 'HSC 1389.21(a) and the ACA, 42 U.S.C. 300gg-12, bar rescission unless the enrollee "made an intentional misrepresentation of material fact" or committed fraud.', src: 'hsc-1389-21', also: ['usc-42-300gg-12', 'hailey', 'hsc-1389-3', 'hc-preexisting'] },
    { id: 'lg52', ages: 'both', topic: 'insurance', cite: 'Hailey v. California Physicians\' Service (2007) 158 Cal.App.4th 452', s: 'After Blue Shield rescinded their plan, a trial court, on summary judgment, ordered the Haileys to repay $104,194.12. What did the Court of Appeal do?',
      c: ['Raised it to add fees', 'It reversed the judgment', 'Upheld the award in full'],
      m: 'Once a trial court orders repayment, the family is stuck with it.', f: 'A trial loss can be undone on appeal. And under today\'s rules, ask the state regulator to review any rescission.', w: 'The Court of Appeal found triable issues on whether the Haileys acted willfully and whether Blue Shield acted in bad faith: "The judgment is reversed."', src: 'hailey', also: ['hsc-1389-21'] }
  ]
});
</script>
<script data-src="content/decks/street_power.js">
// Street Smart: Power Plays deck (STREET-SMART-SPEC.md item 4). Data only. c = [myth choice, right choice, decoy]. Off by default (opt-in).
// v18: real, well-documented conflicts (politics, regimes, business, Hollywood, street, family). The player picks the best safe way out;
// the fix shows a 3 to 4 step "way out" diagram (steps) and the tactic name (our own names, LSA.POWER_TACTICS; nothing from Greene's
// 48 Laws, see tools/power-banned.json). kind 'none' cards: no choice worked, it was already too deep; the fix tells the real ending.
// Rated adult: Adult profiles only, unless a parent PIN unlocks it on a young adult profile. Sources and saved copies: docs/street/POWER-SOURCES.md.
LSA.deck({
  id: 'power', name: 'Power Plays', icon: '♟️', section: 'Street Smart', rating: 'adult', power: true,
  cover: 'Power Plays covers real power struggles: dictators, purges, cults, fraud and abuse, told without graphic detail.',

  cards: [
    // ---- How regimes took power ----
    { id: 'pw01', ages: 'both', topic: 'regime', tactic: 'madeEnemy', cite: 'Reichstag Fire Decree, Feb. 28, 1933', src: 'ushmm-reichstag',
      s: 'Berlin, Feb. 27, 1933. The parliament building burns. The next day an emergency decree suspends free speech, press and assembly "for safety." A newspaper editor has one evening. What move fits best?',
      c: ['Trust it is short; the courts will step in', 'Treat it as a power grab and get help out', 'Print a fiery front page to shame them'],
      m: 'An emergency rule that suspends rights will end once the crisis is over.', f: 'When a crisis is used to cancel rights, take it at face value: move records, people and plans to safety early.',
      w: 'The decree was never lifted. The Nazis used it to arrest opponents, and it stayed in force for the whole regime.',
      steps: ['Name the power grab', 'Move records to safety', 'Warn trusted allies', 'Plan a way out'] },
    { id: 'pw02', ages: 'both', topic: 'regime', tactic: 'slowSqueeze', cite: 'Enabling Act, Mar. 23, 1933', src: 'ushmm-rise', also: ['ushmm-reichstag'],
      s: 'March 1933. Hitler asks parliament to let his cabinet make laws for four years. Communist deputies are already under arrest. A centrist deputy is told it will be used with restraint. What is the wise read?',
      c: ['A promise in writing is cover enough for now', 'A law with no limits will not be used gently', 'Vote yes now and resist from inside later'],
      m: 'Giving a leader huge power is fine if he promises to use it rarely.', f: 'Judge a grant of power by what it allows, not by what its holder promises. Vote no, and say why in public.',
      w: 'Only the Social Democrats voted no. Within months every other party was banned or dissolved itself, and Germany was a one-party state.',
      steps: ['Read what it allows', 'Ignore the soft promise', 'Vote no in public', 'Join others who refuse'] },
    { id: 'pw03', ages: 'both', topic: 'regime', tactic: 'slowSqueeze', cite: 'Union offices seized, May 2, 1933', src: 'ushmm-gleich',
      s: 'April 1933. Union leaders declare their unions "neutral" and even join the new regime\'s May Day parade, hoping to be left alone. What does the record say about going along to get along?',
      c: ['It worked; the unions were left alone', 'The day after May Day the offices were seized', 'None of these; it was too late by then'],
      m: 'If you cooperate with a rising regime, it will spare you.', f: 'Bending to a regime that wants total control buys little time. Keep members informed and keep records out of its reach.',
      w: 'On May 2, 1933, stormtroopers occupied union offices across Germany, seized funds and arrested leaders.',
      steps: ['See the pattern early', 'Keep copies offsite', 'Tell members the truth', 'Build outside ties'] },
    { id: 'pw04', ages: 'both', topic: 'regime', kind: 'none', tactic: 'loyaltyTest', cite: 'Night of the Long Knives, June 30, 1934', src: 'brit-longknives',
      s: 'June 1934. Ernst Röhm leads the SA, the brownshirts who helped Hitler rise. Hitler now fears the SA has grown too powerful. Former chancellor Kurt von Schleicher is home in Berlin. What was their best move?',
      c: ['Pledge loyalty again, loudly and fast', 'None of these; it was already too deep', 'Go to the police and ask for protection'],
      m: 'Old allies of a strongman are safe if they stay loyal.', f: 'Early on, refuse to help an armed group get above the law. Once it controls the police and courts, loyalty buys nothing.',
      w: 'On June 30, 1934, Hitler had his SS guards murder the SA leaders, Röhm among them. Hundreds of other perceived opponents were killed too.',
      steps: ['Spot lawless force early', 'Refuse to help it', 'Leave before it peaks'] },
    { id: 'pw05', ages: 'both', topic: 'regime', kind: 'none', tactic: 'rewrite', cite: 'Moscow show trial, March 1938', src: 'brit-purge',
      s: '1937. Nikolay Bukharin, once a top party leader, is arrested. Old comrades are confessing to plots in show trials. What is his best move now?',
      c: ['Confess to every charge and plead for mercy', 'None of these; it was too late by then', 'Write to Stalin to remind him of the past'],
      m: 'In a show trial, a full confession wins mercy.', f: 'In a terror state the verdict comes first. The time to act was years before: speak while there are still courts, or leave.',
      w: 'Bukharin was tried in March 1938 and executed. It was later shown that the accused were innocent, the cases were made up, and the confessions were forced.',
      steps: ['See the purge pattern', 'Do not sign lies', 'Get family to safety'] },
    { id: 'pw06', ages: 'both', topic: 'regime', tactic: 'loyaltyTest', cite: 'Nikolay Yezhov, NKVD chief 1936 to 1938', src: 'brit-yezhov',
      s: 'Nikolay Yezhov ran the Soviet secret police at the worst of the purges and sent huge numbers to their deaths. He thinks his zeal makes him safe. What does his own end show?',
      c: ['Serving the purge hard keeps you safe from it', 'A purge machine turns on its own builders', 'Top men are spared if they stay useful'],
      m: 'If you do the dirty work for a tyrant, you will be protected.', f: 'Do not build a machine that can punish anyone. Refuse early, and keep your own record of what happened.',
      w: 'Yezhov was arrested in 1939. In February 1940 he became a victim of the trial process he had helped create and was executed.',
      steps: ['Refuse the dirty work', 'Keep your own record', 'Plan a way out'] },
    { id: 'pw07', ages: 'both', topic: 'regime', tactic: 'falseSafety', cite: 'Hundred Flowers (1956 to 1957), then the Anti-Rightist Campaign', src: 'brit-flowers',
      s: 'China, spring 1957. Mao invites open criticism: "Let a hundred flowers bloom." Students and professors put up wall posters. A teacher is urged to speak up at a meeting. What is the wise move?',
      c: ['Speak out fully; the invite is the new rule here', 'Go slow; watch what happens to the first critics', 'Name the coworkers who are complaining'],
      m: 'When a one-party state asks for criticism, it is safe to give it.', f: 'Test an invite from a regime that punishes dissent. Watch what happens to the first ones who speak, and keep your records private.',
      w: 'By early July 1957 an anti-rightist campaign was under way. Britannica says most of the recent critics lost their jobs and were forced to do manual labor in the country.',
      steps: ['Pause before speaking', 'Watch the first critics', 'Keep notes private'] },
    { id: 'pw08', ages: 'both', topic: 'regime', kind: 'none', tactic: 'loyaltyTest', cite: 'Peng Dehuai removed as defense minister, 1959', src: 'brit-peng',
      s: 'China, 1959. Marshal Peng Dehuai, the defense minister and a hero of the Long March, criticizes the party\'s military and economic policies. What would have kept him safe and still told the truth?',
      c: ['Say it in a private letter to the leader', 'None of these; no move was safe by then', 'Get other leaders to sign it with him'],
      m: 'A loyal, honest warning to the top will be heard.', f: 'Where one man\'s word is law, there was no safe channel. The real ending is a warning to build checks before power is total.',
      w: 'Peng was removed as defense minister in 1959 for his criticism. He never held power again and died in 1974.',
      steps: ['Know who can check power', 'Build checks early', 'Record the truth'] },
    { id: 'pw09', ages: 'both', topic: 'regime', tactic: 'splitRule', cite: 'Cultural Revolution, 1966 to 1976', src: 'brit-cultrev',
      s: 'China, 1966. Mao urges young Red Guards to root out "bourgeois" enemies, even among teachers and elders. A student is pressed to accuse her own father at a meeting. What is the most honest way through?',
      c: ['Denounce him; it will help him in the end', 'Say as little as she can and stay close to family', 'Cry and tell the group everything at home'],
      m: 'Turning in your own family shows loyalty and keeps them safe.', f: 'When a group asks you to turn on family, slow down. Say as little as you can, and keep family ties.',
      w: 'Red Guards attacked respected teachers, abused elderly citizens and turned on former friends. The chaos lasted until Mao died in 1976.',
      steps: ['Say as little as possible', 'Do not sign accusations', 'Keep family close'], faith: 'Exodus 20:12: "Honor your father and your mother."' },
    { id: 'pw10', ages: 'both', topic: 'regime', kind: 'none', tactic: 'cutOff', cite: 'Fall of Phnom Penh, Apr. 17, 1975', src: 'brit-camgen', also: ['brit-khmer'],
      s: 'Phnom Penh, April 1975. Khmer Rouge forces take the city, and within days they order everyone out to the countryside. For a family in the city that week, what would have worked?',
      c: ['Pack light, follow orders, and come back soon', 'None of these; the trap had already closed', 'Hide at home until the soldiers move on'],
      m: 'An order to leave home "for now" means you will be back soon.', f: 'There was no safe pick that week. The lesson is earlier: when an armed movement hates whole groups, leave before it wins.',
      w: 'The city was emptied. An estimated 1.5 million to 3 million people died under Khmer Rouge rule, about a quarter of Cambodia.',
      steps: ['Hear the hate early', 'Leave while borders open', 'Keep papers on you'] },
    { id: 'pw11', ages: 'both', topic: 'escape', tactic: 'falseSafety', cite: 'Haing S. Ngor under the Khmer Rouge, 1975 to 1979', src: 'brit-ngor',
      s: 'Cambodia, 1975. The Khmer Rouge are killing intellectuals. Haing Ngor is a doctor. Guards keep asking what he did before. What kept him alive?',
      c: ['Tell them; doctors will be needed', 'Hide his schooling and blend in', 'Ask to meet the new leaders first and explain'],
      m: 'If a new regime needs skilled people, the skilled will be rewarded.', f: 'If a group that hates "elites" asks who is educated, do not raise your hand. Blend in and look for a way out.',
      w: 'Ngor said he was a taxi driver and hid that he was a doctor. He escaped to Thailand in 1979 and in 1985 won an Oscar for The Killing Fields.',
      steps: ['Pause before answering', 'Blend in', 'Look for the border'] },
    { id: 'pw12', ages: 'both', topic: 'regime', tactic: 'falseSafety', cite: 'Castro takes power, January 1959', src: 'brit-castro',
      s: 'Cuba, 1959. Fidel Castro came to power promising to restore the 1940 constitution and full civil and political liberties. A lawyer who backed him is asked to serve the new government. What is the wise read?',
      c: ['Liberties will come once things calm down, so wait', 'Watch what he does; keep your options open', 'Join the government and fix it from the inside'],
      m: 'A leader who promises freedom will deliver it once he is in charge.', f: 'Judge a new ruler by what he does, not what he promised. Keep your passport, savings and contacts ready, and do not lend your name.',
      w: 'Castro turned Cuba into the first communist state in the Western Hemisphere and led it until 2008. Many who backed him later fled.',
      steps: ['Note the broken promise', 'Do not lend your name', 'Keep passport ready', 'Keep ties abroad'] },
    { id: 'pw13', ages: 'both', topic: 'escape', tactic: 'cutOff', cite: 'Mariel boatlift, April to October 1980', src: 'brit-mariel',
      s: 'Cuba, April 1980. Castro suddenly opens the port of Mariel to anyone who wants to leave. A family in Havana hears that boats from Florida are coming. What fits best?',
      c: ['Hold off; it will be easier next year', 'Leave now with papers, by a known boat', 'None of these; the trap had already closed'],
      m: 'If a door opens once, it will open again.', f: 'When a closed border opens, it may close fast. Go with papers and a known contact, and do not take wild risks.',
      w: 'From April until October about 125,000 Cubans crossed to the United States. Then the door closed again.',
      steps: ['Act while it is open', 'Carry papers', 'Use a known contact'] },
    { id: 'pw14', ages: 'both', topic: 'regime', tactic: 'fakeDeadline', cite: 'Re-education order, Saigon, June 1975', src: 'vhm-reed',
      s: 'South Vietnam, June 1975. Former South Vietnamese officers are told to report for "re-education" and bring food for ten days. A captain is unsure. What does the record say?',
      c: ['It was ten days, just like the order said', 'Many were held for years in remote labor camps', 'Ten days, then a job in the new army'],
      m: 'If the new rulers say ten days, it will be ten days.', f: 'A short, vague deadline from a regime with no courts is a red flag. Seek out people who have come back, and plan for the worst.',
      w: 'Many were held for years, some for well over a decade, in remote labor camps. Many families later fled by sea.',
      steps: ['Ask who came back', 'Plan for the worst', 'Keep family informed'] },
    { id: 'pw15', ages: 'both', topic: 'escape', tactic: 'debtTrap', cite: 'Vietnamese boat people, after 1975', src: 'brit-boat',
      s: 'Vietnam, late 1970s. A family hears a boat owner will take them for gold, no questions asked. The boat is small and will be packed. What is the wiser plan?',
      c: ['Pay the boat owner; it is faster and surer', 'Weigh the sea risk and seek a safer route out', 'Stay home until the boats are bigger and safer'],
      m: 'The fastest way out is the safest.', f: 'If a legal, monitored route exists, it is safer than paying a smuggler. Keep proof of who you are and who your family is.',
      w: 'Crowded into small boats, many were prey to pirates, and many died of thirst, hunger or drowning. Those who made it often waited years in camps.',
      steps: ['Look for a legal route', 'Keep proof of family', 'Avoid smugglers'] },
    { id: 'pw16', ages: 'both', topic: 'extremism', tactic: 'flattery', cite: 'Shamima Begum leaves Bethnal Green for Syria, 2015', src: 'bbc-begum',
      s: 'London, 2015. A teen from Bethnal Green and two school friends secretly plan to travel to Syria to join the Islamic State group. She thinks she can come home if it goes badly. What is the safe move?',
      c: ['Go; she can come home if it is bad', 'Tell a parent or teacher, then block', 'Keep chatting to learn more first'],
      m: 'You can try out an extremist group and come home if you change your mind.', f: 'Secrecy plus big promises is a recruiting play. Tell a trusted adult, save the chats, and report them.',
      w: 'Shamima Begum went to Syria at 15. Her British citizenship was revoked in 2019, she lost her final UK appeal in 2024, and she remains in a camp in Syria.',
      steps: ['Save the chats', 'Tell a trusted adult', 'Block and report'] },
    // ---- Defectors ----
    { id: 'pw18', ages: 'both', topic: 'escape', tactic: 'fakeDeadline', cite: 'Nureyev defects at a Paris airport, June 1961', src: 'brit-nureyev',
      s: 'Paris, June 1961. Dancer Rudolf Nureyev is touring with the Kirov Ballet. At the airport, Soviet security men are watching him and want him sent home. What is the wise move?',
      c: ['Fly home; a trip back is a big honor', 'Walk to the French police and ask asylum', 'Argue with the minders at the gate in front of them'],
      m: 'A sudden summons home is an honor.', f: 'A sudden recall away from the group is a warning sign. Go to the local police in a public place and ask for help.',
      w: 'Nureyev eluded the Soviet security men at the airport and asked France for asylum. He became one of the most famous dancers in the world.',
      steps: ['Spot the sudden recall', 'Stay in public', 'Go to the police', 'Ask for asylum'] },
    { id: 'pw19', ages: 'both', topic: 'escape', tactic: 'freezeOut', cite: 'Svetlana Alliluyeva defects in New Delhi, 1967', src: 'brit-svetlana',
      s: 'New Delhi, 1967. Stalin\'s daughter Svetlana Alliluyeva has been allowed out of the Soviet Union for a family visit to India. She wants to stay free. What did she do?',
      c: ['Flew home to argue her case', 'Went to American officials for help', 'Hid in a hotel and waited'],
      m: 'You must obey your own embassy abroad.', f: 'When your own officials are the threat, go to a country that will protect you, in person, and say clearly what you want.',
      w: 'She went around the Soviet Embassy and, with the help of American officials, defected to the United States in the spring of 1967.',
      steps: ['Choose a safe embassy', 'Go in person', 'Put it in writing'] },
    { id: 'pw20', ages: 'both', topic: 'escape', tactic: 'cutOff', cite: 'Hyeonseo Lee, TED talk (2013)', src: 'ted-hlee',
      s: 'Hyeonseo Lee escaped North Korea and built a new life. Later she guides her family out, but they are jailed in Laos, short of the South Korean embassy, and her money is gone. What does the record show?',
      c: ['She gave up and flew back to China alone', 'She told a stranger who asked; he paid', 'She waited until the jail let them go free'],
      m: 'In real trouble, you have to get out alone.', f: 'Being cut off is what keeps people trapped. When someone sincerely asks what is wrong, telling the truth can open a way out.',
      w: 'Her family was jailed and her money ran out. A stranger asked "What\'s wrong?", went to an ATM, and paid to free them.',
      steps: ['Admit you are stuck', 'Let someone help', 'Keep going'] },
    { id: 'pw21', ages: 'both', topic: 'escape', tactic: 'slowSqueeze', cite: 'Berlin Wall, August 1961', src: 'brit-wall',
      s: 'Berlin, August 1961. Barbed wire goes up overnight between East and West. About 2.5 million East Germans have already fled west. A family in the East is unsure. What does the record teach?',
      c: ['Sit tight; the wire is just for now', 'When a door is closing, move first', 'Ask an officer for a travel pass'],
      m: 'A barrier put up "for now" will come down soon.', f: 'When a border is closing, the first days are the easiest. Move while there is still a gap.',
      w: 'The wire was replaced by concrete walls up to 15 feet high, with watchtowers and guns. The wall stood until 1989.',
      steps: ['See the door closing', 'Move while it is open', 'Head to safe help'] },
    { id: 'pw22', ages: 'both', topic: 'regime', kind: 'none', tactic: 'falseSafety', cite: 'Imre Nagy arrested, Nov. 22, 1956', src: 'brit-nagy',
      s: 'Budapest, Nov. 1956. Soviet troops have crushed the revolt. Prime Minister Imre Nagy is sheltering in the Yugoslav embassy. He is offered a way out. What was his best move?',
      c: ['Take the offer; it is in writing, so it holds', 'None of these; it was too late by then', 'Leave with the embassy staff at night'],
      m: 'A written promise of safe passage will be kept.', f: 'There was no safe pick by then. The real ending shows why a promise from those who just broke one is worth little.',
      w: 'After he left the embassy he was treacherously deported, arrested on Nov. 22, and executed in June 1958 after a secret trial.',
      steps: ['Weigh their track record', 'Seek outside guarantees', 'Stay where you are safe'] },
    { id: 'pw24', ages: 'both', topic: 'regime', tactic: 'loyaltyTest', cite: 'Charter 77, Czechoslovakia, 1977', src: 'brit-havel',
      s: 'Prague, 1977. A petition asks the regime to respect the human rights it promised to keep. Signing could cost a playwright, Vaclav Havel, his work and his freedom. What does the record show?',
      c: ['Signing changes little, so it costs little', 'Calm, shared refusal can wear down a regime', 'None of these; it was already too deep'],
      m: 'Going along in small ways does no harm, and speaking up does no good.', f: 'Control lives on small public lies. Saying no in a calm way, with others, chips at it.',
      w: 'Havel was arrested again and again and spent four years in prison (1979 to 1983). In December 1989 he became president.',
      steps: ['Notice the small lie', 'Stop repeating it', 'Find others who agree'] },
    { id: 'pw25', ages: 'both', topic: 'escape', tactic: 'cutOff', cite: 'Tiananmen Square crackdown, June 3 to 4, 1989', src: 'brit-tiananmen',
      s: 'Beijing, June 1989. After the army crushes the protests in Tiananmen Square, student leaders are being hunted. A friend says there is a way out of the country. What is wisest?',
      c: ['Turn yourself in and explain', 'Lie low and trust a known network', 'Post your location to show you are not afraid'],
      m: 'If you turn yourself in and explain, you will be treated fairly.', f: 'When you are on a list, go quiet, use people you can vouch for, and move only on a set plan.',
      w: 'Many dissidents got prison terms and some were executed. Several leaders, like Wu\'er Kaixi, escaped and found refuge in the West.',
      steps: ['Go quiet', 'Use a known network', 'Move on a set plan'] },
    // ---- Rescuers ----
    { id: 'pw27', ages: 'both', topic: 'rescue', tactic: 'borrowedCredit', cite: 'Raoul Wallenberg, Budapest, July to Dec. 1944', src: 'ushmm-wallenberg',
      s: 'Budapest, 1944. Swedish diplomat Raoul Wallenberg has no army, only paper and stamps. Jews are being deported. What did he use?',
      c: ['Secret guns and fighters sent from Sweden', 'Protective passports and \"Swedish\" houses', 'Speeches to the crowds on the radio'],
      m: 'Only force can stop a powerful regime.', f: 'Use the rules a regime still respects, like diplomatic papers and safe houses, to protect people.',
      w: 'He issued protective passports and declared buildings Swedish territory, saving thousands. He vanished in Soviet custody in 1945.',
      steps: ['Find the rule they respect', 'Put it on paper', 'Shelter people fast'] },
    // ---- Cults and high-control groups ----
    { id: 'pw28', ages: 'both', topic: 'cult', kind: 'none', tactic: 'cutOff', cite: 'Jonestown, Guyana, Nov. 18, 1978', src: 'brit-jonestown',
      s: 'Guyana, Nov. 18, 1978. Rep. Leo Ryan\'s visit to Jonestown has ended in an attack at the airstrip. Jim Jones gathers his followers. For the hundreds still in the camp that evening, what worked?',
      c: ['Hold on; help will come by morning', 'None of these; no move was safe by then', 'Hide inside the camp until the guards leave'],
      m: 'In a cult, you can leave later.', f: 'By that night there was no safe choice. The lesson is earlier: a leader who cuts you off from family, passports and news is a danger sign.',
      w: 'More than 900 died, some 300 of them 17 or under. Fewer than 100 Temple members in Guyana survived.',
      steps: ['Spot the isolation', 'Keep your passport', 'Stay in touch outside'] },
    { id: 'pw29', ages: 'both', topic: 'cult', tactic: 'debtTrap', cite: 'United States v. Raniere (E.D.N.Y.), sentenced Oct. 27, 2020', src: 'doj-nxivm',
      s: 'A self-help group called NXIVM tells some women to hand over damaging secrets as "collateral" to prove they are serious. A member is asked to. What is the safe answer?',
      c: ['Hand it over; it shows real commitment to growth', 'Say no, leave, and tell people outside', 'Share a small secret first to test how they use it'],
      m: 'Handing over your secrets to a group shows trust.', f: 'A group that asks for blackmail material is a high-control group. Leave, keep your records, and talk to people outside.',
      w: 'Leader Keith Raniere was convicted of racketeering and sex trafficking offenses and sentenced to 120 years in prison.',
      steps: ['Refuse the "collateral"', 'Leave the group', 'Talk to outsiders', 'Report to police'], faith: 'Matthew 10:16: "Be wise as serpents and harmless as doves."' },
    { id: 'pw30', ages: 'both', topic: 'family', tactic: 'cutOff', cite: 'Tara Westover, Educated (2018)', src: 'westover',
      s: 'Idaho. Tara Westover has never been to school; her survivalist family lives cut off from the world, and an older brother has become violent. Another brother got himself into college. What is the real way out?',
      c: ['Stay; family comes first, whatever happens', 'Study for a way out, with an ally', 'Run away at night with no plan'],
      m: 'Loyal kids stay home no matter what.', f: 'Education and one ally can be a way out of a controlling home. Make a plan, get help, and keep going.',
      w: 'She set foot in a classroom for the first time at 17 and went on to earn a PhD from Cambridge University.',
      steps: ['Find one ally', 'Make a plan', 'Get skills', 'Leave safely'] },
    { id: 'pw31', ages: 'both', topic: 'family', tactic: 'debtTrap', cite: 'Conservatorship of Britney Spears, ended Nov. 12, 2021', src: 'ap-britney',
      s: 'Los Angeles, 2021. For nearly 14 years a pop star\'s life and money have been run under a court conservatorship, long led by her father. She wants out. What turned the case?',
      c: ['Keep quiet and wait for her father', 'Ask the court for her own lawyer', 'Post angry videos online and skip the court dates'],
      m: 'If a court put a guardian in charge, you cannot fight it.', f: 'In a court-backed control, your strongest move is a lawyer of your own choosing and your own voice in court.',
      w: 'In July 2021 the judge let her hire a lawyer of her choice. He first got her father removed, and the conservatorship ended on Nov. 12, 2021.',
      steps: ['Speak to the court', 'Pick your own lawyer', 'Keep records'] },
    { id: 'pw32', ages: 'both', topic: 'family', tactic: 'flattery', cite: 'Jennette McCurdy, I\'m Glad My Mom Died (2022)', src: 'mccurdy',
      s: 'A child actor\'s mother runs her life, food and money, and says, "This is all for you." Years later the star is worn out. What helps most?',
      c: ['Push harder; mom knows best and wants the best', 'See her own therapist and set limits', 'Quit acting and cut off her friends too'],
      m: 'A parent who says it is all for you is always right.', f: 'Control can look like love. A therapist of your own and clear limits are a real way out.',
      w: 'After finding therapy and quitting acting, McCurdy began her recovery and wrote a best-selling memoir about it.',
      steps: ['Name the control', 'Get your own help', 'Set clear limits'] },
    { id: 'pw33', ages: 'both', topic: 'family', tactic: 'debtTrap', cite: 'Tina Turner divorces Ike Turner, 1978', src: 'brit-tina',
      s: 'Tina Turner sings in Ike Turner\'s act, and he controls the band and the money. She has suffered years of abuse. Leaving could mean starting over with almost nothing. What is the real lesson?',
      c: ['Stay until there is more money saved', 'Leave, get safe, and rebuild with help', 'Fight back hard and stay in the act'],
      m: 'Leaving an abuser takes money first.', f: 'Safety comes first; money can be rebuilt. Call a hotline for a safety plan, and lean on friends.',
      w: 'She divorced Ike in 1978, citing years of physical abuse. Her 1984 solo album Private Dancer sold more than 20 million copies.',
      steps: ['Get to a safe place', 'Call a friend', 'Call the hotline', 'Rebuild step by step'] },
    // ---- Business ----
    { id: 'pw35', ages: 'both', topic: 'business', tactic: 'rewrite', cite: 'Sherron Watkins memo to Ken Lay, Aug. 2001', src: 'brit-enron', also: ['time-wb'],
      s: 'Houston, 2001. Enron vice president Sherron Watkins is worried about secret partnerships run by the finance chief. The company says all is well. What fits best?',
      c: ['Trust the bosses; they know the books', 'Write a memo to the top and keep a copy', 'Sell her stock and keep quiet'],
      m: 'If the boss says the books are fine, they are fine.', f: 'Put what you see in writing, dated, to someone who has to act. Keep a copy.',
      w: 'She warned chairman Ken Lay of possible accounting scandals. Enron went bankrupt that December, and TIME named her a Person of the Year in 2002.',
      steps: ['Write down the facts', 'Date it', 'Send it up', 'Keep a copy'] },
    { id: 'pw36', ages: 'both', topic: 'business', tactic: 'freezeOut', cite: 'United States v. Holmes (N.D. Cal.), sentenced Nov. 18, 2022', src: 'doj-holmes',
      s: 'A young lab worker at Theranos sees blood tests failing quality checks. Company lawyers remind him of his secrecy agreement. What is the right move?',
      c: ['Keep quiet; his secrecy deal covers this too', 'Report it to a regulator and keep notes', 'Ask a friend on the board to fix it quietly'],
      m: 'A secrecy agreement stops you from reporting fraud.', f: 'A secrecy deal does not bar you from telling regulators about safety problems. Keep notes and report to the agency.',
      w: 'Founder Elizabeth Holmes was sentenced to more than 11 years in prison for defrauding Theranos investors of hundreds of millions of dollars.',
      steps: ['Keep notes', 'Tell the regulator', 'Get a lawyer', 'Do not back down'] },
    { id: 'pw37', ages: 'both', topic: 'business', tactic: 'flattery', cite: 'Madoff Ponzi scheme, exposed Dec. 2008', src: 'brit-madoff',
      s: 'A fund manager posts smooth gains year after year and says, "My fund is closed, but I will make room for you." The returns never dip. What is the wise move?',
      c: ['Join fast before he changes his mind', 'Ask for proof from an outside auditor', 'Test it with a little money first'],
      m: 'A manager who lets you into a closed fund is doing you a favor.', f: 'Smooth returns plus a VIP invite is a red flag. Ask who holds the money and who audits it, and walk away if they will not say.',
      w: 'Bernie Madoff\'s scheme collapsed in December 2008. Loss estimates ran from $50 billion to $65 billion.',
      steps: ['Ask who audits it', 'Check the custodian', 'Walk if they dodge'] },
    { id: 'pw38', ages: 'both', topic: 'business', tactic: 'freezeOut', cite: 'Madoff Ponzi scheme, exposed Dec. 2008', src: 'brit-madoff',
      s: '2005. Analyst Harry Markopolos has told the SEC twice that Madoff\'s returns are impossible. He is ignored. What did he do next?',
      c: ['Gave up; he had done his part', 'Filed with the SEC again, with more proof', 'Went to Madoff himself to warn him off'],
      m: 'If a regulator ignores you once, it is over.', f: 'If you are ignored, file again, in writing, with more proof, and keep copies of every filing.',
      w: 'Markopolos kept presenting evidence to the SEC, including his 2005 study, "The World\'s Largest Hedge Fund Is a Fraud." The scheme collapsed in 2008.',
      steps: ['Write it again', 'Add new proof', 'Keep every copy'] },
    { id: 'pw39', ages: 'both', topic: 'business', tactic: 'borrowedCredit', cite: 'WorldCom audit, 2002', src: 'time-wb',
      s: '2002. Cynthia Cooper, head of internal audit at WorldCom, finds billions in costs that do not add up. Senior managers want her to back off. What did she do?',
      c: ['Hold off as the managers asked', 'Keep auditing and tell the board', 'Tell the press first, then the board'],
      m: 'If senior managers say stop, an auditor should stop.', f: 'Take a finding to the audit committee of the board. They sit above the managers.',
      w: 'Cooper told the board that the company had covered up $3.8 billion in losses with phony bookkeeping. TIME named her a Person of the Year.',
      steps: ['Keep the evidence', 'Go to the board', 'Keep a copy'] },
    { id: 'pw40', ages: 'both', topic: 'business', tactic: 'fakeDeadline', cite: 'CFPB Consent Order, Wells Fargo, Sept. 8, 2016', src: 'cfpb-wells',
      s: 'A Wells Fargo teller is pushed hard to hit sales targets. Coworkers are quietly opening accounts that customers never asked for. What is the safe move?',
      c: ['Do what coworkers do to keep the job', 'Refuse, write it down, and report it', 'None of these; no move was safe by then'],
      m: 'If the boss demands it, it is not your fault.', f: 'Do not open fake accounts. Write down the pressure and report it to the ethics line and a regulator.',
      w: 'In 2016 the CFPB fined Wells Fargo $100 million for secretly opening unauthorized deposit and credit card accounts, spurred by sales targets.',
      steps: ['Refuse the fake', 'Write it down', 'Report to a regulator'] },
    { id: 'pw41', ages: 'both', topic: 'business', tactic: 'splitRule', cite: 'Susan Fowler blog, Feb. 19, 2017', src: 'fowler', also: ['eeoc-retal'],
      s: 'Uber, 2016. Engineer Susan Fowler reports a manager\'s harassment to HR, with screenshots. HR says it is his first offense. She later meets other women who reported him. What worked?',
      c: ['Trust HR; it is his first offense', 'Compare notes with others and keep records', 'None of these; it was too late by then'],
      m: 'If HR says it is a first offense, it is.', f: 'Keep records, compare with coworkers, and if HR stalls, go to an outside agency or a lawyer.',
      w: 'Fowler kept records and spoke with other women. In February 2017 she told the story in a blog post that was read around the world.',
      steps: ['Keep records', 'Compare with others', 'Go outside if blocked'] },
    { id: 'pw42', ages: 'both', topic: 'business', tactic: 'splitRule', cite: 'Steve Jobs removed by Apple board, 1985; returns 1997', src: 'brit-jobs', also: ['sec-jobs'],
      s: 'Apple, 1985. CEO John Sculley convinces the board to remove cofounder Steve Jobs. Jobs is stunned. What does the record show?',
      c: ['Fight the board to the bitter end, then sue', 'Leave, build, and come back stronger', 'Sue the board for control and stay to fight it'],
      m: 'Losing a boardroom fight is the end.', f: 'If you lose a fight for control, leave clean and build something new.',
      w: 'Jobs started NeXT and built Pixar into a major studio. In June 1997 Apple\'s board asked him to lead again, and in September 1997 it named him interim CEO.',
      steps: ['Accept the loss', 'Leave clean', 'Build something new'] },
    // ---- Hollywood ----
    { id: 'pw43', ages: 'both', topic: 'hollywood', tactic: 'debtTrap', cite: 'De Haviland v. Warner Bros. (1944) 67 Cal.App.2d 225', src: 'dehav',
      s: 'Hollywood, 1943. Actress Olivia de Havilland has served her seven-year contract, but Warner Bros. says it added the months she was suspended for refusing roles. What did she do?',
      c: ['Cave and work the extra time', 'Sue; the seven-year cap is the law', 'Change studios under a new name'],
      m: 'A studio can stretch a contract for as long as it likes.', f: 'Read the law behind the contract. Some limits cannot be signed away.',
      w: 'She won. The court held that the suspension extensions could not bind her beyond May 5, 1943, seven years after her work began.',
      steps: ['Read the law', 'Get a lawyer', 'Sue if you must'] },
    { id: 'pw45', ages: 'both', topic: 'hollywood', tactic: 'borrowedCredit', cite: 'Taylor Swift masters dispute, 2019 to 2023', src: 'brit-swift',
      s: '2019. Taylor Swift learns her old label, which owns the master recordings of her first six albums, was sold to talent manager Scooter Braun. She cannot control her old songs. What did she do?',
      c: ['Sue to block the sale in court', 'Re-record the old albums herself and own them', 'None of these; it was already too deep'],
      m: 'If you do not own the masters, you have no move.', f: 'If someone holds your past work, make new work you own. Know what rights you kept.',
      w: 'She re-recorded the albums, starting with Fearless (Taylor\'s Version) and Red (Taylor\'s Version) in 2021, so the remakes would be the ones sought out.',
      steps: ['Know your rights', 'Make your own copy', 'Tell your fans'] },
    // ---- Politics ----
    { id: 'pw46', ages: 'both', topic: 'politics', tactic: 'loyaltyTest', cite: 'Saturday Night Massacre, Oct. 20, 1973', src: 'brit-watergate',
      s: 'Oct. 20, 1973. President Nixon orders Attorney General Elliot Richardson to fire the Watergate special prosecutor. He believes it is wrong. What did he do?',
      c: ['Fire him; the president is the boss', 'Refuse the order and resign that same night', 'None of these; no move was safe by then'],
      m: 'An order from the top must be carried out.', f: 'If you are told to break a promise or the law, say no and resign if you must. It keeps your name.',
      w: 'Richardson refused and resigned, and so did his deputy. The uproar fed the scandal, and on Aug. 9, 1974, Nixon became the only U.S. president to resign.',
      steps: ['Recall your promise', 'Say no once', 'Resign if needed'] },
    { id: 'pw47', ages: 'both', topic: 'politics', tactic: 'madeEnemy', cite: 'Army-McCarthy hearings, June 9, 1954', src: 'senate-welch',
      s: 'June 9, 1954. On live TV, Senator Joseph McCarthy attacks a young lawyer at Army counsel Joseph Welch\'s law firm for a past tie to a lawyers\' group. What did Welch do?',
      c: ['Shout back with a smear of his own', 'Calmly called out the cruelty', 'Walked out of the hearing room in silent protest'],
      m: 'You beat a bully by being louder.', f: 'When someone smears a person in public, call it out calmly and plainly. Keep your voice low.',
      w: 'Welch asked, "Have you no sense of decency?" Overnight McCarthy\'s huge popularity evaporated, and he was later censured by the Senate.',
      steps: ['Stay calm', 'Name the smear', 'Let others see it'] },
    // ---- Street ----
    { id: 'pw48', ages: 'both', topic: 'street', tactic: 'loyaltyTest', cite: 'Homeboy Industries, Los Angeles, since 1988', src: 'homeboy',
      s: 'East Los Angeles. A young gang member is told by his crew that leaving is betrayal. A priest\'s program offers him job training and a paycheck. What is the wise move?',
      c: ['Stay; loyalty to the crew is what he has left', 'Take the job and lean on new people', 'Leave the city alone at night with no plan or help'],
      m: 'Once you are in a gang, there is no way out.', f: 'A job and a new circle are a real way out. Groups like Homeboy help with work, tattoo removal and support.',
      w: 'Father Greg Boyle began Homeboy Industries in 1988. It is now the largest gang rehab and re-entry program in the world, with businesses that train and hire.',
      steps: ['Find a safe adult', 'Take the job', 'Build a new circle'], faith: 'Proverbs 13:20: "Walk with the wise and become wise."' },
    { id: 'pw49', ages: 'both', topic: 'street', tactic: 'flattery', cite: 'Whitey Bulger and FBI agent John Connolly, Boston', src: 'brit-bulger',
      s: 'FBI agent John Connolly grew up idolizing Whitey Bulger. Now Bulger is his informant, feeding him tips as a friend. What should Connolly have done?',
      c: ['Protect him; he is a good source', 'Keep it by the book and tell his boss', 'Take gifts but report the tips'],
      m: 'A friend who gives you tips can be trusted.', f: 'If someone uses friendship to get favors, keep it by the book and tell your boss.',
      w: 'Connolly tipped Bulger off before a 1995 indictment, and Bulger fled. Connolly was later convicted; Bulger was caught in June 2011.',
      steps: ['Notice the favor', 'Keep it formal', 'Tell your boss'] },
    { id: 'pw50', ages: 'both', topic: 'street', tactic: 'fakeDeadline', cite: 'Charles Ponzi, Boston, 1920', src: 'brit-ponzi',
      s: '1920. Charles Ponzi promises 50% profit in 45 days from trading postal reply coupons. A neighbor says, "Get in before it closes." What is the wise move?',
      c: ['Get in before it closes', 'Ask how the profit is made', 'None of these; the trap had already closed'],
      m: 'A huge return with a time limit is a good deal.', f: 'Ask how the money is made. If it does not add up, walk away.',
      w: 'Early investors were paid with later investors\' money. When it collapsed, losses were some $7 million, and Ponzi was convicted in 1920.',
      steps: ['Ask how', 'Check the math', 'Walk away'] },
    // ---- More regime cases with a way out ----
    { id: 'pw51', ages: 'both', topic: 'regime', kind: 'none', tactic: 'slowSqueeze', cite: 'Holodomor, Ukraine, 1932 to 1933', src: 'brit-holodomor',
      s: 'Ukraine, 1933. Food requisitions keep rising. Villages are put on blacklists and cut off from food, and peasants are forbidden to leave to look for food elsewhere. What could a farm family do?',
      c: ['Hand over the seed grain; quotas will drop', 'None of these; it was already too deep', 'Walk to the city and buy bread there'],
      m: 'If you meet one more quota, the squeeze will stop.', f: 'There was no safe pick by then. When demands keep rising and exits close, the time to get word out and get out is early.',
      w: 'Millions died in the man-made famine. The Kremlin officially denied it for more than half a century.',
      steps: ['Spot the rising demand', 'Write it down', 'Tell the world'] },
    { id: 'pw52', ages: 'both', topic: 'extremism', tactic: 'madeEnemy', cite: 'Islamic State seizes Mosul, June 2014', src: 'cfr-isis',
      s: 'Mosul, June 2014. Islamic State fighters overrun the city as the Iraqi army collapses. Christians and other religious minorities are told they must pay a special tax to stay. What did many families do?',
      c: ['Pay the tax and stay put', 'Leave fast for a safer area nearby', 'Stay put and see what happens'],
      m: 'If you pay and keep your head down, an extremist group will leave you alone.', f: 'When a group sorts people by faith, leave early if you can. Go to areas under a safer authority.',
      w: 'Many fled. Those who had not fled faced an extra tax on top of the group\'s extortion, and worse.',
      steps: ['Hear the threat', 'Leave early', 'Go to a safer area'] },
    // ---- More business and politics ----
    { id: 'pw53', ages: 'both', topic: 'business', tactic: 'borrowedCredit', cite: 'Kearns v. Chrysler Corp. (Fed. Cir. 1994) 32 F.3d 1541', src: 'kearns', also: ['nyt-kearns'],
      s: 'Robert Kearns patented windshield wipers that pause between swipes. Carmakers would not license them, then began selling cars with intermittent wipers. What did he do?',
      c: ['Let it go; one man cannot fight a carmaker', 'Sue on his patents and keep records', 'Build his own car company to sell the wiper himself'],
      m: 'A small inventor cannot win against a giant company.', f: 'If someone takes your idea, a patent and dated records are your proof. A patent lawyer can take it to court.',
      w: 'A jury found Ford infringed his patents, and Ford settled. A court upheld an $18.7 million judgment against Chrysler in 1994.',
      steps: ['Patent the idea', 'Keep dated records', 'Get a patent lawyer'] },
    { id: 'pw54', ages: 'both', topic: 'politics', tactic: 'madeEnemy', cite: 'Declaration of Conscience, U.S. Senate, June 1, 1950', src: 'senate-mcs',
      s: '1950. Senator Joseph McCarthy is smearing people as communists with little proof. Fellow Republicans fear him. Senator Margaret Chase Smith is new. What did she do?',
      c: ['Kept quiet to protect her seat and her party', 'Spoke out against it on the Senate floor in public', 'Sent him a private note of concern and hoped for change'],
      m: 'Standing up to a powerful smear campaign ends your career.', f: 'When a smear campaign grows, say so in public, calmly, and bring others with you.',
      w: 'She gave her "Declaration of Conscience" speech, joined by six other Republican senators. McCarthy was censured four years later.',
      steps: ['Gather the facts', 'Find allies', 'Speak in public', 'Stay calm'] },
    { id: 'pw55', ages: 'both', topic: 'regime', tactic: 'freezeOut', cite: 'Gdansk shipyard strike, August 1980', src: 'brit-solidarity',
      s: 'Poland, August 1980. Strikes over rising food prices spread, and the Lenin Shipyards in Gdańsk walk out. One worker alone could just be fired. What worked?',
      c: ['Each worker quits on their own in protest', 'They struck together with clear demands', 'None of these; it was already too deep'],
      m: 'One worker has no power against the state.', f: 'Stand together. A group with clear demands is harder to freeze out than one person.',
      w: 'The strikes led to Solidarity, founded in September 1980, the first independent union in the Soviet bloc. It had about 10 million members by early 1981.',
      steps: ['Stand together', 'Write clear demands', 'Hold the line'] },
    { id: 'pw56', ages: 'both', topic: 'regime', tactic: 'splitRule', cite: 'Cambodian genocide: use of children, 1975 to 1979', src: 'brit-camgen',
      s: 'Cambodia, 1976. The Khmer Rouge take many children from their families and train them in total loyalty to the party. Children are told to report on parents and elders. A mother still has her son with her. What helps most?',
      c: ['Teach him to report anything odd he hears', 'Keep talk at home safe and stay close to him', 'Talk politics with him late at night'],
      m: 'A child who reports on family is just being a good citizen.', f: 'When a regime turns children into informers, keep risky talk away from them and keep the bond strong.',
      w: 'Children were recruited as soldiers, spies and guards. The regime used them to break family and community ties.',
      steps: ['Guard what you say', 'Stay close', 'Keep the bond'] },
    { id: 'pw57', ages: 'both', topic: 'regime', tactic: 'madeEnemy', cite: 'German election, March 5, 1933', src: 'ushmm-rise', also: ['ushmm-reichstag'],
      s: 'Germany, March 1933. Under the fire decree, the government limits Social Democrat and Communist campaigning, and Communist leaders like Ernst Thälmann are arrested. A friend says the vote will set things right. What is the wise read?',
      c: ['The vote will fix it; just wait for the count', 'Plan as if this is the last free vote for years', 'None of these; it was too late by then'],
      m: 'One more election will put things right.', f: 'When a government jails rivals before a vote, plan for the worst: protect people and records, and build ties abroad.',
      w: 'The March 1933 election was the last multi-party election in Germany until after World War II.',
      steps: ['See the rigged field', 'Protect people and records', 'Build ties abroad'] },
    { id: 'pw58', ages: 'both', topic: 'cult', tactic: 'loyaltyTest', cite: 'United States v. Raniere (E.D.N.Y.), sentenced Oct. 27, 2020', src: 'doj-nxivm',
      s: 'Inside NXIVM, a secret circle asks women to take "vows of obedience" to a senior member and keep it from the wider group. A new member is invited. What is the wise answer?',
      c: ['Take the vow; secrecy shows real trust in growth', 'Decline, leave, and tell people outside', 'Take it for now and quit later if needed'],
      m: 'A secret vow of obedience is a sign of a deep, safe bond.', f: 'Secret vows of obedience are a mark of a high-control group. Decline, leave, and tell people you trust.',
      w: 'Prosecutors said the secret group was used to exploit women. Its leader, Keith Raniere, was sentenced to 120 years.',
      steps: ['Decline the vow', 'Leave the group', 'Tell people you trust'] }
  ]
});

<script data-src="content/decks/street_safety.js">
// Street Safety: Red Flags (STREET-SMART-SPEC.md item 2). Each set is built on a real, named case from a DOJ press release.

  id: 'safety', name: 'Red Flags', icon: '🚩', format: 'redflags', section: 'Street Smart', rating: 'teen',
  notice: 'Red flags come from real court cases. Fine signs are ordinary ones added for contrast. In danger, call 911. Trafficking help: 1-888-373-7888.',
  sources: {
    'doj-carmona': ['U.S. Attorney, S.D. Cal. (Oct. 20, 2023): Woman Pleads Guilty to Drug Trafficking and Obstruction of Justice in So-Called “Blind Mule” Case', 'https://www.justice.gov/usao-sdca/pr/woman-pleads-guilty-drug-trafficking-and-obstruction-justice-so-called-blind-mule-case'],

    'doj-fbcourier': ['U.S. Attorney, W.D. Wash. (June 23, 2025): Mexican National sentenced to prison for role as drug ring courier', 'https://www.justice.gov/usao-wdwa/pr/mexican-national-sentenced-prison-role-drug-ring-courier'],
