    { id: 'hr38', ages: 'both', rating: 'adult', topic: 'culture', title: "Different, Not Lesser", cite: "Britannica, Cultural relativism; Ethnocentrism", sourceIds: ["brit-relativism","brit-ethnocentrism"],
      passage: [
        "Ethnocentrism, Britannica explains, is the belief that one's own group is superior and the habit of judging other cultures by one's own customs. European travelers after the age of exploration often described non-Western peoples as immoral or illogical simply because their ways differed. Anthropology grew partly as a correction: the anthropologist Franz Boas and his students showed there is no necessary connection between culture and \"race.\"",
        "Cultural relativism pushes the other way. It holds that morality develops differently in each society and urges us to understand a practice in its own setting before judging it. As a method, this is powerful. It explains why one family eats with their hands and another with forks, why greetings and dress differ, and why a custom that looks strange may have a sensible history.",
        "As a final rule, though, relativism runs into trouble. Critics argue it can prevent valid moral judgments against harmful practices, and Britannica notes that the profession has come to accept \"the moral necessity\" of rejecting claims that local culture is untouchable. The balanced view keeps both lessons. Most differences are just differences and deserve respect. A practice that kills, enslaves, or silences people is not protected by calling it culture, and the people who suffer it are usually the first to say so."
      ],
      qs: [
        { id: 'hr38-q1', type: 'mainIdea', q: "What is the main point of the passage?", c: ["Relativism should guide each moral judgment","Respect differences but reject harm","Anthropology began with travelers' reports"], fix: "The author keeps relativism as a method but rejects it as a shield for harm.", line: 3, proof: "The balanced view keeps both lessons." },
        { id: 'hr38-q2', type: 'purpose', q: "Why does the author mention eating with hands or forks?", c: ["To show that relativism began with studies of food","To give harmless examples where understanding fits","To show that Western table manners are better"], fix: "Everyday customs show where relativism works well as a method.", line: 2, proof: "It explains why one family eats with their hands and another with forks" },
        { id: 'hr38-q3', type: 'inference', q: "What does the passage suggest about the travelers' judgments?", c: ["They rested on long and careful study of each people","They rested on difference rather than evidence","They were shaped by Boas and his students"], fix: "They called others immoral \"simply because their ways differed.\"", line: 1, proof: "simply because their ways differed" },
        { id: 'hr38-q4', type: 'assumption', q: "The final clause, that sufferers \"are usually the first to say so,\" assumes that...", c: ["Outsiders see harms more clearly","Insiders object to harms too","Customs change slowly over time"], fix: "The point relies on critics existing within the culture, not only outside it.", line: 3, proof: "the people who suffer it are usually the first to say so" },
        { id: 'hr38-q5', type: 'weaken', q: "Which would most weaken the critics' case against strict relativism?", c: ["Some customs that look strange have sensible histories","Strict relativists still condemned slavery","Boas studied culture and race together"], fix: "If strict relativists could still condemn slavery, relativism would not block moral judgment.", line: 3, proof: "Critics argue it can prevent valid moral judgments against harmful practices" },
        { id: 'hr38-q6', type: 'tone', q: "The author's tone is best described as...", c: ["Skeptical of anthropology","Balanced between both","Firmly relativist"], fix: "The author weighs both views and keeps what each gets right.", line: 3, proof: "Most differences are just differences and deserve respect." }
      ] },
    { id: 'hr39', ages: 'both', rating: 'adult', topic: 'economics', title: "A Wall Facing Inward", cite: "Britannica, Berlin Wall", sourceIds: ["brit-wall"],
      passage: [
        "Between 1949 and 1961, about 2.5 million East Germans fled to West Germany, including steadily rising numbers of skilled workers, professionals, and intellectuals. Britannica writes that their loss threatened to destroy the economic viability of the East German state. On the night of August 12-13, 1961, East Germany began building a barrier around West Berlin, first of barbed wire and cinder blocks, later of concrete walls up to 15 feet high with watchtowers and mines.",
        "About 5,000 East Germans crossed the wall and reached West Berlin safely. Another 5,000 were captured trying, and 191 were killed during the crossing. The wall stood until 1989, when it opened and became a symbol of the end of the Cold War's division of Europe.",
        "A wall can keep enemies out or keep people in, and the direction tells you a great deal. East Germany's planned economy had promised security and equality, and some citizens valued what it gave them. But when millions of its most trained people chose to leave, the state answered with guards rather than reform. That choice is a piece of evidence any debate about economic systems has to face. A system confident in its record does not need to stop its own people from walking out."
      ],
      qs: [
        { id: 'hr39-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["The wall kept Western spies out of East Berlin","Locking people in was evidence","West Berlin lacked room for refugees"], fix: "The author reads a wall facing inward as a judgment on the system.", line: 3, proof: "That choice is a piece of evidence any debate about economic systems has to face." },
        { id: 'hr39-q2', type: 'inference', q: "Why does the passage stress that many who fled were skilled?", c: ["To show the West recruited them","To show their loss hit the economy very hard","To show the East trained too few people"], fix: "Losing skilled workers is why Britannica says the state's viability was threatened.", line: 1, proof: "their loss threatened to destroy the economic viability of the East German state" },
        { id: 'hr39-q3', type: 'purpose', q: "Why does the author say \"some citizens valued what it gave them\"?", c: ["To show the wall had wide support","To be fair to supporters of the system","To show most people chose to stay"], fix: "The author grants the other side a point before making the main argument.", line: 3, proof: "some citizens valued what it gave them" },
        { id: 'hr39-q4', type: 'assumption', q: "The last sentence assumes that...", c: ["Walls are built mostly for defense","People leave when a system fails them","Skilled workers seek higher pay abroad"], fix: "Walking out counts as evidence only if people leave because the system serves them poorly.", line: 3, proof: "A system confident in its record does not need to stop its own people from walking out." },
        { id: 'hr39-q5', type: 'strengthen', q: "Which detail best supports the claim that the wall faced inward?", c: ["It stood until 1989 and then opened","Its guns pointed at those leaving","It was first made of barbed wire and blocks"], fix: "Defenses aimed at people trying to leave show whom the wall was for.", line: 2, proof: "Another 5,000 were captured trying, and 191 were killed during the crossing." },
        { id: 'hr39-q6', type: 'tone', q: "How would you describe the author's tone?", c: ["Bitter","Pointed","Even and neutral"], fix: "The author draws a sharp conclusion from the record.", line: 3, proof: "the direction tells you a great deal" }
      ] },
    { id: 'hr40', ages: 'both', rating: 'adult', topic: 'economics', title: "Markets Without Votes", cite: "Britannica, Deng Xiaoping", sourceIds: ["brit-deng"],
      passage: [
        "Deng Xiaoping was the most powerful figure in China from the late 1970s until his death in 1997. Britannica says he abandoned many orthodox communist doctrines and brought elements of free enterprise into the economy. Peasant farmers were given individual control over their production and profits, a policy that greatly increased farm output within a few years of its start in 1981.",
        "The results were large. Britannica credits Deng with restoring stability after the excesses of the Cultural Revolution and with a rapidly growing economy, rising living standards, expanded personal and cultural freedoms, and growing ties to the world economy. Yet in June 1989, after students in Tiananmen Square demanded more political freedom, Deng backed the use of force, and the army crushed the protests with considerable loss of life.",
        "The record offers something to each side of the old debate. Supporters of markets can point out that a communist state grew richer once farmers could keep their profits. Defenders of planning can note that the state kept firm control and directed the change. And anyone who values freedom has to notice the limit: Deng opened the economy but left one-party rule in place, and that same government used tanks when the people asked for a voice."
      ],
      qs: [
        { id: 'hr40-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["How Deng rose to power within the party after Mao","Reforms and their political limit","Why farm output fell after 1981"], fix: "The passage weighs the economic gains against the 1989 crackdown.", line: 3, proof: "Deng opened the economy but left one-party rule in place" },
        { id: 'hr40-q2', type: 'inference', q: "What does the farm policy suggest about incentives?", c: ["Farmers did better on large state farms than alone","Farmers produced more when they could keep the gains","Profits drew farmers into the cities"], fix: "Output rose \"greatly\" once farmers controlled their own profits.", line: 1, proof: "a policy that greatly increased farm output within a few years of its start in 1981" },
        { id: 'hr40-q3', type: 'purpose', q: "Why does the author include the events of June 1989?", c: ["To show the protests reversed the reforms","To show economic freedom stopped short of a voice","To show the army acted against Deng"], fix: "Tiananmen shows that the reforms stopped short of political freedom.", line: 2, proof: "the army crushed the protests with considerable loss of life" },
        { id: 'hr40-q4', type: 'assumption', q: "The point that the record \"offers something to each side\" assumes that...", c: ["The Chinese case settles the debate","One case may be read many ways","Planning beats markets in the long run"], fix: "The author treats the same facts as support for different views.", line: 3, proof: "The record offers something to each side of the old debate." },
        { id: 'hr40-q5', type: 'weaken', q: "Which would most weaken the claim that markets drove the growth?", c: ["Living standards rose in those years","Unreformed places grew as fast","Farm output rose within a few years"], fix: "If unreformed areas grew equally, the reform would not explain the gain.", line: 3, proof: "a communist state grew richer once farmers could keep their profits" },
        { id: 'hr40-q6', type: 'tone', q: "The author's approach is best described as...", c: ["Approving of Deng's rule","Even-handed but clear","Hostile to reform"], fix: "The author gives each side its point and still names the crackdown.", line: 3, proof: "anyone who values freedom has to notice the limit" }
      ] },
    { id: 'hr41', ages: 'both', rating: 'adult', topic: 'gangs', title: "What the Gang Offers", cite: "National Institute of Justice, Changing Course (2013)", sourceIds: ["nij-gangjoin"],
      passage: [
        "A National Institute of Justice report, Changing Course, sets out why young people join gangs. Researchers Carl Taylor and Pamela Smith list several attractions: money, ties to friends or family already in the gang, a sense of support and belonging, a perception of protection, and the status of being an \"outlaw.\" No single reason explains every case.",
        "Ages 11 to 14 are a key window. Children start spending less time with family and more with friends, care intensely about what others think, and test limits. Some youth join for protection from violence in their neighborhoods and schools. Others are drawn by money; the report notes that low-level \"jobs\" in gangs are often easier to find than a minimum-wage job in many places, and can make a kid feel he is at least doing something.",
        "A recruiter does not have to lie about all of this. He can offer real things: friends, cash, respect, a group that has your back. What he leaves out is the cost, which the report calls potentially life-altering. That is why the report argues that prevention has to offer real alternatives, such as a job, a team, a mentor, or a safe place, rather than only warnings. Seeing the pitch for what it is means asking what the offer leaves out."
      ],
      qs: [
        { id: 'hr41-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["Gangs draw youth mostly through lies and threats","Gangs offer real pulls so alternatives matter","Most youth join for protection from violence"], fix: "The passage lists real attractions and argues for real alternatives.", line: 3, proof: "prevention has to offer real alternatives" },
        { id: 'hr41-q2', type: 'inference', q: "Why are ages 11 to 14 described as a key window?", c: ["Children that age are kept home more by parents","Friends start to matter more than family","Gangs recruit at middle schools"], fix: "In those years kids shift toward friends and care what others think.", line: 2, proof: "Children start spending less time with family and more with friends" },
        { id: 'hr41-q3', type: 'purpose', q: "Why does the author say a recruiter \"does not have to lie about all of this\"?", c: ["To show recruiters are honest","To show the pull is real","To show gang jobs pay more than wages"], fix: "Admitting the offer is partly real explains why warnings alone fail.", line: 3, proof: "He can offer real things: friends, cash, respect, a group that has your back." },
        { id: 'hr41-q4', type: 'assumption', q: "The call for \"real alternatives\" assumes that...", c: ["Warnings work better than programs","Youth take good options when they exist","Gangs close when jobs appear"], fix: "Offering a job or a team helps only if kids will take them over the gang.", line: 3, proof: "such as a job, a team, a mentor, or a safe place" },
        { id: 'hr41-q5', type: 'strengthen', q: "Which would most support the report's point about money?", c: ["Many gang members have family in the gang already","Youth in areas with summer jobs joined gangs less","Gang jobs are easier to find than minimum-wage jobs"], fix: "If jobs cut joining, money really was part of the pull.", line: 2, proof: "low-level \"jobs\" in gangs are often easier to find than a minimum-wage job" },
        { id: 'hr41-q6', type: 'tone', q: "How does the author treat young people drawn to gangs?", c: ["With alarm at their choices","With understanding of their reasons","With cool detachment"], fix: "The author explains their reasons without scorn.", line: 2, proof: "can make a kid feel he is at least doing something" }
      ] },
    { id: 'hr42', ages: 'both', rating: 'adult', topic: 'gangs', title: "Getting Out, Staying Out", cite: "OJJDP, Getting Out of Gangs, Staying Out of Gangs; Homeboy Industries", sourceIds: ["ojjdp-desist","homeboy"],
      passage: [
        "Leaving a gang is usually not a single dramatic moment. A federal juvenile justice research summary describes turning points that lead members to rethink: contact with the justice system, being hurt by other gang members, disruption of the gang itself, and life changes such as a romantic relationship, the birth of a child, or family illness.",
        "Those moments open a door, but walking through it takes help. The research points to removing the barriers that keep a person stuck, such as a lack of education and job skills, pressure from old friends, and family problems, while helping the person take on new adult roles. In Los Angeles, Homeboy Industries began in 1988 to improve the lives of former gang members and now calls itself the largest gang rehabilitation and re-entry program in the world, a model for more than 250 organizations.",
        "One participant listed what changed: finishing drug treatment, getting housing, a job, a car, and a license, and supporting her kids. Her summary was plain: \"things take time.\" That is the honest version of an exit. It is slower than the movies, it needs a job and people who will stick around, and it works far more often than a person stuck inside may believe."
      ],
      qs: [
        { id: 'hr42-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["How gangs punish members who try to leave them","People leave with time and support","Why Homeboy began in 1988"], fix: "The passage covers turning points, the help needed, and one real exit.", line: 3, proof: "That is the honest version of an exit." },
        { id: 'hr42-q2', type: 'inference', q: "What does the list of turning points suggest?", c: ["Members leave mainly after prison terms","Exits often begin with a change in someone's life","Members rethink when the gang grows"], fix: "Relationships, children and illness can all prompt a rethink.", line: 1, proof: "life changes such as a romantic relationship, the birth of a child, or family illness" },
        { id: 'hr42-q3', type: 'purpose', q: "Why does the author include the participant's list?", c: ["To show exits are quick for most people","To make the research concrete with one real life","To show treatment is the main step"], fix: "Her list turns \"new adult roles\" into real steps.", line: 3, proof: "finishing drug treatment, getting housing, a job, a car, and a license" },
        { id: 'hr42-q4', type: 'assumption', q: "The phrase \"walking through it takes help\" assumes that...", c: ["Old friends offer the best help","Real barriers hold people back","Programs replace family support"], fix: "Help matters only if real obstacles stand in the way.", line: 2, proof: "removing the barriers that keep a person stuck" },
        { id: 'hr42-q5', type: 'weaken', q: "Which would most weaken the final claim that exits work \"far more often\" than insiders believe?", c: ["Homeboy is a model for more than 250 groups","Most who left were back within a year","Exits take time"], fix: "If most quickly returned, exits would not work as often as claimed.", line: 3, proof: "it works far more often than a person stuck inside may believe" },
        { id: 'hr42-q6', type: 'tone', q: "The author's tone in the last paragraph is...", c: ["Cautious and doubtful","Honest and encouraging","Neutral and detached"], fix: "The author admits exits are slow yet says they often work.", line: 3, proof: "It is slower than the movies" }
      ] },
    { id: 'hr43', ages: 'both', rating: 'adult', topic: 'abuse', title: "An Order on Paper", cite: "Oyez, Castle Rock v. Gonzales (2005)", sourceIds: ["oyez-castlerock"],
      passage: [
        "Jessica Gonzales obtained a restraining order against her estranged husband that barred him from seeing her or their three daughters except during set visits. A month later he took the girls. She repeatedly urged the police in Castle Rock, Colorado, to find and arrest him, but they told her to wait and see if he brought the children back. That night he killed all three girls, then opened fire at a police station and was killed by police.",
        "Gonzales sued, arguing that the police had violated her right to due process by refusing to enforce the order. In a 7-2 decision written by Justice Antonin Scalia, the Court ruled against her. State law, the Court held, did not entitle the holder of a restraining order to any specific action by the police; how to enforce it was left to police discretion. Justice John Paul Stevens, joined by Justice Ruth Bader Ginsburg, dissented.",
        "The ruling settled a legal question, not a moral one. Whatever the Constitution requires, the case shows that an order on paper does not by itself stop someone determined to cause harm. That is why advocates urge people who leave an abuser to treat the order as one part of a safety plan, along with a safe place to stay, people who know the danger, and hotline help, and why many states have since written firmer duties for police into law."
      ],
      qs: [
        { id: 'hr43-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["The police in the case followed the order exactly","An order alone may fail to protect","Colorado law voided the order"], fix: "The author says the order is one part of a wider safety plan.", line: 3, proof: "treat the order as one part of a safety plan" },
        { id: 'hr43-q2', type: 'inference', q: "What did the Court mean by police \"discretion\"?", c: ["Police are bound to arrest each time an order is broken","Police may decide how to respond","Police need a judge's approval"], fix: "The Court held state law left the specific action up to police.", line: 2, proof: "how to enforce it was left to police discretion" },
        { id: 'hr43-q3', type: 'purpose', q: "Why does the author write that the ruling \"settled a legal question, not a moral one\"?", c: ["To say the Court misread state law","To separate law from what is right","To praise the two dissenting justices"], fix: "The author keeps the legal holding apart from the lesson about safety.", line: 3, proof: "The ruling settled a legal question, not a moral one." },
        { id: 'hr43-q4', type: 'assumption', q: "The advice to build a \"safety plan\" assumes that...", c: ["Abusers seldom break court orders","Danger outlasts the order","Hotlines can enforce orders"], fix: "Extra steps matter only if risk remains once the order exists.", line: 3, proof: "an order on paper does not by itself stop someone determined to cause harm" },
        { id: 'hr43-q5', type: 'weaken', q: "Which would most weaken the claim that the order alone did not protect the girls?", c: ["She called the police more than once that night","Police had searched for him at once","The vote was 7-2 against her"], fix: "If police had acted at once, the case would not show an order going unenforced.", line: 1, proof: "they told her to wait and see if he brought the children back" },
        { id: 'hr43-q6', type: 'tone', q: "The tone of the passage is best described as...", c: ["Angry and accusing","Grave and restrained","Clinical and dry"], fix: "The author reports a terrible case plainly and draws a practical lesson.", line: 3, proof: "Whatever the Constitution requires" }
      ] },
    { id: 'hr44', ages: 'both', rating: 'adult', topic: 'abuse', title: "A Credible Threat", cite: "Oyez, United States v. Rahimi (2024); Castle Rock v. Gonzales (2005)", sourceIds: ["oyez-rahimi","oyez-castlerock"],
      passage: [
        "Zackey Rahimi was under a civil protective order for alleged assault on his ex-girlfriend, and the order expressly barred him from having guns. Between December 2020 and January 2021 he was involved in a series of violent incidents in Arlington, Texas, including shootings. Police searched his home and found a rifle and a pistol, and he was charged under a federal law that bars people under domestic violence restraining orders from possessing firearms.",
        "Rahimi argued the law violated the Second Amendment, and a federal appeals court agreed. The Supreme Court reversed in an 8-1 decision written by Chief Justice John Roberts. The Court held that a person found by a court to \"pose a credible threat to the physical safety of another\" may be temporarily disarmed. The right to keep and bear arms, the Court said, is fundamental but not unlimited.",
        "Read beside the 2005 Castle Rock case, Rahimi shows the law working at a different point. Castle Rock was about whether police must act on an order; Rahimi was about whether the order can take away a dangerous person's weapons in advance. Research and police experience both show that guns in a home with domestic violence raise the risk of death. The ruling does not end that risk, but it keeps one of the strongest tools on the books."
      ],
      qs: [
        { id: 'hr44-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["Why the Second Amendment was narrowed by the Court","Courts may disarm people found dangerous","How police searched homes in Arlington"], fix: "The passage explains the Rahimi holding and why it matters.", line: 2, proof: "may be temporarily disarmed" },
        { id: 'hr44-q2', type: 'inference', q: "What does \"fundamental but not unlimited\" suggest?", c: ["The right now applies to few people","Rights may have narrow and justified limits","Courts may ban guns at will"], fix: "The Court kept the right while allowing a specific limit.", line: 2, proof: "The right to keep and bear arms, the Court said, is fundamental but not unlimited." },
        { id: 'hr44-q3', type: 'purpose', q: "Why does the author compare Rahimi with Castle Rock?", c: ["To show the two rulings say the same thing","To show two points where the law may protect","To argue Castle Rock was overruled"], fix: "One case is about police action, the other about disarming in advance.", line: 3, proof: "Rahimi shows the law working at a different point" },
        { id: 'hr44-q4', type: 'assumption', q: "The phrase \"one of the strongest tools\" assumes that...", c: ["Abusers seldom own guns","Removing guns lowers danger","Courts rarely issue such orders"], fix: "Disarming is a strong tool only if guns raise the risk of death.", line: 3, proof: "guns in a home with domestic violence raise the risk of death" },
        { id: 'hr44-q5', type: 'weaken', q: "Which would most weaken the case for the law?", c: ["The Court voted 8-1 in the Rahimi case","Guns at home made little difference to the risk","Rahimi had both a rifle and a pistol"], fix: "If guns did not raise the risk, disarming would protect no one.", line: 3, proof: "Research and police experience both show" },
        { id: 'hr44-q6', type: 'tone', q: "The final sentence is best described as...", c: ["Hopeful","Measured","Worried and uneasy"], fix: "The author credits the ruling without claiming it ends the danger.", line: 3, proof: "The ruling does not end that risk" }
      ] },
    { id: 'hr45', ages: 'both', rating: 'adult', topic: 'cults', title: "The Concerned Relatives", cite: "Britannica, Jonestown", sourceIds: ["brit-jonestown"],
      passage: [
        "The Peoples Temple did real humanitarian work in its communities, Britannica notes, but its leader, Jim Jones, treated followers harshly. Members were humiliated and pressured into signing over their homes and possessions. Families were kept apart and encouraged to inform on one another. Black members and other minorities were told that if they left, they would be rounded up into government camps. In 1977, as reporters began asking questions, Jones moved several hundred followers to Jonestown in Guyana.",
        "Former members and families of current members formed a group called Concerned Relatives and reported that people were being held against their will. At their urging, Congressman Leo Ryan of California flew to Guyana with reporters in November 1978. When he prepared to leave, about 14 members asked to go with him. At the airstrip, Temple members opened fire; Ryan and four others were killed. Within hours Jones ordered the deaths of his followers, and 913 died, including 304 under 18.",
        "The ending is the most remembered part, but the warning signs came years earlier, and so did the people who saw them. The relatives were right. Most of the few survivors in Guyana were people who had defected that day or were away in the capital. Telling members that the outside world is the danger, splitting families, and taking their property are ways of closing every exit. People who left, and families who kept asking, were the ones who held exits open."
      ],
      qs: [
        { id: 'hr45-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["Jonestown is mainly a story about Guyana's politics","Exits were closed and pushback mattered","Ryan's visit set off the deaths"], fix: "The author stresses the early signs and the people who held exits open.", line: 3, proof: "People who left, and families who kept asking, were the ones who held exits open." },
        { id: 'hr45-q2', type: 'inference', q: "Why would Jones tell members they would be put in \"camps\" if they left?", c: ["To prepare them for the move to Guyana","To make leaving seem more dangerous than staying","To explain the government's plans"], fix: "Fear of the outside world keeps people from leaving.", line: 1, proof: "were told that if they left, they would be rounded up into government camps" },
        { id: 'hr45-q3', type: 'purpose', q: "Why does the author note who survived?", c: ["To blame the people who defected","To show that leaving saved lives","To show the capital was safe for members"], fix: "Most survivors in Guyana had defected or were away.", line: 3, proof: "Most of the few survivors in Guyana were people who had defected that day or were away in the capital." },
        { id: 'hr45-q4', type: 'assumption', q: "Calling these tactics \"ways of closing every exit\" assumes that...", c: ["Most members wanted to stay there","Those things help people leave","Jones feared the press"], fix: "Taking those things closes exits only if they are what make leaving possible.", line: 3, proof: "Telling members that the outside world is the danger, splitting families, and taking their property" },
        { id: 'hr45-q5', type: 'strengthen', q: "Which detail best supports \"The relatives were right\"?", c: ["The Temple did humanitarian work in its towns","About 14 members asked to leave with Ryan","Jones moved there in 1977"], fix: "People asking to leave confirms they had felt held there.", line: 2, proof: "about 14 members asked to go with him" },
        { id: 'hr45-q6', type: 'tone', q: "How does the author treat the Concerned Relatives?", c: ["With caution","With respect","As outsiders to it"], fix: "The author says plainly that they were right.", line: 3, proof: "The relatives were right." }
      ] },
    { id: 'hr46', ages: 'both', rating: 'adult', topic: 'cartels', title: "The Fee", cite: "U.S. Attorney, N.D. Okla., cartel courier sentencing", sourceIds: ["doj-sanchez-courier"],
      passage: [
        "In Tulsa, Oklahoma, a federal judge sentenced Jose Amadeis Sanchez Sanchez, 34, a Mexican national, to 37 months in prison for a drug conspiracy tied to a Mexico-based cartel. Agents had found him staying at two drug houses in East Tulsa, where they seized $38,000 in cash, phones, scales, a drug ledger, and nearly 2.5 pounds of fentanyl.",
        "Court documents describe how he got there. He believed he was coming to the United States to work legally. Instead, the cartel \"informed\" him that he would be a courier to repay a $25,000 \"fee\" for being smuggled across the border. He broke large amounts of fentanyl into smaller ones and passed cash to another courier headed back to Mexico. Even after being removed from the country once, he returned and kept working for the cartel. The wider investigation has led to more than 35 arrests.",
        "The quote marks around \"informed\" and \"fee\" in the government's own release say a lot. A fee you learn about after you arrive is not a price you agreed to; it is a debt invented to control you. That is the same tool labor traffickers use, aimed here at making a man move poison. None of this excuses the harm fentanyl does. It does show how a promise of honest work becomes the first step into a cartel, and why an offer to cross a border with the cost worked off later is a trap."
      ],
      qs: [
        { id: 'hr46-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["How agents traced a cartel's cash to Tulsa","An invented debt pulled a man in","Why he returned after he was removed"], fix: "The passage centers on the \"fee\" that turned a job seeker into a courier.", line: 3, proof: "it is a debt invented to control you" },
        { id: 'hr46-q2', type: 'inference', q: "Why does the author focus on the quote marks around \"informed\" and \"fee\"?", c: ["They mark words the author added","They suggest neither word was honest","They show the words came from Sanchez"], fix: "The marks hint that he was not really informed and the fee was not a real price.", line: 3, proof: "The quote marks around \"informed\" and \"fee\" in the government's own release say a lot." },
        { id: 'hr46-q3', type: 'purpose', q: "Why does the author write \"None of this excuses the harm fentanyl does\"?", c: ["To argue his sentence was too harsh for what he did","To keep sympathy from becoming an excuse","To show the agents overreached"], fix: "The author explains the trap without excusing the crime.", line: 3, proof: "None of this excuses the harm fentanyl does." },
        { id: 'hr46-q4', type: 'assumption', q: "Calling the fee \"a debt invented to control you\" assumes that...", c: ["He agreed to the fee once he arrived","He learned of it after arriving","The fee was set by the court"], fix: "A fee revealed only on arrival was not something he chose.", line: 3, proof: "A fee you learn about after you arrive is not a price you agreed to" },
        { id: 'hr46-q5', type: 'weaken', q: "Which would most weaken the claim that he was trapped by the debt?", c: ["He kept working after being removed once","He had agreed to courier work before he crossed","Agents found $38,000 in cash"], fix: "If he agreed beforehand, the debt was not what pulled him in.", line: 2, proof: "He believed he was coming to the United States to work legally." },
        { id: 'hr46-q6', type: 'tone', q: "The tone of the final paragraph is best described as...", c: ["Sympathetic toward the cartel's couriers","Cautionary","Detached and clinical"], fix: "The author reads the record closely and ends on a warning.", line: 3, proof: "is a trap" }
      ] },
    { id: 'hr47', ages: 'both', rating: 'adult', topic: 'trafficking', title: "Heavy Debt Before the Harvest", cite: "U.S. Department of Justice, H-2A forced labor sentencing (M.D. Fla.)", sourceIds: ["doj-lvh"],
      passage: [
        "Los Villatoros Harvesting was a farm labor contractor that brought seasonal Mexican workers to the United States on H-2A agricultural visas. Prosecutors showed it was run as a criminal enterprise. Between 2015 and 2017 it subjected more than a dozen workers to forced labor while they harvested fruits and vegetables.",
        "A recruiter for the company signed up about 40 workers. He charged each of them fees of $1,000 to $2,000 before they left home, falsely told them the company would pay them back, and lied about their wages. He knew the workers had gone into heavy debt to pay him, and that the debt could be used to keep them working. Others in the scheme took the workers' passports to keep them from fleeing, and workers were threatened with arrest and deportation if they tried to escape. Three defendants were sentenced, two to prison terms, and two were ordered to pay restitution.",
        "Each piece of this scheme can look normal at first. Recruiters exist, visa programs are legal, and many jobs come with paperwork. The warning signs are the combination: a fee charged before the job, a promise of repayment that is never written down, a boss who keeps your passport, and threats about your status. A Justice Department official described the goal of such cases as making sure abusers are \"stripped of any profits so that the victims can rightfully use restitution proceeds to rebuild their lives.\""
      ],
      qs: [
        { id: 'hr47-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["Visa programs let recruiters charge workers fees","Fees, debt and taken passports meant forced labor","Recruiters lied about pay to fill quotas"], fix: "The passage shows how normal-looking pieces combined into control.", line: 3, proof: "The warning signs are the combination" },
        { id: 'hr47-q2', type: 'inference', q: "Why did the recruiter want the workers in \"heavy debt\"?", c: ["So they would earn interest on the loans","So the debt would keep them working","So the visas would be approved faster"], fix: "He knew the debt could be used to coerce them into staying.", line: 2, proof: "the debt could be used to keep them working" },
        { id: 'hr47-q3', type: 'purpose', q: "Why does the author say \"Each piece of this scheme can look normal at first\"?", c: ["To suggest the workers should have known","Legal parts hid the trap","To argue that visa programs invite abuse"], fix: "Legal-looking pieces made the trap hard to see until they combined.", line: 3, proof: "Recruiters exist, visa programs are legal, and many jobs come with paperwork." },
        { id: 'hr47-q4', type: 'assumption', q: "The list of warning signs assumes that...", c: ["Fees before a job are illegal","Workers may watch for these","Recruiters will explain them"], fix: "Listing signs helps only if a worker can notice them in time.", line: 3, proof: "a fee charged before the job, a promise of repayment that is never written down" },
        { id: 'hr47-q5', type: 'strengthen', q: "Which detail best supports calling the company a \"criminal enterprise\"?", c: ["The workers came on legal H-2A visas","Several people played set roles in the scheme","Workers picked fruits and vegetables"], fix: "A recruiter, a passport-taker and others acting together fits an enterprise.", line: 2, proof: "Others in the scheme took the workers' passports" },
        { id: 'hr47-q6', type: 'tone', q: "The quoted official's tone is...", c: ["Angry at the farms and recruiters","Firm and focused on victims","Cautious and hedged"], fix: "The official stresses taking profits and helping victims rebuild.", line: 3, proof: "so that the victims can rightfully use restitution proceeds to rebuild their lives" }
      ] },
    { id: 'hr48', ages: 'both', rating: 'adult', topic: 'philosophy', title: "The Care of the Soul", cite: "Stanford Encyclopedia of Philosophy, Toleration", sourceIds: ["sep-toleration"],
      passage: [
        "The 17th century was marked by bitter religious wars, and it produced three classic arguments for toleration: Baruch de Spinoza's Tractatus Theologico-Politicus (1670), Pierre Bayle's Commentaire Philosophique (1686), and John Locke's A Letter Concerning Toleration (1689). The Stanford Encyclopedia of Philosophy calls Locke's the most popular and influential of the three.",
        "Locke separated the work of the state from the work of the church. The state, he argued, exists to secure citizens' \"civil interests,\" such as life, liberty, and property. The \"care of the soul\" is not its business, because that is a matter between each person and God. Churches, in this view, are voluntary associations with no right to use force. Bayle went further. Rather than relying mainly on the idea that conscience cannot be forced, he argued against the use of force in religion on grounds of reason that people of different faiths could share.",
        "These arguments came from believers as well as skeptics, and they do not ask anyone to stop believing. They ask something harder: to hold your faith firmly while refusing to make others hold it by force. Modern versions still debate the reasons. Some rest respect on each person's ability to choose a way of life; others, following Bayle, on the idea that laws must be justified by reasons all citizens could accept."
      ],
      qs: [
        { id: 'hr48-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["Why religion should be kept out of public life","Early arguments against forcing faith","How the religious wars ended"], fix: "The passage explains Locke and Bayle on keeping force out of faith.", line: 3, proof: "to hold your faith firmly while refusing to make others hold it by force" },
        { id: 'hr48-q2', type: 'inference', q: "Why might Locke call churches \"voluntary associations\"?", c: ["Because the state paid for the churches","Membership should be free","Because churches had no clergy"], fix: "If churches are voluntary, they have no right to compel anyone.", line: 2, proof: "Churches, in this view, are voluntary associations with no right to use force." },
        { id: 'hr48-q3', type: 'purpose', q: "Why does the author note the arguments \"came from believers as well as skeptics\"?", c: ["To show toleration came mainly from doubters","To show it is open to people of faith","To show the thinkers agreed on God"], fix: "The point is that toleration does not require giving up belief.", line: 3, proof: "they do not ask anyone to stop believing" },
        { id: 'hr48-q4', type: 'assumption', q: "Locke's split between state and church assumes that...", c: ["Churches should hold the state in check","Belief under force is empty","The state guards the soul"], fix: "Leaving the soul to God assumes the state has no proper role in compelling belief.", line: 2, proof: "because that is a matter between each person and God" },
        { id: 'hr48-q5', type: 'weaken', q: "Which would most weaken Bayle's approach as the passage describes it?", c: ["Locke's letter was more widely read than his","Different faiths share few common reasons","Conscience is hard to force"], fix: "Bayle relied on reasons people of different faiths could share; if none exist, the argument fails.", line: 2, proof: "on grounds of reason that people of different faiths could share" },
        { id: 'hr48-q6', type: 'tone', q: "The author's tone is best described as...", c: ["Skeptical of faith","Fair","Partisan"], fix: "The author presents the views and modern debates without taking a religious side.", line: 3, proof: "Modern versions still debate the reasons." }
      ] },
    { id: 'hr49', ages: 'both', rating: 'adult', topic: 'manipulation', title: "Glowing but False", cite: "U.S. Attorney, N.D. Cal., Elizabeth Holmes sentencing", sourceIds: ["doj-holmes"],
      passage: [
        "Elizabeth Holmes founded the blood testing company Theranos in 2003. For more than a decade, trial evidence showed, she claimed its analyzer could run any blood test a conventional lab could, from a fingerstick, faster, cheaper, and more accurately. In fact the device failed to perform, and she knew it. She was sentenced to 135 months in federal prison for defrauding investors of hundreds of millions of dollars.",
        "Prosecutors said she gave investors \"glowing but false representations.\" She showed reports bearing drug companies' logos, falsely suggesting they endorsed her technology. She claimed the device had been deployed on the battlefield to treat wounded soldiers, which she knew was untrue. She projected huge revenue while actual revenue was falling. She appeared on magazine covers, dined at the White House, and by the end of 2014 her stock was valued at more than $4 billion. The fraud also put patients at risk, because her flawed tests were used on people with serious conditions.",
        "Holmes fooled beginners and experienced investors alike. The case shows that the strongest manipulators borrow trust from others: famous backers, big logos, a noble mission, and confidence that never wavers. The defense is dull but works. Ask to see the evidence yourself, check claims with the source they name, and notice when admiration for a person is doing the work that proof should do."
      ],
      qs: [
        { id: 'hr49-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["Fingerstick tests were too new for the market","Borrowed trust may hide a lack of proof","Experienced investors are hard to fool"], fix: "The author says manipulators borrow trust and urges checking evidence.", line: 3, proof: "the strongest manipulators borrow trust from others" },
        { id: 'hr49-q2', type: 'inference', q: "Why would fake logos on reports persuade investors?", c: ["They made the reports look modern","They implied trusted firms checked it","The logos were required by law"], fix: "Logos implied endorsement by companies the investors trusted.", line: 2, proof: "falsely suggesting they endorsed her technology" },
        { id: 'hr49-q3', type: 'purpose', q: "Why does the author mention the magazine covers and the White House?", c: ["To show she had earned the honors fairly","Fame added to her credibility","To show she had political ties"], fix: "Public honors are part of the \"borrowed trust\" the author describes.", line: 2, proof: "She appeared on magazine covers, dined at the White House" },
        { id: 'hr49-q4', type: 'assumption', q: "The advice to \"check claims with the source they name\" assumes that...", c: ["Logos are hard to copy","Sources will confirm or deny","Investors rarely ask questions"], fix: "Checking with the source helps only if the source will answer truthfully.", line: 3, proof: "check claims with the source they name" },
        { id: 'hr49-q5', type: 'strengthen', q: "Which fact best supports the claim that the harm went beyond money?", c: ["Her stock was worth billions by 2014","Flawed tests were used on sick patients","She projected revenue far above the real figures"], fix: "Patients relying on bad results faced physical risk.", line: 2, proof: "her flawed tests were used on people with serious conditions" },
        { id: 'hr49-q6', type: 'tone', q: "How does the author describe the defense?", c: ["Clever but slow","Dull but effective","Simple but risky"], fix: "The author calls checking evidence \"dull\" yet effective.", line: 3, proof: "The defense is dull but works." }
      ] },
    { id: 'hr50', ages: 'both', rating: 'adult', topic: 'religion', title: "From the Pulpit", cite: "Britannica, Martin Luther King, Jr.", sourceIds: ["brit-mlk"],
      passage: [
        "Martin Luther King, Jr., came from a family of Baptist preachers in Atlanta; both his father and his maternal grandfather led churches. At Morehouse College his mentor, the college president Benjamin Mays, criticized the Black church for focusing on the hereafter instead of the here and now, a call to service that stayed with King. At Crozer Theological Seminary he studied Mohandas Gandhi's philosophy of nonviolence along with Protestant theology.",
        "King went on to lead the civil rights movement from the mid-1950s until he was assassinated in 1968. As head of the Southern Christian Leadership Conference he promoted nonviolent tactics, including the March on Washington in 1963, and Britannica calls his leadership fundamental to ending legal segregation in the South and elsewhere. He received the Nobel Peace Prize in 1964.",
        "King's story is useful for reading how faith works in public life. He drew on Christian teaching, borrowed from Gandhi, and appealed to the nation's own laws and ideals, so that people of many beliefs could join. That differs from movements that use religion to divide people into the pure and the doomed. The test is not whether a movement speaks of God, but whether it asks followers to protect others' dignity, including their opponents', or to strip it away."
      ],
      qs: [
        { id: 'hr50-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["Why religion should stay out of politics now","How King's faith shaped an open movement","How Mays founded a movement at Morehouse"], fix: "The passage traces King's religious roots and how he made the movement broad.", line: 3, proof: "so that people of many beliefs could join" },
        { id: 'hr50-q2', type: 'inference', q: "What did Mays's criticism likely push King toward?", c: ["A focus on life after death","Applying faith to present injustice","A career as a college president"], fix: "Mays urged focus on \"the here and now,\" which King carried into action.", line: 1, proof: "a call to service that stayed with King" },
        { id: 'hr50-q3', type: 'purpose', q: "Why does the author mention that King borrowed from Gandhi?", c: ["To show he left the Baptist church","He drew across faiths","To show the seminary taught Gandhi"], fix: "Drawing on Gandhi shows a faith that reached across lines.", line: 3, proof: "borrowed from Gandhi" },
        { id: 'hr50-q4', type: 'assumption', q: "The author's \"test\" assumes that...", c: ["Religious movements tend to divide people","Talk of God alone says little","Movements should avoid naming God"], fix: "The test looks past religious language to how people are treated.", line: 3, proof: "The test is not whether a movement speaks of God" },
        { id: 'hr50-q5', type: 'weaken', q: "Which would most weaken the claim that King's approach was inclusive?", c: ["He won the Nobel Peace Prize in 1964","He barred other faiths from his marches","He led the conference for years"], fix: "Excluding people of other faiths would contradict \"people of many beliefs could join.\"", line: 3, proof: "so that people of many beliefs could join" },
        { id: 'hr50-q6', type: 'tone', q: "How does the author treat religion in public life?", c: ["As a private matter","As judged by its fruits","As a danger to watch"], fix: "The author judges movements by whether they protect dignity.", line: 3, proof: "whether it asks followers to protect others' dignity" }
      ] },
    { id: 'hr51', ages: 'both', rating: 'adult', topic: 'trafficking', title: "One Person to Tell", cite: "U.S. Department of Justice, New Jersey forced labor sentencing; U.S. State Department, Understanding Human Trafficking", sourceIds: ["doj-bolarinwa","state-tip"],
      passage: [
        "In December 2015, a woman arrived in New Jersey after Bolaji Bolarinwa recruited her to come to the United States. Once she arrived, the Justice Department says, Bolarinwa confiscated her passport and used threats, verbal abuse, isolation and constant surveillance to make her clean and care for Bolarinwa's children every day, around the clock, for nearly a year. In April 2016 a second woman arrived on a student visa, and her passport was taken too.",
        "The way out came through an ordinary connection. In October 2016 the second woman told a professor at her college, who reported it to the FBI. After a two-week trial, Bolarinwa was found guilty of forced labor and document servitude, and in 2025 she was sentenced to 45 months in prison and ordered to pay $87,518.72 in restitution to the victims.",
        "The State Department lists the tools traffickers use, including threats, debt manipulation, withholding of pay, and confiscation of identity documents. None of them requires a locked door. A trafficker who holds your passport wants you to believe you have nowhere to go and no one to tell. This case shows why that belief is false. Taking someone's papers to control them is itself a crime, and one honest conversation with a teacher, a coworker, or a doctor can be the start of an exit."
      ],
      qs: [
        { id: 'hr51-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["Student visas are how most traffickers bring workers in","Control can be broken by telling someone outside","Restitution is the main goal of a trafficking case"], fix: "The author ends on how one conversation can start an exit.", line: 3, proof: "one honest conversation with a teacher, a coworker, or a doctor can be the start of an exit" },
        { id: 'hr51-q2', type: 'inference', q: "Why would a trafficker hold on to a worker's passport?", c: ["To keep it safe from loss while she worked","To make her feel unable to leave","To handle her visa papers for her"], fix: "Holding the passport is meant to make the worker feel trapped.", line: 3, proof: "wants you to believe you have nowhere to go and no one to tell" },
        { id: 'hr51-q3', type: 'purpose', q: "Why does the author say none of the tools \"requires a locked door\"?", c: ["To suggest the women could have left freely","To show control can work without walls","To praise the State Department's list"], fix: "Threats, debts and taken papers can hold a person without locks.", line: 3, proof: "None of them requires a locked door." },
        { id: 'hr51-q4', type: 'assumption', q: "Saying one conversation \"can be the start of an exit\" assumes that...", c: ["Victims usually know their legal rights","The person told will act on it","Professors are trained to spot trafficking"], fix: "Telling someone helps only if that person does something, as the professor did.", line: 2, proof: "who reported it to the FBI" },
        { id: 'hr51-q5', type: 'strengthen', q: "Which detail best supports the claim that telling someone works?", c: ["The second woman came on a student visa","The professor reported it to the FBI","The work went on for nearly a year"], fix: "The report led to the case and the conviction.", line: 2, proof: "In October 2016 the second woman told a professor at her college, who reported it to the FBI." },
        { id: 'hr51-q6', type: 'tone', q: "The author's attitude toward the trafficker's message is...", c: ["Mildly doubtful","Firmly dismissive","Neutral"], fix: "The author says plainly that the belief is false.", line: 3, proof: "This case shows why that belief is false." }
      ] },
    { id: 'hr52', ages: 'both', rating: 'adult', topic: 'philosophy', title: "Only Doing His Job", cite: "Britannica, Hannah Arendt", sourceIds: ["brit-arendt"], guard: ["rebutted"],
      passage: [
        "In 1961 the philosopher Hannah Arendt reported on the trial of the Nazi war criminal Adolf Eichmann, who had a role in the mass extermination of Jews. In Eichmann in Jerusalem (1963) she argued, Britannica explains, that his crimes came not from a wicked or depraved character but from sheer \"thoughtlessness\": he was an ambitious bureaucrat who failed to reflect on the enormity of what he was doing. She called this the \"banality of evil.\"",
        "Her view drew fierce criticism, and it has been challenged since. A 2011 book by Bettina Stangneth, based in part on sources Arendt did not have, argued that Eichmann had long been a confirmed antisemite. Both views carry a lesson. Some people who serve great crimes are true believers, and some are careerists who simply stop asking what their work is for.",
        "The excuse that runs through such cases is familiar: I only did my job, I followed the rules, the decision was not mine. Arendt's answer was that a person cannot hand off the duty to think. Rules and orders explain how a crime was organized; they do not make the people who carried it out innocent. The defense against becoming part of a cruel system is ordinary: stop and ask what your task does to other people, and refuse when the answer is wrong."
      ],
      qs: [
        { id: 'hr52-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["How later sources proved Arendt's view of Eichmann wrong","How failing to think lets people serve evil","Why clerks were the main planners of the Holocaust"], fix: "The passage builds to the duty to think and to refuse.", line: 3, proof: "a person cannot hand off the duty to think" },
        { id: 'hr52-q2', type: 'inference', q: "What does \"thoughtlessness\" mean in paragraph 1?", c: ["Being rude or careless toward others","Not reflecting on what one is doing","Lacking the skill to plan"], fix: "Arendt meant he failed to reflect on his own actions.", line: 1, proof: "failed to reflect on the enormity of what he was doing" },
        { id: 'hr52-q3', type: 'purpose', q: "Why does the author mention Stangneth's book?", c: ["To show her critics were mistaken","To show the view has been challenged","To recommend it over Arendt's book"], fix: "The book argued Eichmann was a committed antisemite, not just a careerist.", line: 2, proof: "argued that Eichmann had long been a confirmed antisemite" },
        { id: 'hr52-q4', type: 'assumption', q: "The rebuttal in paragraph 3 assumes that...", c: ["Rules are seldom followed in practice","People stay responsible under orders","Most officials are true believers"], fix: "Orders explain a crime without excusing the people who did it.", line: 3, proof: "they do not make the people who carried it out innocent" },
        { id: 'hr52-q5', type: 'weaken', q: "Which would most weaken the author's advice to stop and ask?", c: ["Eichmann was an ambitious bureaucrat","Asking rarely changes what people do","Arendt's book came out in 1963"], fix: "The advice matters only if asking leads people to act differently.", line: 3, proof: "stop and ask what your task does to other people" },
        { id: 'hr52-q6', type: 'tone', q: "How does the author treat the debate over Arendt's view?", c: ["As settled","Even-handed","Dismissive of it"], fix: "The author finds a lesson in both views.", line: 2, proof: "Both views carry a lesson." }
      ] },
    { id: 'hr53', ages: 'both', rating: 'adult', topic: 'religion', title: "The Rule in Many Books", cite: "Britannica, Golden Rule", sourceIds: ["brit-golden"],
      passage: [
        "The Golden Rule is best known from the Gospel of Matthew: \"In everything, do to others what you would have them do to you.\" Britannica calls it a summary of the Christian's duty to his neighbour and a fundamental ethical principle. It also recalls an older command in Deuteronomy to \"love the stranger.\"",
        "It is not, however, unique to Christianity. A negative form, \"Do not do to others what you would not like done to yourselves,\" appears in the writings of the Jewish scholars Hillel and Philo of Alexandria and in the Analects of Confucius, written centuries earlier. Forms of it also appear in Plato, Aristotle, and Seneca.",
        "Some people treat any overlap between faiths as a threat, and others take it as proof that all religions teach the same thing. Neither follows. Traditions differ in real ways, and their followers deserve to be described accurately. But when separate traditions, across many centuries, arrive at a rule this similar, it is worth noticing: many people have found that fairness starts with imagining yourself in another person's place."
      ],
      qs: [
        { id: 'hr53-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["The Golden Rule began with the Gospel of Matthew","A similar rule appears in many traditions","Religions share one basic teaching"], fix: "The author shows the rule across many traditions without erasing their differences.", line: 2, proof: "It is not, however, unique to Christianity." },
        { id: 'hr53-q2', type: 'inference', q: "What is the \"negative form\" of the rule?", c: ["A version that forbids helping strangers","A version stated as what not to do","A version later writers rejected"], fix: "It tells you what not to do to others.", line: 2, proof: "Do not do to others what you would not like done to yourselves" },
        { id: 'hr53-q3', type: 'purpose', q: "Why does the author list Hillel, Confucius, and Plato?", c: ["To rank the traditions by age","To show how widely the rule appears","To argue Christianity borrowed the rule"], fix: "The list shows the rule in many places.", line: 2, proof: "Forms of it also appear in Plato, Aristotle, and Seneca." },
        { id: 'hr53-q4', type: 'assumption', q: "Saying followers \"deserve to be described accurately\" assumes that...", c: ["A shared rule makes traditions alike","Real differences between faiths matter","Readers often misjudge Confucius"], fix: "Accuracy matters because the traditions really differ.", line: 3, proof: "Traditions differ in real ways" },
        { id: 'hr53-q5', type: 'weaken', q: "Which would most weaken the author's final point?", c: ["Matthew states the rule in a positive form","Each text had copied a single source","Seneca wrote long after Confucius"], fix: "The point rests on separate traditions reaching the rule on their own.", line: 3, proof: "when separate traditions, across many centuries, arrive at a rule this similar" },
        { id: 'hr53-q6', type: 'tone', q: "The author's view of the two positions in paragraph 3 is...", c: ["Partly agreeing with each","Rejecting both","Favoring the second"], fix: "The author says neither conclusion follows.", line: 3, proof: "Neither follows." }
      ] },
    { id: 'hr54', ages: 'both', rating: 'adult', topic: 'culture', title: "A Banned Feast", cite: "The Canadian Encyclopedia, Potlatch Ban; Britannica, Potlatch", sourceIds: ["tce-potlatch","brit-potlatch"],
      passage: [
        "The potlatch is a ceremony of Indigenous Peoples of the Northwest Coast, held to mark marriages, births, deaths, and other important events. It includes feasting, dancing, singing, and the giving of gifts, and the guests serve as witnesses. Chief Bill Cranmer of the Kwakwaka'wakw explained that this was how his people kept their history alive, \"as we had no written language at the time.\"",
        "From 1885 to 1951 the federal government of Canada banned it. Officials saw it as a barrier to assimilation, and its redistribution of wealth clashed with settler values. After Chief Dan Cranmer hosted a large potlatch in 1921, Indian agents and police arrested 45 people, and roughly half were jailed for two to three months. The community was made to hand over masks, costumes, and other ceremonial objects, an estimated 600 in all, and many ended up in museums.",
        "The ban rested on the claim that one people's ways were a problem to be removed, and today it is recognized as an aspect of cultural genocide. Yet many communities kept the potlatch in secret, the ban ended in 1951, and beginning in the 1970s Kwakwaka'wakw people worked to bring the confiscated items home. Many have been returned. A tradition that harms no one does not need outsiders' approval to deserve respect."
      ],
      qs: [
        { id: 'hr54-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["How the potlatch ranked families by their wealth","A banned tradition that survived and is being restored","Why museums kept the ceremonial objects"], fix: "The passage traces the ban, the secret survival, and the return of items.", line: 3, proof: "Yet many communities kept the potlatch in secret" },

    { id: 'lg01', ages: 'both', topic: 'driving', cite: 'People v. Spriggs (2014) 224 Cal.App.4th 150; Cal. Veh. Code 23123.5', s: 'Steven Spriggs, stuck in Fresno County traffic, held his phone to check a map. The court threw out his ticket. Could he do that today?',

    { id: 'lg03', ages: 'both', topic: 'driving', cite: 'Cal. Veh. Code 23123.5(c); People v. Porter (2025)', s: 'After Porter lost his appeal over a handheld map, a friend asks how to use a phone map legally while driving in California. What works?',

    { id: 'lg04', ages: 'both', topic: 'driving', cite: 'People v. Jimenez (2024); Cal. Veh. Code 20002', s: 'Esteban Jimenez fled police, ran onto a sidewalk and hit a cinder block wall, then ran. No one else was hurt. Was that still hit-and-run?',

    { id: 'lg06', ages: 'both', topic: 'fault', cite: 'Li v. Yellow Cab Co. (1975) 13 Cal.3d 804', s: 'Nga Li turned left across traffic and was hit by a speeding Yellow Cab. She was partly at fault too. What did the California Supreme Court decide?',
      c: ['Her own fault bars recovery', 'Damages split by share of fault', 'The cab pays the full bill'],
      m: 'If you were partly at fault, you get nothing.', f: 'Even if you made a mistake, you can still recover. Your award is cut by your share of the fault.', w: 'Li replaced the all-or-nothing contributory negligence rule with pure comparative negligence.', src: 'li-yellowcab' },
    { id: 'lg07', ages: 'both', topic: 'fault', cite: 'Li v. Yellow Cab Co. (1975)', s: 'After a crash, the other driver\'s insurer says, "You were 20% at fault, so under California law you get zero." What does Li v. Yellow Cab say?',

    { id: 'lg08', ages: 'both', topic: 'fault', cite: 'Van Horn v. Watson (2008) 45 Cal.4th 322', s: 'Lisa Torti pulled her friend Alexandra Van Horn from a crashed car. Van Horn said the move left her paralyzed and sued. What did the court rule in 2008?',

      m: 'Anyone who helps at a crash is always protected.', f: 'Call 911 first. Move a person only if there is real danger, like fire or traffic.', w: 'The Supreme Court held the old section 1799.102 covered only emergency medical care, so Torti could not claim it.', src: 'vanhorn' },
    { id: 'lg09', ages: 'both', topic: 'fault', cite: 'Van Horn v. Watson (2008); Cal. Health and Safety Code 1799.102', s: 'After the Van Horn ruling against rescuer Lisa Torti, what did the Legislature change in the Good Samaritan law?',
