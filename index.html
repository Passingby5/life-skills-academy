        { id: 'hr13-q5', type: 'weaken', q: 'Which would most weaken the author\'s final argument?', c: ["Other estimates of the dead are much higher than the official one", "The state opened its 1989 archives to outside historians", "Martial law was declared in late May"], fix: 'Opening the record to scrutiny would cut against the claim that the state fears it.', line: 3, proof: 'A government that is confident in its account invites people to examine it.' },

    { id: 'hr14', ages: 'both', rating: 'adult', topic: 'communism', title: 'Ten Million Members', cite: 'Britannica, Solidarity', sourceIds: ['brit-solidarity'],
      passage: [
        'Solidarity began in 1980 as the first independent labor union in a Soviet-bloc country. Its roots went back to 1976, when dissident intellectuals formed a Workers\' Defense Committee after striking workers were attacked and jailed; the committee gave legal and medical aid and spread news through an underground network. In 1980, some 17,000 workers at the Lenin Shipyards in Gdansk struck under Lech Walesa, an electrician. By early 1981 Solidarity had about 10 million members.',
        'The government, under heavy pressure from the Soviet Union, imposed martial law in December 1981. Solidarity was declared illegal and its leaders were arrested. The union was formally dissolved in 1982, but it kept working underground.',
        'In 1988 new strikes demanded that Solidarity be recognized. In April 1989 the government agreed to legalize it and let it run in free elections, and in June its candidates won 99 of 100 Senate seats. Martial law could ban the name and jail the leaders, but it could not make ten million people forget what they had built together. The movement survived because its strength was spread out, not held in one office that could be closed.'
      ],
      qs: [
        { id: 'hr14-q1', type: 'mainIdea', q: 'Which best states the passage\'s main point?', c: ["Martial law ended Solidarity in 1982", "A rooted movement outlasted a ban", "Walesa's leadership alone kept the union alive"], fix: 'Banned in 1981, Solidarity returned to win elections in 1989.', line: 3, proof: 'The movement survived because its strength was spread out' },
        { id: 'hr14-q2', type: 'purpose', q: 'Why does the author describe the 1976 committee?', c: ["To show the 1980 strikes began among intellectuals", "To show that Solidarity had roots in earlier networks", "To explain why martial law was declared that December night"], fix: 'The committee\'s aid and underground network came before the union.', line: 1, proof: 'Its roots went back to 1976' },
        { id: 'hr14-q3', type: 'inference', q: 'What does "it kept working underground" imply?', c: ["Members met openly in the shipyards despite the ban", "The ban did not end the members' activity", "The leaders ran the union from their jail cells"], fix: 'It went on in secret despite being outlawed.', line: 2, proof: 'The union was formally dissolved in 1982, but it kept working underground.' },
        { id: 'hr14-q4', type: 'assumption', q: 'The final sentence assumes that a movement held "in one office"...', c: ["Tends to win more seats in free elections", "Is easier for a government to find and shut down", "Grows faster under pressure from outside"], fix: 'The author contrasts spread-out strength with a single point of failure.', line: 3, proof: 'not held in one office that could be closed' },
        { id: 'hr14-q5', type: 'strengthen', q: 'Which would most strengthen the author\'s explanation for why Solidarity survived?', c: ["Walesa was released early from detention by the government", "Local cells kept meeting after 1981 while leaders were jailed", "Soviet pressure eased in 1988"], fix: 'Local activity without the leaders shows strength that was spread out.', line: 3, proof: 'its strength was spread out' },
        { id: 'hr14-q6', type: 'tone', q: 'The author\'s view of Solidarity is...', c: ["Guarded and wary", "Admiring", "Even and detached"], fix: 'The author credits what "ten million people" built together.', line: 3, proof: 'it could not make ten million people forget what they had built together' }
      ] },
    { id: 'hr15', ages: 'both', rating: 'adult', topic: 'escape', title: 'The Doctor Who Said He Drove a Taxi', cite: 'Britannica, Haing S. Ngor', sourceIds: ['brit-ngor'],
      passage: [
        'Haing S. Ngor was a doctor in Phnom Penh, an obstetrician and gynecologist, when the Khmer Rouge took the city in 1975. The regime emptied the capital and sent its people to forced-labor camps, and many of the country\'s professional and technical class were killed. Ngor and his wife, Chang My Huoy, were sent to the camps. Because intellectuals were being executed, Ngor said he was a taxi driver, and he kept to that story even under torture.',
        'He had to hide that he was a doctor even when his wife was dying in childbirth; neither she nor the child survived. After Vietnam invaded in 1979, he escaped to Thailand with his niece, worked as a doctor in refugee camps, and moved to the United States the next year. He was a job counselor for refugees in Los Angeles when he was cast in The Killing Fields, with no acting experience, and in 1985 he won the Academy Award for best supporting actor.',
        'Ngor used his fame to help displaced Cambodians and to press for the regime\'s leaders to face justice. In 1996 he was shot to death in a robbery outside his Los Angeles home. A system that made skill a death sentence forced a healer to hide his gift at the moment it mattered most. His later life was an answer to it.'
      ],
      qs: [
        { id: 'hr15-q1', type: 'mainIdea', q: 'What is the passage mainly about?', c: ["How Ngor's acting career began in Los Angeles after the war", "A survivor who hid his skill, then used his voice", "How doctors were spared in the camps"], fix: 'It follows Ngor from hiding his profession to speaking for justice.', line: 3, proof: 'His later life was an answer to it.' },
        { id: 'hr15-q2', type: 'inference', q: 'Why did Ngor claim to be a taxi driver?', c: ["Drivers were sent to easier camps with more food", "Being educated could get him killed", "He had driven a taxi in Phnom Penh as a student"], fix: 'Intellectuals were being executed.', line: 1, proof: 'Because intellectuals were being executed, Ngor said he was a taxi driver' },
        { id: 'hr15-q3', type: 'purpose', q: 'Why does the author include the death of Ngor\'s wife?', c: ["To explain why he chose to leave for Thailand after the invasion", "To show the cost of hiding his skill", "To show the camps lacked trained doctors"], fix: 'It shows the regime forced a healer to hide his gift when it mattered most.', line: 3, proof: 'forced a healer to hide his gift at the moment it mattered most' },
        { id: 'hr15-q4', type: 'assumption', q: 'Calling his later life "an answer" assumes that...', c: ["Fame by itself brings justice for victims", "Speaking out may counter what a regime did", "His film role made up for the past"], fix: 'The author treats his advocacy as a reply to the regime that silenced him.', line: 3, proof: 'Ngor used his fame to help displaced Cambodians and to press for the regime\'s leaders to face justice.' },
        { id: 'hr15-q5', type: 'weaken', q: 'Which would most weaken the claim that the regime targeted the educated?', c: ["Many doctors died in the camps during those four years", "Records show doctors were spared and given rank", "Ngor kept his story even under torture"], fix: 'If doctors were favored, the claim would fail.', line: 1, proof: 'many of the country\'s professional and technical class were killed' },
        { id: 'hr15-q6', type: 'tone', q: 'The author\'s tone is best described as...', c: ["Detached and cool", "Somber and admiring", "Bitter and angry"], fix: 'The author recounts loss and honors Ngor\'s response.', line: 3, proof: 'His later life was an answer to it.' }
      ] },
    { id: 'hr16', ages: 'both', rating: 'adult', topic: 'rwanda', title: "The Radio Said Cockroach", cite: "USHMM, The Rwanda Genocide; United Nations, Rwanda history", sourceIds: ["ushmm-rwanda","un-rwanda"], guard: ["quotesExtremism","rebutted"],
      passage: [
        "In 1994 about 85 percent of Rwandans were Hutu and 14 percent were Tutsi. After a rebel force led by Tutsi exiles invaded in 1990, the United Nations records, all Tutsis inside the country were labeled accomplices of the rebels, and Hutu members of opposition parties were labeled traitors. Media, especially radio, spread unfounded rumours for years before the killing began.",
        "On April 6, 1994, the president's plane was shot down over Kigali. Who fired the missile is still disputed. The next day a station called RTLM blamed the rebels and broadcast incitements to eliminate the \"Tutsi cockroach\". Within hours militias had set up roadblocks to identify Tutsis. Over about 100 days, as many as one million people, mostly Tutsis, were killed, and neighbors were called on by local leaders to kill neighbors.",
        "Calling people insects is a claim that they are not people. It is false on its face: Hutu and Tutsi spoke one language and had married one another for generations. The word did its job anyway, because it turned a political quarrel into pest control. A UN court later convicted a radio station owner and a newspaper publisher of incitement to genocide, the first time since Nuremberg that an international court weighed the media's part in mass atrocity."
      ],
      qs: [
        { id: 'hr16-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["How a plane crash started a civil war over land and power", "A dehumanizing word made killing seem normal", "How rebels used radio to win the war"], fix: "The passage traces years of labeling, the \"cockroach\" broadcast, and why the word worked.", line: 3, proof: "it turned a political quarrel into pest control" },
        { id: 'hr16-q2', type: 'inference', q: "Why does the passage say who fired the missile \"is still disputed\"?", c: ["To show the rebels later admitted firing it", "To show the blame on air came well before proof", "To show the radio station's report was later confirmed"], fix: "RTLM named a culprit the next day, though the facts are unsettled even now.", line: 2, proof: "Who fired the missile is still disputed." },
        { id: 'hr16-q3', type: 'purpose', q: "Why does the author mention that the two groups shared a language and intermarried?", c: ["To explain why RTLM had so many loyal listeners across the country", "To rebut the claim that Tutsis were a lesser kind of people", "To show the two groups had lived at peace for centuries"], fix: "Shared language and marriage show the \"insect\" label is false on its face.", line: 3, proof: "It is false on its face: Hutu and Tutsi spoke one language and had married one another for generations." },
        { id: 'hr16-q4', type: 'assumption', q: "The author's point about \"pest control\" assumes that...", c: ["Radio, in those years, was trusted more than local leaders", "People resist killing people more", "Listeners took the word as a joke"], fix: "The word \"worked\" only if it lowered the bar people feel against killing other humans.", line: 3, proof: "The word did its job anyway" },
        { id: 'hr16-q5', type: 'strengthen', q: "Which fact from the passage best supports the claim that the killing was planned, not a sudden riot?", c: ["Radio had spread unfounded rumours for years before", "Roadblocks to identify Tutsis went up within a few hours", "The president's plane was shot down"], fix: "Checkpoints that fast suggest lists, orders and men ready in advance.", line: 2, proof: "Within hours militias had set up roadblocks to identify Tutsis." },
        { id: 'hr16-q6', type: 'tone', q: "How does the author treat the court case at the end?", c: ["As a step that came far too late to matter much", "As a real step in holding words to account for killing", "As a ruling about the station's owner alone"], fix: "The author stresses the case was a first in decades for weighing the media's role.", line: 3, proof: "the first time since Nuremberg that an international court weighed the media's part in mass atrocity" }
      ] },
    { id: 'hr17', ages: 'both', rating: 'adult', topic: 'rwanda', title: "Two Thousand to Two Hundred Seventy", cite: "United Nations, Rwanda history; USHMM, The Rwanda Genocide", sourceIds: ["un-rwanda","ushmm-rwanda"],
      passage: [
        "In October 1993 the UN Security Council set up a peacekeeping mission for Rwanda, called UNAMIR, to support a peace deal signed at Arusha. The United Nations later wrote that evidence showed extremist leaders, while talking peace, were in fact planning a campaign to exterminate Tutsis and moderate Hutus.",
        "When the killing began in April 1994, the mission was not strengthened. On April 7, ten Belgian peacekeepers guarding the prime minister were killed, and Belgium withdrew the rest of its force. By April 21, after other countries asked to pull their troops, the mission had shrunk from 2,165 to 270. The UN's own history says its capacity to reduce suffering was \"severely constrained by the unwillingness of Member States\" to send more troops.",
        "The lesson is not that outsiders can fix every crisis. It is that warning signs were on the record, and leaving was a choice. Tutsis fled to churches, schools, and government buildings that had been safe in earlier troubles, and many of those refuges became massacre sites. Afterward the UN created a tribunal that indicted 93 people, and Rwanda's community gacaca courts heard more than 1.2 million cases before they closed in 2012."
      ],
      qs: [
        { id: 'hr17-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["Peacekeepers had too few troops to stop the plan", "Outsiders pulled back in 1994 despite warnings", "The Arusha deal held until the plane crash"], fix: "The passage sets the warnings beside the drawdown and calls leaving a choice.", line: 3, proof: "It is that warning signs were on the record, and leaving was a choice." },
        { id: 'hr17-q2', type: 'inference', q: "What does the passage suggest about the peace talks?", c: ["Most leaders wanted the Arusha deal to work out in the end", "Some leaders used the talks as cover for planning", "The talks broke down in late 1993 over troop numbers"], fix: "The UN found extremists were planning killings \"while talking peace.\"", line: 1, proof: "while talking peace, were in fact planning a campaign to exterminate Tutsis and moderate Hutus" },
        { id: 'hr17-q3', type: 'purpose', q: "Why does the author give the numbers 2,165 and 270?", c: ["To show how few troops Belgium sent to Kigali", "To make the scale of the pullback clear and concrete", "To show the mission had grown"], fix: "The drop from thousands to a few hundred shows what \"not strengthened\" meant.", line: 2, proof: "the mission had shrunk from 2,165 to 270" },
        { id: 'hr17-q4', type: 'weaken', q: "Which, if true, would most weaken the author's claim that \"leaving was a choice\"?", c: ["Belgium lost ten of its soldiers that week", "No country had troops that it could send in time", "Other countries asked to pull their troops"], fix: "If no troops could be sent at all, staying or reinforcing would not have been a real option.", line: 3, proof: "leaving was a choice" },
        { id: 'hr17-q5', type: 'assumption', q: "The author's mention of churches and schools assumes the reader will see that...", c: ["Many victims were active members of those church parishes", "Old safe places offered no safety this time around", "Churches were guarded by the UN mission through April"], fix: "People ran where they had been safe before, which makes their fate a measure of how different 1994 was.", line: 3, proof: "had been safe in earlier troubles, and many of those refuges became massacre sites" },
        { id: 'hr17-q6', type: 'tone', q: "The author's tone in the last paragraph is best described as...", c: ["Hopeless", "Sober and pointed", "Detached and neutral"], fix: "The author rules out a naive lesson and states a hard one plainly.", line: 3, proof: "The lesson is not that outsiders can fix every crisis." }
      ] },
    { id: 'hr18', ages: 'both', rating: 'adult', topic: 'armenia', title: "Far From the Front", cite: "USHMM Holocaust Encyclopedia, The Armenian Genocide (1915-16)", sourceIds: ["ushmm-armenian"],
      passage: [
        "About 1.5 million Armenians lived in the Ottoman Empire in 1915. Between the spring of 1915 and the autumn of 1916, at least 664,000 and possibly as many as 1.2 million of them died, in massacres and killings and through systematic ill treatment, exposure, and starvation. The U.S. Holocaust Memorial Museum notes that the government, run by the Committee of Union and Progress, aimed to solidify Muslim Turkish dominance in central and eastern Anatolia.",
        "The stated reason was war. During World War I the government said it feared Armenians near the northeastern border would join invading troops, and in spring 1915 it began deporting them. Then the deportations spread to almost all provinces \"regardless of distance from combat zones.\" Many deportees died on the way to desert regions in the south, and tens of thousands of children were taken from their families and converted.",
        "A security measure aimed at a border should stop at the border. When it reaches families hundreds of miles from any fighting, the stated reason no longer explains the act. The lawyer Raphael Lemkin later coined the word genocide, and he said that reading about these crimes as a young man shaped his belief that groups needed legal protection. That belief became part of the UN Genocide Convention of 1948."
      ],
      qs: [
        { id: 'hr18-q1', type: 'mainIdea', q: "Which best states the main point of the passage?", c: ["Most Armenians died of disease in camps", "A war excuse cannot explain most of the deaths", "Deportations stayed close to the front"], fix: "The passage tests the war rationale against where the deportations actually went.", line: 3, proof: "the stated reason no longer explains the act" },
        { id: 'hr18-q2', type: 'inference', q: "What can be inferred from the quoted phrase \"regardless of distance from combat zones\"?", c: ["The army lacked good maps of the front lines", "The target was the people themselves rather than a risk", "The fighting had spread to most provinces by then"], fix: "If distance from fighting did not matter, the danger at the border was not the real reason.", line: 2, proof: "regardless of distance from combat zones" },
        { id: 'hr18-q3', type: 'purpose', q: "Why does the author end with Lemkin and the 1948 convention?", c: ["To show the word genocide was in use during the war itself", "To show the crime shaped later law against genocide", "To show the UN judged the Ottoman leaders in its 1948 court"], fix: "The ending links the Armenian case to the legal idea of protecting groups.", line: 3, proof: "That belief became part of the UN Genocide Convention of 1948." },
        { id: 'hr18-q4', type: 'assumption', q: "The sentence \"A security measure aimed at a border should stop at the border\" relies on which idea?", c: ["Wartime borders are hard to defend", "A real safety step fits the danger", "Families near a front may help invaders"], fix: "The argument works only if a genuine safety step matches the threat it names.", line: 3, proof: "A security measure aimed at a border should stop at the border." },
        { id: 'hr18-q5', type: 'strengthen', q: "Which detail from the passage most supports the view that the goal went beyond security?", c: ["The empire was at war with invading troops that spring", "Children were taken from their families and converted", "Armenians lived near the northeastern border"], fix: "Taking and converting children has no link to a border threat; it points to erasing the group.", line: 2, proof: "tens of thousands of children were taken from their families and converted" },
        { id: 'hr18-q6', type: 'tone', q: "How would you describe the author's approach?", c: ["Heated and openly accusing", "Measured and logical", "Detached and unsure of itself"], fix: "The author lays out the stated reason and tests it step by step.", line: 3, proof: "When it reaches families hundreds of miles from any fighting" }
      ] },
    { id: 'hr19', ages: 'both', rating: 'adult', topic: 'honor', title: "Not About Honor", cite: "Britannica, Honor killing", sourceIds: ["brit-honor"],
      passage: [
        "Britannica defines an honor killing as, most often, the murder of a woman or girl by male family members who claim she has brought dishonor upon the family. The United Nations Population Fund estimates that as many as 5,000 women are killed this way each year, and such crimes are widely suspected to be underreported. They occur around the world and are not limited to one religion, though nearly half are reported in India and Pakistan.",
        "The \"reasons\" given are often small or false. A woman can be targeted for talking with an unrelated man, for refusing an arranged marriage, or for seeking a divorce, even from an abusive husband. Britannica notes that the mere suspicion may trigger an attack, and that these suspicions rest on men's feelings \"rather than on objective truth.\" Female relatives sometimes defend the killings too.",
        "The law can make it worse. When cases reach court, trials often focus on the woman's alleged behaviour rather than the violence against her, and defendants may ask for lighter sentences in the name of family honor. Article 340 of the Jordanian Penal Code exempts some killers, and a 2011 effort to tighten a related article stalled. A family that kills a daughter to protect its name has not protected anything; it has put control above a life and asked the law to call that respect."
      ],
      qs: [
        { id: 'hr19-q1', type: 'mainIdea', q: "What is the passage mainly arguing?", c: ["Such killings, at root, come from one faith", "Such killings are about control", "Such killings are mostly punished harshly"], fix: "The passage covers the thin \"reasons,\" the soft courts, and calls it control over a life.", line: 3, proof: "it has put control above a life" },
        { id: 'hr19-q2', type: 'inference', q: "Why does the author stress that suspicion alone \"may trigger an attack\"?", c: ["To show families usually had strong proof of what she did", "To show that what she really did often counts for very little", "To show police act on rumors"], fix: "If suspicion is enough, the woman's real choices are beside the point.", line: 2, proof: "the mere suspicion may trigger an attack" },
        { id: 'hr19-q3', type: 'purpose', q: "Why does the author mention Article 340?", c: ["To show Jordan has the highest rate of such crimes", "To give an example of law that softens it", "To show the 2011 change passed"], fix: "An exemption from punishment is a concrete case of the law \"making it worse.\"", line: 3, proof: "Article 340 of the Jordanian Penal Code exempts some killers" },
        { id: 'hr19-q4', type: 'assumption', q: "The claim that the crimes are \"underreported\" suggests the 5,000 figure is likely...", c: ["Too high, since it counts other crimes", "Lower than the real number", "About right, since it is a UN estimate"], fix: "If many cases go unreported, the true toll is probably higher than the estimate.", line: 1, proof: "such crimes are widely suspected to be underreported" },
        { id: 'hr19-q5', type: 'weaken', q: "Which would most weaken the claim that \"the law can make it worse\"?", c: ["Many trials dwell on the woman's alleged conduct", "Courts there gave such killers the full sentence under law", "Female relatives sometimes defend the killers"], fix: "If courts punished these killings fully, the law would not be softening them.", line: 3, proof: "The law can make it worse." },
        { id: 'hr19-q6', type: 'tone', q: "The final sentence is best described as...", c: ["A plea for mercy for the families", "A firm moral rebuttal", "A neutral summary of law"], fix: "The author answers the \"honor\" claim directly and rejects it.", line: 3, proof: "A family that kills a daughter to protect its name has not protected anything" }
      ] },
    { id: 'hr20', ages: 'both', rating: 'adult', topic: 'abuse', title: "Why Didn't She Just Leave?", cite: "Britannica, Domestic violence", sourceIds: ["brit-domviol"],
      passage: [
        "People who have never lived with abuse often ask why a victim stays. Britannica describes domestic violence as abuse between intimate partners that can be physical, emotional, sexual, or financial. Abusers come from every income, culture, and level of schooling. Estimates of the number of American women abused by a male partner each year range from two to four million, and men are abused too, though they report it less.",
        "The question assumes leaving is simple. It is not. Many victims depend on the abuser for money, and many are parents who fear they cannot support their children alone. Years of abuse can wear down self-esteem until a person believes they deserve it. Worst of all, Britannica notes that abusers often \"become most violent and vengeful precisely when women try to leave.\"",
        "Help used to be thin. In the early 1800s most legal systems treated \"wife-beating\" as a husband's right, and a 1967 police training manual called arrest a \"last resort.\" Shelters, advocacy groups, and the Violence Against Women Act of 1994 changed that. So a better question than why she did not leave is what makes leaving safe, and the answer includes money, a place to go, and a plan made with people who know the danger."
      ],
      qs: [
        { id: 'hr20-q1', type: 'mainIdea', q: "Which best states the passage's main point?", c: ["Most victims stay out of love for the abuser", "Leaving is risky and needs support", "Victims stay mainly for the children"], fix: "The passage lists the barriers and the danger, then reframes the question around safety.", line: 3, proof: "a better question than why she did not leave is what makes leaving safe" },
        { id: 'hr20-q2', type: 'assumption', q: "According to the author, the question \"why doesn't she leave\" wrongly assumes...", c: ["That most victims of abuse are women and not men, as it seems", "That walking away is simple and also safe for the victim", "That victims can count on the police"], fix: "The author answers that leaving is neither simple nor, at first, safe.", line: 2, proof: "The question assumes leaving is simple. It is not." },
        { id: 'hr20-q3', type: 'inference', q: "What does the quote about abusers being most violent \"when women try to leave\" suggest?", c: ["That abuse fades once the couple splits up for good", "That leaving should be planned with help from others", "That victims should stay until it calms"], fix: "If danger peaks at leaving, a safe exit needs planning and support.", line: 2, proof: "become most violent and vengeful precisely when women try to leave" },
        { id: 'hr20-q4', type: 'purpose', q: "Why does the author mention the 1967 police manual?", c: ["To show when arrest first became the rule", "To show how little help victims had back then", "To show police training improved by 1967"], fix: "Calling arrest a \"last resort\" shows how thin help used to be.", line: 3, proof: "a 1967 police training manual called arrest a \"last resort.\"" },
        { id: 'hr20-q5', type: 'weaken', q: "Which would most weaken the claim that money keeps many victims in place?", c: ["Many victims are parents who fear raising their children alone", "Most victims had a steady income of their own to live on", "Many victims lose self-esteem over long years of abuse"], fix: "If most victims could support themselves, money would not be a main barrier.", line: 2, proof: "Many victims depend on the abuser for money" },
        { id: 'hr20-q6', type: 'tone', q: "How does the author treat people who ask \"why didn't she leave\"?", c: ["Sharply, as if the question were cruel", "Patiently, by offering them a better question", "Neutrally, without an answer"], fix: "The author does not mock the question but replaces it with a more useful one.", line: 3, proof: "So a better question" }
      ] },
    { id: 'hr21', ages: 'both', rating: 'adult', topic: 'economics', title: "The Record of Markets", cite: "Britannica Money, Capitalism", sourceIds: ["brit-capitalism"],
      passage: [
        "Britannica defines capitalism as a system in which most means of production are privately owned, and production and income are guided largely by markets. Its long rise drew on reinvesting savings to grow production rather than spending them on monuments. In 1776 Adam Smith argued for leaving economic choices to self-regulating markets, and in the century that followed industry grew enormously.",
        "The record has two sides. The same factories created a vast class of workers whose miserable conditions inspired Karl Marx, though his forecast of capitalism's inevitable overthrow \"proved shortsighted.\" The Great Depression of the 1930s ended pure hands-off policy in most countries. After World War II, capitalist countries that had built welfare states performed well. From the 1970s, fast-rising inequality revived doubts, and after the 2007-09 financial crisis polls found a slight majority of millennials viewed socialism favorably.",
        "Britannica adds a detail that is easy to miss: the policies those young people actually favored differed little from the regulatory and social-welfare programs of the 1930s New Deal. In other words, much of the modern debate is not markets against no markets. It is about how far markets should be checked and how much of their gain should be shared."
      ],
      qs: [
        { id: 'hr21-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["Markets failed until the New Deal", "Markets bring gains and costs", "Welfare states beat markets after the war"], fix: "The passage weighs growth against hardship and ends on how far to check markets.", line: 3, proof: "It is about how far markets should be checked and how much of their gain should be shared." },

    { id: 'hr22', ages: 'both', rating: 'adult', topic: 'economics', title: "New Harmony", cite: "Britannica, Socialism", sourceIds: ["brit-socialism"],
      passage: [
        "Early socialists hoped to prove their ideas in small working models. Robert Owen, himself a factory owner, ran textile mills in New Lanark that were highly profitable and, for their day, remarkably humane: no children under age 10 were employed. Owen believed human nature is formed, not fixed. Change the conditions, he argued, and people will change.",
        "In 1825 he set out to build New Harmony, a cooperative community in Indiana where property was owned in common. It failed within a few years and took most of his fortune with it. In the 1850s the French socialist Etienne Cabet founded an Icarian community in Illinois, and dissension among its members led him to leave in 1856. Owen did not quit, though. He turned to trade unions and cooperative businesses, which lasted far longer than his village.",
        "Both sides can learn from this record. Owen's mills showed that decent treatment and profit can go together, a point friendly to reformers. His village showed that shared ownership on a small scale ran into quarrels and money trouble, a point friendly to critics. Socialists themselves have long split between those who want a central state in control, as in the Soviet Union, and those who want decisions made locally by the people affected."
      ],
      qs: [
        { id: 'hr22-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["Why Owen's village outlasted his mills", "What early experiments achieved", "How Cabet's ideas spread"], fix: "The passage weighs the mills' success against the village's failure.", line: 3, proof: "Both sides can learn from this record." },
        { id: 'hr22-q2', type: 'inference', q: "What does the passage suggest about Owen's later work?", c: ["It ended with the failure of New Harmony", "It lasted longer than New Harmony did by far", "It moved back to New Lanark's mills"], fix: "Unions and cooperatives \"lasted far longer than his village.\"", line: 2, proof: "which lasted far longer than his village" },
        { id: 'hr22-q3', type: 'purpose', q: "Why does the author mention Cabet's community in Illinois?", c: ["To show Cabet's group outlasted Owen's by decades", "To give a second small commune that also struggled", "To show socialism began in France"], fix: "Cabet's split community backs up the pattern seen at New Harmony.", line: 2, proof: "dissension among its members led him to leave in 1856" },
        { id: 'hr22-q4', type: 'assumption', q: "Owen's plan to \"change the conditions\" rests on which belief?", c: ["Firm rules, more than kindness, keep workers honest", "Surroundings shape how people act", "Common property ends quarrels"], fix: "If nature is \"formed, not fixed,\" better conditions should make better people.", line: 1, proof: "Owen believed human nature is formed, not fixed." },
        { id: 'hr22-q5', type: 'weaken', q: "Which, if true, would most weaken the point that humane mills can still profit?", c: ["New Harmony closed within a few years of opening in Indiana", "The mills lost money once children under 10 were barred from work", "Owen lost most of his fortune in the Indiana venture in America"], fix: "If the mills lost money after barring child labor, decency and profit would not have gone together.", line: 3, proof: "decent treatment and profit can go together" },
        { id: 'hr22-q6', type: 'tone', q: "The author's view of Owen is best described as...", c: ["Skeptical of his motives", "Fair: credit plus failure", "Fond and forgiving"], fix: "The author credits the mills and his persistence but states the village failed.", line: 2, proof: "It failed within a few years and took most of his fortune with it." }
      ] },
    { id: 'hr23', ages: 'both', rating: 'adult', topic: 'philosophy', title: "The Examined Life", cite: "Britannica, Socrates", sourceIds: ["brit-socrates"],
      passage: [
        "Socrates wrote nothing. What we know of him comes mostly from two admirers, Plato and Xenophon, who wrote him into conversations with friends, strangers, and leading figures of Athens. Most scholars do not think every one of those dialogues reports his words exactly. Readers have to weigh the sources, which is itself a lesson he might have liked.",
        "In his own city he was famous and controversial. The comic playwright Aristophanes mocked him in Clouds, produced in 423 BCE, but comedy never aims at a balanced portrait, and in Plato's Apology Socrates rejects that play as a fabrication. At age 70 he was tried on a charge of impiety and sentenced to death, probably by hemlock, by a jury of his fellow citizens.",
        "Plato's Apology, the speech Socrates is said to have given at his trial, became one of the central documents of Western thought for its defense of the examined life. Its argument is simple to state and hard to live: a belief is worth holding only if it can survive honest questions. That idea cuts against anyone, a party, a leader, or a group, who asks for trust while forbidding questions. It also cuts against our own habits of agreeing with whatever is said loudest."
      ],
      qs: [
        { id: 'hr23-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["Aristophanes gave the fairest account of him", "He left a case for testing beliefs", "Plato recorded his words exactly as spoken"], fix: "The passage ends on the examined life and why it still matters.", line: 3, proof: "a belief is worth holding only if it can survive honest questions" },
        { id: 'hr23-q2', type: 'inference', q: "Why might Socrates have \"liked\" that readers must weigh the sources?", c: ["Because he trusted Xenophon's account more than Plato's", "Because weighing evidence is itself a kind of questioning", "Because he disliked written records"], fix: "Testing what Plato and Xenophon say is the kind of examining he urged.", line: 1, proof: "Readers have to weigh the sources, which is itself a lesson he might have liked." },
        { id: 'hr23-q3', type: 'purpose', q: "Why does the author note that \"comedy never aims at a balanced portrait\"?", c: ["To present Clouds as a fair record of his views", "To warn against treating a satire as fact", "To show the play led to his trial"], fix: "A comic play is a weak source for what the man really believed.", line: 2, proof: "comedy never aims at a balanced portrait" },
        { id: 'hr23-q4', type: 'assumption', q: "The claim that the idea \"cuts against\" leaders who forbid questions assumes...", c: ["Leaders who allow questions tend to be right", "Unquestionable claims earn little trust", "Juries should judge beliefs"], fix: "The point works if trust must be earned by surviving questions.", line: 3, proof: "who asks for trust while forbidding questions" },
        { id: 'hr23-q5', type: 'weaken', q: "Which would most weaken the passage's portrait of Socrates?", c: ["Plato and Xenophon agreed on most of his views and habits", "New evidence showed both admirers simply invented him", "The jury's vote at the trial was close"], fix: "If the main sources made him up, the portrait would collapse.", line: 1, proof: "What we know of him comes mostly from two admirers, Plato and Xenophon" },
        { id: 'hr23-q6', type: 'tone', q: "The tone of the last paragraph is best described as...", c: ["Stern toward Athens", "Thoughtful and self-critical", "Respectful of the jury"], fix: "The author applies the lesson to readers too, not only to others.", line: 3, proof: "It also cuts against our own habits" }
      ] },
    { id: 'hr24', ages: 'both', rating: 'adult', topic: 'manipulation', title: "Mirror, Mirror", cite: "Britannica, Narcissism", sourceIds: ["brit-narcissism"],
      passage: [
        "The word comes from Narcissus, the figure in myth who fell in love with his own reflection. Britannica describes narcissism as an inflated self-image, a coolness shaken only when that confidence is threatened, and a tendency to take others for granted or exploit them. Narcissistic personality disorder is diagnosed by clinicians, and many more people have milder narcissistic traits within the normal range.",
        "What matters for spotting manipulation is the need underneath. Britannica says narcissists are overly concerned with getting praise and react with extreme emotion when they get it or fail to get it. They \"actively manipulate others to solicit or coerce admiration.\" In one well-known theory, from the psychoanalyst Otto Kernberg, such people are grandiose on the outside but vulnerable and doubting inside.",
        "Read that way, the flattery and the anger are two halves of one pattern. Someone who needs your admiration will reward you while you give it and punish you when you stop. The warning sign is not one rude moment; everyone has those. It is a steady pattern where your worth in a relationship rises and falls with how well you reflect the other person. A label from the internet is not a diagnosis, but a pattern is something you can see and name."
      ],
      qs: [
        { id: 'hr24-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["How to spot the disorder from articles online", "A need for admiration drives control", "Why mild traits do no harm"], fix: "The passage explains the need, then the pattern of reward and punishment it drives.", line: 3, proof: "the flattery and the anger are two halves of one pattern" },
        { id: 'hr24-q2', type: 'purpose', q: "Why does the author say \"everyone has those\" about rude moments?", c: ["To show rude moments are an early warning sign of the disorder", "To keep readers from labeling people over one incident", "To excuse a partner's anger"], fix: "The sign is a steady pattern, not a single bad day.", line: 3, proof: "The warning sign is not one rude moment; everyone has those." },
        { id: 'hr24-q3', type: 'inference', q: "Based on the passage, what is likely to happen when someone stops praising a person with these traits?", c: ["The person loses interest and moves on", "The person reacts to it with anger or punishment", "The person seeks more admiration from you"], fix: "The passage says such a person will \"punish you when you stop.\"", line: 3, proof: "reward you while you give it and punish you when you stop" },
        { id: 'hr24-q4', type: 'assumption', q: "The last sentence assumes that...", c: ["Online labels are usually accurate", "A pattern of behavior is enough to act on", "A clinician should be consulted"], fix: "Seeing and naming a pattern is useful even when you cannot diagnose anyone.", line: 3, proof: "A label from the internet is not a diagnosis, but a pattern is something you can see and name." },
        { id: 'hr24-q5', type: 'strengthen', q: "Which detail from the passage best supports Kernberg's view of a fragile inner self?", c: ["The disorder is named after a figure in an old Greek myth", "Their calm cracks when their confidence is threatened by others", "Milder traits fall within the normal range for most people"], fix: "Composure that breaks under threat fits a self that is vulnerable underneath.", line: 1, proof: "a coolness shaken only when that confidence is threatened" },
        { id: 'hr24-q6', type: 'tone', q: "The author's tone is best described as...", c: ["Alarmed", "Careful and practical", "Clinical and fully detached"], fix: "The author warns against loose labels and gives a usable sign instead.", line: 3, proof: "A label from the internet is not a diagnosis" }
      ] },
    { id: 'hr25', ages: 'both', rating: 'adult', topic: 'armenia', title: "A Novel Passed Hand to Hand", cite: "USHMM Holocaust Encyclopedia, The Armenian Genocide (1915-16)", sourceIds: ["ushmm-armenian"],
      passage: [
        "News of the Armenian deportations reached the United States, and the response was unlike anything before it. The U.S. ambassador in Constantinople, Henry Morgenthau Sr., was deeply troubled by what he learned and tried to rouse the world's conscience. President Woodrow Wilson, Hollywood celebrities, and many thousands of ordinary Americans joined in, raising over $110 million for Armenian refugees and orphans.",
        "The memory lasted into the next war. The ambassador's son, Henry Morgenthau Jr., became secretary of the treasury under Franklin D. Roosevelt. Partly because of what his father had seen, he pressed for the War Refugee Board, which rescued as many as 200,000 Jews from Nazi Europe. And in the ghettos, Jews secretly passed from hand to hand a novel about Armenian self-defense, Franz Werfel's The Forty Days of Musa Dagh, reading it as a call to resistance.",
        "Genocide depends on silence and on the idea that no one far away will care. This record answers both. Witnesses spoke, strangers gave, and one family carried the lesson from one atrocity to the next. Those acts did not stop the killing in 1915, and the passage should not pretend they did. They do show that knowing, telling, and helping are choices that can matter decades later."
      ],
      qs: [
        { id: 'hr25-q1', type: 'mainIdea', q: "Which best states the main point of the passage?", c: ["American aid stopped the genocide", "Witness and aid still mattered, even late", "The novel sparked ghetto uprisings"], fix: "The author credits the response while admitting it did not stop the killing.", line: 3, proof: "knowing, telling, and helping are choices that can matter decades later" },
        { id: 'hr25-q2', type: 'purpose', q: "Why does the author include Morgenthau Jr. and the War Refugee Board?", c: ["To show the Board was his father's idea from 1915", "To show how a lesson carried from one genocide to the next", "To show Roosevelt doubted the Board"], fix: "The son acted partly because of what his father saw, linking two eras.", line: 2, proof: "Partly because of what his father had seen, he pressed for the War Refugee Board" },
        { id: 'hr25-q3', type: 'inference', q: "What can be inferred about why ghetto readers valued the novel?", c: ["It gave them escape routes to follow out of the ghetto", "It showed people like them choosing to resist", "It was banned, so it felt daring"], fix: "They read a story of Armenian self-defense \"as a call to resistance.\"", line: 2, proof: "reading it as a call to resistance" },
        { id: 'hr25-q4', type: 'assumption', q: "The claim that genocide \"depends on silence\" assumes that...", c: ["Reports alone end violence quickly", "Killers gain when the world looks away", "Witnesses rarely speak up while it happens"], fix: "Silence helps only if perpetrators gain from the world looking away.", line: 3, proof: "Genocide depends on silence and on the idea that no one far away will care." },
        { id: 'hr25-q5', type: 'weaken', q: "Which would most weaken the author's claim that strangers cared?", c: ["Wilson himself joined the relief effort in public", "Records showed the relief money was a myth", "Morgenthau was troubled by the news"], fix: "If the money was never raised, the case for broad public concern falls.", line: 1, proof: "raising over $110 million for Armenian refugees and orphans" },
        { id: 'hr25-q6', type: 'tone', q: "How would you describe the author's tone in the last paragraph?", c: ["Proud and certain", "Hopeful but honest", "Grim and resigned"], fix: "The author finds meaning in the response yet refuses to overstate it.", line: 3, proof: "and the passage should not pretend they did" }
      ] },
    { id: 'hr26', ages: 'both', rating: 'adult', topic: 'cults', title: "She Said She Had Erred", cite: "Britannica, Branch Davidian", sourceIds: ["brit-davidian"],
      passage: [
        "Victor Houteff, a Seventh-day Adventist layman, called for reform of his church in tracts he named \"Shepherd's Rod.\" Rebuffed by church leaders, he and his followers settled near Waco, Texas, in 1935. They lived simply, worked hard, and became self-sustaining while they prepared for what they believed was the soon return of Jesus.",
        "After Houteff died in 1955, his wife, Florence, led the group. She set a date, April 22, 1959, for the dawn of a new age, and from March of that year hundreds of believers gathered at the Texas center. The date passed. The prediction's failure split the movement into factions. Then, in 1962, Florence did something rare for the leader of such a group: she announced that she had erred, disbanded her following, and sold the property.",
        "A failed prophecy is a test of a leader, not only of a belief. One response is to admit the mistake and let people go home. Another is to explain the failure away, demand more loyalty, and pull the group further from outsiders. Britannica's account shows that the group's later history under other leaders took the second path and ended in disaster at the same site in 1993. Florence Houteff's choice is a reminder that stepping back is possible, and that a leader who can admit being wrong is safer to follow than one who never can."
      ],
      qs: [
        { id: 'hr26-q1', type: 'mainIdea', q: "Which best states the main idea of the passage?", c: ["Houteff's tracts led straight to the later disaster at Waco", "A leader's response to failure matters", "The 1959 date split the Adventist church in two"], fix: "The passage contrasts admitting error with explaining it away.", line: 3, proof: "A failed prophecy is a test of a leader, not only of a belief." },
        { id: 'hr26-q2', type: 'inference', q: "Why does the author call Florence Houteff's choice \"rare\"?", c: ["Few leaders give up the land their group lives on", "Leaders of such groups seldom admit that a prediction failed", "Few such groups were led by women"], fix: "The author treats admitting error as unusual for a leader whose authority rests on being right.", line: 2, proof: "she announced that she had erred, disbanded her following, and sold the property" },
        { id: 'hr26-q3', type: 'purpose', q: "Why does the author mention the events of 1993?", c: ["To show the group grew after 1962", "To contrast her path with the harder one", "To show the later leaders kept her rules"], fix: "The later history shows where the other response can lead.", line: 3, proof: "took the second path and ended in disaster at the same site in 1993" },
        { id: 'hr26-q4', type: 'assumption', q: "The last sentence assumes that...", c: ["Admitting error weakens a group's hold", "Handling mistakes is what reveals a leader", "Set dates draw in new members"], fix: "Calling the leader who admits error \"safer\" assumes that trait tells followers something real.", line: 3, proof: "a leader who can admit being wrong is safer to follow than one who never can" },
        { id: 'hr26-q5', type: 'weaken', q: "Which, if true, would most weaken the author's praise of Florence Houteff?", c: ["Hundreds of believers gathered at the center for the date", "She had quietly told members to cut off their families", "The group split into factions after the date passed"], fix: "Cutting members off from family would be the controlling path, not the safe one.", line: 3, proof: "One response is to admit the mistake and let people go home." },
        { id: 'hr26-q6', type: 'tone', q: "How does the author treat the group's faith?", c: ["With doubt about the faith itself and its teachings", "With respect, while judging the leaders' choices", "With approval of the 1959 prophecy"], fix: "The author describes their beliefs plainly and judges only how leaders handled failure.", line: 1, proof: "They lived simply, worked hard, and became self-sustaining" }
      ] },
    { id: 'hr27', ages: 'both', rating: 'adult', topic: 'cults', title: "When the Spaceship Did Not Come", cite: "Britannica, Heaven's Gate", sourceIds: ["brit-heavensgate"],
      passage: [
        "Heaven's Gate began in the 1970s, one of many new religious movements that grew after the 1960s counterculture. Its founders, Marshall Applewhite and Bonnie Nettles, taught that they could channel beings from space and that humans would soon pass to a \"Next Level\" aboard a spacecraft. At its 1975 peak the group had about 200 followers, who dropped out of society to prepare.",
        "By the end of 1975 the founders had prophesied that they would be martyred and raised again, an event they called the Demonstration. It did not happen. Instead of loosening, the group turned inward. Its core moved to Texas, in 1976 Nettles announced that it would take no new members, and life was organized like a classroom but run \"more like a boot camp.\" In March 1997, 39 members died in a mass suicide near San Diego, California.",
        "Britannica notes that scholars avoid the word cult because it carries \"pejorative connotations\" and prefer \"new religious movement.\" That care is useful: the label does not explain anything. What explains more is the pattern. A group cut off from outsiders, told its leaders hear from beyond, and asked to answer every failed prediction with more discipline has lost the checks that might have saved it. Watching for that pattern works whatever name a group goes by."
      ],
      qs: [
        { id: 'hr27-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["Why scholars prefer the term new religious movement", "Failure plus isolation removed its checks", "How the founders channeled beings from space"], fix: "The passage traces a failed prophecy, the turn inward, and the lost checks.", line: 3, proof: "has lost the checks that might have saved it" },
        { id: 'hr27-q2', type: 'inference', q: "What does the phrase \"Instead of loosening\" suggest?", c: ["That the founders expected members to leave", "That a failed prophecy could have led people to step back", "That the group grew more open to visitors from Texas"], fix: "The author implies the natural response to failure would have been to loosen up, not tighten.", line: 2, proof: "Instead of loosening, the group turned inward." },
        { id: 'hr27-q3', type: 'purpose', q: "Why does the author bring up the scholars' word choice?", c: ["To show scholars defended the group in public", "To shift attention away from labels to patterns", "To show the group was not religious"], fix: "The author says the label explains nothing; the pattern explains more.", line: 3, proof: "the label does not explain anything" },
        { id: 'hr27-q4', type: 'assumption', q: "The claim that the group \"lost the checks\" assumes that...", c: ["Strict schedules, over time, lead to disaster", "Outsiders may challenge bad ideas", "Leaders hear from beyond"], fix: "Closing to new members and outsiders only matters if they could have pushed back.", line: 3, proof: "A group cut off from outsiders" },
        { id: 'hr27-q5', type: 'strengthen', q: "Which detail from the passage best supports the claim that the group grew more closed?", c: ["It grew after the 1960s counterculture", "In 1976 it stopped taking new members", "It had about 200 followers at its peak"], fix: "Refusing new members is a clear step toward isolation.", line: 2, proof: "in 1976 Nettles announced that it would take no new members" },
        { id: 'hr27-q6', type: 'tone', q: "The author's tone is best described as...", c: ["Grieving", "Sober and analytical", "Cold and dismissive"], fix: "The author avoids ridicule and focuses on a pattern readers can use.", line: 3, proof: "What explains more is the pattern." }
      ] },
    { id: 'hr28', ages: 'both', rating: 'adult', topic: 'manipulation', title: "Gaslight", cite: "Britannica, Gaslighting", sourceIds: ["brit-gaslight"],
      passage: [
        "The word comes from a 1938 British stage play, Gas Light, later made into films in 1940 and 1944. In the story a deceitful husband works to drive his wife to near insanity. Britannica defines gaslighting as deception and psychological manipulation, usually by one person on one victim over a long time, that slowly undermines the victim's confidence in telling truth from falsehood.",
        "The methods Britannica lists are ordinary on their own. The gaslighter flatly denies saying things he obviously said. He insists, again and again, on something bizarre. He dismisses the victim's feelings as invalid. He questions the motives of anyone who disagrees with him, and he gradually isolates the victim from \"independent sources of information and validation, including other people.\" Over time the victim becomes dependent on the gaslighter for a sense of what is real.",
        "Because each step can be explained away, the defense is not to win every argument. It is to keep outside anchors: a friend you talk to honestly, notes or messages written at the time, and your own record of what happened. A person who tells you to trust no one but them is asking you to give up exactly those anchors. That request, more than any single lie, is the sign to notice."
      ],
      qs: [
        { id: 'hr28-q1', type: 'mainIdea', q: "What is the passage mainly about?", c: ["How the play Gas Light shaped the later films", "How gaslighting works and how one can resist it", "Why victims doubt their friends"], fix: "It describes the methods, then the defense of keeping outside anchors.", line: 3, proof: "It is to keep outside anchors" },
        { id: 'hr28-q2', type: 'inference', q: "Why does the author say the methods are \"ordinary on their own\"?", c: ["They are signs of a mental illness", "Each alone could pass as a normal quarrel", "They are used by strangers"], fix: "Any single denial or dismissal can pass as a normal disagreement, which is why the pattern is hard to see.", line: 2, proof: "The methods Britannica lists are ordinary on their own." },
        { id: 'hr28-q3', type: 'purpose', q: "Why does the author list notes and messages as anchors?", c: ["To help the victim win each argument with the gaslighter", "To keep a record apart from the gaslighter", "To prepare evidence for a divorce"], fix: "A record made at the time does not shift when the gaslighter denies it.", line: 3, proof: "notes or messages written at the time, and your own record of what happened" },
        { id: 'hr28-q4', type: 'assumption', q: "The advice to keep \"a friend you talk to honestly\" assumes that...", c: ["Friends tend to side with you", "An outside view helps check a distorted one", "Gaslighters avoid people with friends"], fix: "A friend helps only if an outside view can correct what the gaslighter is distorting.", line: 3, proof: "a friend you talk to honestly" },
        { id: 'hr28-q5', type: 'weaken', q: "Which would most weaken the author's advice?", c: ["The gaslighter questioned the motives of each critic he had", "Victims with close friends were gaslit as deeply", "Gaslighting usually has one victim"], fix: "If outside contact made no difference, keeping anchors would not protect anyone.", line: 3, proof: "the defense is not to win every argument" },
        { id: 'hr28-q6', type: 'tone', q: "The tone of the last paragraph is best described as...", c: ["Alarmed and quite urgent", "Practical and protective", "Clinical and cool"], fix: "The author gives concrete steps and a clear warning sign.", line: 3, proof: "That request, more than any single lie, is the sign to notice." }
      ] },
    { id: 'hr29', ages: 'both', rating: 'adult', topic: 'manipulation', title: "Superficial Charm", cite: "Britannica, Psychopathy", sourceIds: ["brit-psychopathy"],
      passage: [
        "Britannica describes psychopathy as a personality disorder marked by a lack of empathy or remorse, along with impulsiveness, manipulativeness, and deceitfulness. It is estimated to affect about 1 percent of people and is more common in men than in women. Psychopathic behavior can include crime and violence, \"but this is not always the case.\" The DSM-5 (2013) treats it as a form of antisocial personality disorder rather than a separate diagnosis, which reflects a lack of agreement on its exact boundaries.",
        "A widely used model, the Psychopathy Checklist-Revised, groups the traits into two factors. One is about personality: superficial charm, deceit, and manipulation, along with shallow emotion and no remorse. The other is about behavior: thrill seeking, impulsiveness, poor self-control, and early trouble. A 2011 study put the social cost of criminal psychopathic behavior in the United States at $460 billion a year.",
        "The trait that matters most for everyday safety is the first one on the list: charm. Charm is pleasant, and most charming people are simply friendly. The warning is charm that does not match actions, such as warm words with broken promises, or flattery followed by requests. Judging people by what they do over time, rather than by how they make you feel in the first hour, protects you from manipulators without making you suspicious of everyone."
      ],
      qs: [
        { id: 'hr29-q1', type: 'mainIdea', q: "Which best states the main idea?", c: ["Charming people tend to be psychopaths", "Judge people by their actions over time", "The checklist can spot manipulators"], fix: "The passage ends with a practical rule: weigh actions over first impressions.", line: 3, proof: "Judging people by what they do over time" },
        { id: 'hr29-q2', type: 'inference', q: "What does the passage suggest about the term psychopathy?", c: ["It is defined by violent crime", "Experts still disagree about its edges", "The DSM-5 treats it as its own diagnosis"], fix: "The DSM-5 handling \"reflects a lack of agreement on its exact boundaries.\"", line: 1, proof: "which reflects a lack of agreement on its exact boundaries" },
