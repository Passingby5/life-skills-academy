    { id: 'es13', ages: 'both', topic: 'wills', cite: 'Hall v. Kalfayan (2010) 190 Cal.App.4th 927', s: 'A lawyer drafted a new estate plan for Alexandra Turner naming her friend Carlyle Hall. She died in 2007 before it was executed. Could Hall sue the lawyer?',
      c: ['Yes, the lawyer owed him', 'No, there was no duty', 'A share of the estate'],
      m: 'If a lawyer is slow, the person who would have inherited can sue.', f: 'Sign your will or trust as soon as it is ready. A draft that is never signed does nothing.', w: 'The court held a prospective beneficiary "cannot maintain a cause of action for legal malpractice" against the lawyer whose will was not executed before death.', src: 'hall' },
    { id: 'es14', ages: 'both', topic: 'wills', cite: 'Cal. Prob. Code 6110; Hall v. Kalfayan (2010)', s: 'In Hall v. Kalfayan, the new plan never took effect because it was not executed before death. Rosa wants her typed will to count. What does California law require?',
      c: ['A notary stamp', 'Signed, plus two witnesses', 'A single witness and a date'],
      m: 'A notary stamp makes a will official.', f: 'Sign with two adult witnesses present at the same time, and have them sign too.', w: 'Section 6110 says a will must be signed and witnessed by "at least two persons" present at the same time.', src: 'prob-6110', also: ['hall'] },
    { id: 'es15', ages: 'both', topic: 'wills', cite: 'Moore v. Anderson Zeigler (2003) 109 Cal.App.4th 1287', s: 'Clyde Smith changed his estate plan in June 2000 and died later that month. His children said he lacked capacity and sued his lawyers for not checking. Did the lawyers owe the children that duty?',
      c: ['Yes, to check his capacity', 'No duty to the kids', 'The kids had to pay'],
      m: 'The lawyer who writes a will must protect the family from a bad one.', f: 'If capacity may be questioned later, raise it while the person is alive. A lawsuit after death is too late.', w: 'The court declined to impose on the testator\'s lawyer a duty to nonclient beneficiaries to investigate or document capacity.', src: 'moore' },
    // ---- Dying without a will ----
    { id: 'es16', ages: 'both', topic: 'intestacy', cite: 'Estate of Prince Rogers Nelson (Carver County, Minn.), AP report', s: 'Prince died in 2016 with no will, no spouse and no children. Who were his heirs?',
      c: ['The state of Minnesota', 'His six siblings', 'His record company'],
      m: 'If you die without a will, the state takes everything.', f: 'Make a will or trust. Without one, state law, not you, picks your heirs.', w: 'AP reported Prince "did not leave a will," and the estate went to his "six sibling heirs."', src: 'ap-prince' },
    { id: 'es17', ages: 'both', topic: 'intestacy', cite: 'Estate of Prince Rogers Nelson (2022), AP report', s: 'Prince\'s estate took six years to settle. What did AP say lawyers and consultants were paid to run it?',
      c: ['A small flat fee', 'Tens of millions', 'No pay until the end'],
      m: 'Without a will, things just pass quickly to family.', f: 'A plan you sign now can save your family years of court time and big fees.', w: 'Lawyers and consultants "have been paid tens of millions of dollars to administer his estate."', src: 'ap-prince' },
    { id: 'es18', ages: 'both', topic: 'intestacy', cite: 'Cal. Prob. Code 6402; Prince estate (AP)', s: 'Prince died with no will, no spouse and no kids, and his estate went to his siblings. Dev dies in California with no will, no spouse and no kids. Both of his parents are alive. Who inherits?',
      c: ['His best friend', 'His mom and his dad', 'His brothers and sisters first'],
      m: 'Your partner or best friend inherits if you meant to leave it to them.', f: 'If you want a partner or friend to inherit, put it in a signed will or trust.', w: 'Section 6402(b): if there is no surviving issue, the estate goes "to the decedent\'s parent or parents equally."', src: 'prob-6402', also: ['ap-prince'] },
    { id: 'es19', ages: 'both', topic: 'intestacy', cite: 'Estate of Heggstad (1993) 16 Cal.App.4th 943; Cal. Prob. Code 21610', s: 'Halvard Heggstad signed a will and trust, then married Nancy a month later. Neither document mentioned her. What did she get?',
      c: ['None, since she was left out', 'Her share, here one-third', 'The whole estate'],
      m: 'If your will leaves out a new spouse, they get nothing.', f: 'Update your will and trust after you marry, divorce or have a child.', w: 'All parties agreed she was "entitled to one-third of the decedent\'s estate (her intestate share)" as an omitted spouse. Under section 21610 the share depends on the kind of property, so it is not always one-third.', src: 'heggstad', also: ['prob-21610'] },
    // ---- Trusts ----
    { id: 'es20', ages: 'both', topic: 'trusts', cite: 'Estate of Heggstad (1993) 16 Cal.App.4th 943', s: 'Halvard Heggstad listed a Menlo Park property on his trust\'s Schedule A but never signed a deed moving it to the trust. Was it in the trust?',
      c: ['No, a deed was needed', 'Yes, the schedule did it', 'Part of it was'],
      m: 'A trust holds only what has a deed in the trust\'s name.', f: 'Fund your trust: deed real estate to the trustee and retitle accounts. Do not count on a court fix later.', w: 'The court held "there is no requirement that the settlor/trustee execute a separate writing conveying the property to the trust."', src: 'heggstad', also: ['prob-850'] },
    { id: 'es21', ages: 'both', topic: 'trusts', cite: 'Ukkestad v. RBS Asset Finance (2015) 235 Cal.App.4th 156', s: 'Larry Mabee\'s trust said he assigned all his real property to it, but it did not name two parcels. Were those parcels trust assets?',
      c: ['No, unnamed means not in', 'Yes, it did cover them too', 'Following a full probate'],
      m: 'If a property is not named in the trust, it has to go through probate.', f: 'List and retitle each property anyway. A court petition costs time and money even when you win.', w: 'The Court of Appeal reversed and told the probate court to grant the petition confirming the two parcels as trust assets.', src: 'ukkestad', also: ['prob-850'] },
    { id: 'es22', ages: 'both', topic: 'trusts', cite: 'Ukkestad v. RBS Asset Finance (2015)', s: 'Mabee\'s trust said its assignment took effect right away. What did the same sentence admit?',
      c: ['No more steps were needed', 'Other papers may be needed', 'A judge must sign first'],
      m: 'Signing a trust automatically moves your house and bank accounts into it.', f: 'After signing a trust, do the follow-up: deeds, account forms and titles.', w: 'It said the assignment was effective "even though other documents may be necessary to perfect title."', src: 'ukkestad' },
    { id: 'es23', ages: 'both', topic: 'trusts', cite: 'Barefoot v. Jennings (2020) 8 Cal.5th 822', s: 'Mauri Barefoot was a beneficiary of her mother\'s trust until late amendments cut her out. She said they came from undue influence. Could she challenge them in probate court?',
      c: ['No, she was cut out of it', 'Yes, she had standing', 'Only after five more years'],
      m: 'Once you are written out of a trust, you cannot challenge it.', f: 'If late changes cut you out and something seems wrong, see a probate lawyer quickly. Deadlines can be short.', w: 'The California Supreme Court held such claims "should be decided by the probate court" and reversed the dismissal.', src: 'barefoot' },
    { id: 'es24', ages: 'both', topic: 'trusts', cite: 'Cal. Prob. Code 21380; Barefoot v. Jennings (2020)', s: 'A helper drafts Grandma\'s trust amendment that leaves the helper her house. What does California law presume?',
      c: ['It is a normal gift', 'It was undue influence', 'Grandma might have dementia'],
      m: 'A gift to whoever wrote the document is fine if Grandma signed it.', f: 'Use an independent lawyer to draft. A gift to the drafter or a caregiver is presumed suspect.', w: 'Section 21380 presumes a gift to "the person who drafted the instrument" is the product of fraud or undue influence.', src: 'prob-21380', also: ['barefoot'] },
    { id: 'es25', ages: 'both', topic: 'trusts', cite: 'Bernard v. Foley (2006) 39 Cal.4th 794; Cal. Prob. Code 21380', s: 'Carmel Bosco amended her trust seven times. The last one left her estate to two friends who cared for her at the end. Could friends count as "care custodians"?',
      c: ['No, friends do not count', 'Yes, they could', 'Paid nurses alone'],
      m: 'A friend who helps out can never be treated as a caregiver.', f: 'If a caregiver will inherit, have an independent lawyer review the plan first.', w: 'The Court held an unrelated person giving substantial, ongoing health services may be a care custodian even if the bond began as friendship.', src: 'bernard', also: ['prob-21380'] },
    { id: 'es26', ages: 'both', topic: 'trusts', cite: 'Cal. Prob. Code 21380; Bernard v. Foley (2006)', s: 'Bernard was decided under an older law; today\'s rule is Probate Code 21380. When is a gift to a dependent adult\'s care custodian presumed suspect?',
      c: ['Gifts over $1 million', 'During care or 90 days', 'A relative must object'],
      m: 'Small gifts to a caregiver are never questioned.', f: 'Check the timing. A will or trust signed while a caregiver is helping is the riskiest.', w: 'Section 21380(a)(3) applies if the instrument was executed while the care custodian provided services, "or within 90 days before or after."', src: 'prob-21380', also: ['bernard'] },
    // ---- Elder abuse ----
    { id: 'es27', ages: 'both', topic: 'abuse', cite: 'Estate of Lowrie (2004) 118 Cal.App.4th 220', s: 'Lynelle Goodreau said her uncle Sheldon abused and isolated her grandmother, Laura Lowrie, and got her to change her trust. Could a granddaughter bring the elder abuse case?',
      c: ['No, the trustee had to', 'Yes, she had standing', 'Her parents had to sue for her'],
      m: 'Only the trustee can sue over abuse, even if the trustee is the abuser.', f: 'If you suspect elder abuse in your family, report it and get a lawyer. A grandchild may be able to act.', w: 'The court held "the granddaughter has standing to bring this elder abuse civil lawsuit."', src: 'lowrie' },
    { id: 'es28', ages: 'both', topic: 'abuse', cite: 'Estate of Lowrie (2004); Cal. Prob. Code 259', s: 'Lynelle asked the court, under Probate Code 259, to treat Sheldon as if he had died before his mother. What is that rule for?',
      c: ['Speeding up probate', 'Abusers losing inheritance', 'Cutting estate taxes'],
      m: 'An heir who abused a parent still inherits like everyone else.', f: 'Abuse can cost an heir the inheritance. Keep records and report it.', w: 'Section 259 deems a person liable for abuse of an elder, in bad faith, to have "predeceased" the decedent.', src: 'prob-259', also: ['lowrie'] },
    { id: 'es29', ages: 'both', topic: 'abuse', cite: 'Estate of Lowrie (2004)', s: 'In Lowrie, what did the petition say Sheldon did that is a classic elder abuse warning sign?',
      c: ['Moved her abroad', 'Cut her off from family', 'Paid her bills late'],
      m: 'If a relative takes over all contact, it just means they are helping.', f: 'Watch for a helper who blocks visits and calls. Isolation is a red flag; report it.', w: 'The petition said "Sheldon isolated Decedent from her two other children, her five grandchildren."', src: 'lowrie' },
    // ---- Power of attorney ----
    { id: 'es30', ages: 'both', topic: 'poa', cite: 'Estate of Powell v. Commissioner (2017) 148 T.C. No. 18; Cal. Prob. Code 4264', s: 'The day after doctors said Nancy Powell could not act for herself, her son Jeffrey used her power of attorney to give her partnership interest to a charitable trust. Was the gift valid?',
      c: ['Yes, a POA allows gifts', 'No, it was not allowed', 'Yes, if a notary stamps it'],
      m: 'A power of attorney lets the agent give away your property.', f: 'If you want your agent to make gifts, say so in the document, with limits. Otherwise the agent cannot.', w: 'The Tax Court held the transfer was void or revocable because the POA did not authorize gifts above the annual exclusion.', src: 'powell', also: ['prob-4264'] },
    { id: 'es31', ages: 'both', topic: 'poa', cite: 'Cal. Prob. Code 4264; Estate of Powell (2017)', s: 'Under California Probate Code 4264, when may an agent under a power of attorney make a gift of your property?',
      c: ['When the family agrees', 'If the POA says so', 'A bank can say so'],
      m: 'Your agent can give gifts to family whenever it seems fair.', f: 'Read the POA before you sign it. Gift powers should be spelled out, or left out on purpose.', w: 'Section 4264: an agent may make a gift "only if the power of attorney expressly grants that authority."', src: 'prob-4264', also: ['powell'] },
    { id: 'es32', ages: 'both', topic: 'poa', cite: 'Cal. Prob. Code 4232; Estate of Powell (2017)', s: 'Your aunt makes you her agent under a power of attorney. What duty does California law put on you?',
      c: ['Share it with family', 'Act only in her interest', 'Follow the heirs\' wishes'],
      m: 'An agent can use the money for the whole family, since it will be theirs one day.', f: 'Keep her money separate, keep receipts, and use it only for her.', w: 'Section 4232: an agent "has a duty to act solely in the interest of the principal and to avoid conflicts of interest."', src: 'prob-4232', also: ['powell'] },
    // ---- LLCs and family partnerships ----
    { id: 'es33', ages: 'adult', topic: 'business', cite: 'Strangi v. Commissioner (5th Cir. 2005) 417 F.3d 468; 26 U.S.C. 2036', s: 'As Albert Strangi\'s health failed, about $10 million of his assets went into a family limited partnership. His estate then paid tax only on his partnership interest. Did that work?',
      c: ['Yes, the discount held', 'No, assets were included', 'Part of the house counted'],
      m: 'Putting assets in a family partnership or LLC always shrinks the estate tax.', f: 'A family entity needs a real business purpose and must be run like one. Get tax advice before you set one up.', w: 'The Fifth Circuit upheld the finding that the transfer "lacked a substantial non-tax purpose," so the assets stayed in the estate under 2036(a).', src: 'strangi', also: ['usc-26-2036'] },
    { id: 'es34', ages: 'adult', topic: 'business', cite: 'Strangi v. Commissioner (2005); 26 U.S.C. 2036', s: 'In Strangi, which exception to section 2036 could have kept the partnership assets out of the estate?',
      c: ['An LLC name', 'A bona fide sale', 'Filing it out of state'],
      m: 'The name or state of the company is what saves the tax.', f: 'Ask what real reason, besides tax, the entity serves. Without one, the IRS can pull assets back in.', w: 'Section 2036 excepts "a bona fide sale for an adequate and full consideration"; Strangi\'s transfer did not qualify.', src: 'strangi', also: ['usc-26-2036'] },
    { id: 'es35', ages: 'adult', topic: 'business', cite: '26 U.S.C. 2036; Estate of Powell (2017)', s: 'Like Nancy Powell, a parent moves assets into a family partnership but keeps the right, with others, to dissolve it. What does federal estate tax law do?',
      c: ['No, it leaves her estate', 'It counts in her estate', 'It becomes tax free'],
      m: 'Once assets go into a family entity, they leave your estate.', f: 'Keeping control or the income usually keeps the assets in your estate. Plan with a tax pro.', w: 'Powell held her ability to dissolve the partnership was enough to invoke section 2036(a)(2).', src: 'powell', also: ['usc-26-2036'] },
    // ---- Community property ----
    { id: 'es36', ages: 'both', topic: 'property', cite: 'In re Marriage of Valli (2014) 58 Cal.4th 1396; Cal. Fam. Code 852', s: 'Frankie Valli used community funds to buy a $3.75 million life policy, naming his wife Randy as sole owner and beneficiary. At divorce, whose was it?',
      c: ['Randy\'s; her name is on it', 'It is community property', 'Frankie owns it as his own'],
      m: 'Whoever is named on the title owns it.', f: 'If you mean to change who owns something in a marriage, sign a clear written agreement.', w: 'The Court held that "unless the statutory transmutation requirements have been met, the life insurance policy is community property."', src: 'valli', also: ['fam-852'] },
    { id: 'es37', ages: 'both', topic: 'property', cite: 'Cal. Fam. Code 852; In re Marriage of Valli (2014)', s: 'After Valli, what does it take in California to turn community property into one spouse\'s separate property?',
      c: ['Putting it in one name', 'An express writing', 'A spoken promise to share'],
      m: 'Putting a car or account in one name makes it that spouse\'s alone.', f: 'Write it down, state the change plainly, and have the spouse who loses out sign.', w: 'Section 852: a transmutation "is not valid unless made in writing by an express declaration."', src: 'fam-852', also: ['valli'] },
    { id: 'es38', ages: 'both', topic: 'property', cite: 'Cal. Prob. Code 100; In re Marriage of Valli (2014)', s: 'When a married Californian dies, how much of the couple\'s community property already belongs to the surviving spouse?',
      c: ['It goes to the kids', 'One-half of it', 'One-quarter of it'],
      m: 'Your will can give away all the community property.', f: 'Your will controls only your half of community property. Plan with your spouse.', w: 'Section 100: "one-half of the community property belongs to the surviving spouse and the other one-half belongs to the decedent."', src: 'prob-100', also: ['valli'] },
    // ---- Joint tenancy, probate and updates ----
    { id: 'es39', ages: 'both', topic: 'property', cite: 'Riddle v. Harmon (1980) 102 Cal.App.3d 524', s: 'Frances Riddle owned a home in joint tenancy with her husband. She wanted her half to pass by her will instead. She signed a deed from herself to herself and died 20 days later. Did it work?',
      c: ['No, he had to sign too', 'Yes, it ended it', 'Yes, but a year later'],
      m: 'Joint tenancy can be ended only if both owners agree.', f: 'Know how each property is titled. Joint tenancy passes to the survivor unless it is ended first.', w: 'The court held a joint tenant can unilaterally end a joint tenancy by a deed to herself, without an intermediary.', src: 'riddle' },
    { id: 'es40', ages: 'both', topic: 'property', cite: 'Riddle v. Harmon (1980)', s: 'In Riddle, the trial court first gave the whole house to Frances\'s husband. Why does joint tenancy usually do that?',
      c: ['The will decides it', 'The survivor takes it', 'Probate splits it'],
      m: 'Your will decides who gets a house you own in joint tenancy.', f: 'Check your deed. A will does not control joint tenancy property unless the joint tenancy was ended first.', w: 'A joint tenant can destroy "the right of survivorship by conveyance of his or her joint tenancy interest."', src: 'riddle' },
    { id: 'es41', ages: 'both', topic: 'wills', cite: 'Cal. Prob. Code 6122; Sveen v. Melin (2018)', s: 'Like the beneficiary rule in Sveen, California has a will rule. After a divorce, what happens to gifts to your ex in a will you signed while married?',
      c: ['The ex still gets them', 'They are all revoked', 'They pass to the state'],
      m: 'An old will still gives your ex everything after a divorce.', f: 'Make a new will after a divorce anyway, so there is no doubt who you want.', w: 'Section 6122: unless the will says otherwise, a dissolution revokes "any disposition or appointment of property made by the will to the former spouse."', src: 'prob-6122', also: ['sveen'] },
    { id: 'es42', ages: 'both', topic: 'trusts', cite: 'Cal. Prob. Code 15401; Barefoot v. Jennings (2020)', s: 'Barefoot v. Jennings was a fight over late changes to a revocable trust. If such a trust is silent on how to revoke it, what does California law allow?',
      c: ['A phone call', 'A signed writing', 'A new will, by itself'],
      m: 'You can revoke a trust by telling the trustee or writing a new will.', f: 'Follow the method in your trust, in writing. If it names one exclusive method, use that one.', w: 'Section 15401 allows revocation "by a writing, other than a will, signed by the settlor" and delivered to the trustee.', src: 'prob-15401', also: ['barefoot'] },
    { id: 'es43', ages: 'both', topic: 'probate', cite: 'Cal. Prob. Code 13100; Prince estate (AP)', s: 'Prince\'s large estate took six years to settle in court. In California, what can heirs use for a small estate instead of full probate?',
      c: ['Full probate, in court', 'A small estate affidavit', 'A note from the bank'],
      m: 'Every estate has to go through full probate court.', f: 'Ask about the small estate affidavit. Check today\'s dollar limit and wait the required 40 days.', w: 'Section 13100 lets a successor collect property without probate after 40 days if the estate is under its limit, "as adjusted periodically."', src: 'prob-13100', also: ['ap-prince'] },
    { id: 'es44', ages: 'both', topic: 'wills', cite: 'Cal. Prob. Code 6124; Aretha Franklin will case (2023)', s: 'Aretha Franklin\'s handwritten will was found in her couch after her death. In California, if a will last kept by the person cannot be found after death, what does the law presume?',
      c: ['It was lost during a move', 'The testator revoked it', 'A lawyer still holds the original'],
      m: 'If the original will is lost, a copy works just as well.', f: 'Keep the original will somewhere safe that your executor knows about.', w: 'Section 6124 presumes "the testator destroyed the will with intent to revoke it" when it was last in the testator\'s possession and cannot be found.', src: 'prob-6124', also: ['ap-aretha'] },
    { id: 'es45', ages: 'both', topic: 'beneficiary', cite: 'Sveen v. Melin (2018)', s: 'Mark Sveen named his two children as backup beneficiaries. Under Minnesota\'s divorce rule, who takes the money when the ex is removed?',
      c: ['The ex, anyway', 'The ones named as backups', 'The insurer, by default'],
      m: 'Naming backup beneficiaries is a waste of time.', f: 'Always name a backup beneficiary on every policy and account.', w: 'The Court said the law makes the proceeds "instead go to the contingent beneficiary" or the estate.', src: 'sveen' },
    { id: 'es46', ages: 'both', topic: 'wills', cite: 'Estate of Black (1982) 30 Cal.3d 880; Cal. Prob. Code 6111', s: 'Frances Black wrote her will by hand on three pages of a store-bought printed will form, using bits of its printed words. Probate was denied over the printed parts. What did the California Supreme Court do?',
      c: ['Agreed; the printed words void it', 'Reversed; it was a valid will', 'Sent it to a jury'],
      m: 'A handwritten will is void if any printed words are on the page.', f: 'If you use a form, write every gift and your signature in your own hand, and date it.', w: 'The Court found the printed material was not "material to the substance of the will" and reversed the denial.', src: 'black', also: ['prob-6111'] },
    { id: 'es47', ages: 'both', topic: 'wills', cite: 'Estate of Black (1982)', s: 'In Estate of Black, who wrote the handwriting on the form, including the date and her name?',
      c: ['A lawyer, for her', 'Frances Black herself', 'Her neighbor, as witness'],
      m: 'Someone else can write your handwritten will for you.', f: 'For a handwritten will, write it yourself. Your hand on the key parts is what counts.', w: 'All parties conceded "all of the handwriting, including the date and her name, is that of the testatrix."', src: 'black' },
    { id: 'es48', ages: 'both', topic: 'wills', cite: 'Estate of Southworth (1996) 51 Cal.App.4th 564', s: 'On a charity donor card, Dorothy Southworth wrote that her whole estate should go to the charity, then signed and dated it. Was the card her will?',
      c: ['Yes, it was signed and dated', 'No, it was not a will', 'Part went to charity'],
      m: 'Any signed note about who gets your estate counts as a will.', f: 'Put your wishes in a real will or trust. A card or letter about a future gift may not count.', w: 'The court held her handwriting on the donor card was not a holographic will and reversed the probate order.', src: 'southworth' },
    { id: 'es49', ages: 'both', topic: 'wills', cite: 'Estate of Southworth (1996)', s: 'Why did the Southworth court say the donor card failed as a will?',
      c: ['It had no witnesses', 'It showed future intent', 'It was not dated'],
      m: 'Saying you plan to leave something is the same as leaving it.', f: 'Use words that make the gift now, at death, in a signed will. "I plan to" is not enough.', w: 'The card\'s printed words showed "an intent to make a future gift to the charity."', src: 'southworth' },
    { id: 'es50', ages: 'both', topic: 'trusts', cite: 'Andersen v. Hunt (2011) 196 Cal.App.4th 722; Cal. Prob. Code 6100.5', s: 'After a stroke, Wayne Andersen amended his trust to leave 60 percent to his partner, Pauline Hunt. The probate court judged his capacity by the contract standard. Was that the right test?',
      c: ['Yes, trusts are contracts', 'No, the will standard applied', 'No test is needed'],
      m: 'Any trust change is judged like signing a business contract.', f: 'For a simple trust change that works like a will, the will-making capacity test applies. Get a doctor\'s note if capacity may be questioned.', w: 'The court held the probate court erred by using sections 810 to 812 "instead of the standard of testamentary capacity set out in Probate Code section 6100.5."', src: 'andersen' },
    { id: 'es51', ages: 'both', topic: 'trusts', cite: 'Andersen v. Hunt (2011)', s: 'In Andersen v. Hunt, the appeals court upheld Wayne\'s trust amendments. What did it still let stand against Pauline?',
      c: ['The whole trust, as is', 'The account and policy rulings', 'A fine for undue influence'],
      m: 'If your trust holds up, every other change you made holds up too.', f: 'Opening joint accounts and changing a beneficiary can be judged by a stricter test. Make big changes while you are well.', w: 'There was substantial evidence Wayne "lacked capacity to open joint tenancy accounts and to change the beneficiary of his life insurance policy."', src: 'andersen' },
    { id: 'es52', ages: 'both', topic: 'beneficiary', cite: 'Egelhoff v. Egelhoff (2001)', s: 'David Egelhoff had a Boeing life policy and a pension plan, both naming his ex-wife. Which did the federal rule in Egelhoff cover?',
      c: ['The life policy', 'Both of the plans', 'The pension plan'],
      m: 'Only life insurance follows the beneficiary form; pensions follow your will.', f: 'Update the form on every plan: insurance, pension, 401(k) and IRA.', w: 'Both plans "were governed by ERISA," and the Court held ERISA pre-empts the state statute as applied to ERISA plans.', src: 'egelhoff' },
    { id: 'es53', ages: 'both', topic: 'beneficiary', cite: 'Hillman v. Maretta (2013)', s: 'A state law let Warren Hillman\'s widow sue his ex-wife to hand over the insurance money. What did the Supreme Court say about that remedy?',
      c: ['It worked as a backup', 'It was pre-empted by law', 'Part could be taken'],
      m: 'Even if the ex gets paid, the widow can sue to get it back.', f: 'Do not count on a lawsuit to fix an old form. Update it while you can.', w: 'Asked whether the state-law remedy is pre-empted by FEGLIA, the Court said: "We hold that it is."', src: 'hillman' },
    { id: 'es54', ages: 'both', topic: 'beneficiary', cite: 'Kennedy v. Plan Administrator for DuPont (2009)', s: 'After his divorce, William Kennedy did file a new form naming his daughter Kari on one DuPont plan. Which one?',
      c: ['The savings plan (SIP)', 'His pension plan', 'His group life policy'],
      m: 'Updating one account updates them all.', f: 'Make a list of every account with a beneficiary and update each one separately.', w: 'He named Kari on the "Pension and Retirement Plan" but never removed Liv from the savings plan.', src: 'kennedy' }
  ]
});
</script>
<script data-src="content/decks/street_hardreads.js">
// Hard Reads (v20): Street Smart passage deck. Each passage is 2 to 3 short paragraphs built on documented history,
// court records or credible reference works, then 5 to 7 reading questions (main idea, inference, purpose, assumption,
// strengthen, weaken, tone). Adult-rated: a young adult plays it only after a parent PIN unlock.
// Guardrails (STREET-SMART-SPEC.md): recognition and defense only, never graphic, no sexual content, no how-to.
// Extremist or genocidal reasoning is quoted briefly, labeled, and answered in the same passage (guard: quotesExtremism,
// rebutted). Faith questions test reading, never which faith is right. Every quoted phrase is checked against its saved
// source by tools/hr-facts.js. c[1] is always the right choice in the data; the engine shuffles the order shown.
LSA.deck({

  cards: [
    { id: 'hr01', ages: 'both', rating: 'adult', topic: 'genocide', title: 'No Gain, No Loss', cite: 'USHMM, Cambodia 1975-1979; Britannica, Khmer Rouge', sourceIds: ['ushmm-cambodia', 'brit-khmer'], guard: ['quotesExtremism', 'rebutted'],
      passage: [
        'From April 17, 1975, to January 7, 1979, the Khmer Rouge ruled Cambodia. The U.S. Holocaust Memorial Museum says nearly two million people died under the movement, which imposed forced labor, thought control, and mass execution. Its stated goal was a classless agrarian utopia. City people were marched into the countryside to dig canals and tend crops. Religion and all forms of self-expression were forbidden, and children were forced into mobile labor brigades.',
        'The museum records the regime\'s warning to its people: "To keep you is no gain; to lose you is no loss." The line is an argument as much as a threat. It prices a person by usefulness to the plan, so a life counts only while it serves. Grant that premise and killing a doubter starts to look like bookkeeping. The movement applied it even to its own, killing thousands of members as suspected traitors and spies.',
        'The premise fails on its own terms. A government exists to protect the people in it; one that calls them disposable has given up any claim to rule them. Nor did the plan deliver what it promised: mismanagement led to shortages of food and medicine, and untold numbers died of disease and starvation. Decades later a joint UN and Cambodian tribunal convicted three defendants. It has drawn criticism for its cost and its few indictments, yet it showed that such crimes can still be brought to account.'
      ],
      qs: [
        { id: 'hr01-q1', type: 'mainIdea', q: 'Which best states the main point of the passage?', c: ["Moving city people to farms fixed shortages but split families", "A slogan that priced lives by use led to mass death", "A joint UN tribunal ended the regime and judged its top leaders"], fix: 'The passage moves from the regime\'s rule, to the logic of its slogan, to why that logic fails.', line: 2, proof: 'It prices a person by usefulness to the plan, so a life counts only while it serves.' },
        { id: 'hr01-q2', type: 'inference', q: 'Why does the author say killing a doubter "starts to look like bookkeeping"?', c: ["The regime tracked each prisoner by name in written ledgers", "If lives are priced by use, losing one seems a small entry", "Killing doubters saved the plan money it could not spare for food"], fix: 'Bookkeeping is a metaphor: once a person is a number on a ledger, removing one feels routine.', line: 2, proof: 'Grant that premise and killing a doubter starts to look like bookkeeping.' },
        { id: 'hr01-q3', type: 'purpose', q: 'Why does the passage mention that the movement killed its own members?', c: ["To show foreign spies had joined it", "To show that the logic spared even its own", "To show the party was purging real traitors"], fix: 'If even loyal members could be lost "at no loss," no one was safe under that logic.', line: 2, proof: 'The movement applied it even to its own, killing thousands of members as suspected traitors and spies.' },
        { id: 'hr01-q4', type: 'assumption', q: 'The slogan depends on which unstated assumption?', c: ["Cities had grown too large for the farms to feed them", "A person's worth equals what they give the state", "A classless society needs city people to farm"], fix: 'The slogan only works if a life has no worth beyond its use to the plan.', line: 2, proof: 'It prices a person by usefulness to the plan' },
        { id: 'hr01-q5', type: 'weaken', q: 'Which detail from the passage most weakens the regime\'s claim that its plan served the people?', c: ["It set out to build a classless agrarian society for its people", "Its mismanagement left people short of food and medicine", "City people were moved to dig canals"], fix: 'A plan that starves the people it claims to serve fails by its own goal.', line: 3, proof: 'mismanagement led to shortages of food and medicine, and untold numbers died of disease and starvation' },
        { id: 'hr01-q6', type: 'tone', q: 'How does the author view the tribunal?', c: ["Too costly to have been worth it", "Flawed but still worth having", "A full accounting for the crimes"], fix: 'The author notes the criticism ("yet") and still credits the court with bringing crimes to account.', line: 3, proof: 'It has drawn criticism for its cost and its few indictments, yet it showed that such crimes can still be brought to account.' }
      ] },
    { id: 'hr02', ages: 'both', rating: 'adult', topic: 'fascism', title: 'One Fire, One Decree', cite: 'USHMM Holocaust Encyclopedia, The Reichstag Fire', sourceIds: ['ushmm-reichstag', 'ushmm-gleich'],
      passage: [
        'On February 27, 1933, the German parliament building, the Reichstag, burned. The U.S. Holocaust Memorial Museum notes that the origins of the fire are still unclear. Hitler had been chancellor for only weeks, yet the Nazi leadership and its coalition partners blamed the Communists at once and told President Paul von Hindenburg that a violent uprising was coming. Emergency action, they said, was needed to stop it.',
        'The next day Hindenburg signed the Decree for the Protection of the People and State. It suspended the right to assembly, freedom of speech, freedom of the press, and other constitutional protections. It let the regime arrest opponents without specific charges and dissolve political organizations. Communist and Socialist deputies were expelled from parliament, and camps for political opponents soon followed. The decree stayed in force until Germany was defeated in May 1945.',
        'The pattern is worth learning because it is so simple. A shocking event is pinned on a feared group before the facts are known, and the fear is then used to pass powers that outlast the danger. The museum calls the decree a step that paved the way for Nazi dictatorship. A temporary emergency that lasts twelve years is not an emergency; it is a new system wearing an emergency\'s clothes.'
      ],
      qs: [
        { id: 'hr02-q1', type: 'mainIdea', q: 'What is the passage mainly about?', c: ["How Communists set the fire, hoping to start an uprising", "How a crisis became lasting power", "Why Hindenburg resisted Hitler's decree"], fix: 'The passage traces how the fire became the excuse for a decree that never ended.', line: 3, proof: 'the fear is then used to pass powers that outlast the danger' },
        { id: 'hr02-q2', type: 'inference', q: 'What does the passage suggest about the blame placed on the Communists?', c: ["It was later confirmed by the fire's investigators", "It came before the facts were in", "It came from Hindenburg's own advisers"], fix: 'The origins are "still unclear," yet blame came "at once."', line: 1, proof: 'blamed the Communists at once' },
        { id: 'hr02-q3', type: 'purpose', q: 'Why does the author mention that the decree lasted until May 1945?', c: ["To show the decree outlasted the danger it was for", "To show the \"emergency\" became permanent", "To show how long Hindenburg stayed in office"], fix: 'The long life of the decree is the author\'s evidence that it was a new system, not an emergency.', line: 3, proof: 'A temporary emergency that lasts twelve years is not an emergency' },
        { id: 'hr02-q4', type: 'assumption', q: 'The author\'s last sentence assumes that a real emergency power should...', c: ["Be signed by the president", "End when the danger ends", "Be approved by the parliament first"], fix: 'Calling a twelve-year emergency "not an emergency" assumes true emergency powers are temporary.', line: 3, proof: 'A temporary emergency that lasts twelve years is not an emergency' },
        { id: 'hr02-q5', type: 'strengthen', q: 'Which fact, if true, would most support the author\'s view of the decree?', c: ["The fire's origins are still unclear today", "Arrests of opponents with no charges rose sharply", "Communist deputies had been elected fairly"], fix: 'If the powers were used mostly on political opponents, that supports the claim the crisis was a pretext.', line: 2, proof: 'It let the regime arrest opponents without specific charges and dissolve political organizations.' },
        { id: 'hr02-q6', type: 'tone', q: 'The tone of the final paragraph is best described as...', c: ["Resigned", "Warning", "Neutral and detached"], fix: 'The author teaches a pattern to watch for and calls it out plainly.', line: 3, proof: 'The pattern is worth learning because it is so simple.' }
      ] },
    { id: 'hr03', ages: 'both', rating: 'adult', topic: 'fascism', title: 'Coordinated', cite: 'USHMM Holocaust Encyclopedia, Gleichschaltung', sourceIds: ['ushmm-gleich'],
      passage: [
        'The Nazis called it Gleichschaltung, a German word that means "coordination" or "synchronization." After Hitler became chancellor in January 1933, his party set out to bring every part of German life in line with the state. The Enabling Act let Hitler pass laws without the Reichstag. In April a civil service law pushed Jews and political opponents out of government jobs, and it reached judges, teachers, professors, and lawyers too.',
        'Unions were abolished in May 1933 and replaced by a single labor front. In July a new law declared the Nazi Party "the only political party in Germany." Even clubs and children\'s activities were brought under the party, and the Hitler Youth became mandatory. The U.S. Holocaust Memorial Museum notes that this was not only forced from the top. Many Germans "coordinated" themselves, and many rushed to join the party to protect their jobs. Hitler wrote that "everything is going much faster than we ever dared to hope."',
        'The word itself did work. Coordination sounds like tidy management, not the end of free unions, parties, and courts. It was done in the name of national unity, which made objecting feel disloyal. Within six months, all formal political opposition was gone.'
      ],
      qs: [
        { id: 'hr03-q1', type: 'mainIdea', q: 'Which best states the main idea of the passage?', c: ["The Nazis won power mainly through a string of fair elections", "Free institutions were folded into one party, fast", "Germans resisted the new laws for years"], fix: 'The passage lists law after law that brought government, work and clubs under one party.', line: 3, proof: 'Within six months, all formal political opposition was gone.' },
        { id: 'hr03-q2', type: 'purpose', q: 'Why does the author quote Hitler on things going "much faster"?', c: ["To show he had planned each step years ahead", "To show how little resistance it met", "To show he feared the pace"], fix: 'Even Hitler was surprised at how easily society fell into line.', line: 2, proof: '"everything is going much faster than we ever dared to hope."' },
        { id: 'hr03-q3', type: 'inference', q: 'What can be inferred from the fact that many Germans joined the party to protect their jobs?', c: ["Many of them had been Nazis well before Hitler took power", "Fear for income helped it spread", "Party members were paid higher wages"], fix: 'People joined to keep work, so economic fear helped the party grow.', line: 2, proof: 'many rushed to join the party to protect their jobs' },
        { id: 'hr03-q4', type: 'assumption', q: 'The author\'s point about the word "coordination" assumes that...', c: ["The word was chosen by the unions themselves", "Mild words may hide harsh actions", "Germans took the word as a plain threat"], fix: 'The author argues the soft word made a harsh process sound like tidy management.', line: 3, proof: 'Coordination sounds like tidy management, not the end of free unions, parties, and courts.' },
        { id: 'hr03-q5', type: 'weaken', q: 'Which finding would most weaken the claim that the takeover was "not only forced from the top"?', c: ["Records show many clubs merged before an order came", "Records show clubs merged under direct threat", "Records show party rolls grew fast in 1933 as people joined"], fix: 'If every group merged only under threat, there was no bottom-up "self-coordination."', line: 2, proof: 'this was not only forced from the top' },
        { id: 'hr03-q6', type: 'tone', q: 'The author\'s attitude toward the word "coordination" is...', c: ["Matter-of-fact", "Skeptical of it", "Puzzled by it"], fix: 'The author says the word "did work" by hiding what was really happening.', line: 3, proof: 'The word itself did work.' }
      ] },
    { id: 'hr04', ages: 'both', rating: 'adult', topic: 'cults', title: 'The Compound in Guyana', cite: 'Britannica, Jonestown', sourceIds: ['brit-jonestown'],
      passage: [
        'Jim Jones opened his first church in Indianapolis in the mid-1950s, and his congregation was known for being racially integrated at a time when that was rare. The Peoples Temple did real humanitarian work. Britannica also records how Jones treated followers inside it: members were humiliated and blackmailed, many were pressured into signing over their homes and possessions, family members were kept apart and urged to inform on one another, and Black members were told that if they left they would be rounded up into government camps.',
        'In 1977, as the press began asking questions, Jones moved hundreds of members to a remote commune in Guyana. A U.S. Embassy cable found that the local government exercised "little or no control" there. In November 1978, Congressman Leo Ryan visited to look into reports that people were held against their will. When some members tried to leave with him, Ryan and others were shot at the airstrip. That night more than 900 people died at Jones\'s order, some 300 of them age 17 and under.',
        'The warning signs came long before the end: control of money, cut-off families, fear of the outside world, and a leader no one could question. The good works were real too, which is part of why the control was hard to see.'
      ],
      qs: [
        { id: 'hr04-q1', type: 'mainIdea', q: 'What is the main point of the passage?', c: ["Jonestown began as a sudden break no one could have seen", "Years of control came before the end", "The Temple's good works, from the start, were a cover"], fix: 'The last paragraph says the warning signs "came long before the end."', line: 3, proof: 'The warning signs came long before the end' },
        { id: 'hr04-q2', type: 'purpose', q: 'Why does the author mention the Temple\'s humanitarian work?', c: ["To show the Temple changed after leaving Indianapolis", "To explain why control was hard to see", "To balance the record so readers trust Jones"], fix: 'The good works were real, which helped hide the abuse.', line: 3, proof: 'The good works were real too, which is part of why the control was hard to see.' },
        { id: 'hr04-q3', type: 'inference', q: 'What does the embassy cable suggest about life in the commune?', c: ["The commune was too remote for visitors to reach", "Members had little outside help to turn to out there", "Guyana's police guarded the commune closely"], fix: 'With "little or no control" by the local government, members had no outside authority nearby.', line: 2, proof: 'the local government exercised "little or no control" there' },
        { id: 'hr04-q4', type: 'assumption', q: 'The author treats "a leader no one could question" as a warning sign. This assumes that...', c: ["Questions slow down a group's humanitarian work in towns", "Being free to question a leader protects members", "Integrated groups need strong, unquestioned leaders"], fix: 'Calling it a warning sign assumes the freedom to question is a safeguard.', line: 3, proof: 'a leader no one could question' },
        { id: 'hr04-q5', type: 'strengthen', q: 'Which fact would most strengthen the claim that fear of the outside kept members in?', c: ["Members signed over homes and possessions", "Ex-members said they feared leaving", "Ryan came to look into reports of members held"], fix: 'Accounts from people who left, describing fear of leaving, would directly support it.', line: 1, proof: 'Black members were told that if they left they would be rounded up into government camps' },
        { id: 'hr04-q6', type: 'tone', q: 'The author\'s tone is best described as...', c: ["Openly angry at Jones and his aides", "Sober and cautionary throughout", "Detached and clinical"], fix: 'The author states facts plainly and draws out the warning signs.', line: 3, proof: 'The warning signs came long before the end' }
      ] },
    { id: 'hr05', ages: 'both', rating: 'adult', topic: 'cults', title: 'Collateral', cite: 'U.S. Attorney, E.D.N.Y., Raniere sentencing (Oct. 27, 2020)', sourceIds: ['doj-nxivm', 'polaris-recruit'],
      passage: [
        'Keith Raniere ran what he sold as self-help. Federal prosecutors in Brooklyn said his groups, including Nxivm, existed to promote him and to recruit people. In 2019 a jury convicted him of racketeering, sex trafficking, forced labor conspiracy and other crimes, and in 2020 a judge sentenced him to 120 years in prison. His co-defendants had pleaded guilty, among them Nxivm\'s president and co-founder.',
        'The method shows up in the court record. Women were recruited to what they were told was a women-only mentorship group. Only later did they learn they had taken "vows of obedience." To join, they had to hand over "collateral," including damaging confessions about themselves and loved ones, true or not, and rights to their money. The collateral was there to stop them from leaving or telling anyone.',
        'Polaris, which runs the U.S. human trafficking hotline, says most traffickers do not kidnap. They trick, manipulate or threaten. Fear, shame and misplaced loyalty can keep a person from seeing control for what it is. A group that asks for secrets as the price of trust is not offering growth. It is building a cage.'
      ],
      qs: [
        { id: 'hr05-q1', type: 'mainIdea', q: 'What is the main idea of the passage?', c: ["Raniere's sentence was harsher than usual for such crimes", "Secrets taken as \"collateral\" were used to trap the people", "Women were kidnapped into a mentorship group"], fix: 'The passage centers on how collateral kept people from leaving.', line: 2, proof: 'The collateral was there to stop them from leaving or telling anyone.' },
        { id: 'hr05-q2', type: 'inference', q: 'Why would a confession be useful as "collateral" even if it was untrue?', c: ["Members had agreed in writing to make it public", "The threat of exposure still causes real fear", "It proved the member's loyalty to the group"], fix: 'Collateral works through fear of exposure, whether or not it is true.', line: 2, proof: 'damaging confessions about themselves and loved ones, true or not' },
        { id: 'hr05-q3', type: 'purpose', q: 'Why does the author bring in what Polaris says?', c: ["To link Nxivm to the national hotline's records", "To show such control rarely needs force", "To argue that Raniere's crimes were unusual for the hotline"], fix: 'Polaris explains that manipulation and threats, not kidnapping, are the usual method.', line: 3, proof: 'Polaris, which runs the U.S. human trafficking hotline, says most traffickers do not kidnap.' },
        { id: 'hr05-q4', type: 'assumption', q: 'The last two sentences assume that real growth groups...', c: ["Ask members for honest confessions about their pasts", "Do without leverage over members", "Keep their courses open to men"], fix: 'The author contrasts growth with "a cage": a healthy group has no need to hold secrets over people.', line: 3, proof: 'A group that asks for secrets as the price of trust is not offering growth.' },
        { id: 'hr05-q5', type: 'weaken', q: 'Which fact would most weaken the claim that the group was a trap?', c: ["Members paid high fees to attend its courses for years", "Members could leave freely, and their secrets stayed private", "The co-defendants, including its president, pleaded guilty"], fix: 'If leaving had no cost, the collateral would not have trapped anyone.', line: 2, proof: 'to stop them from leaving or telling anyone' },
        { id: 'hr05-q6', type: 'tone', q: 'How would you describe the final sentence?', c: ["Hesitant", "Blunt", "Detached and formal"], fix: 'The author states the conclusion in a short, hard image: a cage.', line: 3, proof: 'It is building a cage.' }
      ] },
    { id: 'hr06', ages: 'both', rating: 'adult', topic: 'communism', title: 'A Hundred Flowers', cite: 'Britannica, Hundred Flowers Campaign', sourceIds: ['brit-flowers'],
      passage: [
        'In May 1956, China\'s Communist Party began what Britannica calls a movement to grant "greater freedom of thought and speech." Mao Zedong invited criticism of the party\'s policies, even from intellectuals outside it, with a line from classical history: "Let a hundred flowers bloom, and a hundred schools of thought contend." At first few people spoke. Criticism was slow to develop.',
        'Not until the spring of 1957 did people begin to criticize openly, and then it came fast. Wall posters denounced every aspect of the government, and students and professors criticized party members. In June the party signaled that the criticism had gone too far. By early July an antirightist campaign was under way, and the recent critics faced severe retribution. Most of them lost their jobs and were forced into manual labor.',
        'Whatever the leaders first intended, the result taught a lesson that outlived the campaign: speech that is invited but not protected is not free. An offer to speak freely means little unless the person making it has no power to punish you, or is bound by rules that stop them. The people who trusted the invitation paid for it, and many who stayed silent had guessed right.'
      ],
      qs: [
        { id: 'hr06-q1', type: 'mainIdea', q: 'Which best expresses the passage\'s main point?', c: ["Mao's campaign freed speech for a full year, then ended quietly", "An invitation to speak became a trap for its takers", "The party's critics were mostly students"], fix: 'Critics who answered the invitation were punished weeks later.', line: 3, proof: 'speech that is invited but not protected is not free' },
        { id: 'hr06-q2', type: 'inference', q: 'Why might criticism have been "slow to develop" at first?', c: ["The slogan's classical source confused people", "Many doubted it was safe to speak", "Critics waited for wall posters to appear"], fix: 'The passage ends by noting that those who stayed silent "guessed right," which suggests early doubt about safety.', line: 3, proof: 'many who stayed silent had guessed right' },
        { id: 'hr06-q3', type: 'purpose', q: 'What is the role of the first sentence of paragraph 3?', c: ["To prove the leaders planned the trap from the start", "To set motive aside for the result", "To show the leaders meant well from the start"], fix: '"Whatever the leaders first intended" sets the question of motive aside.', line: 3, proof: 'Whatever the leaders first intended, the result taught a lesson' },
        { id: 'hr06-q4', type: 'assumption', q: 'The author\'s claim about "free" speech assumes that free speech requires...', c: ["Wall posters in public places", "Protection from punishment", "An invitation from the leader himself"], fix: 'The author says speech is not free unless the listener cannot punish you or is bound by rules.', line: 3, proof: 'unless the person making it has no power to punish you, or is bound by rules that stop them' },
        { id: 'hr06-q5', type: 'strengthen', q: 'Which detail most supports the claim that trusting the invitation was costly?', c: ["Criticism spread fast once it finally started", "Most of the critics lost their jobs and were sent to labor", "The party said criticism went too far"], fix: 'Losing jobs and being forced into labor is the cost the passage describes.', line: 2, proof: 'Most of them lost their jobs and were forced into manual labor.' },
        { id: 'hr06-q6', type: 'tone', q: 'The tone of the final paragraph is...', c: ["Bitter and accusing", "Wry and cautionary in tone", "Hopeful about reform"], fix: 'The author draws a lesson with some irony: silence "guessed right."', line: 3, proof: 'The people who trusted the invitation paid for it' }
      ] },
    { id: 'hr07', ages: 'both', rating: 'adult', topic: 'communism', title: 'Confessions on Trial', cite: 'Britannica, Great Purge', sourceIds: ['brit-purge'],
      passage: [
        'In the late 1930s the Soviet Union held three widely publicized show trials. Prominent Old Bolsheviks, men who had led the revolution, were found guilty of treason and shot or imprisoned. Britannica notes that all the evidence presented in court came from the defendants\' own pretrial questioning and their confessions. The accused admitted to plots with Trotsky, sabotage, and spying for Germany and Japan.',
        'It was later established that the accused were innocent, that the secret police had fabricated the cases, and that the confessions were made under torture and intimidation. The trials removed Stalin\'s real and potential rivals. They were only the public face of a wider purge that sent millions of alleged "enemies of the people" to prison camps. Closed trials gutted the army\'s leadership, which helped explain the poor performance of Soviet forces when Germany invaded in June 1941.',
        'The trials offer a test for any accusation. A confession is only as good as the conditions under which it was given. When the only evidence is what a frightened prisoner says, a court that wants a result can produce one. A system that cannot tell guilt from fear does not make a country safer; here it left the country weaker.'
      ],
      qs: [
        { id: 'hr07-q1', type: 'mainIdea', q: 'What is the passage mainly arguing?', c: ["The trials exposed real plots against the Soviet state", "Forced confessions made the trials worthless as proof of guilt", "Closed trials of the army were fairer than the public ones"], fix: 'The passage shows the confessions were coerced and draws the lesson about evidence.', line: 3, proof: 'A confession is only as good as the conditions under which it was given.' },
        { id: 'hr07-q2', type: 'inference', q: 'Based on the passage, why did the defendants confess to crimes they did not commit?', c: ["They hoped, by naming others, to save their families", "They were tortured and threatened", "They had worked with Trotsky's followers"], fix: 'Britannica says the confessions came under torture and intimidation.', line: 2, proof: 'the confessions were made under torture and intimidation' },
        { id: 'hr07-q3', type: 'purpose', q: 'Why does the author mention the German invasion of June 1941?', c: ["To date the end of the purge and the trials", "To show the purge harmed the state", "To show the army had been disloyal to Stalin"], fix: 'Purging the army\'s leaders weakened the country when it was attacked.', line: 3, proof: 'here it left the country weaker' },
        { id: 'hr07-q4', type: 'weaken', q: 'Which finding would most weaken the trials\' verdicts?', c: ["The defendants confessed in open court, in detail", "Police files show the cases against them were made up", "Several accused admitted to spying for Japan"], fix: 'Proof that the cases were fabricated undercuts the verdicts directly.', line: 2, proof: 'the secret police had fabricated the cases' },
        { id: 'hr07-q5', type: 'assumption', q: 'The claim that "a court that wants a result can produce one" assumes that...', c: ["Courts weigh confessions above other evidence", "Pressure may make people say false things of themselves", "Rivals of a leader tend to plot against him"], fix: 'The point only works if fear can produce false statements.', line: 3, proof: 'When the only evidence is what a frightened prisoner says' },
        { id: 'hr07-q6', type: 'tone', q: 'The author\'s attitude toward the trials is...', c: ["Uncertain and torn on it", "Condemning of them", "Coolly neutral"], fix: 'The author calls them a system that "cannot tell guilt from fear."', line: 3, proof: 'A system that cannot tell guilt from fear does not make a country safer' }
      ] },
    { id: 'hr08', ages: 'both', rating: 'adult', topic: 'holocaust', title: 'Papers in Budapest', cite: 'USHMM Holocaust Encyclopedia, Raoul Wallenberg', sourceIds: ['ushmm-wallenberg'],
      passage: [
        'When Raoul Wallenberg arrived in Budapest on July 9, 1944, he was a Swedish businessman with no diplomatic training. The U.S. War Refugee Board had recruited him, and Sweden gave him diplomatic status. By then, Hungarian and German authorities had deported nearly 440,000 Jews from Hungary, almost all to Auschwitz-Birkenau. Nearly 200,000 Jews remained in Budapest, and the authorities intended to deport them as well.',
        'Wallenberg handed out certificates of protection from the Swedish legation. He used Swedish and American funds to set up hospitals, nurseries and a soup kitchen, and named more than 30 "safe" houses. After the fascist Arrow Cross seized power in October 1944, Jews were forced to march west toward Austria. Wallenberg repeatedly, often in person, stepped in to secure the release of people holding certificates or forged papers.',
        'His work saved thousands. His own ending was bitter. Wallenberg was detained by Soviet forces and disappeared, and a Soviet report in 1956 said he had died in a Moscow prison in 1947, a claim later sightings have called into question. The U.S. Holocaust Memorial Museum notes that most people were reluctant to help Jews, out of fear, self-interest or hatred. Wallenberg shows that one person with papers, money, and nerve could still change the outcome for thousands.'
      ],
      qs: [
        { id: 'hr08-q1', type: 'mainIdea', q: 'Which best states the main idea?', c: ["A trained diplomat stopped the deportations from Hungary", "One untrained man used his post in 1944 to save thousands", "The War Refugee Board saved most of Budapest's Jews"], fix: 'The passage centers on what Wallenberg did with papers, money and nerve.', line: 3, proof: 'one person with papers, money, and nerve could still change the outcome for thousands' },
        { id: 'hr08-q2', type: 'purpose', q: 'Why does the author note that Wallenberg had no diplomatic training?', c: ["To explain why Sweden was slow to back him in Budapest", "To stress that courage mattered more than expertise", "To explain why the Soviets detained him"], fix: 'The contrast makes the scale of what he did stand out.', line: 1, proof: 'he was a Swedish businessman with no diplomatic training' },
        { id: 'hr08-q3', type: 'inference', q: 'What does the passage suggest about the certificates of protection?', c: ["They protected holders on their own, without anyone's help", "Officials could be pressed to honor them", "They were issued by the War Refugee Board"], fix: 'He secured releases of people holding them, so they had force when pressed.', line: 2, proof: 'stepped in to secure the release of people holding certificates or forged papers' },
        { id: 'hr08-q4', type: 'tone', q: 'How does the author describe Wallenberg\'s fate?', c: ["As settled by the 1956 report", "As bitter and still unresolved", "As a quiet retirement in Sweden"], fix: 'The author calls it bitter and notes the Soviet account has been questioned.', line: 3, proof: 'His own ending was bitter.' },
        { id: 'hr08-q5', type: 'assumption', q: 'The last sentence assumes that most people in that time and place...', c: ["Had not heard of the deportations from Hungary", "Stood by when some action was possible", "Were helping in secret, out of the public's view"], fix: 'Contrasting Wallenberg with the reluctant majority assumes action was possible but rare.', line: 3, proof: 'most people were reluctant to help Jews, out of fear, self-interest or hatred' },
        { id: 'hr08-q6', type: 'weaken', q: 'Which would most weaken the claim that Wallenberg\'s work saved lives?', c: ["He relied on Swedish and American funds for his work", "Certificate holders were deported at the same rate", "Hungary had already deported 440,000 Jews"], fix: 'If holders fared no better, the certificates would not have saved anyone.', line: 3, proof: 'His work saved thousands.' }
      ] },
    { id: 'hr09', ages: 'both', rating: 'adult', topic: 'escape', title: 'Lights Across the River', cite: 'Hyeonseo Lee, TED talk (2013), "My escape from North Korea"', sourceIds: ['ted-hlee'],
      passage: [
        'Hyeonseo Lee says that as a child she believed her country was "the best on the planet." She grew up singing a song called "Nothing To Envy." At school she studied the history of Kim Il-Sung but learned little about the outside world, except that America, South Korea and Japan were enemies. Her family was not poor, and she had never gone hungry.',
        'Then, in 1995, her mother brought home a letter from a coworker\'s sister saying the family had not eaten for three weeks and was waiting to die. A famine hit North Korea in the mid-1990s, and Lee says more than a million people died. Power outages left her town dark at night, except for the lights of China across the river. "I always wondered why they had lights, but we didn\'t," she said.',
        'Lee was sent to China during the famine, expecting to be apart from her family for a short time; it took 14 years before they lived together again. Her story shows how a closed system holds belief: it controls what people learn and names enemies to blame. It also shows how belief can crack. No speech convinced her. A letter and a lit riverbank did.'
      ],
      qs: [
        { id: 'hr09-q1', type: 'mainIdea', q: 'What is the main point of the passage?', c: ["Hunger drove Lee to flee her country", "Evidence broke a taught belief", "School taught Lee to question her leaders"], fix: 'Her belief was taught; a letter and the lights across the river cracked it.', line: 3, proof: 'No speech convinced her. A letter and a lit riverbank did.' },
        { id: 'hr09-q2', type: 'inference', q: 'Why did the lights in China matter to Lee?', c: ["They helped her find a way across the river", "They showed that life could be better somewhere else", "They meant China's power plants served her town"], fix: 'The lights raised the question of why others had what her country lacked.', line: 2, proof: '"I always wondered why they had lights, but we didn\'t,"' },
        { id: 'hr09-q3', type: 'purpose', q: 'Why does the author mention that Lee\'s family was not poor?', c: ["To explain how she paid for the long trip across to China", "To show that her doubts did not come from her own hunger", "To suggest the famine did not reach her town"], fix: 'Her doubt came from what she learned of others, not her own want.', line: 1, proof: 'Her family was not poor, and she had never gone hungry.' },
        { id: 'hr09-q4', type: 'assumption', q: 'The claim that a closed system "controls what people learn" assumes that...', c: ["Songs do more than school lessons to shape what people believe", "Belief depends partly on what people see", "Children believe whatever their parents believe"], fix: 'Control of information matters only if belief depends on what people can learn and see.', line: 3, proof: 'it controls what people learn and names enemies to blame' },
        { id: 'hr09-q5', type: 'strengthen', q: 'Which would most strengthen the author\'s view of how belief cracks?', c: ["Other defectors say speeches changed their minds", "Other defectors also name one event, like a letter", "Other defectors recall the same song from school"], fix: 'If other defectors also cite a concrete event, that supports the claim that evidence, not speeches, breaks belief.', line: 3, proof: 'A letter and a lit riverbank did.' },
        { id: 'hr09-q6', type: 'tone', q: 'The author\'s tone toward Lee is...', c: ["Pitying toward her", "Respectful", "Neutral and distant"], fix: 'The author treats her account as a serious lesson.', line: 3, proof: 'Her story shows how a closed system holds belief' }
      ] },
    { id: 'hr10', ages: 'both', rating: 'adult', topic: 'islamism', title: 'Islamic and Islamist', cite: 'Britannica, Islamism; Council on Foreign Relations, The Islamic State; Nobel Prize, Nadia Murad', sourceIds: ['brit-islamism', 'cfr-isis', 'nobel-murad'], guard: ['quotesExtremism', 'rebutted'],
      passage: [
        'Britannica draws a line that matters. "Islamic" refers to Islam as a religion. "Islamist" describes someone pursuing a political goal through the symbols and traditions of Islam. Islamist movements differ widely, from reform movements to transnational jihadist groups, and scholars still debate the term. Confusing the two words blames a faith of many people for the politics of a few movements.',
        'The self-proclaimed Islamic State shows what the most violent version claims. The Council on Foreign Relations says the group set out to build a caliphate "claiming exclusive political and theological authority over the world\'s Muslims," and that its state-building was marked "more by extreme violence than institution building." In 2014 it attacked Sinjar in Iraq, intending, the Nobel Foundation writes, to ethnically cleanse Iraq of all Yazidis. Nadia Murad, a Yazidi survivor, won the 2018 Nobel Peace Prize for her advocacy.',
        'The claim of "exclusive" authority answers itself. A group that must use force to make people accept its rule over their faith has not shown that it speaks for them; it has shown that it cannot win their consent. Murad\'s work, meeting leaders and pressing for the rebuilding of her homeland, is a reply in a different language: law, testimony, and repair.'
      ],
      qs: [
        { id: 'hr10-q1', type: 'mainIdea', q: 'Which best states the main idea of the passage?', c: ["Islamist movements share one aim, a caliphate under one ruler", "A violent group's claim to speak for a faith is false", "Murad's prize was a direct reply to the caliphate's claims"], fix: 'The passage separates faith from political movements and rebuts the group\'s claim.', line: 3, proof: 'it has shown that it cannot win their consent' },
        { id: 'hr10-q2', type: 'purpose', q: 'Why does the author explain "Islamic" and "Islamist" first?', c: ["To show scholars agree on what the two terms mean", "To keep a faith from being blamed for a movement", "To class the Islamic State as one of the reform movements"], fix: 'The author warns that confusing the words blames a faith for a few movements.', line: 1, proof: 'Confusing the two words blames a faith of many people for the politics of a few movements.' },
        { id: 'hr10-q3', type: 'inference', q: 'Based on paragraph 1, what can be inferred about Islamist movements?', c: ["They mostly share the Islamic State's goals", "Their aims and methods vary a lot", "They began as reform groups and turned violent"], fix: 'They range from reform movements to jihadist groups.', line: 1, proof: 'Islamist movements differ widely, from reform movements to transnational jihadist groups' },
        { id: 'hr10-q4', type: 'assumption', q: 'The rebuttal in paragraph 3 assumes that speaking for a people requires...', c: ["Control of the places they live", "Their consent rather than their fear of force", "Recognition by the world's leading religious scholars"], fix: 'The author says force shows the group "cannot win their consent."', line: 3, proof: 'it has shown that it cannot win their consent' },
        { id: 'hr10-q5', type: 'tone', q: 'How does the author treat the Islamic State\'s claim?', c: ["As a theological question for scholars", "As refuted by its own methods", "As proved false by its loss of land"], fix: 'The author says the claim "answers itself."', line: 3, proof: 'The claim of "exclusive" authority answers itself.' },
        { id: 'hr10-q6', type: 'weaken', q: 'Which would most weaken the group\'s claim to speak for the world\'s Muslims?', c: ["It took Sinjar and held it for a time", "Most Muslims rejected its rule where it took power", "It built a state marked more by violence than institutions"], fix: 'Rejection by the people it claimed to lead undercuts its claim to speak for them.', line: 3, proof: 'A group that must use force to make people accept its rule over their faith has not shown that it speaks for them' }
      ] },
    { id: 'hr11', ages: 'both', rating: 'adult', topic: 'recruiters', title: 'Not a Van, a Promise', cite: 'Polaris Project, Myths, Facts and Statistics', sourceIds: ['polaris-recruit'],
      passage: [
        'The most common picture of human trafficking is a stranger and a van. Polaris, which runs the U.S. National Human Trafficking Hotline, calls that the most pervasive myth. Most traffickers, it says, use psychological means: tricking, defrauding, manipulating or threatening people into commercial sex or exploitative labor. Trafficking does not even require movement. People can be recruited in their own home towns, even their own homes.',
        'Recruiters look for need. Polaris lists recent migration or relocation, substance use, mental health concerns, involvement with child welfare, and being a runaway or homeless youth as significant risk factors. Traffickers often use these needs to create dependency. A person may have agreed to the first job or the first trip, but Polaris notes that initial consent does not matter to the crime once force, fraud or coercion begins.',
        'Why not just leave? Some lack a ride or a safe place to go. Some are afraid. Some have been manipulated so well they do not yet see themselves as controlled. In 2021 the hotline learned of 10,359 trafficking situations involving 16,554 victims, which Polaris says is likely only a fraction of the real number. The lesson is to watch for the offer that solves your problem too neatly, from someone who then becomes the only solution.'
      ],
      qs: [
        { id: 'hr11-q1', type: 'mainIdea', q: 'What is the passage mainly about?', c: ["Why migrants are the main targets of trafficking", "How traffickers recruit through need and through trust", "How the hotline helps victims leave"], fix: 'The passage replaces the "van" myth with recruitment through need and manipulation.', line: 1, proof: 'Most traffickers, it says, use psychological means' },
        { id: 'hr11-q2', type: 'inference', q: 'Why would a runaway teen be at higher risk, based on the passage?', c: ["They tend to move across state lines on their own", "Their needs give a recruiter an offer", "Child welfare staff may miss them and their needs"], fix: 'Recruiters "look for need" and use it to build dependency.', line: 2, proof: 'Traffickers often use these needs to create dependency.' },
        { id: 'hr11-q3', type: 'purpose', q: 'Why does the author include the 2021 hotline numbers?', c: ["To show the hotline's growth in calls since it began", "To show the scale, and that it is undercounted", "To show labor cases now outnumber sex trafficking cases"], fix: 'Polaris says the figures are "likely only a fraction" of the real number.', line: 3, proof: 'which Polaris says is likely only a fraction of the real number' },
        { id: 'hr11-q4', type: 'assumption', q: 'The point about "initial consent" assumes that...', c: ["Consent to a first trip makes later force legal", "Agreeing to a job is not agreeing to be forced", "Most victims do not agree to the first job"], fix: 'Once force or fraud begins, earlier agreement does not cover it.', line: 2, proof: 'initial consent does not matter to the crime once force, fraud or coercion begins' },
        { id: 'hr11-q5', type: 'weaken', q: 'Which would most weaken the claim that most trafficking is psychological, not physical?', c: ["Most victims were recruited in their home towns", "Case files showed most victims were seized by force", "Many victims had agreed to the first job or the first trip"], fix: 'If most cases began with physical seizure, the "myth" would be the norm.', line: 1, proof: 'Polaris, which runs the U.S. National Human Trafficking Hotline, calls that the most pervasive myth.' },
        { id: 'hr11-q6', type: 'tone', q: 'The final sentence is best described as...', c: ["A warning about strangers", "Practical advice", "A call for new laws"], fix: 'It tells the reader what to watch for.', line: 3, proof: 'The lesson is to watch for the offer that solves your problem too neatly' }
      ] },
    { id: 'hr12', ages: 'both', rating: 'adult', topic: 'communism', title: 'Hunger and Silence', cite: 'Britannica, Holodomor', sourceIds: ['brit-holodomor'],
      passage: [
        'The Holodomor was a man-made famine in Soviet Ukraine in 1932 and 1933. Its name comes from the Ukrainian words for hunger and extermination. Britannica traces it to Stalin\'s 1929 decision to collectivize farming: party agitators forced peasants to give up land and property to collective farms, and wealthier peasants and resisters were deported. Production fell and food ran short.',
        'In 1932 Stalin wrote to a colleague that "we may lose Ukraine," and that autumn the Politburo took a series of decisions that widened and deepened the famine there. Across the Soviet Union at least 5 million people died of hunger between 1931 and 1934; a team of Ukrainian demographers counted at least 3.9 million Ukrainians among them. The famine also gave cover to a campaign against Ukrainian culture, religious leaders, and intellectuals.',
        'News of it was silenced. Party officials did not mention it in public, and Western reporters in Moscow were told not to write about it. Walter Duranty of The New York Times dismissed the reports of a young freelancer, Gareth Jones. A famine that may not be named cannot be relieved, and the silence was itself part of the harm.'
      ],
      qs: [
        { id: 'hr12-q1', type: 'mainIdea', q: 'Which best states the passage\'s main idea?', c: ["A drought and failed harvests caused the famine in Ukraine", "Policy choices and silence made a famine deadlier", "Collective farms grew more food than the old farms had"], fix: 'The passage traces the famine to political decisions and to the silence around it.', line: 2, proof: 'the Politburo took a series of decisions that widened and deepened the famine there' },
        { id: 'hr12-q2', type: 'purpose', q: 'Why does the author quote Stalin\'s letter?', c: ["To show Stalin wanted to send aid to Ukraine", "To show that fear of losing Ukraine shaped the policy", "To show he blamed his colleague"], fix: 'The letter shows a political motive behind the decisions that autumn.', line: 2, proof: 'In 1932 Stalin wrote to a colleague that "we may lose Ukraine,"' },
        { id: 'hr12-q3', type: 'inference', q: 'What does the passage suggest about Duranty?', c: ["He confirmed the reports of Gareth Jones", "He helped keep the famine hidden from readers", "He was barred from writing about it"], fix: 'He waved away the reports that could have exposed the famine.', line: 3, proof: 'Walter Duranty of The New York Times dismissed the reports of a young freelancer, Gareth Jones.' },
        { id: 'hr12-q4', type: 'assumption', q: 'The claim that a famine "that may not be named cannot be relieved" assumes that...', c: ["Reporters were free to travel in Ukraine", "Help depends on knowing there is a need", "Famines are rarely man-made"], fix: 'Relief requires the need to be known.', line: 3, proof: 'A famine that may not be named cannot be relieved' },
        { id: 'hr12-q5', type: 'strengthen', q: 'Which would most strengthen the claim that the famine was made worse by decisions aimed at Ukraine?', c: ["Hunger also struck other Soviet regions in those years", "Archives show that Ukraine's grain quotas rose in autumn 1932", "Wealthier peasants were deported"], fix: 'Records of harsher demands on Ukraine would support "widened and deepened."', line: 2, proof: 'that autumn the Politburo took a series of decisions that widened and deepened the famine there' },
        { id: 'hr12-q6', type: 'tone', q: 'The author\'s tone in the last paragraph is...', c: ["Mournful but forgiving", "Grave and critical", "Cautious, even hesitant"], fix: 'The author says the silence was "part of the harm."', line: 3, proof: 'the silence was itself part of the harm' }
      ] },
    { id: 'hr13', ages: 'both', rating: 'adult', topic: 'communism', title: 'The Square', cite: 'Britannica, Tiananmen Square incident', sourceIds: ['brit-tiananmen'],
      passage: [
        'In the spring of 1989, after a decade of fast economic growth that also brought inflation and official corruption, students in China began calling for reform. After the death of the reformer Hu Yaobang in April, tens of thousands gathered in Tiananmen Square in Beijing on the day of his funeral. Over the next weeks, many others joined them, seeking political, social and economic change.',
        'Party leaders split. Moderates such as Zhao Ziyang wanted to negotiate and offer concessions. Hard-liners led by Premier Li Peng, backed by Deng Xiaoping, who feared anarchy, insisted on force. Martial law was declared in late May, but Beijing residents flooded the streets and blocked the troops. On the night of June 3 to 4, tanks and armed troops advanced, opening fire on those who tried to stop them, and the square was cleared by morning.',
        'The government counted 241 dead, including soldiers; most other estimates are much higher. Since then the state has generally tried to suppress references to the event, and public commemoration is banned. A government that is confident in its account invites people to examine it. Banning the memory of a day suggests the opposite.'
      ],
      qs: [
        { id: 'hr13-q1', type: 'mainIdea', q: 'What is the main idea of the passage?', c: ["Rising prices, not politics, drove the spring protests", "A movement was crushed, and then its memory was suppressed", "The protests ended after the leaders agreed to talks"], fix: 'The passage covers the protests and the crackdown, and says the state has tried to suppress references to it.', line: 3, proof: 'the state has generally tried to suppress references to the event' },
        { id: 'hr13-q2', type: 'inference', q: 'What does the split among leaders suggest?', c: ["The army forced the leaders' hand in May", "Force was a choice among options", "Deng sided with the moderates at first, then changed"], fix: 'Moderates proposed talks; hard-liners chose force.', line: 2, proof: 'Moderates such as Zhao Ziyang wanted to negotiate and offer concessions.' },
