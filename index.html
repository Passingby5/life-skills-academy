<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#10202e;color:#f2f5f7;font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
#app{max-width:720px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px 24px}
h1{font-size:1.5rem;margin:.2em 0 .4em}
h2{font-size:1.2rem;margin:.6em 0 .3em}
p{margin:.4em 0}
button,.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;min-width:48px;margin:8px 0;padding:10px 14px;border:0;border-radius:14px;background:#24435c;color:#fff;font:inherit;font-weight:600;text-align:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none;word-break:break-word}
button:active{filter:brightness(1.2)}
button.main{background:#2f8f5b}
button.alt{background:#3a3f6b}
button.ghost{background:transparent;border:2px solid #3b5b74}
button.on{outline:3px solid #ffd257}
button:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.ver{font-size:.8rem;opacity:.75;text-align:center;margin-top:16px}
.card{background:#183247;border-radius:16px;padding:14px;margin:10px 0}
.scene{font-size:1.2rem;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top button{width:auto;margin:0}
.muted{opacity:.75;font-size:.9rem}
.pick{background:#7a5a12}
.fix .lab{font-weight:700;color:#ffd257}
.fix .wrong{font-weight:800;color:#ff8a7a}
.fix .ok{font-weight:800;color:#7be0a3}
a.src{display:flex;align-items:center;min-height:48px;color:#9fd3ff;word-break:break-word}
.wow{display:inline-block;background:#ffd257;color:#2a1d00;font-weight:900;font-size:1.3rem;padding:8px 16px;border-radius:999px;margin:4px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{min-height:72px;margin:0;font-size:.85rem;font-weight:500;background:#24435c}
.tile.f{background:#2e4d3c}
.tile.sel{outline:3px solid #ffd257}
.tile.gone{visibility:hidden}
.tile.miss{background:#7a2d2d}
.note{background:#5a3d10;border-radius:12px;padding:10px}
ul.list{padding-left:1.1em}ul.list li{margin:.5em 0}
input{width:100%;min-height:52px;font:inherit;padding:8px 12px;border-radius:12px;border:2px solid #3b5b74;background:#0c1924;color:#fff}
@media (orientation:landscape) and (max-height:500px){
  html,body{font-size:16px}
  #app{max-width:none;padding:8px max(14px,env(safe-area-inset-left)) 12px max(14px,env(safe-area-inset-right))}
  .play{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .play .card{margin:0}
  .play button{min-height:48px;margin:6px 0}
  .tiles{grid-template-columns:1fr 1fr 1fr 1fr}
  h1{font-size:1.25rem}
}
</style></head>

<script data-src="engine/rng.js">
// Seeded RNG (mulberry32). State is one number, so it can be saved and resumed. No DOM.
var LSA = typeof LSA !== 'undefined' ? LSA : {};
LSA.rng = function (seed) {
  var r = { s: (seed >>> 0) || 1 };
  r.next = function () {
    var t = (r.s = (r.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = function (n) { return Math.floor(r.next() * n); };
  return r;
};
LSA.shuffle = function (arr, r) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = r.int(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
};
LSA.hashSeed = function (str) {
  var h = 2166136261 >>> 0;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h || 1;
};
// Tap guard: two taps on the same control within 300 ms count as one.
LSA.tapGuard = function (ms) {
  var last = {}; ms = ms || 300;
  return function (key, now) {
    if (last[key] !== undefined && now - last[key] < ms) return false;
    last[key] = now; return true;
  };
};
</script>
<script data-src="engine/deck.js">
// Deck registry, checker and age filter. No DOM.
var LSA = typeof LSA !== 'undefined' ? LSA : {};

LSA.cardIndex = LSA.cardIndex || {};

LSA.deck = function (d) {
  d.format = d.format || 'gutcheck';
  d.cards.forEach(function (c) { c.deck = d.id; LSA.cardIndex[c.id] = c; });

LSA.visible = function (c, age) { return c.ages === 'both' || c.ages === age; };

    var d = LSA.decks[id]; if (!d || d.format !== 'gutcheck') return;
    d.cards.forEach(function (c) { if (LSA.visible(c, age)) out.push(c); });
  });
  return out;
};
LSA.scenario = function (c, age) { return typeof c.s === 'string' ? c.s : (c.s[age] || c.s.adult || c.s.ya); };
LSA.answerIndex = 1; // c[1] is always the right choice in the data; the engine shuffles the order shown.
// Returns a list of problems. Empty list means the deck is good.
LSA.checkDeck = function (d) {
  var errs = [], seen = {};
  if (d.format === 'steps') {
    d.cards.forEach(function (c) { if (!c.id || !c.title || !Array.isArray(c.steps) || !c.steps.length) errs.push(d.id + ': bad step card ' + c.id); });
    return errs;
  }
  d.cards.forEach(function (c) {
    var p = d.id + '/' + c.id + ': ';
    ['id', 'deck', 'topic', 'ages', 's', 'c', 'm', 'f', 'w', 'src'].forEach(function (k) { if (!c[k]) errs.push(p + 'missing ' + k); });
    if (seen[c.id]) errs.push(p + 'duplicate id'); seen[c.id] = 1;
    if (['both', 'ya', 'adult'].indexOf(c.ages) < 0) errs.push(p + 'bad ages');
    if (!Array.isArray(c.c) || c.c.length !== 3 || new Set(c.c).size !== 3) errs.push(p + 'needs 3 different choices');
    if (c.s && typeof c.s === 'object' && (!c.s.ya || !c.s.adult)) errs.push(p + 'two-line scenario needs ya and adult');
    if (c.src && !(d.sources && d.sources[c.src])) errs.push(p + 'unknown source ' + c.src);
  });
  ['ya', 'adult'].forEach(function (a) {
    var n = d.cards.filter(function (c) { return LSA.visible(c, a); }).length;
    if (n < LSA.MIN_CARDS) errs.push(d.id + ': only ' + n + ' cards for ' + a);
  });
  return errs;
};
LSA.checkAll = function () {
  var errs = [], ids = {};
  LSA.deckOrder.forEach(function (id) {
    errs = errs.concat(LSA.checkDeck(LSA.decks[id]));
    LSA.decks[id].cards.forEach(function (c) { if (ids[c.id] && ids[c.id] !== id) errs.push('id ' + c.id + ' used in ' + ids[c.id] + ' and ' + id); ids[c.id] = id; });
  });
  return errs;

</script>
<script data-src="engine/srs.js">
// Leitner boxes. 5 boxes, gaps 0/1/3/7/14 days. No DOM.
var LSA = typeof LSA !== 'undefined' ? LSA : {};
LSA.GAPS = [0, 1, 3, 7, 14];
LSA.CONF = ['Guess', 'Pretty sure', 'Sure'];
// conf: 0 Guess, 1 Pretty sure, 2 Sure. Returns the new entry.
LSA.grade = function (entry, right, conf, today) {
  var b = entry ? entry.b : 1;
  if (!right) b = 1;
  else if (conf >= 1) b = Math.min(5, b + 1);
  return { b: b, due: today + LSA.GAPS[b - 1], n: ((entry && entry.n) || 0) + 1 };
};
LSA.isWow = function (right, conf) { return !right && conf === 2; };
// Pick up to n cards: due first, then new. Then order so no two in a row share a topic when it can be helped.
LSA.pickRound = function (cards, boxes, today, r, n) {
  n = n || 10;
  var due = [], fresh = [];
  LSA.shuffle(cards, r).forEach(function (c) {
    var e = boxes[c.id];
    if (!e) fresh.push(c); else if (e.due <= today) due.push(c);
  });
  due.sort(function (a, b) { return boxes[a.id].due - boxes[b.id].due; });
  var nd = Math.min(n, due.length);
  return LSA.interleave(due.slice(0, nd)).concat(LSA.interleave(fresh.slice(0, n - nd)));
};
LSA.interleave = function (list) {
  var rest = list.slice(), out = [];
  while (rest.length) {
    var prev = out.length ? out[out.length - 1].topic : null, k = 0;
    // Look ahead: pick the first card whose topic differs, preferring the topic with the most left.
    var counts = {}; rest.forEach(function (c) { counts[c.topic] = (counts[c.topic] || 0) + 1; });
    var best = -1;
    for (var i = 0; i < rest.length; i++) {
      if (rest[i].topic === prev) continue;
      if (best < 0 || counts[rest[i].topic] > counts[rest[best].topic]) best = i;
    }
    k = best < 0 ? 0 : best;
    out.push(rest.splice(k, 1)[0]);
  }
  return out;

</script>
<script data-src="engine/save.js">
// Versioned save. Text in, text out; the UI decides where it is stored. No DOM.
var LSA = typeof LSA !== 'undefined' ? LSA : {};
LSA.SAVE_V = 2;
LSA.newProfile = function (name, age) { return { name: name || 'Player', age: age === 'ya' ? 'ya' : 'adult', boxes: {}, round: null, stats: { rounds: 0, right: 0, seen: 0, wows: 0 } }; };
LSA.newSave = function () { return { v: LSA.SAVE_V, active: null, next: 1, profiles: {}, decks: null }; };
LSA.addProfile = function (s, name, age) { var id = 'p' + (s.next++); s.profiles[id] = LSA.newProfile(name, age); s.active = id; return id; };
// v1 was one player: { v:1, name, age, boxes, round }
LSA.upgrade = function (o) {
  if (o.v === 1) {
    var s = LSA.newSave(), id = LSA.addProfile(s, o.name, o.age);
    var p = s.profiles[id]; p.boxes = o.boxes || {}; p.round = o.round || null; if (o.stats) p.stats = o.stats;
    o = s;
  }
  return o;
};
// Returns { save, broken } and never throws.
LSA.loadSave = function (text) {
  if (!text) return { save: LSA.newSave(), broken: false };
  try {
    var o = LSA.upgrade(JSON.parse(text));
    if (!o || o.v !== LSA.SAVE_V || typeof o.profiles !== 'object' || !o.profiles) throw new Error('bad save');
    Object.keys(o.profiles).forEach(function (k) {
      var p = o.profiles[k]; if (!p || typeof p.boxes !== 'object') throw new Error('bad profile');
      if (p.age !== 'ya' && p.age !== 'adult') p.age = 'adult';
      p.stats = p.stats || { rounds: 0, right: 0, seen: 0, wows: 0 };
    });
    if (o.active && !o.profiles[o.active]) o.active = null;
    return { save: o, broken: false };
  } catch (e) { return { save: LSA.newSave(), broken: true }; }

LSA.dumpSave = function (s) { return JSON.stringify(s); };
</script>
<script data-src="modes/gutcheck.js">
// Gut Check round. Plain data state, so a round can be saved and resumed. No DOM.
var LSA = typeof LSA !== 'undefined' ? LSA : {};
LSA.GC = {
  start: function (profile, deckIds, today, seed) {
    var r = LSA.rng(seed), cards = LSA.cardsFor(profile.age, deckIds);
    var picked = LSA.pickRound(cards, profile.boxes, today, r, 10);
    var q = picked.map(function (c) { return { id: c.id, order: LSA.shuffle([0, 1, 2], r), pick: null, conf: null }; });
    return { rs: r.s, today: today, q: q, i: 0, stage: 'ask', again: {}, wows: [], right: 0 };
  },
  cur: function (st) { return st.q[st.i]; },
  card: function (st) { return LSA.cardIndex[st.q[st.i].id]; },
  // choice: index into order (position on screen)
  pick: function (st, pos) { if (st.stage !== 'ask') return; st.q[st.i].pick = pos; st.stage = 'conf'; },
  isRight: function (it) { return it.order[it.pick] === LSA.answerIndex; },
  confirm: function (st, profile, conf) {
    if (st.stage !== 'conf') return;
    var it = st.q[st.i], right = LSA.GC.isRight(it); it.conf = conf; it.right = right;
    profile.boxes[it.id] = LSA.grade(profile.boxes[it.id], right, conf, st.today);
    profile.stats.seen++;
    if (right) { st.right++; profile.stats.right++; }
    it.wow = LSA.isWow(right, conf);
    if (it.wow && st.wows.indexOf(it.id) < 0) { st.wows.push(it.id); profile.stats.wows++; }
    if (!right && !st.again[it.id]) {
      // Ask it once more, a few cards later in this round.
      st.again[it.id] = 1;
      var r = LSA.rng(st.rs), at = Math.min(st.q.length, st.i + 3);
      st.q.splice(at, 0, { id: it.id, order: LSA.shuffle([0, 1, 2], r), pick: null, conf: null, again: true });
      st.rs = r.s;
    }
    st.stage = 'fix';
  },
  next: function (st, profile) {
    if (st.stage !== 'fix') return;
    st.i++;
    if (st.i >= st.q.length) { st.stage = 'done'; profile.stats.rounds++; } else st.stage = 'ask';
  }

</script>
<script data-src="modes/mythmatch.js">
// Myth Match: pair each myth tile with its fix tile. Only cards the player has seen. No DOM.
var LSA = typeof LSA !== 'undefined' ? LSA : {};
LSA.MM = {
  seenCards: function (profile, deckIds) {
    return LSA.cardsFor(profile.age, deckIds).filter(function (c) { return profile.boxes[c.id]; });
  },
  start: function (profile, deckIds, seed, pairs) {
    var r = LSA.rng(seed), seen = LSA.shuffle(LSA.MM.seenCards(profile, deckIds), r).slice(0, pairs || 4);
    if (seen.length < 2) return null;
    var tiles = [];
    seen.forEach(function (c) { tiles.push({ id: c.id, k: 'm' }); tiles.push({ id: c.id, k: 'f' }); });
    return { tiles: LSA.shuffle(tiles, r), cleared: {}, sel: null, tries: 0, done: false };
  },
  // Returns 'select', 'match', 'miss', or null.
  tap: function (st, i) {
    if (st.done || st.cleared[i]) return null;
    if (st.sel === null) { st.sel = i; return 'select'; }
    if (st.sel === i) { st.sel = null; return null; }
    var a = st.tiles[st.sel], b = st.tiles[i], j = st.sel; st.sel = null; st.tries++;
    if (a.id === b.id && a.k !== b.k) {
      st.cleared[j] = st.cleared[i] = true;
      st.done = Object.keys(st.cleared).length === st.tiles.length;
      return 'match';
    }
    return 'miss';
  }
};
</script>

    'nhs-diabetes': ['NHS: Low blood sugar', 'https://www.nhs.uk/conditions/low-blood-sugar-hypoglycaemia/'],
    'cdc-seizure': ['CDC: First Aid for Seizures', 'https://www.cdc.gov/epilepsy/first-aid-for-seizures/index.html'],
    'cdc-tick': ['CDC: What to Do After a Tick Bite', 'https://www.cdc.gov/ticks/after-a-tick-bite/index.html'],
    'cdc-drowning': ['CDC: Preventing Drowning', 'https://www.cdc.gov/drowning/prevention/index.html'],

  },
  cards: [
    // ---------- shared core (both age groups) ----------
    { id: 'fa01', ages: 'both', topic: 'burns', s: { ya: 'You grab a hot pan handle in your new apartment. Your palm burns. First thing?', adult: 'Your kid touches the hot stove and burns a hand. First thing?' },
      c: ['Rub butter or cream on it', 'Hold it under cool running water for 20 minutes', 'Wrap it tight in a dry towel'],
      m: 'Butter or cream soothes a burn.', f: 'Cool it under running water for 20 minutes, as soon as you can.', w: 'Butter and creams do not cool the burn. The NHS says never put them on.', src: 'nhs-burns' },
    { id: 'fa02', ages: 'both', topic: 'burns', s: 'A burn has a big blister on it. What should you do with the blister?',
      c: ['Pop it so it heals faster', 'Leave it alone', 'Peel the skin off'],
      m: 'Popping a burn blister helps it heal.', f: 'Do not burst burn blisters.', w: 'The blister protects the skin under it. Popping it opens the wound.', src: 'nhs-burns' },
    { id: 'fa03', ages: 'both', topic: 'burns', s: 'The burn is cooled. How do you cover it?',
      c: ['Stick a plaster or sticky bandage on it', 'Lay cling film loosely over it', 'Leave a wet towel taped on all day'],
      m: 'A sticky bandage is best for a burn.', f: 'Lay cling film over it. Do not wrap it around, and skip sticky dressings.', w: 'Sticky dressings can pull at the burned skin.', src: 'nhs-burns' },
    { id: 'fa04', ages: 'both', topic: 'nosebleed', s: { ya: 'Your nose starts bleeding at work. What do you do?', adult: 'Your child gets a nosebleed at dinner. What do you tell them?' },
      c: ['Tilt the head back', 'Sit, lean forward, pinch the soft part of the nose', 'Lie flat on your back'],
      m: 'Tilt your head back to stop a nosebleed.', f: 'Sit, lean forward, and pinch just above the nostrils for 10 to 15 minutes.', w: 'Leaning forward keeps blood from running down your throat.', src: 'nhs-nose' },
    { id: 'fa05', ages: 'both', topic: 'poison', s: { ya: 'Your roommate swallowed some cleaning liquid by mistake. What now?', adult: 'Your toddler got into the cleaning cupboard and swallowed something. What now?' },
      c: ['Make them throw up', 'Get help now and do not make them sick', 'Wait and see if they feel sick'],
      m: 'Make someone throw up if they swallow poison.', f: 'Get medical help right away. Do not try to make them sick.', w: 'Vomiting can make them choke and stop breathing.', src: 'nhs-poison' },
    { id: 'fa06', ages: 'both', topic: 'poison', s: 'Help is on the way after someone swallowed something harmful. Should you give them a drink?',
      c: ['Yes, milk to coat the stomach', 'No food or drink at all', 'Yes, lots of water to flush it'],
      m: 'Milk or water helps after poisoning.', f: 'Do not give them anything to eat or drink.', w: 'The NHS says no food or drink while you wait for help.', src: 'nhs-poison' },
    { id: 'fa07', ages: 'both', topic: 'bites', s: 'A snake bites your friend on a trail. What do you do about the venom?',
      c: ['Suck or cut the venom out', 'Leave the bite alone, keep still, get help', 'Pour hot water on it'],
      m: 'Sucking out the venom helps.', f: 'Never suck or cut the bite. Keep still and get help.', w: 'It does not remove venom and can make the wound worse.', src: 'nhs-snake' },
    { id: 'fa08', ages: 'both', topic: 'bites', s: 'After a snake bite, should you tie a tight band above it?',
      c: ['Yes, to stop the venom spreading', 'No, do not tie anything tight', 'Yes, but only for an hour'],
      m: 'A tight band stops snake venom.', f: 'Do not tie anything tightly around the bite. Loosen clothes instead.', w: 'The area may swell. Tight bands make it worse.', src: 'nhs-snake' },
    { id: 'fa09', ages: 'both', topic: 'cold', s: 'Fingers are white and numb after time in the snow. How do you warm them?',
      c: ['Rub them hard', 'Warm (not hot) water, no rubbing', 'Hold them near a fire'],
      m: 'Rub frostbite to warm it up.', f: 'Use warm, not hot, water or body heat. Do not rub.', w: 'Rubbing frozen skin damages it more.', src: 'nhs-frost' },
    { id: 'fa10', ages: 'both', topic: 'cold', s: 'Someone has frostbite on their toes. Is a hot water bottle a good idea?',
      c: ['Yes, the hotter the better', 'No, use warm water, not direct heat', 'Yes, plus a hot bath'],
      m: 'Direct heat is best for frostbite.', f: 'Do not use a fire, heater, hot water bottle, or hot bath.', w: 'Numb skin cannot feel heat and burns easily.', src: 'nhs-frost' },
    { id: 'fa11', ages: 'both', topic: 'sprains', s: { ya: 'You twist your ankle playing ball. Tonight, heat pack or ice pack?', adult: 'You twist your ankle on the stairs. Tonight, heat pack or ice pack?' },
      c: ['Heat pack and a hot bath', 'Ice pack, wrapped, up to 20 minutes', 'Neither, just walk on it'],
      m: 'Heat helps a fresh sprain.', f: 'Use ice and avoid heat for the first couple of days.', w: 'Heat can add to the swelling early on.', src: 'nhs-sprain' },
    { id: 'fa12', ages: 'both', topic: 'head', s: 'After a minor head bump, the person is tired. Must you keep them awake all night?',
      c: ['Yes, never let them sleep', 'No, they can rest if tired, with an adult nearby', 'Yes, with coffee'],
      m: 'Never let someone sleep after a head bump.', f: 'For a minor head injury they can rest. An adult should stay with them for 24 hours.', w: 'The NHS says you do not need to stay awake if tired. Get help for warning signs.', src: 'nhs-head' },
    { id: 'fa13', ages: 'both', topic: 'heat', s: 'Someone is hot and dizzy after yard work. They cooled down but still feel bad after 30 minutes. Now?',
      c: ['Keep waiting, it will pass', 'Treat it as heatstroke and get help', 'Give them a hot drink'],
      m: 'Heat illness always passes with rest.', f: 'If they are not better after 30 minutes of cooling, it may be heatstroke. Get help.', w: 'Heatstroke is an emergency.', src: 'nhs-heat' },
    { id: 'fa14', ages: 'both', topic: 'bites', s: 'A wasp sting is swelling up. Which helps?',
      c: ['A baking soda paste', 'A cold pack for at least 20 minutes', 'Scratching to spread it out'],
      m: 'Baking soda is a good sting remedy.', f: 'Wash it, then use a cold pack. Skip home remedies like baking soda.', w: 'The NHS says not to use home remedies such as bicarbonate of soda.', src: 'nhs-stings' },
    { id: 'fa15', ages: 'both', topic: 'cuts', s: 'A piece of glass is stuck in a deep cut. What do you do?',
      c: ['Pull it out fast', 'Leave it in and press around it', 'Push it in deeper to stop bleeding'],
      m: 'Pull out anything stuck in a wound.', f: 'Leave it in. Press on both sides of it and get help.', w: 'Pulling it out can cause more bleeding.', src: 'nhs-cuts' },
    { id: 'fa16', ages: 'both', topic: 'cuts', s: 'Blood soaks through the cloth you are pressing on a cut. Now?',
      c: ['Take it off to look', 'Put another cloth on top and keep pressing', 'Rinse it under the tap'],
      m: 'Swap a soaked bandage for a fresh one.', f: 'Add another cloth on top and keep the pressure on.', w: 'Lifting the first one breaks the pressure.', src: 'nhs-cuts' },
    { id: 'fa17', ages: 'both', topic: 'cold', s: { ya: 'A friend is shivering and confused after a cold night out. Best way to warm them?', adult: 'Your elderly neighbor is very cold and confused in a cold house. Best way to warm them?' },
      c: ['A hot bath', 'Dry blanket, head covered, warm drink if awake', 'Rub their arms and legs hard'],
      m: 'A hot bath fixes hypothermia.', f: 'Wrap them in a dry blanket with the head covered. Warm drink if fully awake. Get help.', w: 'Hot baths and rubbing can make it worse.', src: 'nhs-hypo' },
    { id: 'fa18', ages: 'both', topic: 'cold', s: 'Does a drink of alcohol help someone who is too cold?',
      c: ['Yes, it warms you up', 'No, never give alcohol', 'Only a small one'],
      m: 'Alcohol warms you up.', f: 'Do not give alcohol. Give a warm non-alcohol drink if they are awake.', w: 'The NHS lists alcohol as a do not for hypothermia.', src: 'nhs-hypo' },
    { id: 'fa19', ages: 'both', topic: 'bites', s: 'A jellyfish stings a leg at the beach. What do you rinse with?',
      c: ['Pee on it', 'Seawater', 'Fresh water from a bottle'],
      m: 'Pee helps a jellyfish sting.', f: 'Rinse with seawater, then soak in very warm water.', w: 'The NHS says do not pee on it, and do not use fresh water.', src: 'nhs-jelly' },
    { id: 'fa20', ages: 'both', topic: 'bites', s: 'After a jellyfish sting, hot or cold?',
      c: ['Ice pack', 'Very warm water for 30 minutes', 'Nothing at all'],
      m: 'Ice is best for a jellyfish sting.', f: 'Soak in very warm water, as hot as can be put up with, for 30 minutes.', w: 'The NHS says do not use ice or a cold pack here.', src: 'nhs-jelly' },
    { id: 'fa21', ages: 'both', topic: 'seizure', s: 'Someone is having a seizure. Should you put something in their mouth so they do not bite their tongue?',
      c: ['Yes, a spoon or wallet', 'No, never put anything in their mouth', 'Yes, your fingers'],
      m: 'Put something in the mouth during a seizure.', f: 'Never put anything in their mouth. Clear space and turn them on their side.', w: 'It can hurt their teeth or jaw.', src: 'cdc-seizure' },
    { id: 'fa22', ages: 'both', topic: 'seizure', s: 'During a seizure, should you hold the person still?',
      c: ['Yes, hold them down', 'No, do not hold them down', 'Yes, but only the legs'],
      m: 'Hold someone still during a seizure.', f: 'Do not hold them down. Keep things away and time it.', w: 'Holding them down can hurt you or them.', src: 'cdc-seizure' },
    { id: 'fa23', ages: 'both', topic: 'seizure', s: 'A seizure is still going. When should you call 911?',
      c: ['Only if they turn blue', 'If it lasts more than 5 minutes', 'Never, they always stop'],
      m: 'Seizures never need 911.', f: 'Call 911 if it lasts more than 5 minutes, or it is their first seizure.', w: 'CDC: time it, and call if it goes past 5 minutes.', src: 'cdc-seizure' },
    { id: 'fa24', ages: 'both', topic: 'bites', s: { ya: 'After a hike you find a tick stuck on your leg. How do you get it off?', adult: 'You find a tick on your child after a hike. How do you get it off?' },
      c: ['Nail polish or a hot match', 'Tweezers close to the skin, steady pull', 'Wait for a doctor to do it'],
      m: 'Burn or smother a tick so it lets go.', f: 'Grab it close to the skin with tweezers and pull with steady pressure.', w: 'Heat and polish can push germs into the skin. Do not wait.', src: 'cdc-tick' },
    { id: 'fa25', ages: 'both', topic: 'bites', s: 'Pulling a tick out with tweezers. Twist it or pull straight?',
      c: ['Twist it like a screw', 'Pull straight with steady pressure', 'Jerk it out fast'],
      m: 'Twist a tick to get it out.', f: 'Pull steady and even. Do not twist or jerk.', w: 'Twisting can leave mouthparts in the skin.', src: 'cdc-tick' },
    { id: 'fa26', ages: 'both', topic: 'stroke', s: { ya: 'Your friend\'s face droops and words slur, then it clears up. Now?', adult: 'Your dad\'s face droops and his words slur, then it clears up. Now?' },
      c: ['It went away, so relax', 'Get help right now anyway', 'Have them nap and check later'],
      m: 'If stroke signs go away, it is fine.', f: 'Get medical help right away, even if signs stop.', w: 'Signs can stop for a while. It is still an emergency.', src: 'nhs-stroke' },
    { id: 'fa27', ages: 'both', topic: 'heart', s: 'Which of these can be a heart attack sign?',
      c: ['Only crushing chest pain counts', 'Feeling like bad indigestion, sick, or short of breath', 'Only pain in the left arm'],
      m: 'A heart attack is always crushing chest pain.', f: 'It can feel like indigestion, with feeling sick or short of breath.', w: 'The NHS lists these as heart attack signs too.', src: 'nhs-heart' },
    { id: 'fa28', ages: 'both', topic: 'gas', s: 'Is it safe to warm up a car in an attached garage with the big door open?',
      c: ['Yes, the open door is enough', 'No, never in an attached garage', 'Yes, for 10 minutes'],
      m: 'An open garage door makes it safe.', f: 'Never run a car in a garage attached to the house, even with the door open.', w: 'Carbon monoxide can build up and get into the house.', src: 'cdc-co' },
    { id: 'fa29', ages: 'both', topic: 'gas', s: 'How would you know if carbon monoxide is in your home?',
      c: ['You would smell it', 'Only a CO alarm can tell you', 'Your eyes would sting'],
      m: 'You can smell carbon monoxide.', f: 'It has no color or smell. Use a CO alarm.', w: 'You cannot tell it is there without an alarm.', src: 'nhs-co' },
    { id: 'fa30', ages: 'both', topic: 'cpr', s: 'An adult falls and is not breathing. You do not know how to do rescue breaths. Now?',
      c: ['Do nothing, CPR needs breaths', 'Call 911 and push hard on the chest nonstop', 'Shake them and wait'],
      m: 'CPR does not work without rescue breaths.', f: 'Call for help and give nonstop chest compressions.', w: 'The NHS says if you cannot do breaths, keep doing compressions.', src: 'nhs-cpr' },
    { id: 'fa31', ages: 'both', topic: 'cpr', s: 'Someone collapsed and is making odd gasps now and then. Are they breathing OK?',
      c: ['Yes, gasping means breathing', 'No, odd gasps are not normal breathing; start CPR', 'Yes, just wait'],
      m: 'Gasping means they are breathing fine.', f: 'Ignore odd gasps. If not breathing normally, call for help and start CPR.', w: 'Gasps are common early in cardiac arrest.', src: 'nhs-cpr' },
    { id: 'fa32', ages: 'both', topic: 'cpr', s: 'You are giving CPR and a friend is with you. Who goes for the AED?',
      c: ['You stop and go get it', 'Send your friend; you keep pushing', 'Nobody, wait for the ambulance'],
      m: 'Stop CPR to fetch the AED yourself.', f: 'Keep going and send someone else for it.', w: 'The NHS says do not leave the person to look for one yourself.', src: 'nhs-cpr' },
    { id: 'fa33', ages: 'both', topic: 'allergy', s: 'Someone used their EpiPen and feels better. Should they walk to the car?',
      c: ['Yes, they feel fine now', 'No, stay lying down, do not stand or walk', 'Yes, but slowly'],
      m: 'Once you feel better you can get up.', f: 'Stay lying down. Do not stand or walk, even if feeling better.', w: 'The NHS warns against standing at any time during anaphylaxis.', src: 'nhs-anaph' },
    { id: 'fa34', ages: 'both', topic: 'allergy', s: 'Signs of a bad allergy start but seem mild. Use the auto-injector?',
      c: ['No, save it for when it gets bad', 'Yes, use it even if signs are mild', 'Take a nap first'],
      m: 'Wait until it is bad to use an EpiPen.', f: 'Use the auto-injector if you think it is anaphylaxis, even if mild.', w: 'The NHS says use it even when symptoms seem mild.', src: 'nhs-anaph' },
    { id: 'fa35', ages: 'both', topic: 'bites', s: 'A dog bite broke the skin and is barely bleeding. What first?',
      c: ['Cover it fast so no blood comes out', 'Wash with soap and warm water, let it bleed a little', 'Put butter on it'],
      m: 'Stop all bleeding from a bite at once.', f: 'Clean with soap and warm water. Gently squeeze so it bleeds a little.', w: 'A little bleeding can help lower the chance of infection.', src: 'nhs-bites' },
    { id: 'fa36', ages: 'both', topic: 'water', s: { ya: 'A friend goes under at the lake. What does drowning look like?', adult: 'Kids are in the pool. What does drowning look like?' },
      c: ['Loud yelling and splashing', 'Fast and often silent', 'Waving both arms for a long time'],
      m: 'Drowning is loud and easy to spot.', f: 'Drowning happens in seconds and is often silent.', w: 'That is why someone must watch closely all the time.', src: 'cdc-drowning' },
    { id: 'fa37', ages: 'both', topic: 'cuts', s: 'You think an arm is broken. Should you eat or drink on the way to the hospital?',
      c: ['Yes, eat to keep strength up', 'No, you may need surgery', 'Only a big meal'],
      m: 'Eat before going in with a broken bone.', f: 'Do not eat or drink in case you need surgery.', w: 'The NHS gives this advice for a broken arm or wrist.', src: 'nhs-broken' },
    // ---------- young adults ----------
    { id: 'fa50', ages: 'ya', topic: 'alcohol', s: 'At a party, a friend drank way too much and is barely awake. Put them in a cold shower?',
      c: ['Yes, it sobers them up', 'No, it can make them too cold or fall', 'Yes, ice cold'],
      m: 'A cold shower sobers someone up.', f: 'Do not use a cold shower or bath. Get help and stay with them.', w: 'They could get too cold, fall, or pass out in the water.', src: 'nhs-alcpois' },
    { id: 'fa51', ages: 'ya', topic: 'alcohol', s: 'Your friend has had way too much to drink. Give them coffee?',
      c: ['Yes, coffee sobers you up', 'No, skip coffee and caffeine', 'Yes, two cups'],
      m: 'Coffee sobers you up.', f: 'Do not give coffee or caffeine drinks.', w: 'Caffeine can dry out someone with alcohol poisoning.', src: 'nhs-alcpois' },
    { id: 'fa52', ages: 'ya', topic: 'alcohol', s: 'A very drunk friend is sleepy. Should they eat bread to soak it up?',
      c: ['Yes, food soaks up alcohol', 'No, do not give food, they could choke', 'Yes, lots of water too'],
      m: 'Bread soaks up the alcohol.', f: 'Do not give food. They could choke.', w: 'The NHS lists food as a do not for alcohol poisoning.', src: 'nhs-alcpois' },
    { id: 'fa53', ages: 'ya', topic: 'alcohol', s: 'Should you make a very drunk friend throw up to get it out?',
      c: ['Yes, get it out', 'No, never try to make them sick', 'Only if they ask'],
      m: 'Making them throw up helps.', f: 'Do not make them sick. Get help.', w: 'The NHS says do not try to make them sick.', src: 'nhs-alcpois' },
    { id: 'fa54', ages: 'ya', topic: 'head', s: 'You got a concussion in a game. You feel OK by next weekend. Play again?',
      c: ['Yes, you feel fine', 'No, no contact sports for at least 3 weeks', 'Yes, with a helmet'],
      m: 'Feeling fine means you can play again.', f: 'No contact sports for at least 3 weeks.', w: 'The brain needs time to heal after a head injury.', src: 'nhs-head' },
    { id: 'fa55', ages: 'ya', topic: 'head', s: 'You hit your head and feel a bit off. Drive yourself home?',
      c: ['Yes, it is close', 'No, do not drive until fully recovered', 'Yes, with the radio off'],
      m: 'A small head bump is fine for driving.', f: 'Do not drive until you feel fully recovered.', w: 'The NHS says do not drive after a head injury until better.', src: 'nhs-head' },
    { id: 'fa56', ages: 'ya', topic: 'gas', s: 'Camping on a cold night. Bring the camp stove into the tent for heat?',
      c: ['Yes, with the flap open a bit', 'No, never inside a tent', 'Yes, on low'],
      m: 'A stove in a tent is fine if it is cracked open.', f: 'Never use a camp stove or grill inside a tent.', w: 'It makes carbon monoxide you cannot see or smell.', src: 'nhs-co' },
    { id: 'fa57', ages: 'ya', topic: 'water', s: 'Friends do a breath-hold contest in the pool. Breathe fast first to last longer?',
      c: ['Yes, it helps you win', 'No, it can make you pass out and drown', 'Yes, but only 3 times'],
      m: 'Fast breathing first helps you hold your breath safely.', f: 'Do not hyperventilate or hold your breath for long underwater.', w: 'It can cause shallow water blackout.', src: 'cdc-drowning' },
    { id: 'fa58', ages: 'ya', topic: 'water', s: 'A few drinks before going out on the boat. No big deal?',
      c: ['No big deal', 'Avoid alcohol around swimming and boating', 'Fine if you wear sunglasses'],
      m: 'A few drinks on the water is no big deal.', f: 'Avoid alcohol before or during swimming and boating.', w: 'Alcohol hurts balance and judgment.', src: 'cdc-drowning' },
    { id: 'fa59', ages: 'ya', topic: 'diabetes', s: 'A roommate with diabetes passes out. Pour juice in their mouth?',
      c: ['Yes, sugar fixes it', 'No, give nothing by mouth; get help', 'Yes, with water'],
      m: 'Pour juice into someone passed out from low sugar.', f: 'If they are not awake, do not give food or drink. Use glucagon if you can, and call for help.', w: 'They cannot swallow safely.', src: 'nhs-diabetes' },
    { id: 'fa60', ages: 'ya', topic: 'teeth', s: 'A ball knocks out your friend\'s adult front tooth. What do you do with it?',
      c: ['Wrap it in a dry tissue', 'Hold it by the top, put it back or in milk', 'Scrub the root clean'],
      m: 'Wrap a knocked-out tooth in a tissue.', f: 'Hold it by the white part. Put it back in, or keep it in milk or spit. See a dentist fast.', w: 'Do not touch the root. Milk keeps it alive.', src: 'nhs-tooth' },
    { id: 'fa61', ages: 'ya', topic: 'heat', s: 'At a hot outdoor show, a friend is confused with hot skin and no sweat. Now?',
      c: ['Let them sleep it off', 'This is heatstroke; call for help and cool them', 'Give them an energy drink'],
      m: 'No sweat means they are fine.', f: 'Hot skin without sweat plus confusion can be heatstroke. Call for help and cool them.', w: 'Heatstroke is an emergency.', src: 'nhs-heat' },
    { id: 'fa62', ages: 'ya', topic: 'sprains', s: 'Sore twisted ankle after the gym. Hot tub and a massage tonight?',
      c: ['Yes, loosen it up', 'No, avoid heat and massage for a couple of days', 'Yes, both'],
      m: 'Heat and massage help a new sprain.', f: 'Avoid heat, alcohol, and massage for the first couple of days.', w: 'They can add to swelling.', src: 'nhs-sprain' },
    { id: 'fa63', ages: 'ya', topic: 'sprains', s: 'Your sprain feels better after 2 weeks. Back to long runs?',
      c: ['Yes, it feels fine', 'Go easy; avoid hard exercise for up to 8 weeks', 'Yes, run extra to catch up'],
      m: 'Once it feels better, it is healed.', f: 'Avoid hard exercise like running for up to 8 weeks.', w: 'There is a risk of hurting it again.', src: 'nhs-sprain' },
    { id: 'fa64', ages: 'ya', topic: 'allergy', s: 'Friend used their EpiPen at a cafe. Drive them to the ER yourself?',
      c: ['Yes, faster than waiting', 'Call 911; keep them lying down', 'Walk them to the bus'],
      m: 'Driving them is faster and fine.', f: 'Call for help. Keep them lying down; do not have them stand or walk.', w: 'Standing up can be dangerous in anaphylaxis.', src: 'nhs-anaph' },
    { id: 'fa65', ages: 'ya', topic: 'breathing', s: 'Your friend is having an asthma attack. Best position?',
      c: ['Lie down flat to rest', 'Sit up straight', 'Bend over and touch toes'],
      m: 'Lie down during an asthma attack.', f: 'Sit up straight, stay calm, and use the reliever inhaler.', w: 'Sitting up helps breathing.', src: 'nhs-asthma' },
    { id: 'fa66', ages: 'ya', topic: 'breathing', s: 'You had an asthma attack but feel fine now. See a doctor?',
      c: ['No need, it passed', 'Yes, see a doctor within 2 days', 'Only if it happens 5 times'],
      m: 'If an asthma attack passes, no doctor needed.', f: 'See a doctor within 2 days, even if you feel better.', w: 'They can help stop the next one.', src: 'nhs-asthma' },
    { id: 'fa67', ages: 'ya', topic: 'burns', s: 'Bad sunburn after the beach. Ice packs on it?',
      c: ['Yes, ice right on it', 'No, cool shower or damp towel', 'Petroleum jelly instead'],
      m: 'Ice is best for sunburn.', f: 'Cool shower or damp towel, then aftersun. No ice, no petroleum jelly.', w: 'The NHS lists both as do nots.', src: 'nhs-sunburn' },
    { id: 'fa68', ages: 'ya', topic: 'faint', s: 'A friend faints at a party and comes to. Sit them up right away?',
      c: ['Yes, sit them up fast', 'Lay them on their back with legs raised', 'Splash cold water on their face'],
      m: 'Sit someone up right after they faint.', f: 'If breathing normally, lay them on their back and raise their legs.', w: 'This helps blood get back to the brain.', src: 'nhs-faint' },
    { id: 'fa69', ages: 'ya', topic: 'eyes', s: 'Cleaner splashes in your eye at work. Now?',
      c: ['Rub it out', 'Run lots of water over it for 20 minutes', 'Blink and keep working'],
      m: 'Rub a chemical out of your eye.', f: 'Run lots of water over the eye for at least 20 minutes. Do not rub.', w: 'Rubbing spreads it and hurts the eye.', src: 'nhs-chemeye' },
    { id: 'fa70', ages: 'ya', topic: 'eyes', s: 'You got a black eye in a pickup game. Take aspirin for it?',
      c: ['Yes, aspirin is best', 'No, aspirin can make bruising worse', 'Yes, double dose'],
      m: 'Aspirin is good for a black eye.', f: 'Skip aspirin unless a doctor says so. Use a wrapped ice pack.', w: 'Aspirin can make the bruise worse.', src: 'nhs-eye' },
    { id: 'fa71', ages: 'ya', topic: 'eyes', s: 'Black eye. Ice straight on the skin?',
      c: ['Yes, straight on', 'No, wrap it in a cloth first', 'Use a hot towel'],
      m: 'Put ice right on the skin.', f: 'Wrap the ice in a cloth, 10 to 20 minutes at a time.', w: 'The NHS says do not put ice directly on skin.', src: 'nhs-eye' },
    // ---------- adults ----------
    { id: 'fa80', ages: 'adult', topic: 'kids', s: 'Your child has a fever. Should you sponge them with cold water?',

<script data-src="ui/ui.js">
// UI. Renders screens into #app. All actions are taps (data-act), guarded against double taps.
(function () {
  var KEY = 'lsa_save', app = document.getElementById('app');
  var guard = LSA.tapGuard(300);
  var U = { screen: 'home', notice: '', mm: null, age: null, name: '' };
  var ld = LSA.loadSave(localStorage.getItem(KEY));
  if (ld.broken) { try { localStorage.setItem(KEY + '_broken', localStorage.getItem(KEY)); } catch (e) { } U.notice = 'Your saved game could not be read, so we started fresh.'; }
  var S = ld.save;
  function save() { try { localStorage.setItem(KEY, LSA.dumpSave(S)); } catch (e) { } }
  function today() { var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
  function P() { return S.active ? S.profiles[S.active] : null; }
  function decks() { var all = LSA.knowDecks(); return (S.decks || all).filter(function (d) { return all.indexOf(d) >= 0; }); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function b(act, label, cls, extra) { return '<button data-act="' + act + '"' + (cls ? ' class="' + cls + '"' : '') + (extra || '') + '>' + label + '</button>'; }
  function ver() { return '<div class="ver" id="ver">' + esc(LSA_BUILD.label) + '</div>'; }
  function ageName(a) { return a === 'ya' ? 'Young adults (15 to 30)' : 'Adults (30+)'; }
  function go(s) { U.screen = s; S.screen = s; save(); render(); window.scrollTo(0, 0); }

  var R = {};
  R.home = function () {
    var ids = Object.keys(S.profiles), h = '<h1>Life Skills Academy</h1><p>Know It: fast real life myths. Pick, say how sure you are, then see the fix.</p>';
    if (U.notice) h += '<p class="note">' + esc(U.notice) + '</p>';
    h += '<h2>Who is playing?</h2>';
    ids.forEach(function (id) { var p = S.profiles[id]; h += b('prof', '👤 ' + esc(p.name) + ' <span class="muted">' + (p.age === 'ya' ? '15 to 30' : '30+') + '</span>', '', ' data-id="' + id + '"'); });
    h += b('newprof', '➕ Add a player', 'main') + b('about', 'About and sources', 'ghost');
    return h + ver();
  };
  R.newprof = function () {
    var a = U.age, edit = U.edit;
    return '<h1>' + (edit ? 'Change age group' : 'New player') + '</h1>' +
      (edit ? '' : '<label for="nm">Name</label><input id="nm" maxlength="20" autocomplete="off" value="' + esc(U.name) + '">') +
      '<h2>Age group</h2>' + b('age', 'Young adults (15 to 30)', a === 'ya' ? 'on' : '', ' data-a="ya"') + b('age', 'Adults (30+)', a === 'adult' ? 'on' : '', ' data-a="adult"') +
      b('saveprof', 'Save', 'main', a ? '' : ' disabled') + b(edit ? 'menu' : 'home', 'Back', 'ghost');
  };
  R.menu = function () {
    var p = P(), live = p.round && p.round.stage !== 'done', seen = LSA.MM.seenCards(p, decks()).length;
    var h = '<h1>Hi, ' + esc(p.name) + '</h1><p class="muted">' + ageName(p.age) + ' · ' + Object.keys(p.boxes).length + ' cards seen · ' + p.stats.rounds + ' rounds</p>';
    h += b('play', live ? '▶ Resume round' : '▶ Play Gut Check', 'main');
    h += b('match', '🧩 Myth Match', 'alt', seen < 2 ? ' disabled' : '') + (seen < 2 ? '<p class="muted">Myth Match opens after you see a few cards.</p>' : '');
    h += '<h2>Decks</h2>';
    LSA.knowDecks().forEach(function (id) { var d = LSA.decks[id], on = decks().indexOf(id) >= 0; h += b('deck', d.icon + ' ' + esc(d.name) + (on ? ' ✓' : ''), on ? 'on' : 'ghost', ' data-id="' + id + '"'); });
    h += b('editage', 'Change age group', 'ghost') + b('about', 'About and sources', 'ghost') + b('home', 'Switch player', 'ghost');
    return h + ver();
  };
  R.play = function () {
    var p = P(), st = p.round;
    if (!st || st.stage === 'done') return R.recap();
    var it = LSA.GC.cur(st), c = LSA.GC.card(st), base = st.q.filter(function (x) { return !x.again; }).length;
    var top = '<div class="top"><span class="muted">Card ' + (st.i + 1) + ' of ' + st.q.length + (it.again ? ' · one more try' : '') + '</span>' + b('menu', 'Quit', 'ghost') + '</div>';
    if (st.stage === 'fix') return top + fix(c, it);
    var h = '<div class="play"><div class="card"><div class="scene" id="scene">' + esc(LSA.scenario(c, p.age)) + '</div>';
    if (st.stage === 'conf') h += '<p class="muted">How sure are you?</p>';
    h += '</div><div>';
    if (st.stage === 'ask') it.order.forEach(function (ci, pos) { h += b('ans', esc(c.c[ci]), 'ans', ' data-p="' + pos + '"'); });
    else {
      h += '<button class="pick" disabled>' + esc(c.c[it.order[it.pick]]) + '</button>';
      LSA.CONF.forEach(function (t, k) { h += b('conf', t, k === 2 ? 'main' : '', ' data-k="' + k + '"'); });
    }
    return top + h + '</div></div>';
  };
  function fix(c, it) {
    var d = LSA.decks[c.deck], s = d.sources[c.src];
    var h = '<div class="card fix" id="fix">';
    if (it.wow) h += '<div class="wow" id="wow">😮 Wow!</div><p class="muted">You were sure, but it was a myth. Big surprises stick best.</p>';
    h += '<p class="' + (it.right ? 'ok' : 'wrong') + '">' + (it.right ? '✅ You got it.' : '❌ Not this time.') + '</p>';
    h += '<p><span class="lab">Many people think:</span> ' + esc(c.m) + '</p><p class="wrong">That is wrong.</p>';
    h += '<p><span class="lab">Do this:</span> ' + esc(c.f) + '</p><p><span class="lab">Why:</span> ' + esc(c.w) + '</p>';
    h += '<a class="src" href="' + esc(s[1]) + '" target="_blank" rel="noopener">Source: ' + esc(s[0]) + '</a></div>';
    return h + b('next', 'Next', 'main');
  }
  R.recap = function () {
    var p = P(), st = p.round;
    if (!st) return R.menu();
    var h = '<h1>Round done</h1><p>You got ' + st.right + ' of ' + st.q.length + ' right.</p><div class="card" id="recap"><h2>😮 Wow cards</h2>';
    if (!st.wows.length) h += '<p class="muted">No Wow cards this round. No sure-but-wrong answers.</p>';
    else h += '<ul class="list">' + st.wows.map(function (id) { var c = LSA.cardIndex[id]; return '<li><b>Myth:</b> ' + esc(c.m) + '<br><b>Fix:</b> ' + esc(c.f) + '</li>'; }).join('') + '</ul>';
    return h + '</div>' + b('play', 'Play another round', 'main') + b('match', '🧩 Myth Match', 'alt') + b('menu', 'Menu', 'ghost');
  };
  R.match = function () {
    var st = U.mm;
    if (!st) return R.menu();
    var h = '<div class="top"><h1>Myth Match</h1>' + b('menu', 'Back', 'ghost') + '</div><p class="muted">Tap a myth (blue), then its fix (green).</p><div class="tiles" id="tiles">';
    st.tiles.forEach(function (t, i) {
      var c = LSA.cardIndex[t.id], cls = 'tile ' + t.k + (st.cleared[i] ? ' gone' : '') + (st.sel === i ? ' sel' : '') + (U.miss && U.miss.indexOf(i) >= 0 ? ' miss' : '');
      h += b('tile', esc(t.k === 'm' ? c.m : c.f), cls, ' data-i="' + i + '"');
    });
    h += '</div>';
    if (st.done) h += '<p class="ok" id="mmdone">🎉 All matched in ' + st.tries + ' tries!</p>' + b('match', 'Play again', 'main') + b('menu', 'Menu', 'ghost');
    return h;
  };
  R.about = function () {
    var h = '<div class="top"><h1>About</h1>' + b(P() ? 'menu' : 'home', 'Back', 'ghost') + '</div>';
    h += '<p>Each card is a real moment where the quick answer is often wrong. You pick, say how sure you are, then see the fix and its source. Cards come back on a schedule (1, 3, 7, 14 days) when you get them right. Built for families. No ads, no account, your progress stays on this phone.</p>';
    h += '<h2>Why it works</h2><ul class="list" id="research">';
    LSA.RESEARCH.forEach(function (r) { h += '<li>' + esc(r[0]) + '<br><span class="muted">' + esc(r[1]) + '</span><a class="src" href="' + r[2] + '" target="_blank" rel="noopener">' + r[2] + '</a></li>'; });
    h += '</ul><p class="muted">The real life scene format is our design choice. We did not find one strong review that proves scenes beat plain questions.</p><h2>Card sources</h2>';
    LSA.knowDecks().forEach(function (id) {
      var d = LSA.decks[id]; h += '<h2>' + d.icon + ' ' + esc(d.name) + '</h2><ul class="list">';
      Object.keys(d.sources).forEach(function (k) { h += '<li><a class="src" data-sid="' + k + '" href="' + esc(d.sources[k][1]) + '" target="_blank" rel="noopener">' + esc(d.sources[k][0]) + '</a></li>'; });
      h += '</ul>';
    });
    h += '<p class="muted">This is general info, not medical, legal or money advice. In an emergency call 911.</p>';
    return h + ver();
  };

  function render() { app.innerHTML = (R[U.screen] || R.home)(); }

  var A = {
    home: function () { U.notice = ''; S.active = null; go('home'); },
    menu: function () { go(P() ? 'menu' : 'home'); },
    about: function () { go('about'); },
    prof: function (el) { S.active = el.dataset.id; U.notice = ''; go('menu'); },
    newprof: function () { U.age = null; U.name = ''; U.edit = false; go('newprof'); },
    editage: function () { U.age = P().age; U.edit = true; go('newprof'); },
    age: function (el) { var nm = document.getElementById('nm'); if (nm) U.name = nm.value; U.age = el.dataset.a; render(); },
    saveprof: function () {
      if (!U.age) return;
      if (U.edit) { var p = P(); if (p.age !== U.age) { p.age = U.age; p.round = null; } }
      else { var nm = document.getElementById('nm'); LSA.addProfile(S, (nm && nm.value.trim()) || 'Player', U.age); }
      go('menu');
    },
    deck: function (el) {
      var cur = decks(), id = el.dataset.id, i = cur.indexOf(id);
      if (i >= 0) { if (cur.length > 1) cur.splice(i, 1); } else cur.push(id);
      S.decks = cur; P().round = null; save(); render();
    },
    play: function () {
      var p = P();
      if (!p.round || p.round.stage === 'done') p.round = LSA.GC.start(p, decks(), today(), (Date.now() ^ (Math.random() * 1e9)) >>> 0);
      go('play');
    },
    ans: function (el) { LSA.GC.pick(P().round, +el.dataset.p); save(); render(); },
    conf: function (el) { LSA.GC.confirm(P().round, P(), +el.dataset.k); save(); render(); window.scrollTo(0, 0); },
    next: function () { LSA.GC.next(P().round, P()); go('play'); },
    match: function () { U.mm = LSA.MM.start(P(), decks(), (Date.now() ^ (Math.random() * 1e9)) >>> 0, 4); U.miss = null; go(U.mm ? 'match' : 'menu'); },
    tile: function (el) {
      var i = +el.dataset.i, j = U.mm.sel, res = LSA.MM.tap(U.mm, i);
      U.miss = res === 'miss' ? [i, j] : null; render();
      if (res === 'miss') setTimeout(function () { U.miss = null; if (U.screen === 'match') render(); }, 600);
    }
  };
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    var act = el.dataset.act;
    // One guard for the whole screen: a double tap never counts twice, even when the screen changes under the finger.
    if (!guard('tap', Date.now())) return;
    if (A[act]) A[act](el);
  });
  // Resume where we left off (also after an auto update reload).
  if (P() && S.screen && ['menu', 'play', 'about'].indexOf(S.screen) >= 0) U.screen = S.screen;
  LSA.UI = { save: save, S: function () { return S; }, U: U, render: render };
  render();
})();

      setTimeout(reloadNow, 1500);

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      check(reg); document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(reg); });

    }).catch(function () { });
  });
})();
