<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Home canned jar checks: a lid that pops or bulges, or leaks, means throw it out"><title>Home canned jar checks: a lid that pops or bulges, or leaks, means throw it out</title><rect width="320" height="240" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#222"><rect x="40" y="70" width="80" height="110" rx="10" fill="#cfe8c8" stroke="#333"/><rect x="36" y="58" width="88" height="14" fill="#aaa" stroke="#333"/><text x="80" y="45" text-anchor="middle" font-size="14">OK: lid flat, sealed</text><rect x="200" y="70" width="80" height="110" rx="10" fill="#cfe8c8" stroke="#333"/><path d="M196 72 q44 -30 88 0z" fill="#aaa" stroke="#c33" stroke-width="3"/><path d="M215 180 v20 M260 180 v25" stroke="#58a" stroke-width="3"/><text x="240" y="45" text-anchor="middle" font-size="14">BAD: bulging, leaking</text><text x="240" y="222" text-anchor="middle" font-size="12">Throw it out. Never taste.</text></g></svg>
