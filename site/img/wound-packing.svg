<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Pack a deep wound, then press hard for 3 minutes"><title>Pack a deep wound, then press hard for 3 minutes</title><rect width="320" height="240" fill="#fff"/><g font-family="sans-serif" font-size="15" fill="#222"><path d="M30 150 Q160 120 290 150 V200 H30z" fill="#f2c9a0" stroke="#333"/><path d="M130 140 Q160 200 190 140z" fill="#a33"/><path d="M160 60 Q150 110 160 170" stroke="#ccc" stroke-width="14" fill="none"/><rect x="110" y="40" width="100" height="22" rx="8" fill="#e8b48a" stroke="#333"/><text x="215" y="56" text-anchor="start" font-size="14" fill="#222">PRESS</text><text x="60" y="100" text-anchor="start" font-size="15" fill="#222">GAUZE IN</text><text x="160" y="228" text-anchor="middle" font-size="15" fill="#222">Press firmly at least 3 minutes</text></g></svg>
