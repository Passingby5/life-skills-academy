<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Boiling water canner for high acid foods; pressure canner for low acid foods"><title>Boiling water canner for high acid foods; pressure canner for low acid foods</title><rect width="320" height="240" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#222"><rect x="25" y="80" width="110" height="80" rx="8" fill="#9bd" stroke="#333"/><path d="M20 80 q60 -30 120 0z" fill="#ccc" stroke="#333"/><text x="80" y="40" text-anchor="middle" font-size="15">WATER BATH</text><text x="80" y="185" text-anchor="middle" font-size="14">High acid:</text><text x="80" y="203" text-anchor="middle" font-size="12">fruit, jam, pickles</text><rect x="185" y="80" width="110" height="80" rx="8" fill="#bbb" stroke="#333"/><rect x="180" y="70" width="120" height="14" fill="#888" stroke="#333"/><circle cx="240" cy="55" r="14" fill="#fff" stroke="#333"/><path d="M240 55 l8 -6" stroke="#c33" stroke-width="2"/><text x="240" y="28" text-anchor="middle" font-size="15">PRESSURE</text><text x="240" y="185" text-anchor="middle" font-size="14">Low acid:</text><text x="240" y="203" text-anchor="middle" font-size="12">vegetables, meat</text><text x="160" y="232" text-anchor="middle" font-size="12">Low acid foods need a pressure canner</text></g></svg>
