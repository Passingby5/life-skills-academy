<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Fever warning signs: call 911 if a high fever will not come down, the person is hard to wake, or a seizure starts"><title>Fever warning signs: call 911 if a high fever will not come down, the person is hard to wake, or a seizure starts</title><rect width="320" height="240" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#222"><rect x="20" y="20" width="280" height="200" rx="12" fill="#fff6e0" stroke="#c90" stroke-width="3"/><text x="160" y="50" text-anchor="middle" font-size="16">GET HELP, CALL 911, IF:</text><text x="40" y="82" text-anchor="start" font-size="14">High fever will not come down</text><text x="40" y="110" text-anchor="start" font-size="14">Person is hard to wake</text><text x="40" y="138" text-anchor="start" font-size="14">A seizure starts</text><line x1="40" y1="155" x2="280" y2="155" stroke="#c90"/><text x="160" y="180" text-anchor="middle" font-size="13">Meanwhile: uncover the person;</text><text x="160" y="200" text-anchor="middle" font-size="13">fresh air helps lower the fever</text></g></svg>
