<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Pressure dressing on an arm: the soaked pad stays on, a new pad goes on top, and a wrap holds both snug"><title>Pressure dressing on an arm: the soaked pad stays on, a new pad goes on top, and a wrap holds both snug</title><rect width="320" height="240" fill="#fff"/><g font-family="sans-serif" fill="#222"><rect x="15" y="110" width="290" height="56" rx="28" fill="#f2c9a0" stroke="#333"/><rect x="118" y="100" width="84" height="14" fill="#d55" stroke="#933"/><rect x="112" y="84" width="96" height="16" fill="#fafafa" stroke="#333"/><g fill="#8ab4d8" stroke="#3a6a96" opacity=".9"><rect x="104" y="80" width="16" height="92" rx="3"/><rect x="152" y="80" width="16" height="92" rx="3"/><rect x="200" y="80" width="16" height="92" rx="3"/></g><path d="M250 62 L208 90" stroke="#333" stroke-width="1.5"/><text x="252" y="58" font-size="14">NEW PAD</text><path d="M70 70 L120 106" stroke="#333" stroke-width="1.5"/><text x="12" y="46" font-size="14">SOAKED PAD</text><text x="12" y="64" font-size="13">(stays on)</text><path d="M240 196 L216 166" stroke="#333" stroke-width="1.5"/><text x="226" y="212" font-size="14">WRAP</text><text x="160" y="232" text-anchor="middle" font-size="14">Add pads on top. Wrap snug. Keep pressing.</text></g></svg>
