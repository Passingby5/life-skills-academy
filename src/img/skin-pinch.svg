<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Dehydration check: pinched skin that stays up is a warning sign"><title>Dehydration check: pinched skin that stays up is a warning sign</title><rect width="320" height="240" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#222"><rect x="20" y="120" width="130" height="50" rx="20" fill="#f2c9a0" stroke="#333"/><path d="M70 120 q15 -40 30 0" fill="#f2c9a0" stroke="#333"/><text x="85" y="70" text-anchor="middle" font-size="14">Skin pinched up</text><text x="85" y="195" text-anchor="middle" font-size="12">Snaps back fast: good</text><rect x="170" y="120" width="130" height="50" rx="20" fill="#f2c9a0" stroke="#333"/><path d="M220 120 q15 -40 30 0" fill="#e8b48a" stroke="#c33" stroke-width="2"/><text x="235" y="70" text-anchor="middle" font-size="14">Stays up a while</text><text x="235" y="195" text-anchor="middle" font-size="12">Warning: drink, get help</text><text x="160" y="228" text-anchor="middle" font-size="12">Also watch for little or dark urine</text></g></svg>
