<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Treat water: filter cloudy water, boil 1 minute, store covered"><title>Treat water: filter cloudy water, boil 1 minute, store covered</title><rect width="320" height="240" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#222"><path d="M20 60 h70 l-25 50 h-20z" fill="#eee" stroke="#333"/><rect x="38" y="115" width="34" height="50" fill="#9bd" stroke="#333"/><text x="55" y="50" text-anchor="middle" font-size="14">1 FILTER</text><text x="55" y="190" text-anchor="middle" font-size="14">through cloth</text><rect x="125" y="90" width="70" height="60" rx="6" fill="#9bd" stroke="#333"/><path d="M140 85 q5 -15 0 -25 M160 85 q5 -15 0 -25 M180 85 q5 -15 0 -25" stroke="#888" fill="none"/><path d="M135 160 l10 -10 l10 10 l10 -10 l10 10 l10 -10 l10 10" stroke="#e60" fill="none" stroke-width="3"/><text x="160" y="50" text-anchor="middle" font-size="14">2 BOIL</text><text x="160" y="190" text-anchor="middle" font-size="14">rolling, 1 minute</text><rect x="235" y="80" width="55" height="85" rx="8" fill="#9bd" stroke="#333"/><rect x="250" y="68" width="25" height="14" fill="#555"/><text x="262" y="50" text-anchor="middle" font-size="14">3 STORE</text><text x="262" y="190" text-anchor="middle" font-size="14">clean, covered</text><text x="160" y="225" text-anchor="middle" font-size="12">Above 6,500 feet, boil 3 minutes</text></g></svg>
